        * { box-sizing: border-box; touch-action: manipulation; }
        html, body { background-color: #f9f9f9; margin: 0; padding: 0; width: 100%; min-height: 100%; overscroll-behavior: none; }
        body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; color: #333; display: flex; justify-content: center; align-items: flex-start; }

        /* 全域容器 */
        .page-view { width: 100%; max-width: 440px; margin: 0 auto; padding: 20px; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }

        /* 統一包裝在同一個白色大框架內 */
        .card-container { background-color: #FCFCFF; border-radius: 24px; border: 1px solid #F0F0F0; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15); overflow: hidden; padding: 40px 20px; width: 100%; position: relative; }
        
        /* 上半部雙 LOGO 區塊 */
        .logo-wrapper { position: relative; min-height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 95%; margin: 0 auto 20px auto; }
        .logo-link { display: block; width: 100%; transition: transform 0.3s ease; }
        .logo-link:hover { transform: scale(1.02); }
        .logo-img { width: 100%; height: auto; border-radius: 12px; display: block; }
        .logo-avatar { position: absolute; top: -24px; left: -18px; width: 50px; height: 50px; border-radius: 50%; border: 3px solid #FFFFFF; box-shadow: 0 4px 10px rgba(0,0,0,0.15); z-index: 10; object-fit: cover; }

        /* 詩句區塊樣式 */
        .slogan-section { text-align: center; margin-bottom: 25px; }
        .slogan-clickable { font-size: 1.25em; font-weight: bold; color: #444; cursor: pointer; display: inline-block; transition: color 0.2s; }
        .slogan-clickable:hover { color: #000; }
        
        .poem-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out, opacity 0.3s ease-out; opacity: 0; color: #666; font-size: 0.9em; line-height: 1.8; margin-top: 0; }
        .poem-content.show { max-height: 150px; opacity: 1; margin-top: 8px; }

        /* ========================================================
           下半部：純圖片 Pinterest 瀑布流風格（隨機 6 幅）
           ======================================================== */
        .pinterest-masonry { 
            column-count: 2; /* 雙欄瀑布流 */
            column-gap: 10px; /* 欄位間距 */
            width: 100%; 
        }
        
        .pin-card { 
            break-inside: avoid; /* 避免圖片被欄位切斷 */
            display: inline-block; 
            width: 100%;
            margin-bottom: 10px; /* 上下圖片間距 */
            border-radius: 14px; 
            overflow: hidden; 
            background: #fff; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.06); 
            text-decoration: none; 
            transition: transform 0.3s ease, box-shadow 0.3s ease; 
        }
        
        .pin-card:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 8px 22px rgba(0,0,0,0.12); 
        }
        
        /* 保持圖片原始比例，呈現高低錯落感 */
        .pin-img { 
            width: 100%; 
            height: auto; 
            display: block; 
            background: #eee;
        }

<script>
    // 點擊第一層文字時，切換第二層詩句的顯示與隱藏
    function togglePoem() {
        const poemBox = document.getElementById('poem-box');
        poemBox.classList.toggle('show');
    }

    // 每次重新整理頁面時，隨機挑選 12 幅圖片呈現
    document.addEventListener("DOMContentLoaded", function() {
        const masonryContainer = document.getElementById("random-masonry");
        const cards = Array.from(masonryContainer.children);
        
        // Fisher-Yates 隨機洗牌演算法
        for (let i = cards.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [cards[i], cards[j]] = [cards[j], cards[i]];
        }
        
        // 清空容器並只取前 12 張卡片塞入
        masonryContainer.innerHTML = "";
        cards.slice(0, 12).forEach(card => masonryContainer.appendChild(card));
    });
</script>
