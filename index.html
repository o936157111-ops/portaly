<!DOCTYPE html>

<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">


<!-- 啟用手機全螢幕與沉浸式模式 -->

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="mobile-web-app-capable" content="yes">



<title>生活・簡居・生活 | 數位名片型總入口</title>

<style>

/* 基礎重置：確保手機版直接滿版全螢幕 */

* {

box-sizing: border-box;

}



html, body {

margin: 0;

padding: 0;

width: 100%;

height: 100%;

background-color: #ffffff;

color: #111;

font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

overflow: hidden;

position: fixed;

top: 0;

left: 0;

}



/* 電腦版或大螢幕時：置中顯示手機比例框體 */

@media (min-width: 768px) {

body {

display: flex;

justify-content: center;

align-items: center;

background-color: #ffffff;

position: static;

}


.app-frame {

width: 100%;

max-width: 430px;

height: 844px;

max-height: 90vh;

border-radius: 24px;

overflow: hidden;

box-shadow: 0 10px 30px rgba(0,0,0,0.15);

position: relative;

background-color: #ffffff;

}

}



/* 手機版：直接強制 100% 全螢幕覆蓋 */

@media (max-width: 767px) {

.app-frame {

width: 100vw;

height: 100vh;

height: 100dvh;

position: absolute;

top: 0;

left: 0;

right: 0;

bottom: 0;

border-radius: 0;

box-shadow: none;

background-color: #ffffff;

}

}



/* 最上層的過渡頁面（Splash Screen），其餘透明、只放 3 個按鈕 */

.splash-overlay {

position: absolute;

top: 0;

left: 0;

width: 100%;

height: 100%;

background: rgba(0, 0, 0, 0.2); /* 極淡的透明背景，可依喜好調整，或改為 transparent */

backdrop-filter: blur(6px); /* 毛玻璃質感，讓底下的畫面隱約透出 */

-webkit-backdrop-filter: blur(6px);

z-index: 20000;

display: flex;

flex-direction: column;

justify-content: center;

align-items: center;

transition: opacity 0.5s ease, visibility 0.5s ease;

}



.splash-overlay.fade-out {

opacity: 0;

visibility: hidden;

pointer-events: none;

}



/* 3 個按鈕的置中容器 */

.splash-btn-container {

display: flex;

flex-direction: column;

gap: 16px;

width: 80%;

max-width: 280px;

}



/* 透明質感按鈕樣式 */

.splash-btn {

width: 100%;

padding: 14px 20px;

background: rgba(255, 255, 255, 0.25);

backdrop-filter: blur(4px);

-webkit-backdrop-filter: blur(4px);

border: 1px solid rgba(255, 255, 255, 0.5);

color: #ffffff;

font-size: 16px;

font-weight: 600;

text-align: center;

border-radius: 12px;

text-decoration: none;

text-shadow: 0 1px 2px rgba(0,0,0,0.4);

box-shadow: 0 4px 15px rgba(0,0,0,0.1);

transition: all 0.2s ease;

cursor: pointer;

}



.splash-btn:hover {

background: rgba(255, 255, 255, 0.45);

transform: translateY(-2px);

}



.reel-container {

width: 100%;

height: 100%;

overflow-y: scroll;

scroll-snap-type: y mandatory;

-webkit-overflow-scrolling: touch;

scrollbar-width: none;

transform: translateZ(0);

}



.reel-container::-webkit-scrollbar {

display: none;

}



.reel-card {

width: 100%;

height: 100%;

scroll-snap-align: start;

scroll-snap-stop: always;

position: relative;

display: flex;

justify-content: center;

align-items: center;

background-color: #ffffff;

overflow: hidden;

}



.video-wrapper {

position: absolute;

top: 0;

left: 0;

width: 100%;

height: 100%;

z-index: 1;

display: flex;

justify-content: center;

align-items: center;

}



.video-wrapper iframe {

width: 100% !important;

height: 100% !important;

border: none;

object-fit: cover;

}



/* 預設自訂封面層樣式 */

.custom-cover-layer {

position: absolute;

top: 0;

left: 0;

width: 100%;

height: 100%;

background: linear-gradient(to top, rgba(0,0,0,0) 0%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1) 100%),

url('https://live.staticflickr.com/65535/55549203944_a7a9f89992_z.jpg') center/cover no-repeat;

z-index: 5;

cursor: pointer;

transition: opacity 0.5s ease;

}



.custom-cover-layer.fade-out {

opacity: 0;

pointer-events: none;

}



.cover-play-btn {

width: 52px;

height: 52px;

background-color: #ff3b30;

border-radius: 50%;

display: flex;

justify-content: center;

align-items: center;

box-shadow: 0 4px 20px rgba(255, 59, 48, 0.5);

animation: pulse 2s infinite;

flex-shrink: 0;

cursor: pointer;

}



.cover-play-btn svg {

width: 22px;

height: 22px;

fill: #ffffff;

transform: translateX(2px);

}



@keyframes pulse {

0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.6); }

70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(255, 59, 48, 0); }

100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }

}



/* 底部資訊與按鈕共用同一列容器，適應安全距離 */

.overlay-info {

position: absolute;

bottom: 0;

left: 0;

right: 0;

padding: 40px 16px calc(25px + env(safe-area-inset-bottom)) 16px;

background: linear-gradient(to top, rgba(0,0,0,0) 0%, rgba(0,0,0,0.3) 50%, transparent 100%);

z-index: 10;

display: flex;

justify-content: space-between;

align-items: flex-end;

pointer-events: none;

}



.song-text-group {

pointer-events: auto;

flex-grow: 1;

margin-right: 16px;

}



.cover-play-btn-wrapper {

pointer-events: auto;

margin-top: 10px;

display: flex;

justify-content: flex-start;

}



.song-title {

font-size: 16px;

font-weight: bold;

margin-bottom: 8px;

color: #fff;

text-shadow: 0 1px 3px rgba(0,0,0,0.8);

}



.song-views {

font-size: 12px;

color: #fff;

background: rgba(255, 255, 255, 0.2);

backdrop-filter: blur(4px);

display: inline-block;

padding: 3px 10px;

border-radius: 12px;

}



.top-left-logo {

position: absolute;

top: 16px;

left: 16px;

width: 44px;

height: 44px;

border-radius: 50%;

border: 2px solid rgba(255, 255, 255, 0.8);

box-shadow: 0 4px 10px rgba(0,0,0,0.3);

z-index: 9999;

object-fit: cover;

background-color: #fff;

transition: transform 0.2s ease;

}

.top-left-logo:hover {

transform: scale(1.08);

}



</style>

</head>

<body>



<div class="app-frame">

<!-- 最上層過渡頁：只有 3 個透明按鈕，其餘透明 -->

<div class="splash-overlay" id="splashOverlay">

<div class="splash-btn-container">

<a href="#news" class="splash-btn" onclick="enterApp(event, 'news')">新聞劃重點</a>

<a href="#books" class="splash-btn" onclick="enterApp(event, 'books')">私房好讀書單</a>

<a href="#explorer" class="splash-btn" onclick="enterApp(event, 'explorer')">檔案總管</a>

</div>

</div>



<a href="https://myezlife.com/index-1.html"><img src="https://myezlife.com/eric-logo.gif" width="44" class="top-left-logo"></a>

<div class="reel-container" id="reelContainer"></div>

</div>



<script>

// 點擊過渡頁按鈕進入的控制函式

function enterApp(event, targetType) {

event.preventDefault(); // 防止預設跳轉（你可以之後把這三個按鈕改成對應你的實際網址或動作）


// 淡出過渡頁

const splash = document.getElementById('splashOverlay');

splash.classList.add('fade-out');



// 這裡可以依據 targetType 做你想要的動作，例如跳轉或展開特定內容

console.log("使用者點擊了：" + targetType);


// 如果你希望點下去直接去到對應頁面，可以改成：

// if (targetType === 'news') window.location.href = '你的新聞網址';

}



// 歌曲資料改由 Google 試算表公開 CSV 載入

const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTOX4kSu5tM7H8A3UPVNr1lEF_7dZwkzqXQrSf7oAJuAqkdVYEDhJh_UjJbfQ0UuKtufPydYSeZJO89/pub?gid=0&single=true&output=csv";



function parseCSV(text) {

const rows = [];

let row = [], cell = "", quoted = false;

for (let i = 0; i < text.length; i++) {

const ch = text[i];

if (ch === '"') {

if (quoted && text[i + 1] === '"') { cell += '"'; i++; }

else quoted = !quoted;

} else if (ch === ',' && !quoted) {

row.push(cell); cell = "";

} else if ((ch === '\n' || ch === '\r') && !quoted) {

if (ch === '\r' && text[i + 1] === '\n') i++;

row.push(cell); cell = "";

if (row.some(v => v.trim() !== "")) rows.push(row);

row = [];

} else {

cell += ch;

}

}

if (cell.length || row.length) {

row.push(cell);

if (row.some(v => v.trim() !== "")) rows.push(row);

}

return rows;

}



function normalizeHeader(value) {

return String(value || "").trim().toLowerCase().replace(/[\s_\-（）()【】\[\]]/g, "");

}



function findColumn(headers, aliases) {

const normalized = headers.map(normalizeHeader);

for (const alias of aliases) {

const index = normalized.indexOf(normalizeHeader(alias));

if (index >= 0) return index;

}

return -1;

}



function extractYouTubeId(value) {

const raw = String(value || "").trim();

if (!raw) return "";

if (/^[\w-]{11}$/.test(raw)) return raw;

try {

const url = new URL(raw);

if (url.hostname.includes("youtu.be")) return url.pathname.split("/").filter(Boolean)[0] || "";

if (url.hostname.includes("youtube.com")) {

if (url.pathname === "/watch") return url.searchParams.get("v") || "";

const parts = url.pathname.split("/").filter(Boolean);

const marker = parts.findIndex(part => ["embed", "shorts", "live"].includes(part));

if (marker >= 0) return parts[marker + 1] || "";

}

} catch (_) {}

const match = raw.match(/(?:youtube\.com\/(?:embed\/|shorts\/|live\/|watch\?v=)|youtu\.be\/)([\w-]{11})/);

return match ? match[1] : "";

}



function rowsToSongs(rows) {

if (!rows.length) return [];

const headers = rows[0];

const titleCol = findColumn(headers, ["歌曲名稱", "歌曲", "歌名", "title", "song", "name"]);

const viewsCol = findColumn(headers, ["熱門標籤", "views", "標籤", "分類", "描述"]);

const coverCol = findColumn(headers, ["封面樣式", "封面圖片網址", "coverclass", "coverurl", "封面"]);

const videoCol = findColumn(headers, ["youtube網址", "youtube連結", "影片網址", "影片連結", "video", "videoid", "youtubeid", "embedcode", "連結", "網址"]);

const productCol = findColumn(headers, ["產品網址", "產品連結", "外部連結", "producturl", "link", "url"]);


const dataRows = (titleCol >= 0 && (videoCol >= 0 || productCol >= 0)) ? rows.slice(1) : rows;

const titleIndex = titleCol >= 0 ? titleCol : 0;

const videoIndex = videoCol >= 0 ? videoCol : 3;

const productIndex = productCol >= 0 ? productCol : 4;



return dataRows.map(row => {

const title = String(row[titleIndex] || "").trim();

const videoValue = String(row[videoIndex] || "").trim();

const videoId = extractYouTubeId(videoValue);

const productUrl = productCol >= 0 ? String(row[productIndex] || "").trim() : "";



if (!title || (!videoId && !productUrl)) return null;



const coverValue = coverCol >= 0 ? String(row[coverCol] || "").trim() : "";

let coverUrl = "";

let coverClass = "";


if (coverValue.startsWith("http://") || coverValue.startsWith("https://")) {

coverUrl = coverValue;

} else {

coverClass = coverValue;

}



return {

title,

views: viewsCol >= 0 && row[viewsCol] ? String(row[viewsCol]).trim() : "🎵 精彩推薦",

isCustomCover: true,

coverClass,

coverUrl,

productUrl,

embedCode: videoId ? String.fromCharCode(60) + 'iframe width="560" height="315" src="https://www.youtube.com/embed/' + videoId + '?autoplay=1&playsinline=1" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen>' + String.fromCharCode(60, 47) + 'iframe>' : ""

};

}).filter(Boolean);

}



async function loadSongDatabase() {

const response = await fetch(CSV_URL, { cache: "no-store" });

if (!response.ok) throw new Error("CSV 載入失敗（HTTP " + response.status + "）");

const csvText = await response.text();

const songs = rowsToSongs(parseCSV(csvText.replace(/^\uFEFF/, "")));

if (!songs.length) throw new Error("CSV 中找不到有效歌曲。請確認欄位至少包含歌曲名稱與 YouTube 影片網址。");

return songs;

}



function initReels(songDatabase) {

const container = document.getElementById('reelContainer');

container.innerHTML = '';



const shuffledSongs = [...songDatabase].sort(() => 0.5 - Math.random());

const infiniteSongs = [...shuffledSongs, ...shuffledSongs, ...shuffledSongs];



infiniteSongs.forEach((song) => {

const card = document.createElement('div');

card.className = 'reel-card';


let coverHtml = '';

if (song.isCustomCover) {

const extraClass = song.coverClass ? ` ${song.coverClass}` : '';

coverHtml = `<div class="custom-cover-layer${extraClass}"${song.coverUrl ? ` style="background-image:linear-gradient(to top, rgba(0,0,0,0), rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1)),url('${song.coverUrl.replace(/'/g, "%27")}')"` : ""}></div>`;

card.dataset.hasCover = "true";

}



card.innerHTML = `

${coverHtml}

<div class="video-wrapper"></div>

<div class="overlay-info">

<div class="song-text-group">

<div class="song-title">${song.title}</div>

<div class="song-views">${song.views}</div>

</div>

${song.isCustomCover ? `

<div class="cover-play-btn-wrapper" onclick="playCustomSong(this)">

<div class="cover-play-btn">

<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>

</div>

</div>` : ''}

</div>

`;


card.dataset.embed = song.embedCode;

card.dataset.productUrl = song.productUrl;

container.appendChild(card);

});



const cards = document.querySelectorAll('.reel-card');

const totalOriginal = songDatabase.length;



if (cards.length > 0) {

const randomOffset = Math.floor(Math.random() * totalOriginal);

const targetIndex = totalOriginal + randomOffset;

container.scrollTop = cards[targetIndex].offsetTop;

}



let scrollTimeout;

container.addEventListener('scroll', () => {

clearTimeout(scrollTimeout);

scrollTimeout = setTimeout(() => {

const singleBlockHeight = cards[0].offsetHeight * totalOriginal;


if (container.scrollTop < singleBlockHeight * 0.4) {

container.style.scrollSnapType = 'none';

container.scrollTop += singleBlockHeight;

setTimeout(() => { container.style.scrollSnapType = 'y mandatory'; }, 50);

}

else if (container.scrollTop > singleBlockHeight * 2.3) {

container.style.scrollSnapType = 'none';

container.scrollTop -= singleBlockHeight;

setTimeout(() => { container.style.scrollSnapType = 'y mandatory'; }, 50);

}

}, 100);

}, { passive: true });



const observer = new IntersectionObserver((entries) => {

entries.forEach(entry => {

const card = entry.target;

const wrapper = card.querySelector('.video-wrapper');

const hasCover = card.dataset.hasCover === "true";



if (entry.isIntersecting) {

const coverLayer = card.querySelector('.custom-cover-layer');

if (hasCover && coverLayer && !coverLayer.classList.contains('fade-out')) {

return;

}



if (!wrapper.hasChildNodes()) {

wrapper.innerHTML = card.dataset.embed;

}

} else {

if (!hasCover || (hasCover && card.querySelector('.custom-cover-layer')?.classList.contains('fade-out'))) {

wrapper.innerHTML = '';

}

}

});

}, { threshold: 0.6 });



cards.forEach(card => {

observer.observe(card);

});

}



function playCustomSong(btnWrapper) {

const card = btnWrapper.closest('.reel-card');

const wrapper = card.querySelector('.video-wrapper');

const coverLayer = card.querySelector('.custom-cover-layer');

const embedCode = card.dataset.embed;

const productUrl = card.dataset.productUrl;



if (embedCode) {

if (!wrapper.hasChildNodes()) {

wrapper.innerHTML = embedCode;

}

if (coverLayer) {

coverLayer.classList.add('fade-out');

}

} else if (productUrl) {

window.open(productUrl, '_blank');

} else {

alert("此項目目前沒有設定播放影片或產品連結");

}

}



window.onload = async function () {

const container = document.getElementById("reelContainer");

try {

const songDatabase = await loadSongDatabase();

initReels(songDatabase);

} catch (error) {

console.error("歌曲資料載入失敗：", error);

container.innerHTML = `<div style="color:#fff;padding:24px;text-align:center;">歌曲資料載入失敗<br><small>${String(error.message || error)}</small><br><button onclick="location.reload()" style="margin-top:16px;padding:10px 18px;">重新載入</button></div>`;

}

};

</script>

</body>

</html>
