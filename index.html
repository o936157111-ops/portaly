<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>手機版搜尋與執行按鈕修正範例</title>
  <style>
    /* 基本重置與全域設定 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 16px;
      background-color: #f5f5f7;
    }

    /* 容器：限制最大寬度並置中，確保在手機上左右有安全留gi白 */
    .wrapper {
      max-width: 600px;
      margin: 0 auto;
    }

    /* 搜尋列佈局容器 */
    .search-container {
      display: flex;
      flex-wrap: wrap; /* 螢幕太小時自動換行，防止撐破畫面 */
      gap: 10px;       /* 輸入框與按鈕之間的間距 */
      width: 100%;
      background: #ffffff;
      padding: 12px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    /* 輸入框樣式 */
    .search-input {
      flex: 1;         /* 自動佔滿剩餘的空間 */
      min-width: 0;    /* 關鍵：防止 Flex 項目溢出容器 */
      height: 44px;    /* 手機版容易點擊的友善高度 */
      padding: 0 12px;
      font-size: 16px; /* 防止 iOS 裝置點擊輸入時自動放大畫面 */
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
    }

    .search-input:focus {
      border-color: #0066cc;
    }

    /* 執行按鈕樣式 */
    .search-btn {
      flex-shrink: 0;  /* 防止按鈕被強制壓縮 */
      height: 44px;    /* 與輸入框高度一致 */
      padding: 0 20px;
      font-size: 16px;
      font-weight: 500;
      color: #ffffff;
      background-color: #0066cc;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .search-btn:hover {
      background-color: #004bb5;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="search-container">
      <!-- 輸入框 -->
      <input type="text" class="search-input" placeholder="請輸入搜尋內容...">
      <!-- 執行按鈕 -->
      <button type="button" class="search-btn">執行</button>
    </div>
  </div>

</body>
</html>
