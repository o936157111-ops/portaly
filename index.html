<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5328509571221811" crossorigin="anonymous"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>生活・簡居・生活 | 數位名片型總入口</title>
    <link rel="manifest" href="manifest.json">
    <style>
        /* 合併後的智慧啟動遮罩 */
        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #f9f9f9; z-index: 9999;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; cursor: pointer; color: #333;
        }
        @media (max-width: 768px) { #start-overlay { display: flex; } }
        
        .guide-icon { width: 60px; height: 100px; border: 3px solid #333; border-radius: 10px; margin-bottom: 20px; position: relative; }
        .guide-icon::after { content: ''; position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%); width: 8px; height: 8px; background: #333; border-radius: 50%; }
        @keyframes rotatePhone { 0% { transform: rotate(0deg); } 30% { transform: rotate(-90deg); } 70% { transform: rotate(-90deg); } 100% { transform: rotate(0deg); } }
        .rotate-anim { animation: rotatePhone 2.5s infinite; }

        /* 恢復您原有的所有樣式 */
        * { box-sizing: border-box; touch-action: manipulation; }
        html, body { background-color: #f9f9f9; margin: 0; padding: 0; width: 100%; height: 100%; overscroll-behavior: none; }
        body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; padding: 20px; text-align: center; color: #333; }
        .container { max-width: 400px; margin: 0 auto; }
        .card-container { background-color: #FCFCFF; border-radius: 24px; border: 1px solid #F0F0F0; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15); overflow: hidden; padding: 40px 25px; }
        
        .logo-wrapper { position: relative; min-height: 250px; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 20px; width: 95%; margin-left: auto; margin-right: auto; }
        .logo-img { width: 100%; height: auto; display: none; border-radius: 12px; cursor: pointer; }
        .logo-avatar { position: absolute; top: -24px; left: -18px; width: 50px; height: 50px; border-radius: 50%; border: 3px solid #FFFFFF; box-shadow: 0 4px 10px rgba(0,0,0,0.15); z-index: 10; object-fit: cover; display: none; }
        
        #loader-container { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 80%; }
        .loader-text { color: #999; font-size: 0.9em; }
        progress { width: 100%; height: 8px; border-radius: 4px; border: none; background-color: #eee; }
        progress::-webkit-progress-bar { background-color: #eee; border-radius: 4px; }
        progress::-webkit-progress-value { background-color: #555; border-radius: 4px; transition: width 0.3s; }
        
        .header-tabs { margin: 10px 0; font-size: 1.4em; color: #888; }
        .tab-trigger { cursor: pointer; color: #888; font-weight: normal; transition: all 0.2s; }
        .tab-trigger.active { color: #000; font-weight: 800; }
        .slogan { line-height: 1.8; color: #666; font-size: 0.85em; margin-bottom: 25px; }
        .button-group { display: none; flex-direction: column; gap: 12px; }
        .button-group.active { display: flex; }
        .btn { display: flex; align-items: center; justify-content: center; height: 50px; background-color: #f4f4f9; color: #333; text-decoration: none; border-radius: 12px; font-weight: 700; border: 2px solid #dcdcdc; transition: all 0.3s ease; }
        .btn:hover { background-color: #000 !important; color: #fff !important; border-color: #000 !important; transform: translateY(-2px) !important; }

        /* 恢復您原有的 landscape 樣式 (省略部分以節省空間，與您原始檔案一致) */
        #landscape-card-view { display: none; height: 100dvh; overflow-y: auto; }
        @media (orientation: landscape) and (max-width: 950px) {
            .container { display: none !important; }
            #landscape-card-view { display: flex !important; width: 100%; height: 100%; background: #FFFFFF; overflow: hidden; position: relative; }
        }
    </style>
</head>
<body>

<div id="start-overlay" onclick="enterFullScreen()"></div>

<div class="container">
    <div class="card-container">
        <div class="logo-wrapper">
            <div id="loader-container">
                <div class="loader-text">載入日常片段中...</div>
                <progress id="progress-bar" value="0" max="100"></progress>
            </div>
            <img id="logo-avatar" src="https://myezlife.com/eric-logo.jpg" alt="Avatar" class="logo-avatar">
            <img id="logo-img" src="" alt="Logo" class="logo-img" onload="finishLoading()" >
        </div>
        
        <div class="content-section">
            <div class="header-tabs">
                <span class="tab-trigger active" onclick="openTab(event, 'tab-1')">生活</span>・
                <span class="tab-trigger" onclick="openTab(event, 'tab-2')">簡居</span>・
                <span class="tab-trigger" onclick="openTab(event, 'tab-3')">生活</span>
            </div>
            <div class="slogan">
                <p>用瞬間記錄永恆，拿片刻鋪滿人生；<br>
                在角落翻開記憶，把點滴串成一生。<br>
                漫無目的，恣意生活。</p>
            </div>
        </div>

        <div id="tab-1" class="button-group active">
            <a href="https://portaly.cc/myezlife" class="btn" target="_blank" rel="noopener noreferrer">Portaly</a>
            <a href="https://myeztravellife.blogspot.com" class="btn" target="_blank" rel="noopener noreferrer">Blogger</a>
            <a href="https://www.pinterest.com/myezstore/pins/" class="btn" target="_blank" rel="noopener noreferrer">Pinterest</a>
            <a href="https://www.youtube.com/@myezlife" class="btn" target="_blank" rel="noopener noreferrer">YouTube</a>
            <a href="https://www.instagram.com/?hl=zh-tw" class="btn" target="_blank" rel="noopener noreferrer">Instagram</a>
            <a href="https://myezlife.com/games.html" class="btn" target="_blank" rel="noopener noreferrer">自製簡易復古經典小遊戲</a>
        </div>

        <div id="tab-2" class="button-group">
            <a href="https://play.google.com/books" class="btn" target="_blank" rel="noopener noreferrer">生活書房</a>
            <a href="https://ebook.nlpi.edu.tw" class="btn" target="_blank" rel="noopener noreferrer">電子圖書館</a>
            <a href="https://o936157111-ops.github.io/portaly/mylibrary.html" class="btn" target="_blank" rel="noopener noreferrer">生活小書房</a>
            <a href="https://myezlife.notion.site/ebb39ac941254e4ca49803d16f9df13d" class="btn" target="_blank" rel="noopener noreferrer">挑本書細讀</a>
        </div>

        <div id="tab-3" class="button-group">
            <a href="https://myezdailylife.blogspot.com" class="btn" target="_blank" rel="noopener noreferrer">零碎日常</a>
            <a href="https://youtube.com/playlist?list=PL64GNbse4j6vXlAT3Xw4OYk1uqrsvsOac&si=2J4QFyZ2GwTpG2Ic" class="btn" target="_blank" rel="noopener noreferrer">好歌一直聽</a>
            <a href="https://www.flickr.com/photos/0936157111/" class="btn" target="_blank" rel="noopener noreferrer">生活相簿</a>
            <a href="https://o936157111-ops.github.io/portaly/FileExplorer.html" class="btn" target="_blank" rel="noopener noreferrer">檔案總管</a>
        </div>
    </div>
</div>

<div id="landscape-card-view">
    </div>

<script>
    function updateOverlay() {
        const overlay = document.getElementById('start-overlay');
        const isPortrait = window.innerHeight > window.innerWidth;
        if (isPortrait) {
            overlay.innerHTML = `<div class="guide-icon rotate-anim"></div><div class="overlay-content"><h1>歡迎來到 生活・簡居・生活</h1><p>請將手機轉為橫向以獲得最佳體驗<br>或點擊此處直接進入</p></div>`;
        } else {
            overlay.innerHTML = `<div class="overlay-content"><h1>歡迎來到 生活・簡居・生活</h1><p>點擊畫面以進入全螢幕體驗</p></div>`;
        }
    }

    function enterFullScreen() {
        const elem = document.documentElement;
        if (elem.requestFullscreen) {
            elem.requestFullscreen().catch(err => console.log(err.message));
        }
        document.getElementById('start-overlay').style.display = 'none';
    }

    function openTab(evt, tabName) {
        document.querySelectorAll(".button-group").forEach(el => el.classList.remove("active"));
        document.querySelectorAll(".tab-trigger").forEach(el => el.classList.remove("active"));
        document.getElementById(tabName).classList.add("active");
        evt.currentTarget.classList.add("active");
    }

    // 載入器邏輯
    const progressBar = document.getElementById('progress-bar');
    let progress = 0;
    const interval = setInterval(() => { if (progress < 90) { progress += 5; progressBar.value = progress; } }, 100);
    function finishLoading() {
        clearInterval(interval);
        progressBar.value = 100;
        setTimeout(() => {
            document.getElementById('loader-container').style.display = 'none';
            document.getElementById('logo-img').style.display = 'block';
            document.getElementById('logo-avatar').style.display = 'block';
        }, 200);
    }
    
    document.getElementById('logo-img').src = "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhpplybxkZauJQWUOn9OWSx4fqUNgwoxpGXCuovmbLZMKRRh6LSY-nxcOHvfbRtCnP43rluEF1DtoO4T_7Xrl7U_tmbyn4mdN0em7q4DMw3euMtaflcW3EeXl-1trm2MFlhaE4o7HgZ5I4TUVaxOR0eHPdmqwV_Nq_tlSMHGhiooq68AHhpA7lz6C58U8O5/s560/logo.gif";

    window.addEventListener("resize", updateOverlay);
    updateOverlay();
</script>
</body>
</html>
