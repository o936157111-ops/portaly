<div id="lightbox-modal" onclick="closeLightbox(event)">
    <span id="lightbox-close">&times;</span>
    <div class="lightbox-content" onclick="event.stopPropagation()">
        <img id="lightbox-img" src="" alt="放大圖片">
        <a id="lightbox-link" href="" target="_blank" rel="noopener noreferrer" class="lightbox-btn">🔗 前往原始連結</a>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    // 移除日常作息相關事件與輸入監聽
});

function updateRealtimeInfo() {
    const now = new Date();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    const wk = ['日', '一', '二', '三', '四', '五', '六'][now.getDay()];
    const h = String(now.getHours()).padStart(2, '0');
    const min = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');
    
    const datetimeEl = document.getElementById('datetime-text');
    if (datetimeEl) datetimeEl.innerText = `${m}/${d} (${wk}) ${h}:${min}:${s}`;
}

setInterval(updateRealtimeInfo, 1000);
updateRealtimeInfo();

function randomTabOnLoad() {
    const tabs = ['tab-1', 'tab-2', 'tab-3'];
    const triggers = document.querySelectorAll('.tab-trigger');
    const randomIndex = Math.floor(Math.random() * tabs.length);
    const selectedTabId = tabs[randomIndex];
    
    document.querySelectorAll(".button-group").forEach(el => el.classList.remove("active"));
    triggers.forEach(el => el.classList.remove("active"));
    
    document.getElementById(selectedTabId).classList.add("active");
    if (triggers[randomIndex]) {
        triggers[randomIndex].classList.add("active");
    }
}

randomTabOnLoad();

function initLightbox() {
    const pinCards = document.querySelectorAll('.pin-card');
    const modal = document.getElementById('lightbox-modal');
    const modalImg = document.getElementById('lightbox-img');
    const modalLink = document.getElementById('lightbox-link');

    pinCards.forEach(card => {
        card.addEventListener('click', function(e) {
            e.preventDefault(); 
            const img = this.querySelector('.pin-img');
            const href = this.getAttribute('href');
            
            if (img) {
                modalImg.src = img.src;
                modalLink.href = href;
                modal.style.display = 'flex';
            }
        });
    });
}

function closeLightbox(e) {
    if (e.target.id === 'lightbox-modal' || e.target.id === 'lightbox-close') {
        document.getElementById('lightbox-modal').style.display = 'none';
    }
}

function handleOrientation() {
    const view = document.getElementById('landscape-card-view');
    const subText = document.getElementById('dynamic-card-sub');
    const selectContainer = document.getElementById('dynamic-select-container');

    if (window.matchMedia("(orientation: landscape)").matches) {
        const isRightLandscape = window.screen.orientation && window.screen.orientation.type === 'landscape-secondary';

        if (isRightLandscape) {
            view.classList.add('reverse-layout');
            subText.innerText = "AI好劇一直看";
            selectContainer.innerHTML = `
                <select class="landscape-song-select" onchange="playSelectedContent(this)">
                    <option value="" disabled selected>🎬 選擇 AI 好劇</option>
                    <option value="t76zhPJTS2g">春風不等舊時人</option>
                    <option value="Zux32m7Nxjc">百日神醫</option>
                    <option value="T6RWJ7hThMc">一瓶水背後的真相</option>
                    <option value="zJ3Aajl_20">芯骨藏鋒</option>
                    <option value="oe6CQDER01g">歸墟-第一季</option>
                    <option value="6Wz5pdMXHJY">歸墟-第二季</option>
                    <option value="omWT8s9azZ0">現代博士穿成農門窮小子！第1~3季</option>
                    <option value="Xv9WUt_e8xw">現代博士穿成農門窮小子！第4季</option>
                    <option value="LvNlJjV6Jns">現代博士穿成農門窮小子！第5季</option>
                    <option value="ITIWu-l7czg">現代博士穿成農門窮小子！第6季</option>
                    <option value="KeITzXlcqoQ">現代博士穿成農門窮小子！第7季</option>
                    <option value="tT3jm4TmEGE">站在外科之巅，我在急诊科疯狂摸鱼</option>
                </select>
            `;
        } else {
            view.classList.remove('reverse-layout');
            subText.innerText = "好歌一直聽";
            selectContainer.innerHTML = `
                <select class="landscape-song-select" onchange="playSelectedContent(this)">
                    <option value="" disabled selected>🎵 選擇好歌清單</option>
                    <option value="KSTeFTHjj14">楊乃文 - 推開世界的門</option>
                    <option value="W9Ee85S7s2Q">楊乃文 - 我給的愛</option>
                    <option value="1mrBdx9FH44">楊乃文 - 女爵</option>
                    <option value="cP5te4Tl4Os">杨乃文 - 证据</option>
                    <option value="w-flWDAO2rA">楊乃文 - 未接來電</option>
                    <option value="uzD_BwIaeQA">楊乃文 - 祝我幸福</option> 
                    <option value="gqJ21g7nHXY">郭靜 Claire Kuo《暖橘》</option>
                    <option value="nZZ6xsntocU">郭靜 - 陪著我的時候想著她</option>
                    <option value="7dp-Zi7cZVc">郭靜 下一個天亮</option>
                    <option value="IxFZurBc79Q">郭靜 Claire Kuo【心牆】</option>
                    <option value="RSIisC4oTpo">郭靜 Claire Kuo - 往未來飛的客機</option>
                    <option value="rMuqgAHnXUo">我不该动情</option>
                    <option value="Pvb8SO9PBXc">思念成災</option>
                    <option value="tANkOuKG_28">原来你爱的不是我</option>
                </select>
            `;
        }
    }
}

function delayedHandleOrientation() {
    setTimeout(handleOrientation, 100);
}

if (window.screen.orientation) {
    window.screen.orientation.addEventListener("change", delayedHandleOrientation);
}
window.addEventListener("orientationchange", delayedHandleOrientation);
window.addEventListener("resize", delayedHandleOrientation);
delayedHandleOrientation();

function updateOverlay() {
    const overlay = document.getElementById('start-overlay');
    const isPortrait = window.innerHeight > window.innerWidth;
    if (isPortrait) {
        overlay.innerHTML = `<div class="guide-icon rotate-anim"></div><div style="padding:20px;"><h1>歡迎來到<BR>生活・簡居・生活</h1><p>請將手機轉為橫向以獲得最佳體驗<br>或點擊此處直接進入</p></div>`;
    } else {
        overlay.innerHTML = `<div style="padding:20px;"><h1>歡迎來到<BR>生活・簡居・生活</h1><p>點擊畫面以進入全螢幕體驗</p></div>`;
    }
}

function enterFullScreen() {
    const elem = document.documentElement;
    if (elem.requestFullscreen) {
        elem.requestFullscreen().catch(err => console.log(err.message));
    }
    document.getElementById('start-overlay').style.display = 'none';
}

function openTab(evt, tabName) {
    document.querySelectorAll(".button-group").forEach(el => el.classList.remove("active"));
    document.querySelectorAll(".tab-trigger").forEach(el => el.classList.remove("active"));
    document.getElementById(tabName).classList.add("active");
    evt.currentTarget.classList.add("active");
}

function togglePoem() {
    const poemBox = document.getElementById('poem-box');
    poemBox.classList.toggle('show');
}

function playSelectedContent(selectElement) {
    const val = selectElement.value;
    if (!val) return;

    const facade = document.getElementById('landscape-facade');
    facade.classList.add('door-open');

    let iframeContainer = facade.querySelector('.youtube-player-container');
    if (!iframeContainer) {
        iframeContainer = document.createElement('div');
        iframeContainer.className = 'youtube-player-container';
        iframeContainer.style.cssText = "position:absolute; inset:0; z-index:5; background:#000; display:flex; justify-content:center; align-items:center;";
        facade.appendChild(iframeContainer);
    }

    if (val.startsWith("http")) {
        iframeContainer.innerHTML = `<div style="color:#fff; text-align:center; padding:20px;">已開啟播放清單，<a href="${val}" target="_blank" style="color:#D4AF37;">點此前往 YouTube 觀賞</a></div>`;
    } else {
        iframeContainer.innerHTML = `
            <iframe width="100%" height="100%" 
                src="https://www.youtube.com/embed/${val}?autoplay=1" 
                title="YouTube video player" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen style="width:100%; height:100%;">
            </iframe>
        `;
    }
}

const progressBar = document.getElementById('progress-bar');
let progress = 0;
const interval = setInterval(() => { 
    if (progress < 90) { 
        progress += 5; 
        progressBar.value = progress; 
    } 
}, 100);

function finishLoading() {
    clearInterval(interval);
    progressBar.value = 100;
    setTimeout(() => {
        document.getElementById('loader-container').style.display = 'none';
        document.getElementById('logo-img').style.display = 'block';
        document.getElementById('logo-avatar').style.display = 'block';
        document.getElementById('logo-link-wrap').style.display = 'block';
    }, 200);

    const masonryContainer = document.getElementById("random-masonry");
    const cards = Array.from(masonryContainer.children);
    
    for (let i = cards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cards[i], cards[j]] = [cards[j], cards[i]];
    }
    
    masonryContainer.innerHTML = "";
    cards.slice(0, 15).forEach(card => masonryContainer.appendChild(card));

    initLightbox();
}

document.getElementById('logo-img').src = "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhpplybxkZauJQWUOn9OWSx4fqUNgwoxpGXCuovmbLZMKRRh6LSY-nxcOHvfbRtCnP43rluEF1DtoO4T_7Xrl7U_tmbyn4mdN0em7q4DMw3euMtaflcW3EeXl-1trm2MFlhaE4o7HgZ5I4TUVaxOR0eHPdmqwV_Nq_tlSMHGhiooq68AHhpA7lz6C58U8O5/s560/logo.gif";

window.addEventListener("resize", updateOverlay);
updateOverlay();
</script>
