<script>


// 偵測轉向並切換鏡像佈局，絕對不會影響電腦版顯示
function handleOrientation() {
    const view = document.getElementById('landscape-card-view');
    // 只有在手機橫向狀態下才進行反轉偵測
    if (window.matchMedia("(orientation: landscape)").matches) {
        if (window.screen.orientation && window.screen.orientation.type === 'landscape-secondary') {
            view.classList.add('reverse-layout');
        } else {
            view.classList.remove('reverse-layout');
        }
    }
}

// 監聽轉向
if (window.screen.orientation) {
    window.screen.orientation.addEventListener("change", handleOrientation);
}
window.addEventListener("orientationchange", handleOrientation);
handleOrientation();


    function updateOverlay() {
        const overlay = document.getElementById('start-overlay');
        const isPortrait = window.innerHeight > window.innerWidth;
        if (isPortrait) {
            overlay.innerHTML = `<div class="guide-icon rotate-anim"></div><div style="padding:20px;"><h1>歡迎來到<BR>生活・簡居・生活</h1><p>請將手機轉為橫向以獲得最佳體驗<br>或點擊此處直接進入</p></div>`;
        } else {
            overlay.innerHTML = `<div style="padding:20px;"><h1>歡迎來到<BR>生活・簡居・生活</h1><p>點擊畫面以進入全螢幕體驗</p></div>`;
        }
    }

    function enterFullScreen() {
        const elem = document.documentElement;
        if (elem.requestFullscreen) {
            elem.requestFullscreen().catch(err => console.log(err.message));
        }
        document.getElementById('start-overlay').style.display = 'none';
    }

    function openTab(evt, tabName) {
        document.querySelectorAll(".button-group").forEach(el => el.classList.remove("active"));
        document.querySelectorAll(".tab-trigger").forEach(el => el.classList.remove("active"));
        document.getElementById(tabName).classList.add("active");
        evt.currentTarget.classList.add("active");
    }

    // 載入器邏輯
    const progressBar = document.getElementById('progress-bar');
    let progress = 0;
    const interval = setInterval(() => { if (progress < 90) { progress += 5; progressBar.value = progress; } }, 100);
    function finishLoading() {
        clearInterval(interval);
        progressBar.value = 100;
        setTimeout(() => {
            document.getElementById('loader-container').style.display = 'none';
            document.getElementById('logo-img').style.display = 'block';
            document.getElementById('logo-avatar').style.display = 'block';
        }, 200);
    }
    
    document.getElementById('logo-img').src = "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhpplybxkZauJQWUOn9OWSx4fqUNgwoxpGXCuovmbLZMKRRh6LSY-nxcOHvfbRtCnP43rluEF1DtoO4T_7Xrl7U_tmbyn4mdN0em7q4DMw3euMtaflcW3EeXl-1trm2MFlhaE4o7HgZ5I4TUVaxOR0eHPdmqwV_Nq_tlSMHGhiooq68AHhpA7lz6C58U8O5/s560/logo.gif";

    window.addEventListener("resize", updateOverlay);
    updateOverlay();
</script>
