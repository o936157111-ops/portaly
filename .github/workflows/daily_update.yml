name: Daily News Auto Update

on:
  schedule:
    - cron: '0 23 * * *'  # 每天世界標準時間 23:00 執行（台灣時間早上 7 點）
  workflow_dispatch:      # 允許你隨時手動在 GitHub 點擊按鈕觸發

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 授權讓 Action 可以自動 push 程式碼回倉庫

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝相依套件
        run: pip install google-genai beautifulsoup4 requests

      - name: 執行更新腳本
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_script.py

      - name: 自動提交並推送變更回 GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "bot@github.com"
          git add news.json
          git commit -m "chore: 每日自動更新最新新聞摘要 [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }}