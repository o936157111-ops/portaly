name: Sync HTML Files

# 設定觸發時機：每當您將程式碼 push 到 main (或 master) 分支時自動執行
on:
  push:
    branches:
      - main  # 如果您的預設分支是 master，請改成 master

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    
    # 授權工作流程可以修改並推回程式碼到倉庫中
    permissions:
      contents: write

    steps:
    # 1. 把專案程式碼抓到 GitHub 雲端執行環境中
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 設定 Python 環境
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. 執行您的 Python 腳本
    - name: Run sync script
      run: python sync_files.py

    # 4. 自動把更新後的 index_python.html 提交並推回 GitHub 倉庫
    - name: Commit and push if changed
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto-sync index_python.html from index.html via Python"
        file_pattern: index_python.html