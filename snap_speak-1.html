<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI學外語 | myezlife.com</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
            color: #334155;
            margin: 0;
            padding: 0;
        }
        .green-banner {
            background-color: #00a600;
            border-radius: 1.5rem;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 166, 0, 0.2);
        }
    </style>
</head>
<body class="p-3 max-w-md mx-auto flex flex-col min-h-screen">

    <!-- 頂部精簡綠色橫幅：返回首頁按鈕與全域語言切換 -->
    <header class="green-banner p-3.5 flex items-center justify-between gap-3 mb-3 shrink-0">
        <a href="https://myezlife.com" class="bg-white/20 hover:bg-white/30 text-white px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 backdrop-blur">
            <i class="fa-solid fa-house"></i> 返回首頁
        </a>
        <div class="text-center font-black tracking-wider text-sm">
            🌿 AI 學外語 (分階段學習)
        </div>
        <div class="flex bg-black/20 backdrop-blur rounded-xl p-1 gap-1 shrink-0">
            <button onclick="setGlobalLanguage('ja', this)" class="lang-btn px-2.5 py-1 rounded-lg text-xs font-bold bg-white text-[#00a600] shadow-xs transition">日</button>
            <button onclick="setGlobalLanguage('en', this)" class="lang-btn px-2.5 py-1 rounded-lg text-xs font-bold text-white transition">英</button>
            <button onclick="setGlobalLanguage('ko', this)" class="lang-btn px-2.5 py-1 rounded-lg text-xs font-bold text-white transition">韓</button>
        </div>
    </header>

    <!-- 主要互動卡片 -->
    <main class="flex-1 flex flex-col bg-white border border-slate-200 rounded-3xl p-4 shadow-sm space-y-3 relative overflow-hidden">
        
        <!-- 頂端功能圖形列 -->
        <div class="grid grid-cols-4 gap-2 pb-3 border-b border-slate-100 shrink-0">
            <button onclick="triggerCamera()" class="h-12 rounded-2xl bg-slate-100 hover:bg-emerald-50 text-slate-700 hover:text-[#00a600] flex items-center justify-center text-lg transition active:scale-95" title="拍照辨識">
                <i class="fa-solid fa-camera"></i>
            </button>
            <button onclick="triggerUpload()" class="h-12 rounded-2xl bg-slate-100 hover:bg-emerald-50 text-slate-700 hover:text-[#00a600] flex items-center justify-center text-lg transition active:scale-95" title="上傳照片">
                <i class="fa-solid fa-image"></i>
            </button>
            <button onclick="toggleVoiceInput()" id="micBtn" class="h-12 rounded-2xl bg-slate-100 hover:bg-emerald-50 text-slate-700 hover:text-[#00a600] flex items-center justify-center text-lg transition active:scale-95" title="語音輸入">
                <i class="fa-solid fa-microphone"></i>
            </button>
            <button onclick="clearChat()" class="h-12 rounded-2xl bg-slate-100 hover:bg-red-50 text-slate-700 hover:text-red-600 flex items-center justify-center text-lg transition active:scale-95" title="重新開始">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </div>

        <!-- 隱藏的拍照與上傳 Input -->
        <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" onchange="handleImageSelected(event)">
        <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageSelected(event)">

        <!-- 圖片預覽區 -->
        <div id="previewContainer" class="hidden relative h-36 rounded-2xl overflow-hidden bg-slate-900 shrink-0">
            <img id="previewImage" src="" alt="Preview" class="w-full h-full object-cover">
            <button onclick="removeImage()" class="absolute top-2 right-2 w-7 h-7 bg-black/60 text-white rounded-full flex items-center justify-center text-xs">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- 對話訊息顯示區 -->
        <div id="chatBox" class="flex-1 overflow-y-auto p-3 bg-slate-50 rounded-2xl border border-slate-100 flex flex-col gap-3 min-h-[260px]">
            <!-- 動態內容 -->
        </div>

        <!-- 底部訊息輸入區 -->
        <div class="flex gap-2 shrink-0 pt-1">
            <input type="text" id="userInput" placeholder="輸入想學的句子、物品或任何日常對話..." class="flex-1 bg-slate-50 border border-slate-200 px-3.5 py-3 rounded-xl text-sm outline-none focus:border-[#00a600] transition" onkeypress="handleKeyPress(event)">
            <button id="sendBtn" onclick="sendMessage()" class="w-12 h-12 rounded-xl bg-[#00a600] hover:bg-[#008f00] text-white flex items-center justify-center transition shrink-0 shadow-sm active:scale-95">
                <i class="fa-solid fa-paper-plane text-sm"></i>
            </button>
        </div>

    </main>

    <!-- 隱藏的 Google 標準發音音訊容器 -->
    <audio id="globalAudioPlayer" class="hidden"></audio>

    <script>
        let currentLang = 'ja';
        const GAS_URL = "https://script.google.com/macros/s/AKfycbx54C4nncX9H0GWMZGsMR7Mo-vDBPEMkrAB72jLjbCmyMgEVZeDLL2T6Vik8ML9Hwte/exec";
        const STORAGE_KEY = "mobile_ai_lang_history_v14";

        let chatHistory = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [
            { role: 'ai', lang: 'ja', step: 1, topic: '歡迎', text: '你好！請輸入你想學的日常對話句子、物品或拍照上傳，我們將以【分階段方式】輕鬆學外語！' }
        ];

        let selectedImageDataUrl = null;

        window.addEventListener('DOMContentLoaded', renderHistory);

        // 切換全域語言
        async function setGlobalLanguage(lang, btnElement) {
            if (currentLang === lang) return;
            currentLang = lang;
            
            document.querySelectorAll('.lang-btn').forEach(b => {
                b.className = "lang-btn px-2.5 py-1 rounded-lg text-xs font-bold text-white transition";
            });
            btnElement.className = "lang-btn px-2.5 py-1 rounded-lg text-xs font-bold bg-white text-[#00a600] shadow-xs transition";
            
            const langNames = { ja: '日語', en: '英語', ko: '韓語' };
            
            const lastActiveTopic = chatHistory.slice().reverse().find(m => m.topic && m.topic !== '歡迎');
            if (lastActiveTopic) {
                appendMessageToDOM(`已切換至 ${langNames[lang]}，正在為您轉換主題...`, 'ai');
                await requestAIStage(lastActiveTopic.topic, 1, true);
            } else {
                appendMessageToDOM(`已切換學習語言：${langNames[lang]}`, 'ai');
            }
        }

        function triggerCamera() { document.getElementById('cameraInput').click(); }
        function triggerUpload() { document.getElementById('imageInput').click(); }

        function handleImageSelected(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                selectedImageDataUrl = evt.target.result;
                document.getElementById('previewImage').src = selectedImageDataUrl;
                document.getElementById('previewContainer').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        function removeImage() {
            selectedImageDataUrl = null;
            document.getElementById('previewContainer').classList.add('hidden');
            document.getElementById('imageInput').value = "";
            document.getElementById('cameraInput').value = "";
        }

        function toggleVoiceInput() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('您的手機瀏覽器不支援語音辨識');
                return;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = currentLang === 'ja' ? 'ja-JP' : currentLang === 'ko' ? 'ko-KR' : 'en-US';
            
            const micBtn = document.getElementById('micBtn');
            micBtn.className = "h-12 rounded-2xl bg-red-500 text-white flex items-center justify-center text-lg animate-pulse shadow-sm";

            recognition.onresult = (event) => {
                document.getElementById('userInput').value = event.results[0][0].transcript;
                micBtn.className = "h-12 rounded-2xl bg-slate-100 hover:bg-emerald-50 text-slate-700 hover:text-[#00a600] flex items-center justify-center text-lg transition active:scale-95";
                sendMessage();
            };
            recognition.onerror = recognition.onend = () => {
                micBtn.className = "h-12 rounded-2xl bg-slate-100 hover:bg-emerald-50 text-slate-700 hover:text-[#00a600] flex items-center justify-center text-lg transition active:scale-95";
            };
            recognition.start();
        }

        // Google 標準發音（完完全全採用您原本能動的原始架構，僅安全移除會把日文漢字誤砍的正規表達式）
        function speakSentence(phrase, btnElement) {
            let cleanText = phrase.replace(/[*#`()（）]/g, '').trim();
            if (!cleanText) return;

            const icon = btnElement.querySelector('i');
            const originalClass = icon.className;
            icon.className = "fa-solid fa-spinner fa-spin text-xs text-emerald-600";

            const langCode = currentLang === 'ja' ? 'ja' : currentLang === 'ko' ? 'ko' : 'en';
            const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(cleanText)}&tl=${langCode}&client=tw-ob&ttsspeed=1`;

            const audio = document.getElementById('globalAudioPlayer');
            audio.src = ttsUrl;
            
            audio.oncanplaythrough = () => {
                icon.className = "fa-solid fa-volume-high text-xs text-emerald-600 animate-pulse";
                audio.play().catch(() => { icon.className = originalClass; });
            };
            audio.onended = audio.onerror = () => { icon.className = originalClass; };
            audio.load();
        }

        async function sendMessage() {
            const inputField = document.getElementById("userInput");
            let text = inputField.value.trim();

            if (!text && !selectedImageDataUrl) return;

            const topic = text || "圖片辨識物件";
            chatHistory.push({ role: 'user', text: text || "[上傳了圖片]" });
            saveAndRender();
            inputField.value = "";
            removeImage();

            // 每次送出新主題，固定從【階段一】開始，確保秒回與輕量
            await requestAIStage(topic, 1);
        }

        // 請求特定階段的內容
        async function requestAIStage(topic, stageNum) {
            const targetLangName = currentLang === 'ja' ? '日語' : currentLang === 'ko' ? '韓語' : '英語';
            
            let stageInstruction = "";
            if (stageNum === 1) {
                stageInstruction = `請針對主題「${topic}」提供【階段一：核心說法與外語單字】。
格式要求：
1. 給出最核心的單字或短句，必須用反引號包起來（例如 \`お仕事ですか\`）。
2. 附上中文翻譯與短單字解析。精簡扼要，讓使用者能快速秒回掌握。`;
            } else if (stageNum === 2) {
                stageInstruction = `請針對主題「${topic}」繼續提供【階段二：功能與實用句型】。
格式要求：
1. 提供實用的對話句型，必須用反引號包起來（例如 \`明日も仕事がありますか\`）。
2. 附上中文翻譯與用法說明。`;
            } else if (stageNum === 3) {
                stageInstruction = `請針對主題「${topic}」提供【階段三：生活脈絡與文化故事】。
格式要求：
1. 簡述其文化背景或日常生活應用情境。
2. 如有出現關鍵短句也請用反引號包起來。`;
            }

            const systemPrompt = `你是一位專業親切的生活外語導師（目前目標學習語言：${targetLangName}）。請嚴格遵守分階段教學，每次只回答一個階段。`;

            let contentsPayload = [
                { role: 'user', parts: [{ text: systemPrompt }] },
                { role: 'user', parts: [{ text: stageInstruction }] }
            ];

            const loadingIndex = chatHistory.length;
            chatHistory.push({ role: 'ai', lang: currentLang, step: stageNum, topic: topic, text: `（AI 正在為您編排階段 ${stageNum} 內容...）` });
            saveAndRender();

            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ contents: contentsPayload })
                });

                const data = await response.json();
                if (data.status === 'success') {
                    chatHistory[loadingIndex] = { 
                        role: 'ai', 
                        lang: currentLang, 
                        step: stageNum, 
                        topic: topic, 
                        text: data.reply 
                    };
                    saveAndRender();
                } else {
                    throw new Error(data.message || "回應失敗");
                }
            } catch (err) {
                chatHistory[loadingIndex] = { role: 'ai', lang: currentLang, step: stageNum, topic: topic, text: "載入失敗：" + err.message };
                saveAndRender();
            }
        }

        function renderMessageContent(containerDiv, msgObj) {
            containerDiv.innerHTML = "";
            if (!msgObj.text) return;

            // 1. 渲染文字與反引號發音按鈕
            const parts = msgObj.text.split(/`([^`]+)`/);
            parts.forEach((part, index) => {
                if (!part) return;
                if (index % 2 === 1) {
                    const span = document.createElement("span");
                    span.className = "inline-flex items-center gap-1 font-bold text-emerald-800 bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-200 my-0.5 mx-0.5";
                    
                    const textSpan = document.createElement("span");
                    textSpan.textContent = part;
                    span.appendChild(textSpan);

                    const btn = document.createElement("button");
                    btn.className = "text-emerald-600 hover:text-emerald-800 p-1 transition active:scale-125 cursor-pointer flex items-center justify-center";
                    btn.title = "播放標準發音";
                    btn.innerHTML = '<i class="fa-solid fa-volume-high text-xs"></i>';
                    
                    const sentenceToSpeak = part;
                    btn.onclick = (e) => {
                        e.stopPropagation();
                        speakSentence(sentenceToSpeak, btn);
                    };

                    span.appendChild(btn);
                    containerDiv.appendChild(span);
                } else {
                    const textNode = document.createTextNode(part);
                    containerDiv.appendChild(textNode);
                }
            });

            // 2. 如果是 AI 的訊息，自動在下方帶出「階段推進按鈕」
            if (msgObj.role === 'ai' && msgObj.step && msgObj.topic && msgObj.topic !== '歡迎' && !msgObj.text.includes('正在為您編排')) {
                const btnContainer = document.createElement("div");
                btnContainer.className = "mt-3 pt-2 border-t border-slate-100 flex flex-wrap gap-2";

                if (msgObj.step === 1) {
                    const nextBtn = document.createElement("button");
                    nextBtn.className = "text-xs font-bold bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-xl shadow-xs transition active:scale-95 flex items-center gap-1";
                    nextBtn.innerHTML = `<i class="fa-solid fa-arrow-right"></i> 進入階段二：實用句型`;
                    nextBtn.onclick = () => requestAIStage(msgObj.topic, 2);
                    btnContainer.appendChild(nextBtn);
                } else if (msgObj.step === 2) {
                    const nextBtn = document.createElement("button");
                    nextBtn.className = "text-xs font-bold bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-xl shadow-xs transition active:scale-95 flex items-center gap-1";
                    nextBtn.innerHTML = `<i class="fa-solid fa-arrow-right"></i> 進入階段三：生活脈絡`;
                    nextBtn.onclick = () => requestAIStage(msgObj.topic, 3);
                    btnContainer.appendChild(nextBtn);
                }

                containerDiv.appendChild(btnContainer);
            }
        }

        function appendMessageToDOM(msgObj) {
            const chatBox = document.getElementById("chatBox");
            const div = document.createElement("div");
            div.className = `p-3 rounded-2xl text-xs sm:text-sm max-w-[92%] leading-relaxed whitespace-pre-wrap ${msgObj.role === 'user' ? 'bg-[#00a600] text-white self-end rounded-br-xs' : 'bg-white border border-slate-200 text-slate-800 self-start rounded-bl-xs shadow-2xs'}`;
            
            if (msgObj.role === 'ai' && !msgObj.text.includes('正在為您編排') && !msgObj.text.includes('已切換')) {
                renderMessageContent(div, msgObj);
            } else {
                div.textContent = msgObj.text;
            }

            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }

        function renderHistory() {
            const chatBox = document.getElementById("chatBox");
            chatBox.innerHTML = "";
            chatHistory.forEach(m => appendMessageToDOM(m));
        }

        function saveStorage() { localStorage.setItem(STORAGE_KEY, JSON.stringify(chatHistory)); }
        function saveAndRender() { saveStorage(); renderHistory(); }

        function clearChat() {
            if (confirm("重新開始新的學習對話嗎？")) {
                localStorage.removeItem(STORAGE_KEY);
                chatHistory = [{ role: 'ai', lang: 'ja', step: 1, topic: '歡迎', text: '對話已重置！請輸入想學的日常對話句子、物品或拍照上傳開始分階段學習。' }];
                renderHistory();
            }
        }

        function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }
    </script>
</body>
</html>
