<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>myezlife - 個人化數位生活儀表板</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .glass-panel { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col md:flex-row">

  <!-- 左側邊欄 -->
  <aside id="sidebar" class="w-full md:w-80 bg-slate-950/80 border-r border-slate-800 p-4 md:p-6 flex flex-col justify-between hidden md:flex">
    <div class="space-y-6">
      <!-- Header / 大頭貼與天氣 -->
      <div class="flex items-center space-x-3 pb-4 border-b border-slate-800">
        <div class="w-12 h-12 rounded-full bg-emerald-600 flex items-center justify-center text-xl font-bold text-white shadow-md">
          🌱
        </div>
        <div>
          <h2 class="font-bold text-lg text-emerald-400">myezlife 儀表板</h2>
          <div id="weather-info" class="text-xs text-slate-400 flex items-center gap-1">
            <span>🌦️ 台北市 26°C 多雲時晴</span>
          </div>
        </div>
      </div>

      <!-- 選單目錄 -->
      <nav class="space-y-2">
        <a href="https://myezlife.com/diary/index.html" class="flex items-center space-x-3 p-3 rounded-xl hover:bg-slate-800/60 transition text-slate-300 hover:text-white">
          <i class="fa-solid fa-seedling text-emerald-400 w-5"></i>
          <span>心情隨筆與待辦</span>
        </a>
        <a href="https://myezlife.com/FileExplorer.html" class="flex items-center space-x-3 p-3 rounded-xl hover:bg-slate-800/60 transition text-slate-300 hover:text-white">
          <i class="fa-solid fa-folder-open text-amber-400 w-5"></i>
          <span>個人檔案總管</span>
        </a>
        <a href="https://myezlife.com/ai-html/" class="flex items-center space-x-3 p-3 rounded-xl hover:bg-slate-800/60 transition text-slate-300 hover:text-white">
          <i class="fa-solid fa-wand-magic-sparkles text-purple-400 w-5"></i>
          <span>AI 創作藝廊</span>
        </a>
      </nav>
    </div>

    <!-- 左側最下方：開發者管理面板解鎖入口 -->
    <div class="pt-6 border-t border-slate-800/80">
      <button onclick="toggleDevPanel()" class="w-full text-left text-xs text-slate-600 hover:text-slate-400 p-2 rounded transition flex items-center justify-between">
        <span>⚙️ 系統管理員存取</span>
        <i class="fa-solid fa-lock text-[10px]"></i>
      </button>

      <!-- 動態密碼解鎖面板 (預設隱藏) -->
      <div id="dev-panel" class="hidden mt-3 p-3 bg-slate-900 rounded-xl border border-slate-800 text-xs space-y-3">
        <div class="text-slate-300 font-bold flex items-center justify-between">
          <span>動態密碼驗證</span>
          <span class="text-[10px] text-amber-400">YYYYMMDD</span>
        </div>
        <div class="flex gap-2">
          <input type="password" id="dev-pass-input" placeholder="請輸入 8 位數密碼" class="w-full bg-slate-950 border border-slate-700 px-2 py-1 rounded text-white text-xs focus:outline-none focus:border-emerald-500">
          <button onclick="unlockAdmin()" class="bg-emerald-600 hover:bg-emerald-500 text-slate-950 px-3 py-1 rounded font-bold transition">解鎖</button>
        </div>
        <div id="admin-tools" class="hidden space-y-2 pt-2 border-t border-slate-800">
          <button onclick="exportPageHTML()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 py-1.5 rounded transition flex items-center justify-center gap-1">
            <i class="fa-solid fa-download"></i> 儲存並下載完整 HTML
          </button>
        </div>
      </div>
    </div>
  </aside>

  <!-- 主要內容區 -->
  <main class="flex-1 p-4 md:p-8 space-y-6 max-w-6xl mx-auto w-full">
    
    <!-- 頂部時間與歡迎標題 -->
    <header class="glass-panel p-6 rounded-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <h1 class="text-2xl md:text-3xl font-bold text-white tracking-wide">個人數位生活儀表板</h1>
        <p class="text-slate-400 text-sm mt-1" id="date-display">載入日期中...</p>
      </div>
      <div class="text-right">
        <div class="text-3xl md:text-4xl font-extrabold text-emerald-400 font-mono" id="clock-display">00:00:00</div>
      </div>
    </header>

    <!-- 自訂 APP 捷徑區 -->
    <section class="glass-panel p-6 rounded-2xl space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h2 class="text-lg font-bold text-slate-200 flex items-center gap-2">
          <i class="fa-solid fa-grip text-emerald-400"></i> 自訂 App 捷徑
        </h2>
        <button onclick="openAddAppModal()" class="text-xs bg-emerald-600/20 hover:bg-emerald-600/40 text-emerald-300 border border-emerald-500/30 px-3 py-1.5 rounded-lg transition flex items-center gap-1">
          <i class="fa-solid fa-plus"></i> 新增捷徑
        </button>
      </div>

      <!-- App 捷徑容器 (已加入清空渲染防護，絕不重複新增) -->
      <div id="app-grid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-3 md:gap-4">
        <!-- 由 JS 動態繪製 -->
      </div>
    </section>

  </main>

  <!-- 新增 App 彈出視窗 -->
  <div id="app-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full max-w-md space-y-4">
      <h3 class="text-lg font-bold text-white">新增自訂 App 捷徑</h3>
      <div class="space-y-3 text-sm">
        <div>
          <label class="block text-slate-400 mb-1">App 名稱</label>
          <input type="text" id="app-name-input" placeholder="例：Google" class="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-white focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-slate-400 mb-1">網址 (URL)</label>
          <input type="text" id="app-url-input" placeholder="https://..." class="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-white focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-slate-400 mb-1">圖示 Emoji</label>
          <input type="text" id="app-icon-input" placeholder="🌐" value="🌐" class="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-white focus:outline-none focus:border-emerald-500">
        </div>
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeAddAppModal()" class="px-4 py-2 rounded-xl text-slate-400 hover:bg-slate-800 transition">取消</button>
        <button onclick="saveCustomApp()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold rounded-xl transition">新增</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_APPS = [
      { id: 'def-1', name: 'GitHub', url: 'https://github.com', icon: '🐙' },
      { id: 'def-2', name: 'ChatGPT', url: 'https://chatgpt.com', icon: '🤖' },
      { id: 'def-3', name: 'YouTube', url: 'https://youtube.com', icon: '▶️' }
    ];

    window.onload = function() {
      updateClock();
      setInterval(updateClock, 1000);
      renderCustomApps();
    };

    function updateClock() {
      const now = new Date();
      document.getElementById('clock-display').innerText = now.toLocaleTimeString('zh-TW', { hour12: false });
      document.getElementById('date-display').innerText = now.toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
    }

    function getStoredApps() {
      const stored = localStorage.getItem('myezlife_custom_apps');
      return stored ? JSON.parse(stored) : DEFAULT_APPS;
    }

    function renderCustomApps() {
      const grid = document.getElementById('app-grid');
      if (!grid) return;

      // 核心修復：寫入前強制清空容器，解決重新整理重複疊加的問題
      grid.innerHTML = '';

      const apps = getStoredApps();
      
      apps.forEach(app => {
        const appCard = document.createElement('div');
        appCard.className = 'relative group bg-slate-950/60 hover:bg-slate-800/80 border border-slate-800/80 p-3 rounded-2xl flex flex-col items-center justify-center gap-1 text-center transition cursor-pointer';
        appCard.onclick = () => window.open(app.url, '_blank');
        
        appCard.innerHTML = `
          <span class="text-2xl my-1">${app.icon || '🌐'}</span>
          <span class="text-xs font-medium text-slate-300 truncate w-full">${escapeHtml(app.name)}</span>
          <button onclick="deleteApp(event, '${app.id}')" class="absolute top-1 right-1 opacity-0 group-hover:opacity-100 text-slate-500 hover:text-rose-400 text-xs p-1 transition" title="刪除捷徑">
            <i class="fa-solid fa-xmark"></i>
          </button>
        `;
        grid.appendChild(appCard);
      });
    }

    function openAddAppModal() {
      document.getElementById('app-modal').classList.remove('hidden');
    }

    function closeAddAppModal() {
      document.getElementById('app-modal').classList.add('hidden');
      document.getElementById('app-name-input').value = '';
      document.getElementById('app-url-input').value = '';
    }

    function saveCustomApp() {
      const name = document.getElementById('app-name-input').value.trim();
      let url = document.getElementById('app-url-input').value.trim();
      const icon = document.getElementById('app-icon-input').value.trim() || '🌐';

      if (!name || !url) {
        alert('請填寫 App 名稱與網址！');
        return;
      }

      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }

      const apps = getStoredApps();
      const newApp = {
        id: 'app-' + Date.now(),
        name,
        url,
        icon
      };

      apps.push(newApp);
      localStorage.setItem('myezlife_custom_apps', JSON.stringify(apps));

      closeAddAppModal();
      renderCustomApps();
    }

    function deleteApp(event, appId) {
      event.stopPropagation();
      if (confirm('確定要刪除這個捷徑嗎？')) {
        let apps = getStoredApps();
        apps = apps.filter(a => a.id !== appId);
        localStorage.setItem('myezlife_custom_apps', JSON.stringify(apps));
        renderCustomApps();
      }
    }

    function toggleDevPanel() {
      document.getElementById('dev-panel').classList.toggle('hidden');
    }

    function unlockAdmin() {
      const inputPass = document.getElementById('dev-pass-input').value.trim();
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const todayPassword = `${year}${month}${day}`;

      if (inputPass === todayPassword) {
        document.getElementById('admin-tools').classList.remove('hidden');
        alert('解鎖成功！您現在可以使用系統管理員儲存與匯出功能。');
      } else {
        alert('密碼錯誤！請輸入今日日期 8 位數密碼 (例：' + todayPassword + ')');
      }
    }

    function exportPageHTML() {
      const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      const blob = new Blob([htmlContent], { type: "text/html;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "index.html";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
