<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>短影音播放器</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      color: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
    }

    /* 1. 輕量開場迎賓遮罩 (Splash Screen) */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.4s ease;
      padding: 20px;
    }

    .splash-logo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      transition: transform 0.2s ease;
      margin-bottom: 12px;
    }

    .splash-logo:hover {
      transform: scale(1.05);
    }

    .splash-text {
      margin-bottom: 24px;
      font-size: 14px;
      color: #555;
      letter-spacing: 1px;
      cursor: pointer;
    }

    /* 按鈕容器樣式 */
    .splash-btn-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 260px;
    }

    /* 按鈕樣式 */
    .splash-btn {
      width: 100%;
      padding: 12px 18px;
      background: #f7f7f7;
      border: 1px solid #ddd;
      color: #222;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      border-radius: 12px;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .splash-btn:hover {
      background: #222;
      color: #fff;
      transform: translateY(-2px);
    }

    /* 🌟 特殊功能宣傳按鈕樣式 */
    .promo-action-btn {
      width: 100%;
      padding: 13px 18px;
      background: linear-gradient(135deg, #ff3b30, #ff9500);
      border: none;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      text-align: center;
      border-radius: 12px;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(255, 59, 48, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
      margin-bottom: 4px;
    }

    .promo-action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 59, 48, 0.5);
    }

    /* 電腦版或大螢幕時：置中顯示手機比例框體 */
    @media (min-width: 768px) {
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #ffffff;
        position: static;
      }
      .app-frame {
        width: 100%;
        max-width: 430px;
        height: 844px;
        max-height: 90vh;
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        position: relative;
        background-color: #ffffff;
      }
    }

    /* 手機版：直接強制 100% 全螢幕覆蓋 */
    @media (max-width: 767px) {
      .app-frame {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        border-radius: 0;
        box-shadow: none;
        background-color: #ffffff;
      }
    }

    .reel-container {
      width: 100%;
      height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      transform: translateZ(0);
    }

    .reel-container::-webkit-scrollbar {
      display: none;
    }

    .reel-card {
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
      overflow: hidden;
    }

    .video-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .video-wrapper iframe {
      width: 100% !important;
      height: 100% !important;
      border: none;
      object-fit: cover;
    }

    .custom-cover-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to top, rgba(0,0,0,0) 0%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1) 100%),
                  url('https://live.staticflickr.com/65535/55549203944_a7a9f89992_z.jpg') center/cover no-repeat;
      z-index: 5;
      cursor: pointer;
      transition: opacity 0.5s ease;
    }

    .custom-cover-layer.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .cover-play-btn {
      width: 52px;
      height: 52px;
      background-color: #ff3b30;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 20px rgba(255, 59, 48, 0.5);
      animation: pulse 2s infinite;
      flex-shrink: 0;
      cursor: pointer;
    }

    .cover-play-btn svg {
      width: 22px;
      height: 22px;
      fill: #ffffff;
      transform: translateX(2px);
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.6); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(255, 59, 48, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
    }

    .overlay-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 40px 16px calc(25px + env(safe-area-inset-bottom)) 16px;
      background: linear-gradient(to top, rgba(0,0,0,0) 0%, rgba(0,0,0,0.3) 50%, transparent 100%);
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
    }

    .song-text-group {
      pointer-events: auto;
      flex-grow: 1;
      margin-right: 16px;
    }

    .cover-play-btn-wrapper {
      pointer-events: auto;
      margin-top: 10px;
      display: flex;
      justify-content: flex-start;
    }

    .song-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    .song-views {
      font-size: 12px;
      color: #fff;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(4px);
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
    }

    .top-left-logo {
      position: absolute;
      top: 16px;
      left: 16px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      z-index: 9999;
      object-fit: cover;
      background-color: #fff;
      transition: transform 0.2s ease;
      cursor: pointer;
    }
    .top-left-logo:hover {
      transform: scale(1.08);
    }

    /* 左側滑出選單（Drawer）樣式 */
    .side-drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 10000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .side-drawer-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .side-drawer {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100%;
      background: #ffffff;
      z-index: 10001;
      box-shadow: 5px 0 25px rgba(0,0,0,0.15);
      transition: left 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      display: flex;
      flex-direction: column;
      padding: 24px 20px;
    }

    .side-drawer.active {
      left: 0;
    }

    .drawer-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #eee;
    }

    .drawer-header img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
    }

    .drawer-title {
      font-size: 15px;
      font-weight: bold;
      color: #222;
    }

    .drawer-btn-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .drawer-btn {
      width: 100%;
      padding: 12px 18px;
      background: #f7f7f7;
      border: 1px solid #ddd;
      color: #222;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      border-radius: 12px;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      transition: all 0.2s ease;
    }

    .drawer-btn:hover {
      background: #222;
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- 迎賓開場遮罩 -->
  <div id="splash-screen">
    <img src="https://myezlife.com/eric-logo.gif" alt="Logo" class="splash-logo" onclick="closeSplash()">
    <div class="splash-text" onclick="closeSplash()">點擊進入主頁</div>
    <div class="splash-btn-container">
      <button class="promo-action-btn" onclick="closeSplash()">開始瀏覽</button>
    </div>
  </div>

  <div class="app-frame">
    <!-- 左上角 Logo（點擊開啟左側選單） -->
    <img src="https://myezlife.com/eric-logo.gif" width="44" class="top-left-logo" alt="Menu" onclick="toggleDrawer()">

    <!-- 左側滑出選單結構 -->
    <div class="side-drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>
    <div class="side-drawer" id="sideDrawer">
      <div class="drawer-header">
        <img src="https://myezlife.com/eric-logo.gif" alt="Logo">
        <div class="drawer-title">功能選單</div>
      </div>
      <div class="drawer-btn-container">
        <a href="https://myezlife.com/" class="drawer-btn">首頁</a>
        <a href="https://myezlife.com/index-1.html" class="drawer-btn">生活‧簡居‧生活</a>
        <a href="https://myezlife.com/FileExplorer.html" class="drawer-btn">檔案總管</a>
        <a href="https://myezlife.com/index_news.html" class="drawer-btn">新聞劃重點</a>
        <a href="https://youtube.com/playlist?list=PLeSu4EJy_yAQ&si=nW1vtYKbmn12uMex" class="drawer-btn">AI好劇一直看</a>
      </div>
    </div>

    <!-- 短影音播放容器 -->
    <div class="reel-container" id="reelContainer">
      <!-- 示範影音卡片 -->
      <div class="reel-card">
        <div class="video-wrapper">
          <iframe id="player1" src="https://www.youtube.com/embed/dQw4w9WgXcQ?enablejsapi=1&autoplay=0&controls=0&loop=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
        <div class="custom-cover-layer" id="cover1" onclick="playVideo('player1', 'cover1')">
          <div class="overlay-info">
            <div class="song-text-group">
              <div class="song-title">示範短影音標題</div>
              <div class="song-views">點擊播放</div>
            </div>
            <div class="cover-play-btn-wrapper">
              <div class="cover-play-btn">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function toggleDrawer() {
      document.getElementById('sideDrawer').classList.toggle('active');
      document.getElementById('drawerOverlay').classList.toggle('active');
    }

    function closeSplash() {
      const splash = document.getElementById('splash-screen');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(() => {
          splash.style.display = 'none';
        }, 400);
      }
    }

    function playVideo(playerId, coverId) {
      const cover = document.getElementById(coverId);
      if (cover) {
        cover.classList.add('fade-out');
      }
      const iframe = document.getElementById(playerId);
      if (iframe) {
        iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
      }
    }
  </script>
</body>
</html>
