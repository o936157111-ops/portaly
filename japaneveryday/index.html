<!DOCTYPE html>
<html lang="zh-TW"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日本人天天會用的日語短句</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&amp;display=swap" rel="stylesheet">
    
    <style>
        /* 頁面風格顏色配置 */
        :root { --bg-color: #ffffff; --text-color: #000000; --accent-color: #2c3e50; --sub-color: #555555; --panel-bg: #f9f9f9; --border-color: rgba(0, 0, 0, 0.1); }
        .theme-sepia { --bg-color: #f4f1ea; --text-color: #332b22; --accent-color: #8b4513; --sub-color: #7a6e61; --panel-bg: #ede9df; --border-color: rgba(0, 0, 0, 0.15); }
        .theme-dark { --bg-color: #1a1a1a; --text-color: #e0e0e0; --accent-color: #d4af37; --sub-color: #888888; --panel-bg: #252525; --border-color: #333333; }

        /* 全域底層預設字型全面改為微軟正黑體 */
        body { margin: 0; display: flex; height: 100vh; background: var(--bg-color); transition: background 0.3s; font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif; overflow: hidden; color: var(--text-color); }
        
        #sidebar { width: 280px; background: rgba(0, 0, 0, 0.03); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; height: 100%; box-sizing: border-box; transition: background 0.3s, transform 0.3s; z-index: 100; }
        .theme-dark #sidebar { background: #222; }
        
        #book-info { padding: 15px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        #book-title { font-size: 16px; font-weight: bold; color: var(--accent-color); cursor: pointer; }
        
        #tree-area { flex: 1; overflow-y: auto; padding: 10px; }
        .tree-vol { font-weight: bold; padding: 6px 4px; margin-top: 5px; color: var(--accent-color); font-size: 14px; cursor: default; }
        .tree-ch { font-weight: normal; padding: 4px 4px 4px 15px; font-size: 13px; color: var(--sub-color); cursor: default; }
        .tree-item { padding: 4px 4px 4px 25px; font-size: 13px; cursor: pointer; border-radius: 4px; transition: 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-color); display: flex; justify-content: space-between; align-items: center; }
        .tree-item:hover { background: rgba(0, 0, 0, 0.05); }
        .theme-dark .tree-item:hover { background: rgba(255, 255, 255, 0.1); }
        .tree-item.active { background: var(--accent-color); color: #fff !important; }
        .lock-badge { font-size: 10px; opacity: 0.6; }
        
        #main-container { flex: 1; display: flex; flex-direction: column; height: 100%; overflow: hidden; position: relative; }
        
        /* 頂部工具列優化 */
        #toolbar { height: 50px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; box-sizing: border-box; background: var(--bg-color); z-index: 10; }
        .btn-group { display: flex; gap: 6px; align-items: center; }
        
        button { background: transparent; border: 1px solid rgba(0, 0, 0, 0.2); padding: 5px 10px; font-size: 13px; cursor: pointer; border-radius: 4px; color: var(--text-color); font-family: inherit; transition: background 0.2s; }
        button:hover { background: rgba(0, 0, 0, 0.05); }
        .theme-dark button { border-color: #555; }
        .theme-dark button:hover { background: #333; }
        button.active { background: var(--accent-color); color: #fff; border-color: var(--accent-color); }
        
        #menu-toggle { display: none; }
        #settings-toggle { display: none; } /* 手機版專用設定按鈕 */

        /* 閱讀區域 */
        #reader-area { flex: 1; overflow-y: auto; padding: 30px; box-sizing: border-box; display: flex; justify-content: center; }
        #reader-main-area { width: 100%; max-width: 700px; font-size: 16px; }
        #content-title { font-size: 24px; font-weight: bold; margin-bottom: 15px; border-bottom: 2px solid var(--accent-color); padding-bottom: 8px; color: var(--accent-color); }
        #content-body { line-height: 1.6; white-space: pre-wrap; font-weight: normal; }
        
        /* 手機版彈出式設定面板 */
        #mobile-settings-panel { display: none; position: absolute; top: 51px; left: 0; right: 0; background: var(--panel-bg); border-bottom: 1px solid var(--border-color); padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); z-index: 90; box-sizing: border-box; }
        .setting-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .setting-row:last-child { margin-bottom: 0; }
        .setting-label { font-size: 13px; font-weight: bold; color: var(--sub-color); }

        /* 編輯面板 */
        #add-container { border-top: 1px solid var(--border-color); background: rgba(0, 0, 0, 0.01); display: none; } 
        .theme-dark #add-container { background: #1f1f1f; }
        #add-header { padding: 10px 15px; font-size: 13px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, 0.02); color: var(--accent-color); }
        #add-panel { padding: 15px; display: none; box-sizing: border-box; }
        .form-grid { display: grid; grid-template-columns: 80px 1fr; gap: 8px; margin-bottom: 10px; align-items: center; }
        .form-grid label { font-size: 12px; font-weight: bold; color: var(--sub-color); }
        .form-grid input, .form-grid textarea { width: 100%; padding: 5px; box-sizing: border-box; border: 1px solid rgba(0, 0, 0, 0.2); border-radius: 4px; background: var(--bg-color); color: var(--text-color); font-family: inherit; font-size: 13px; }
        .form-grid textarea { height: 80px; resize: vertical; }

        /* RWD 行動裝置自適應：徹底解決工具列擠爆災難 */
        @media (max-width: 768px) {
            #menu-toggle { display: block; }
            #settings-toggle { display: block; } /* 顯示手機版設定鈕 */
            
            /* 隱藏電腦版直排按念群 */
            #desktop-config-group { display: none; } 
            
            #sidebar { position: absolute; left: 0; top: 0; bottom: 0; transform: translateX(-100%); background: var(--bg-color); box-shadow: 2px 0 10px rgba(0,0,0,0.15); }
            #sidebar.open { transform: translateX(0); }
            
            #toolbar { padding: 0 10px; }
            #reader-area { padding: 20px 15px; }
            #content-title { font-size: 20px; }
        }
    </style>
</head>
<body class="theme-light">

            <div id="add-panel">
                <div class="form-grid">
                    <label>分部名稱</label><input type="text" id="in-vol" placeholder="例：初次見面的自我介紹">
                    <label>章節名稱</label><input type="text" id="in-ch" placeholder="例：會話情境 或 小知識">

                    <button onclick="addNewData()" style="background: #27ae60; color:#fff; border:none;">加入此篇內容</button>
                    <button onclick="clearForm()">清空</button>
                </div>
                <hr style="border: 0; border-top: 1px dashed rgba(0,0,0,0.1); margin: 10px 0;">
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <button onclick="exportJSON()" style="width: 100%; text-align: left;">📤 匯出 JSON 備份檔</button>
                    <button onclick="document.getElementById('import-file').click()" style="width: 100%; text-align: left;">📥 匯入 JSON 備份檔</button>
                    <input type="file" id="import-file" style="display: none;" accept=".json" onchange="importJSON(this)">
                </div>
            </div>
        </div>
    </div>

    <div id="main-container">
        <div id="toolbar">
            <div class="btn-group">
                <button id="menu-toggle" onclick="toggleMenu(true); toggleSettingsPanel(false);">☰ 目錄</button>
                <button id="settings-toggle" onclick="toggleSettingsPanel()">⚙️ 設定</button>
                
                <button onclick="setTheme('light')" id="btn-light" class="theme-btn active">明亮</button>
                <button onclick="setTheme('sepia')" id="btn-sepia" class="theme-btn">羊皮紙</button>
                <button onclick="setTheme('dark')" id="btn-dark" class="theme-btn">深色</button>
            </div>
            
            <div class="btn-group" id="desktop-config-group">
                <button onclick="changeFontSize(1)">字型＋</button>
                <button onclick="changeFontSize(-1)">字型－</button>
                <button onclick="changeLineHeight(0.2)">行距＋</button>
                <button onclick="changeLineHeight(-0.2)">行距－</button>
                <button onclick="changeFont('Microsoft JhengHei')">正黑體</button>
                <button onclick="changeFont('Noto Sans TC')">思源黑體</button>
            </div>
            
            <div>
                <button id="btn-html-export" onclick="exportHTML()" style="background: var(--accent-color); color: #fff; font-weight: bold; display: none;">💾 匯出 HTML</button>
            </div>
        </div>
        
        <div id="mobile-settings-panel">
            <div class="setting-row">
                <span class="setting-label">文字大小</span>
                <div class="btn-group">
                    <button onclick="changeFontSize(1)">字型 ＋</button>
                    <button onclick="changeFontSize(-1)">字型 －</button>
                </div>
            </div>
            <div class="setting-row">
                <span class="setting-label">段落行距</span>
                <div class="btn-group">
                    <button onclick="changeLineHeight(0.2)">行距 ＋</button>
                    <button onclick="changeLineHeight(-0.2)">行距 －</button>
                </div>
            </div>
            <div class="setting-row">
                <span class="setting-label">閱讀字體</span>
                <div class="btn-group">
                    <button onclick="changeFont('Microsoft JhengHei')">微軟正黑體</button>
                    <button onclick="changeFont('Noto Sans TC')">思源黑體</button>
                </div>
            </div>
        </div>
        
        <div id="reader-area" onclick="toggleMenu(false); toggleSettingsPanel(false);">
            <div id="reader-main-area">
                <div id="content-title">請選擇左側章節開始閱讀</div>
                <div id="content-body">歡迎使用日語短句電子書閱讀器。</div>
            </div>
        </div>
    </div>

        function getTodayPassword() {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            return `${yyyy}${mm}${dd}`;
        }

        function init() {
            let localData = localStorage.getItem('japanese_book_db');
            if (localData) {
                try { database = JSON.parse(localData); } catch(e) { console.error(e); }
            }
            
            if (sessionStorage.getItem('book_admin_unlocked') === 'true') {
                enableAdminMode();
            }

            renderTree();
            updateStyle();
            
            if (window.innerWidth <= 768) {
                document.getElementById('close-menu').style.display = 'block';
            }
        }

        // 樹狀選單生成
        function renderTree() {
            const treeArea = document.getElementById('tree-area');
            treeArea.innerHTML = '';
            let globalItemIndex = 0;

            for (let volName in database.volumes) {
                let volDiv = document.createElement('div');
                volDiv.className = 'tree-vol';
                volDiv.innerText = volName;
                treeArea.appendChild(volDiv);

                for (let chName in database.volumes[volName]) {
                    let chDiv = document.createElement('div');
                    chDiv.className = 'tree-ch';
                    chDiv.innerText = chName;
                    treeArea.appendChild(chDiv);

                    for (let itemName in database.volumes[volName][chName]) {
                        globalItemIndex++;
                        let itemDiv = document.createElement('div');
                        itemDiv.className = 'tree-item';
                        
                        let isLockedItem = (globalItemIndex > 3) && !isUnlocked;
                        
                        if (isLockedItem) {
                            itemDiv.innerHTML = `<span>${itemName}</span><span class="lock-badge">🔒 鎖定</span>`;
                        } else {
                            itemDiv.innerHTML = `<span>${itemName}</span>`;
                        }

                        let currentIndex = globalItemIndex;
                        itemDiv.onclick = function() {
                            if (currentIndex > 3 && !isUnlocked) {
                                let pass = prompt("請輸入密碼：");
                                if (pass === getTodayPassword()) {
                                    alert("解鎖成功。");
                                    enableAdminMode();
                                    renderTree();
                                    selectItem(itemDiv, volName, chName, itemName);
                                } else if (pass !== null) {
                                    alert("密碼錯誤。");
                                }
                            } else {
                                selectItem(itemDiv, volName, chName, itemName);
                            }
                        };
                        treeArea.appendChild(itemDiv);
                    }
                }
            }
        }

        function selectItem(el, vol, ch, item) {
            document.querySelectorAll('.tree-item').forEach(el => el.classList.remove('active'));
            el.classList.add('active');
            showContent(vol, ch, item);
            if (window.innerWidth <= 768) toggleMenu(false);
        }

        function showContent(vol, ch, item) {
            document.getElementById('content-title').innerText = item;
            document.getElementById('content-body').innerText = database.volumes[vol][ch][item];
        }

        // 點選書名標題觸發驗證
        function verifyAdminUnlock() {
            if (isUnlocked) {
                let changeName = confirm("確認要修改書籍名稱嗎？");
                if (changeName) {
                    let newTitle = prompt("請輸入新的書名：", database.bookTitle);
                    if (newTitle) {
                        database.bookTitle = newTitle;
                        document.getElementById('book-title').innerText = "📖 " + newTitle;
                        localStorage.setItem('japanese_book_db', JSON.stringify(database));
                    }
                }
                return;
            }
            
            let pass = prompt("請輸入密碼：");
            if (pass === getTodayPassword()) {
                alert("驗證成功。");
                enableAdminMode();
                renderTree();
            } else if (pass !== null) {
                alert("密碼錯誤。");
            }
        }

        function enableAdminMode() {
            isUnlocked = true;
            sessionStorage.setItem('book_admin_unlocked', 'true');
            document.getElementById('add-container').style.display = 'block';
            document.getElementById('btn-html-export').style.display = 'block';
        }

        function toggleMenu(show) {
            const sidebar = document.getElementById('sidebar');
            if (show) {
                sidebar.classList.add('open');
            } else {
                sidebar.classList.remove('remove');
                sidebar.classList.remove('open');
            }
        }

        // 控制手機版專用設定面板顯示/隱藏
        function toggleSettingsPanel(explicitState) {
            const panel = document.getElementById('mobile-settings-panel');
            const toggleBtn = document.getElementById('settings-toggle');
            
            if (explicitState === false) {
                panel.style.display = 'none';
                if(toggleBtn) toggleBtn.classList.remove('active');
                return;
            }
            
            if (panel.style.display === 'block') {
                panel.style.display = 'none';
                toggleBtn.classList.remove('active');
            } else {
                panel.style.display = 'block';
                toggleBtn.classList.add('active');
            }
        }

        function changeFontSize(dir) {
            currentFontSize += dir * 2;
            if (currentFontSize < 12) currentFontSize = 12;
            if (currentFontSize > 32) currentFontSize = 32;
            updateStyle();
        }

        function changeLineHeight(dir) {
            currentLineHeight += dir;
            if (currentLineHeight < 1.0) currentLineHeight = 1.0;
            if (currentLineHeight > 3.0) currentLineHeight = 3.0;
            updateStyle();
        }

        function changeFont(font) {
            currentFont = font;
            updateStyle();
        }

        function updateStyle() {
            const mainArea = document.getElementById('reader-main-area');
            if (mainArea) {
                mainArea.style.fontSize = currentFontSize + 'px';
                mainArea.style.fontFamily = currentFont;
            }
            const bodyArea = document.getElementById('content-body');
            if (bodyArea) {
                bodyArea.style.lineHeight = currentLineHeight;
            }
        }

        function setTheme(theme) {
            document.body.className = 'theme-' + theme;
            document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + theme).classList.add('active');
            updateStyle();
        }

        function toggleCollapsible() {
            const panel = document.getElementById('add-panel');
            const icon = document.getElementById('fold-icon');
            if (panel.style.display === "block") {
                panel.style.display = "none";
                icon.innerText = "▼";
            } else {
                panel.style.display = "block";
                icon.innerText = "▲";
            }
        }

        function clearForm() {
            document.getElementById('in-vol').value = '';
            document.getElementById('in-ch').value = '';
            document.getElementById('in-item').value = '';
            document.getElementById('in-content').value = '';
        }

        function addNewData() {
            const vol = document.getElementById('in-vol').value.trim();
            const ch = document.getElementById('in-ch').value.trim();
            const item = document.getElementById('in-item').value.trim();
            const content = document.getElementById('in-content').value.trim();

            if (!vol || !ch || !item || !content) {
                alert('請完整填寫所有欄位後再點擊加入！');
                return;
            }

            if (!database.volumes[vol]) database.volumes[vol] = {};
            if (!database.volumes[vol][ch]) database.volumes[vol][ch] = {};
            
            database.volumes[vol][ch][item] = content;

            localStorage.setItem('japanese_book_db', JSON.stringify(database));
            renderTree();
            clearForm();
            alert('新增成功。');
        }

        function exportJSON() {
            const blob = new Blob([JSON.stringify(database, null, 4)], { type: "application/json" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = `${database.bookTitle}_backup.json`;
            a.click();
        }

        function importJSON(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported && imported.volumes) {
                        database = imported;
                        localStorage.setItem('japanese_book_db', JSON.stringify(database));
                        renderTree();
                        alert('備份導入成功。');
                    } else {
                        alert('格式錯誤。');
                    }
                } catch(err) {
                    alert('匯入失敗。');
                }
            };
            reader.readAsText(file);
        }

        function exportHTML() {
            const dbString = "let database = " + JSON.stringify(database, null, 4) + ";";
            let fullHTML = document.documentElement.outerHTML;
            const newHTML = fullHTML.replace(/let database = \{[\s\S]*?\};/, dbString);
            
            const blob = new Blob([newHTML], { type: "text/html" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = `${database.bookTitle}.html`;
            a.click();
        }

        window.onload = init;
        window.onresize = updateStyle;
    </script>

</body></html>
