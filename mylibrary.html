    {
        "title": "企業策略的終極答案：用「作業價值管理AVM」破除成本迷思，掌握正確因果資訊，做對決策賺到「管理財」",
        "author": "吳安妮",
        "url": "https://www.taaze.tw/products/11100929615.html",
        "img": "https://media.taaze.tw/showThumbnail.html?sc=11100929615&height=400&width=310",
        "intro": "AVM以管理的細胞「作業」為核心，\n提供正確、即時且「原因」與「結果」結合的因果關係資訊，提升決策品質與精準度；\n串連所有部門的價值鏈，達到全員參與之目的，\n並使人文及科技匯流，快速進入AI時代，用軟實力賺到「管理財」。\n\n「成本」是企業每天必須面對的課題，運轉越久、組織層級越多，所產生的「隱藏成本」就越高，而且往往為了度過難關，錯砍成本或錯置資源，反而削弱「長期競爭力」。之所以會如此，在於企業普遍存在著不知如何取捨長短期成本、誤以為大客戶就是好客戶及看不清楚隱藏成本三大成本迷思；中小企業也經常面臨產品如何創新研發、大客戶訂價該讓到什麼程度、長期虧本原因何在，以及轉型升級怎麼準備等四大經營困境。\n\n解決營運上的問題與挑戰，必須仰賴「原因資訊」與「結果資訊」整合的正確管理資訊，但在一般企業內，分別以會計之「科目」、管理之「作業」為細胞的這兩類資訊是分開的，以致無法提供符合管理者需求的決策情報。有三十餘年學術研究、輔導企業經驗的政大講座教授吳安妮，戮力創新的「作業價值管理AVM」(Activity Value Management)，正是該課題的解方。這套大突破的管理制度，是企業各管理階層從事管理決策的重要參考，對提升長期的「經營績效」有深遠且強大的助益。\n\n●AVM對管理決策的十大優點\n1.AVM可以精確計算産品整體價值鏈的成本及利潤，作為「產品創新決策」及「產品定價決策」的依據，解決不敢從事「產品創新」的問題。\n2.AVM可以精確地計算每位客戶及每個通路的整體價值鏈的成本及利潤，作為「客戶及通路決策」的依據，解決「大客戶是好客戶」的迷思。\n3.AVM可以與企業現有管理系統完全相容，讓所有制度徹底整合，進而全面提升企業「整合管理決策」的能力，解決「利潤」下滑的問題。\n4.AVM可以讓使用者進入簡易雲端上線使用，快速了解經營整體問題，為「整體經營管理」奠定良好的基礎，解決「轉型及接班」的問題。\n5.AVM可以提供五種作業中心成本類型，作為各部門「資源分配決策」的依據。\n6.AVM可以提供人員和機器作業的正常產能及成本，作為各部門「預算決策」的依據。\n7.AVM可以精算出人員與機器的超用或剩餘產能，作為「產能管理決策」的依據。\n8.AVM可以精算各項作業屬性的成本和占比，作為「營運流程再造決策」的依據。\n9.AVM可以「作業」來檢視公司的實際營運狀況，作為「精實管理決策」的依據。\n10.AVM可以精算出各部門及員工的收入、成本及利潤資訊，作為「績效和獎酬決策」的依據。\n\n在大數據及AI迅速發展時代，AVM產出的靈活有用資訊，將會為企業帶來莫大的翻轉力量。\n\n●企業界與學術界熱情推薦\nAVM可以重新整理管理要領、看到虧損客戶的問題點、了解各產品的經營問題，以及工廠內部作業失敗成本的原因，是一面厲害的照妖鏡，能看清楚公司各層面的問題，提升管理績效，適合各行各業推動的管理制度。\n――日正食品副總經理 李采慧\n\n硬體+軟體+管理=企業管理三核心，這股浪潮逐漸從AVM的興起而備受矚目，標誌著「因、果」資訊的融合，以及邁向AI智慧與大數據無縫接軌的開端。\n――旭然國際董事長 吳玲美\n\n吳教授帶領我們拆解傳統會計的分析觀點，從「作業」角度重新建構企業的一舉一動。作業價值管理AVM不僅打破組織部門之間的藩籬，通盤檢視既有的營運模式，整合具因果關聯的相關訊，將有限資源投注在最需要的單位，移除不必要的浪費與支出，更對於企業存續最重要的長、短期利潤與價值，具有絕大助益。\n――信義房屋董事長 周俊吉\n\n吳教授鑄造出AVM這把利劍，直指企業痛處，產生原因與結果關係整合資訊，好比儀表板，讓不同管理階層一目了然得到正確即時的決策資訊，大幅提升決策的精準度及其帶來的效益。\n――勤誠興業董事長 陳美琪\n\n沒有正確的攸關資訊，將無法洞察問題的本質，做出對的判斷。落實《企業策略的終極答案》所建議的作業價值管理系統，能為公司提供優質的管理資訊，創造競爭優勢。\n――東海大學會計學系副教授 劉俊儒\n\n吳教授提出的作業價值管理AVM，以客觀數據為基礎，有利於形成共識與溝通；呈現作業活動間的因果關係及互動性，形成系統思考、消除部門主義；能及早發現問，追蹤趨勢；協助管理者專注於重大長期議題，提升高階管理者的能力和價值；讓個人及組織變聰明，既見林（長期競爭力）又見樹（成本迷思）。\n――明門實業董事長 鄭欽明"
    },
    {
        "title": "投資的底氣︰選股策略X心理素質決定你的財富上限",
        "author": "股市隱者（謝天健）",
        "url": "https://www.taaze.tw/usedList.html?oid=11101044743",
        "img": "https://media.taaze.tw/showThumbnail.html?sc=11101044743&height=400&width=310",
        "intro": "出手都是贏勢股，荷包、心靈都自由！\n用一套方法，找到含金量高的贏勢股，\n讓一流企業為你賺錢，\n不盯盤，也能三年賺一倍！\n\n投資方法只能決定財富下限，\n心理素質才能決定你的財富上限，\n在致富路上，比方法更重要的是一顆平穩的心。\n\n曾操盤60億的海外基金經理人股市隱者，\n首次結合他的科學選股、穩健心理素質、通透的財富觀，\n分享如何擁有戰勝人性與市場情緒的投資底氣，\n幫助你長期持有高獲利的贏勢股，\n慢慢致富，也賺到自己的人生。\n\n不論是投資新手、在股市載浮載沉的投資人、\n或是不得投資要領的資深股民，\n都能擁有出手精準的投資底氣，\n在獲利上和心境上，更上一層樓。\n\n本書教你 :\n✓什麼是「贏勢股」？\n處在一個成長中的趨勢，並且都是產業龍頭，\n具備長時間高獲利的特性。\n\n✓找趨勢：\n從產業報告精選成長期3年以上、\n成長率超過10%的產業，享受巨大趨勢紅利。\n\n✓選好股\n從好趨勢中找出護城河高、含金量高，\n能不斷創造價值的龍頭企業，獲利更勝大盤。\n\n✓挑價位\n補足用「本益比」估價的侷限，\n「本益比位階」更好算出買進與加碼的價位，不怕買高賣低。\n\n✓看賣點\n從質性資訊和量化數據看賣出信號是否出現？\n不斷持股追蹤，問自己當初買進的理由是否存在？\n\n✓常被忽略的獲利關鍵：心理素質\n不論哪一種投資方法或標的，都需要這些心理素質──\n耐心等待、獨立思考、放大格局、復盤修正，以及用平常心，\n才能幫助我們長期投資、穩定獲利。\n\n✓荷包自由了，時間和心靈也要自由\n別把快樂建立在無限疊加的數字上，反而更容易財富自由。\n比買哪支股票更重要的問題是：我真正需要什麼？\n什麼樣的生活才讓我滿足？當滿足之時，才是財富自由之時。\n\n投資只是人生的一部分，卻足以改變整個人生。\n看完這本書，回報你的不僅僅是金錢，\n更是一種懂得享受生活的能力。"
    },
    {
        "title": "書店本事：在你心中的那些書店",
        "author": "楊富閔",
        "url": "https://www.taaze.tw/products/11100800527.html",
        "img": "https://media.taaze.tw/showThumbnail.html?sc=11100800527&height=400&width=310",
        "intro": "書店是「人」的地方：店主與顧客在書店交會，作者和讀者彼此交談，冊頁的流轉則是書店最優雅的私語聲。\n\n書店也是「時間」的居所：無論是日式老木屋的改造，眷村房舍的新創，軍事碉堡的活化，島嶼複雜的歷史銘刻在書屋的書架，書架旁的書桌，書桌上的書頁，以及，正在閱讀書頁文字的你的眼眸。\n\n對楊富閔來說，他穿越其中所見的不僅是一本書、一支筆、一頁紙，而是無形中延續、呼吸了書店的歷史與精神，其中便有不同世代的台灣人，對於文化傳承的各種美意。\n\n四十家書店的尋訪猶如四十堂文學課程，而《書店本事：在你心中的那些書店》彷彿是書店們的穿越考，或許也是作家楊富閔的散文筆記、田野心得與裝滿珍貴回憶的第一手觀察。"
    },
    {
        "title": "停下來的書店",
        "author": "夏琳",
        "url": "https://www.taaze.tw/usedList.html?oid=11100926122",
        "img": "https://media.taaze.tw/showThumbnail.html?sc=11100926122&height=400&width=310",
        "intro": "安靜的時光裡，淺睡多夢，\n我們輕輕旋轉手中那顆記憶的琥珀……\n\n書寫一座昨日之城\n一冊重新上架的舊日抒情\n落筆寧靜，念想百轉千回\n聽得見時間迂迴起落的聲音\n\n被海風浸漬的南方近代，\n青春是遺憾與決定的喧嘩交會；\n大船入港那日，陸續上岸的人，\n攜回了關於鹽埕埔那間書店的回憶。\n\n記憶的書架上，總有一冊永不下架卻鮮少翻閱的小說，那是我們的青春、傷懷，以及成長年代之美好的疼痛。\n\n夏琳以書店為舒展記憶的軸心，架構了橫跨六○至八○年代的高雄鹽埕埔斷代史，那一段從動盪至逐漸安定的年歲裡，政經環境的轉變與社會的豐富百態緊繫人心，每個人開始懂得懷抱一份希望，卻也同時擁有了無數遺憾。老城區流轉不息的人文景況，是故事的主旋律，繚繞於情緒豐沛的港口、心緒流轉的街區小巷，甚至等長的愛恨裡……被時間停下來的書店，記憶仍鮮明耀眼，那是收藏昨日的折返點、收容倦途之處。\n\n★南崁小書店店主——夏琳的創作初探，昔時港都的姿態與氣味兼具的自傳體小說，醞釀於地方的昨日書寫，橫跨六○至八○年代高雄老城區鹽埕埔的人文風景，在記憶的繁花幽徑裡，與一代人的美好重遇。"

    {
        "title": "小規模是趨勢：掌握AI和新一代新創公司如何改寫未來經濟模式",
        "author": "賀曼．塔內賈、凱文．曼尼",
        "url": "https://www.taaze.tw/usedList.html?oid=11100880282",
        "img": "https://media.taaze.tw/showThumbnail.html?sc=11100880282&height=400&width=310",
        "intro": "AI＋平台崛起，小規模是趨勢！\n\n一股結合最新科技與經濟學的創新趨勢，正在顛覆巨型產業。現在，規模已經不再是優勢，反而成為不利條件與負擔。新創公司正在運用AI，將以往需要昂貴投資的作業自動化，並且租用各種雲端平台打造事業，因此得以擺脫上個世紀的模式，小規模也能做得有聲有色！\n\n本書作者賀曼．塔內賈為《富比士》（Forbes）雜誌全球百大最佳創投人，以精準的眼光早期投資Airbnb、Snapchat、金流服務商Stripe、眼鏡電商華比帕克（Warby Parker），以及由好萊塢影星潔西卡．艾芭（Jessica Alba）等人所創辦的美國誠實公司（The Honest Company）等知名新創事業。\n\n塔內賈以長達20年的專業創投經驗，在本書解釋「去規模化」（unscaling）的現象。在整個20世紀，世界各地的目標是利用規模經濟的優勢，凡事愈大，幾乎總是愈好。進入21世紀，由於人工智慧、各項新科技的發展和平台崛起，小型新創企業可以用低成本租用平台的能力，靈活運作、精實生產、精準行銷，顛覆產業，提供客製化的產品和個人化的服務，從巨型龍頭手上成功搶下訂單。\n\n塔內賈指出，這股始於2007年左右的趨勢，在未來二十年將會持續發展。在本書，他帶領我們一窺能源業、醫療保健業、教育業、金融業、媒體業、消費性產品業「去規模化」的最新發展，並且為政府制定政策、大型企業和個人提供如何應對這股趨勢的實用建言。\n\n去規模化正在改造巨型產業和全球的發展，為創業者、富想像力的公司，以及足智多謀的個人，開啟絕佳的機會。鮮少產業或活動不會受到影響，不論你從事什麼工作、在何處生活，未來的旅程將不同於以往的年代。擁有創業抱負的個人和組織，現在正處於前所未見的最佳時代，擁有更多的機會、更低的障礙。我們身處於驚奇探索之旅的浪頭，有機會像20世紀初期那樣再次改造整個世界，解決一些最大的全球性問題。"
    },
    {

        "img": "https://media.taaze.tw/showThumbnail.html?sc=11100176301&height=400&width=310",
        "intro": "繼《陰線陽線》之後，全美陰陽線分析大師 Steve Nison再度總結日本陰陽線分析技巧，向全球金融從業人員透露前所未見的新技術。這套有效的分析技巧和傳統的交易、投資或避險技術結合，必可使操作者在市場上斬獲良多。《股票K線戰法》提供您循序漸進的指令，詳細的圖表，和明確的方針，足以磨礪您的技術操作方法。\n\n「……必然成為陰陽線分析領域的經典作品。」－Charles Lebeau and David Lucas Technical Trader's Bulletin\n\n「……不論您是期貨、商品或股票的交易員、帽客或部位操作者，本書都是必備之作。」－Lee Siegfiried Investor's Library, Data Broadcasting Corp.\n\n「……從作者所探討主題的學術及寫作技巧來說，本書必然是最好的投資書籍之一，內容結構無懈可擊……閱讀是一種喜悅。」－Commodity Traders"

    {
        "title": "全球化的過去與未來︰從舊石器時代到數位時代，地理、技術與制度如何改寫人類萬年的歷史",
        "author": "傑佛瑞．薩克斯",
        "url": "https://www.taaze.tw/usedList.html?oid=11100921313",
        "img": "https://media.taaze.tw/showThumbnail.html?sc=11100921313&height=400&width=310",
        "intro": "「由著名經濟學家薩克斯撰寫的世界史，總結了過去七萬年來的歷史演變。買了這本書，可以扔掉你書櫃上數十本那些號稱專家寫！」\n──賈德・戴蒙（Jared Diamond），《槍炮、病菌與與鋼鐵》作者\n\n極端氣候、重度汙染、貧富不均、戰爭風險，\n我們正站在第三次世界大戰的邊緣。\n當人類來到生存的關鍵時刻，\n翻開七萬年的歷史，我們是否能借古鑑今，開啟永續的大門？\n\n────蔡宏政（中山大學社會系教授兼東南亞研究中心主任） 專文推薦────\n\n二十一世紀初，我們再次進入新的地緣政治時代。權力越來越分散，尤其當亞洲也擁有了西歐和美國的技術、經濟、和軍事優勢後，中國、印度、北韓和巴基斯坦成為核武大國，影響全球局勢舉重若輕。不僅如此，數位時代技術的演變，也正在催生全球化權力關係的變化，同時，網路戰成為二十一世紀最新的戰爭。\n\n地緣政治反應了「帝國」的樣貌正以驚人的速度改變。1914年，大英帝國仍然統治著世界；到1960年，大英帝國基本上已經消失了，蘇聯正在挑戰美國的霸權領導地位；1991年12月，蘇聯也從地圖上消失。今天，中國崛起，印度的勢力以極快的速度增長，而非洲的人口上升，預示了二十一世紀的後半可能是截然不同的權力版圖。\n同時，二十一世紀對於人類的基本生存權而言，也面對極大的挑戰：氣候變遷、生物多樣性消失、越來越廣泛的環境汙染，這些都是全球需要攜手面對的難題。\n\n二十八歲即獲聘為哈佛終身職的著名經濟學者傑佛瑞．薩克斯，繼《文明的代價》一書後，將視野拉回過往七萬年的歷史演進。他想知道，若想保證人類的長遠未來，那麼借古鑑今是否有可能？如果我們能研究出過去每個時代的演變與困境，是否就能解決今日的問題？\n\n在本書裡，薩克斯將人類的歷史拆成七個時代：舊石器時代──人類以狩獵採集者的姿態誕生；新石器時代──因農業帶來的密集人口，使得狩獵採集者的競爭力削弱並消失；馬背時代──動物的馴化，讓貿易、通訊都變得更為廣泛，城市發展也逐漸密集且多元；古典時代──世界各區域的文明蓬勃發展，人類史上首度出現陸上帝國；海洋時代──開拓新大陸讓貿易範圍寬廣，跨洲的海洋帝國也於此時誕生；工業時代──蒸氣革命帶來大量工業化，催生了第一個世界霸權大英帝國；以及數位時代──霸權由英國轉為美國，而數位革命又帶來新型態的經濟、戰爭、與地緣政治關係。\n\n薩克斯並以五個問題為切入點扣問：\n\n■是什麼造成了全球化？\n■地理、技術與制度如何交互影響？\n■一個地區的影響力如何向外擴張？\n■這些變化如何影響全球局勢？\n■我們有辦法從過往的全球化汲取教訓，並迎接當下的挑戰嗎？\n\n對於現今世界面臨的危機，薩克斯於書中提出了精闢的見解，更對僵化的聯合國與其他世界組織提出了改革的呼籲。無論是回顧人類七萬年的歷史演進，抑或是對未來的展望上，本書皆展現了全面的觀點，並彌補了傳統經濟學上最缺乏的經濟歷史。薩克斯的這本傑作不僅是強國的警示之書，對於夾擊於強權競逐下的台灣該如何面對世界局勢，也深具啟發。"
    },
    {
        "title": "無止境的殺人",
        "author": "宮部美幸",

        "img": "https://media.taaze.tw/showThumbnail.html?sc=11100853971&height=400&width=310",
        "intro": "錢包，是守護欲望的鏡子。\n反映出人心最真實的渴求，也看盡人性的醜惡與良善……\n\n三十六歲即坐擁高級餐廳的塚田和彥，及年輕貌美如上流名媛的森元法子，一夕之間沸騰了社會。他們不是政經人物，也不是偶像明星，而是讓警方束手無策的「嫌疑犯」。\n\n深夜一樁肇事逃逸的車禍，死於輪下的男子身上的領帶夾不翼而飛。剛蜜月旅行回來的新娘，在機場附近被毆打致死，手上的戒指消失無蹤。過氣的酒店小姐，埋屍在森林深處，唯有大衣鈕扣遺失。離婚女子慘遭輾斃，無端少了一綹頭髮……一連串看似毫不相關的命案，千絲萬縷的線索都指向這對男女是凶手，然而，警方卻找不到任何確鑿的證據。\n\n不知是太愚蠢，或是太狡詐，塚田和法子坦承是彼此的外遇對象。並且，隨著案情愈來愈嚴重，兩人的嫌疑竟逐漸洗刷。到底是過於清白，根本無所畏懼？還是，對於謀殺計畫有百分之有的自信？在輿論倒向支持兩人的情況下，警方要如何破除迷障，拆穿真相？"
    },
    {
        "title": "獲利優先：大道至簡的現金管理系統",
        "author": "麥可‧米卡洛維茲",
        "url": "https://www.taaze.tw/products/14100103184.html",
        "img": "https://media.taaze.tw/showThumbnail.html?sc=14100103184&height=400&width=310",
        "intro": "　本書直指你我可能知道，卻又容易犯錯的財務盲區：透過營收成長無法解決財務問題。一心指望下一張大單、下一個客戶或投資人可以挽救頹勢，但最後只是一手創造了超大怪物。不斷成長卻忽略健康，哪一天大單、客戶或投資人沒有出現，後果不堪設想。\n\n　　創業導師、暢銷書作家麥可‧米卡洛維茲也曾有相同的經驗，只在乎業績成長，不在乎獲利，結果竟陷入求生存的惡性循環陷阱：營收增加，但必要費用增加更多→結果獲利更少，只好再拚命工作增加營收。在這樣的惡性循環下，創業存活的人寥寥可數。\n\n銷貨收入－獲利＝費用\n才是確保生存的獲利成長法則\n\n本書作者米卡洛維茲大聲疾呼要大家改變傳統會計思維，放棄會計原則帶來的賺錢幻象。他發現，傳統會計公式會讓人只想追求成長，忘了獲利。只要翻轉傳統的公式，就可以將記帳方法一改為獲利法則。\n\n創業的目的是為了實現願景，達到財富自由；\n創業家別不小心把自己變成公司的災難，需謹記：\n賺錢（收入）和拿到錢（獲利），兩者天差地遠。\n\n創新轉型不只在產品面，更多在財務面，\n跟著本書從第一天、第一個月、第一年，運轉公司財務轉型，\n配合這套「獲利優先」系統，將公司從吃錢怪獸變成獲利機器！"
    },
    {
        "title": "繁花",
        "author": "金宇澄",
        "url": "https://www.taaze.tw/usedList.html?oid=11100890773",
        "img": "https://media.taaze.tw/showThumbnail.html?sc=11100890773&height=400&width=310",
        "intro": "一座城，兩個男人，三段童年，四個十年，還有說不盡的市井故事。\n\n九○年代，生意人的上海。律師滬生與妻子白萍有名無實，兩人結婚後白萍便想盡辦法轉往國外，不願再回家來。法律夜校同學梅瑞先是與滬生交往，後來勾搭上他的好友「寶總」阿寶，但阿寶心裡始終有一個女孩的影子。\n商場上，精明的女人盯著成功的男人，特別是寂寞的男人。而寂寞的男人背後，都有過一個特別的女人。他們的故事──關於一座城的故事──要遠從滬生、阿寶與小毛三人結識的童年，六○年代的上海說起，那其中充滿各種美麗的、迷人的、身不由己的、充滿慾望的女人，女人的身體，渴望女人的男人與渴望男人的女人；街坊、八卦、流言、背叛、傳說、英雄事蹟、失望與希望、眼淚，與一場改變所有人的革命。"

        "author": "林伍德．巴克萊",

        "intro": "精神分裂症患者湯瑪士沉迷於網路地圖軟體，成日足不出戶瀏覽全球各城市街景。當他於網上逛到紐約曼哈頓下東區街頭時，意外發現某棟公寓三樓的窗內出現了一張被塑膠袋套緊的女人面孔，因恐懼而扭曲變形，他堅信自己目睹了兇殺案。\n\n不過，事情可沒那麼簡單。對警方而言，湯瑪士不能算是可靠證人，想要說服警方進行調查是難上加難。\n\n湯瑪士的哥哥雷此刻正返家處理他們父親意外猝死的後事，起初雷將湯瑪士的意外發現視為他的妄想不予理會，但為了讓湯瑪士打消親自走去探勘紐約現場的念頭，雷親自去到該棟公寓，卻只發現該戶之前的房客已搬離，目前招租中，其他別無異狀。\n\n但湯瑪士相信自己的雙眼，這個堅持將兩兄弟捲入一場陰謀——\n有人正企圖湮滅證據，任何目擊者都無法倖免……"

        "intro": "想活著，就遵守規則，\n非禮勿視、非禮勿聽、非禮勿言、非禮勿動\n否則，格殺勿論！\n\n推理評論人 冬陽\n知名作家暨書評人 提子墨\n荒野夢二書店主人 銀色快手\n知名暢銷作家 螺螄拜恩\n一致好評盛讚（依照姓名筆劃排序）\n\n當繫著黑絲帶的白色盒子再次出現時，\n他知道，四猿殺手回來了。\n\n眼前這個綁著黑絲帶的白盒子，芝加哥警局警探波特再熟悉不過……\n盒子裡分別裝著被害人被洗得乾乾淨淨的五官，再仔細地繫上黑色絲帶，\n就像是禮物一般，送到被害者家人手中。\n當陸續收到第三個盒子後，沒多久便會找到殘破的遺體，旁邊留下「非禮勿動」的警語……\n二十一個盒子，共有七個被害人。\n眼前這個盒子裡裝著一隻耳朵，代表又有一個人被綁架了，\n波特心知肚明，死亡遊戲又開始了。"

    {
        "title": "重啟人生︰一個哈佛教授的生命領悟，給你把餘生過好的簡單建議",

        "intro": "當改變發生，你有沒有勇氣展開另一種人生﹖\n過去，我們總以為只要認真努力，擁抱簡單的成功公式：心無旁騖，犧牲個人生活，一心一意往上爬，辛苦總會有代價。\n如今，我們領悟到人生不是一路往上衝，高峰過後可能就是谷底；不管是誰，現在多閃耀、多風光，有一天都會走下坡。\n當人生從走得光彩奪目變成走鋼索，該如何活出新意義？許多拚命三郎，發現愈來愈力不從心，家庭關係也開始變得緊張。面對人生的四分五裂，他們以一貫方式回應，否認愈來愈明顯的變化，加倍努力，試圖彌補衰退與不足，最後結局卻往往陷入更大的憤怒、害怕與失望。原本以為到了人生某個階段，生活就會更令人自豪，充滿喜悅與滿足感。然而，事與願違。你的人生不必這樣過。\n破解奮鬥者的詛咒，\n把害怕做出的人生改變，轉變成全新的力量泉源。\n哈佛大學教授布魯克斯幫助你打破「奮鬥者的詛咒」，從科學、哲學、神學、歷史的角度出發，分享違反直覺的策略，教你戒除舊習慣，培養新的生活方式，發掘潛在的生命價值。\n‧重新思考成功︰不自我物化，戒掉對成功的癮。\n‧活好︰思考失敗／死亡，擊敗恐懼，好好活著。\n‧認識自己︰從追求外在成就，到發展內在力量。\n‧化脆弱為力量：分享脆弱，生活中的愛會成長。\n\n人生不會因為無條件的相信和努力就變得幸福，有時候你必須捨棄，才會發現生活中真正重要的事情。當改變發生，你不一定要為此感到痛苦。這本書教你以優雅的姿態，帶著喜悅與更深層的使命感，接受挫折帶來的禮物。"

    {
        "title": "起源",
        "author": "丹．布朗",
        "url": "https://www.taaze.tw/usedList.html?oid=11100843999",
        "img": "https://media.taaze.tw/showThumbnail.html?sc=11100843999&height=400&width=310",
        "intro": "哈佛大學符號學教授羅柏‧蘭登受邀到西班牙畢爾包的古根漢美術館參加一場由未來學家艾德蒙‧柯許主辦的神祕晚會。柯許即將發表的「新人類起源說」據稱將解答人類存在的兩個根本疑問，足以顛覆達爾文以降的科學觀點。\n\n活動開始不久，全場數百位來賓都不禁被別出心裁的簡報迷住，蘭登也發現這遠比他想像的更具爭議性。精心安排的晚會進行到一半卻傳出槍響，有人要除掉柯許。眼見柯許的新發現就要在世界上消失，為了解開柯許上鎖文件的關鍵密碼，蘭登和古根漢美術館館長安布拉‧維達摸黑逃離混亂現場。自從刺殺騷動傳出，王宮出面滅火，主教蠢蠢欲動；今日政教關係不再牢固的西班牙，神聖宗教與尊貴王室已無法安定人心。此刻，同行逃往巴塞隆納的兩人，沿路凶險不斷，被迫躲進高第的聖家堂內鮮為人知的密室中，如今唯有仰賴維達館長提供柯許在世前的種種線索，蘭登或許有可能解開柯許設下的重重密碼，搶救可能永遠失落的新發現。\n\n「密碼不會自然出現，必須被創造。」在這部《達文西密碼》的驚人續集中，羅柏．蘭登將穿過隱晦歷史與極端宗教的黑暗長廊，直達最初始的生命起源。十五世紀以來，從伽俐略到霍金到複雜科學，在這個混亂、失序、人心徬徨的年代，從宗教、王權、政治領袖到哲學家，我們如何回應每日不斷翻天覆地的科學新發現？突現的生命答案，又為何讓人誓願以性命守護？\n\n我們從哪裡來？\n我們要往哪裡去？\n\n未知生，焉知死？數千年來，關於人類存在的兩個根本疑問，在權力爭霸的歷史中莫衷一是。長久矇蔽、令人屏息的真相，即將解開。邱吉爾曾言：「偉大的代價是責任」。生命有何意義？又將如何終結？原來人類對於死亡的恐懼，答案就在起源之中。只有看見死亡，人生才有成為傑作的可能。解開起源之謎，可能改寫人類命運的下一步。\n　\n本書創意驚人，被譽為丹布朗迄今最高明最具娛樂性的小說。"
    },

        "img": "https://media.taaze.tw/showThumbnail.html?sc=11100994122&height=400&width=310",
        "intro": "她睜大眼睛，嘴唇分開，像要說話。她的屍體在冰裡凍住……而她並不是唯一一個。\n\n在南倫敦一處公園厚厚的冰層之下發現了一名女性的屍體，愛芮卡刑警被召來負責這起命案。\n經查被害人是一位年輕美麗的社交名媛，看似人生勝利組。然而，當愛芮卡深入調查，發現命案與另外三名女子謀殺案有共通處──她們全都被勒死，雙手綁住，丟進倫敦各處的水域中。\n冰裡的女孩究竟隱藏了什麼見不得人的秘密？"

    {
        "title": "獲利的魔鬼，就躲在細節裡：不拚業績，我們如何讓獲利翻倍？",
        "author": "強納森．伯恩斯",
        "url": "https://www.taaze.tw/usedList.html?oid=11100566348",
        "img": "https://media.taaze.tw/showThumbnail.html?sc=11100566348&height=400&width=310",
        "intro": "本書一共四部、36章，意味著伯恩斯至少要幫你抓出、並糾正36種躲藏在各種做事細節裡的「魔鬼」—也就是觀念或做法的誤解。\n\n伯恩斯認為，我們該做的不是想著怎麼開發新計畫、提出新方案，而是先趕緊找出那40％「隱性虧錢」的生意，讓每位顧客、每項產品、每次服務都為公司帶來獲利，你才能夠將不賺錢的生意轉變成好生意。\n\n「魔鬼藏在細節裡」，意思就是︰企業每一個動作環節，都影響利潤高低，而每一項業務其實都擁有帶來利潤的潛力。伯恩斯多年前就提出一套系統化流程來分析利潤，20多年來幫助許多人快速地判斷，公司業務中的哪些部分值得擴展，哪些部分只會耗盡資源。這套犀利的辦法包括三部分︰\n\n1. 簡單畫一下你的利潤地圖（profit mapping）︰你這麼忙，哪有時間一一細算單項成本！所以你得用這套方法，很快「抓出」客戶、產品和服務為公司創造利潤的程度，知道哪些產品利潤很高，哪些活動幾乎賺不到錢；\n\n2. 接著，對那些能發揮利潤槓桿（profit levers）的活動著力︰利潤槓桿就是公司中一經調整，就能增加利潤的做事關鍵點。\n\n3. 落實以利潤觀點來管理流程︰定期檢討公司的顧客群和服務，讓日常活動能完全呼應公司的商業模式，用教育和訓練，將「盈虧損益意識」往下推展到基層人員。\n\n這是一本公司裡所有主管都該使用的手冊，所有員工都該參照的指導原則，不論你的公司是跨國集團，還是只有五名員工的地方商店，本書都會引導你、促使你服務的公司充分發揮潛力，伯恩斯表示，成功的商務人士一定要「找到自己的最佳實務」，本書就是最佳指南。"
    },
    {
        "title": "傳奇",
        "author": "張愛玲",
        "url": "https://www.taaze.tw/products/11101040212.html",
        "img": "https://media.taaze.tw/showThumbnail.html?sc=11101040212&height=400&width=310",
        "intro": "80年前，身處在不自由的「圍城」，張愛玲將千瘡百孔的現實投射到《傳奇》裡，成就了觸目可見的破碎慾望。\n\n〈封鎖〉中的「慾望街車」超然時空之外，讓壓抑得以發洩；〈金鎖記〉透過可謂為監禁的滯悶空間，將人性赤裸一表無遺；〈茉莉香片〉令人迷失於奇異且幾近扭曲的「遊戲」；〈花凋〉則寫盡毫無情愫的婚姻與被命運拋棄的抑鬱……這些深蘊人心的隱喻、傳統與叛逆的透視，經歷80年的淬鍊打磨，依舊令人心醉神迷。\n\n80年後，透過經典《傳奇》紀念回歸，我們得以跨越歲月的藩籬，沉浸於歷久不衰的字句，完整一窺張愛玲胸臆間的奇特想望，也見證了她在文學史上最重要的一頁。《傳奇》餘韻亙久不朽，張愛玲文思更將盛放不凋！"
    },
    {
        "title": "不存在的任務",
        "author": "李查德",
        "url": "https://www.taaze.tw/usedList.html?oid=11100857617",
        "img": "https://media.taaze.tw/showThumbnail.html?sc=11100857617&height=400&width=310",
        "intro": "閉上嘴收下這塊破銅爛鐵，\n他知道，勳章只是不值錢的封口費。\n但又一次，他接下了見不得光的任務，\n一個「不存在」的任務……\n\n\n那是1996年，傑克．李奇還在當憲兵，已是歹徒聞風喪膽的軍方王牌。一次成功的任務讓他獲頒勳章，但隨後卻立即被下放到「學校」。如果把軍隊比喻成一個人的身體，「學校」就是無人聞問的盲腸。一個才剛完成任務的少校會來到這裡，不是得罪了人就是幕後有鬼。\n\n李奇的猜測很快得到證實，他的兩位「同學」分別來自FBI和CIA，都是功績赫赫的頂尖好手。他們三人將接受美國政府的最高指令，阻止一場可能的恐怖攻擊陰謀。\n\n根據線報，潛伏在柏林的伊斯蘭聖戰組織正在進行一項秘密交易，並傳出一則意義不明的訊息：「美國人要一億。」這群人要交易的是什麼？賣家又到底是誰？在線索全無的情況下，李奇決定遠赴德國，掀開「美國人」的真實身分。但與此同時，新納粹黨也盯上了這筆交易，伺機而動。時間一分一秒過去，李奇遊走在法律邊緣，而且沒有失敗的機會……"
    },
    {

        "intro": "獻給閱讀冒險家的全新旅程——\n圖書館員版的「古墓奇兵」！\n\n圖書館探員的工作\n館藏採購（×）分類編目（×）讀者服務（×）協助研究（×）\n跨越時空、尋找珍本，和奇幻生物打交道，愛書人為佳。\n\n隱藏在世界之間的大圖書館，\n負責保管各個世界裡珍本中的珍本。\n其中偶有獨一無二的特殊版本，甚至能影響所在世界。\n圖書館員則身懷重任，前往不同時空，尋書收藏。\n知曉內情的人們，通稱大圖書館為「看不見的圖書館」。\n"

    {
        "title": "掠食者",
        "author": "PatriciaCornwell",
        "url": "https://www.taaze.tw/gift_sing.html?pid=81301568461",
        "img": "https://media.taaze.tw/showLargeImage.html?sc=11100155469&width=340&height=474",
        "intro": "目前擔任佛羅里達全美法醫學會顧問的史卡佩塔正著手調查一件離奇的失蹤案，一家四口突然從寧靜的家園消失，車子還停在車道上，廚房裡的火爐仍開著小火。不久之後就在失蹤案附近，一名抱怨柑橘樹巡查員上門打擾的老婦人遭到殘虐的謀殺，陳屍床上。案子不但起出極其詭異的證物，所有線索更指向一個極度狡獪靈巧的犯罪心靈。史卡佩塔和她的小組──彼德‧馬里諾、班頓‧衛斯禮，以及她的甥女露西──發現這幾樁駭人聽聞的犯罪案件之間，以及幾名可能的嫌疑犯之間似乎有某種神秘連結。\n\n另一方面，哈佛醫療體系下一家著名精神醫院正進行著一項代號「掠食者」的機密研究計畫，這計畫的實驗對象之一是一名入獄服刑的精神病態罪犯，他透露自己是多件謀殺疑案的主嫌，用似真似假的線索逗弄著史卡佩塔，而真正的凶手似乎仍在逃，且面貌多變。這些事件彼此相關或只是機緣巧合？而對這名犯人的腦部研究，是否真能讓人一窺仍在黑暗中尋找獵物的病態殺手的作案手法？\n\n史卡佩塔將再度抽絲剝繭，找出病態的「掠食者」。"
    },
    {
        "title": "心塵往事",
        "author": "約翰‧厄文",
        "url": "https://www.taaze.tw/usedList.html?oid=11100781641",
        "img": "https://cdn-booklife.shang-yu.com/upload_files/fonlego-rwd/prodpic/D_02600001.jpg",
        "intro": "每個人都曾經尋找，也曾迷失，\n但總有一天你會知道，哪裡，才是心的歸屬……\n\n緬因州，聖克勞斯，在這座因過度伐木興盛，隨後又轉為衰敗的城鎮裡，懷抱著理想與贖罪心的勒奇醫生同情懷孕卻無法扶養孩子的婦女，設立了一所孤兒院，並私下為婦女墮胎。\n終生未婚的勒奇醫生將醫學知識與高超外科技術，傾囊相授給視如己出的孤兒荷馬．威爾斯；荷馬曾被數個家庭先後收養，但又因故回到聖克勞斯，最終荷馬只能留在勒奇醫生的身邊擔任助手；勒奇醫生暗自期盼英俊善良的荷馬終有一天能成為自己的接班人，然而荷馬卻反對為婦女進行墮胎手術。\n一次偶然的機會，荷馬跟隨一對年輕情侶離開了聖克勞斯；急欲接觸真實世界的荷馬，成為了蘋果園的員工，更愛上了好朋友的情人，愛情讓荷馬迷失其中。而在聖克勞斯，勒奇醫生只是默默期盼荷馬能夠回來，在自己被迫離開之前……\n\n道德與困頓、愛情與友情、自私與良善、真相與謊言、背叛與寬恕，《心塵往事》如同採摘蘋果釀酒般，給讀者從滑順到微醺的閱讀迷醉，更成就了一本幽默溫馨、又直探靈魂的經典名作！"
    },
    {
        "title": "新罕布夏旅館",
        "author": "約翰‧厄文",
        "url": "https://www.taaze.tw/usedList.html?oid=11100792600",
        "img": "https://cdn-booklife.shang-yu.com/upload_files/fonlego-rwd/prodpic/D_02600002.jpg",
        "intro": "父親買熊的那年夏天，我們都還沒出生──\n\n「我們」指的是：大哥法蘭、姊姊芬妮、我、莉莉和蛋蛋。我們家是擁有五個孩子的大家庭，除了五個孩子之外，還有一頭父親被強迫推銷買下，名叫「緬因州」的老熊。父親是個聰明的夢想家，他將母親老舊的母校買下後改建成旅館，命名為「新罕布夏」。\n\n我們幾個孩子就這樣在旅館那一扇又一扇的門後穿梭玩樂，竊聽著客房對講機裡的人生百態；在這裡，除了莉莉之外我們飛快成長，而芬妮打輸了一場影響她一生的架──雖然我們都知道，那並不是她宣稱的群毆，而是其他。\n\n父親後來賣掉了旅館，帶著我們到維也納，開設了第二家「新罕布夏旅館」；我們新旅館的住客不是恐怖份子就是妓女；同時，我們也遇見了另一頭熊，由女孩蘇西扮演、繼承被槍殺的「緬因州」地位的「蘇西熊」。而我，貝里家的次子，則忙著到處尋找可以讓我將雙眼視線從芬妮身上移開的女人，但我跟誰在一切都不快樂。\n\n當父親制伏了企圖炸毀一切的恐怖份子後，莉莉把我們一家的故事寫成小說出版，大哥法蘭成了她的經紀人。我和芬妮在經歷這些年之後，確認了彼此的愛情；因此，我們需要做個了結……"
    },
    {
        "title": "我的心遺留在愛琴海",
        "author": "Justin",
        "url": "https://www.taaze.tw/usedList.html?oid=11100177599",
        "img": "https://www.books.com.tw/img/001/022/87/0010228786_bc_01.jpg",
        "intro": "2003年四月底，SARS肆虐，台灣籠罩在死亡的陰影下……\n五月初，本書作者Justin去了一趟希臘，12天的旅程，Justin拍了1400張數位照片，因為希臘太美了，他先是把相片寄給朋友，後來又應大家的要求開了一個網站--「我的心遺留在愛琴海」，因為照片太美，朋友們你告訴我，我告訴他，一個傳一個，然後整個五月、六月、七月…許多人都收到這麼一封信：「這是一個聯電工程師去希臘玩的時候拍下的照片，真的很美~~~http://home.kimo.com.tw/yuchang_chen.tw/」這個網站，截至7月10日止，上網人數已高達一百多萬人，並且持續增加中。\n這個Justin愛琴海網路現象就像一則科技與人文結合的傳奇。究竟是愛琴海太美了？還是SARS讓人太煩悶？或是工程師加希臘（理性與感性）的組合太迷人？答案無人知曉。\n\n希臘的藍與白因為Justin的網站而讓人心生嚮往，「今天的天空非常希臘」不再只是詩句，它有了真正的影像，並且印製成書。12天的旅程，Justin以他希臘旅遊的四個地方為經，學習攝影7年的心得為緯，圖文並茂地呈現出來，這不是一本專業的攝影書，而是一本希臘的攝影遊記。\n\n為什麼要出這本書？Justin說：希臘不遠，想去就可以到達；夢想不遠，踏出去就更接近……\n這本書是一個美景，一個實現。"
    },
    {
        "title": "在咖啡冷掉之前",
        "author": "川口俊和",
        "url": "https://www.taaze.tw/usedList.html?oid=11100813999",
        "img": "https://media.taaze.tw/showThumbnail.html?sc=11100813999&height=400&width=310",
        "intro": "拜託了，請讓我回到那一天！\n「聽說來這裡，就能回到過去，是真的嗎？」\n\n一間能回到過去的咖啡店，一連串奇蹟般的際遇，\n所編織出關於──愛與懊悔的故事。\n\n\n「只有坐在這家咖啡店的某個位子上，\n才能回到過去喔？而且……」\n\n在某條不知名的小徑上，有間咖啡店，有著不可思議的都市傳說。\n當中有個神秘座位，只要坐上那座位，就能回到你所希望回去的那一天。\n不過，回到過去是有代價的，也有著非常麻煩的規則………\n\n1. 就算回到過去，也無法見到不曾來過這家咖啡店的人。\n2. 回到過去之後無論如何努力，也不能改變現實。\n3. 神秘的座位有人，必須等到那個人離席時才能去坐。\n4. 即使回到過去，也不能從座位上離開。\n5. 回到過去的時間，只從咖啡倒進杯子開始，到咖啡冷卻為止。\n\n而且，麻煩的規則還不只這些………\n如果是你，倘若真能回到過去，也有想見的人嗎？\n"
    },
    {
        "title": "安眠書店",
        "author": "卡洛琳．凱普尼斯",
        "url": "https://www.taaze.tw/usedList.html?oid=11100797331&utm_source=shopback&utm_medium=referral&utm_campaign=ap&sbid=102b44540fb101e2fc79a4f271456b",
        "img": "https://media.taaze.tw/showThumbnail.html?sc=11100797331&height=400&width=310",
        "intro": "自她進入喬伊工作的東村書店那一剎那，喬伊便注意到她，在後續的言談間，喬伊更加確定她是自己要找的目標。喬伊先做了大家都會做的事：利用GOOGLE搜尋她信用卡的名字。\n\n全紐約市只有一個桂妮薇爾．貝可，她有隱私設定為公開的臉書帳號，而且發推特總是發得沒完沒了，這讓喬伊得以查出他所需要知道的一切：她朋友直接叫她貝可，念過布朗大學，住在銀行街，今晚要去布魯克林的某間酒吧——這正是製造「巧遇」的完美機會。\n\n喬伊宛若著魔了般開始偷偷摸摸掌控貝可的生活，他刻意搞出一堆事情，就是為了要讓貝可投入他的懷抱。他終於從變態跟蹤者變成了男友，值此同時，他還得忙著剷除兩人戀愛之路上的各種障礙——不計任何手段，就算得殺人也一樣……\n\n《安眠書店》深入探索我們面對偷窺與操控時的無能為力，過程令人恐懼心驚。初試啼聲的作家卡洛琳．凱普尼斯，為這個網路成癮的數位時代所寫下的小說，洞察力十足。節奏暢快，令人愛不釋手，足與《控制》、《美國殺人魔》、史蒂芬．金《戰慄遊戲》等書相互媲美。"
    },

        "author": "史蒂芬．金",
        "url": "https://www.taaze.tw/products/11101008023.html",
        "img": "https://media.taaze.tw/showThumbnail.html?sc=11101008023&height=400&width=310",
        "intro": "這是我的第一個故事，也是我的最後一個故事。\n回憶的深邃，人性的殘酷，命運的險惡，救贖的渺茫……\n我會一直寫，寫到生命的最後一頁。\n\n\n我11歲，那是我第一次開槍，\n槍很重，我必須用兩隻手握著，抵在胸膛上。\n那個男人是媽媽的男友，他殺了我妹妹。\n而我知道在這個世界上，只有我能救我自己……\n\n停下書寫，比利沉浸在過往，文思如湧泉，讓他差點忘了作家的身分只是偽裝。身為頂尖殺手，他已經潛伏在這棟大樓一段時間了，既然偽裝成作家，那就寫寫自己的故事吧。這麼多年來，他只對罪有應得的惡人開槍，而這將是他金盆洗手前的最後一單。端起窗邊的狙擊槍，扣下扳機，任務完成。\n\n豈料事情卻沒那麼順利，當他趁亂離開大樓，卻有人追趕而上。比利躲回預先準備的藏身處，決定繼續完成自己的故事。直到某個雨夜，一輛車駛過，不省人事的少女被丟了下來。女孩遭人性侵，渾身是傷，她認出比利就是那個被通緝的殺手，卻一點也不害怕，她覺得是比利救了自己。\n\n兩個寂寞的靈魂彼此相依，她讀比利寫的書，比利聽她訴說心事。這裡彷彿就是一座堡壘，讓他們躲著全世界。然而，比利卻絲毫未覺，惡意正在暗處蠢蠢欲動。如果出來跑，總是要還，這一次，比利注定得要賭上自己的生命，才能終結這一切……"
    },
    {
        "title": "這不是我們做事的方法！：組織的興起、殞落，再崛起",
        "author": "約翰・科特、赫爾格・拉斯格博",
        "url": "https://www.taaze.tw/usedList.html?oid=11100795865",
        "img": "https://media.taaze.tw/showThumbnail.html?sc=11100795865&height=400&width=310",
        "intro": "https://youtu.be/sERHKbP3BuA?si=Mq3Prm-hKDxTOSTc\n向科特學習迎接挑戰的智慧\n化危機為轉機，只須遵循 8 個步驟\n(1)創造急迫感\n(2)建立領導聯盟\n(3)形成策略願景與行動方案\n(4)招募志工團隊\n(5)排除阻礙展開行動\n(6)創造短期成效\n(7)維持加速前進\n(8)促成變革制度化\n\n當你準備了一個很棒的主意想分享，聽到最爛的回答會是什麼？\n「那不是我們這裡做事的方法！」\n\n《這不是我們做事的方法！》從寓言中淬鍊出高效能組織的精神：\n激發團隊的熱情與才華，為目標同心協力，全力以赴！\n在科特和拉斯格博的代表性暢銷書《冰山在融化》中，他們透過一個與企鵝相關的寓言，闡述領導群眾經歷重大改變的過程。現在，十年之後，他們再度推出一個吸引人的故事，希望能夠協助任何一個團隊或組織，因應他們最重大的挑戰，並且將其轉化為成長的機會。\n\n從南非喀拉哈里沙漠裡的兩個狐獴部落，\n你可以學到哪些關於組織歷久不衰的祕訣？\n很久很久以前，有一個住在非洲南部喀拉哈里的狐獴部落，在多年的穩定成長之後，一場旱災讓這個部落的資源急遽減少，而致命的禿鷹攻擊也增加了。隨著情況愈變愈糟，這個部落的和諧也隨之粉碎。主管團隊為了可能的解決方案而爭執不休，而來自第一線工作人員的建議，則面臨令人絕望的回應：「這不是我們這裡做事的方法！」\n\n所以納迪雅，一隻聰明且喜歡冒險的狐獴，為了幫助她陷入困境的部落尋找新的辦法，展開探索之旅。她發現一個規模較小的部落，有著很不同的運作方式，他們有更多的團隊合作與靈活彈性。這些狐獴發展出創新的解決方案，找到更多的食物，並且避開禿鷹的攻擊。但是在這小部落裡，並非所有的事情都如一開始看到的那樣完美無缺。\n\n這兩個世界，一個是龐大、有紀律、管理良好的部落，另一個是小巧、隨興、充滿創意的部落，誰能夠想出將這兩個優秀團隊的長處結合在一起的最佳方法？\n\n科特將數十年來的經驗與研究精華匯集在這本書中，呈現出為什麼組織會興起與殞落，以及他們可以如何面對逆境、再度崛起的智慧。"
    },
    {
        "title": "三體",
        "author": "劉慈欣",
        "url": "https://www.taaze.tw//usedList.html?oid=11101004264#_=_",
        "img": "https://media.taaze.tw/showThumbnail.html?sc=11101004264&height=400&width=310",
        "intro": "一封寄往宇宙深處的信\n一款謎樣的線上遊戲\n引出決定人類命運的重要決戰\n \n　　父親在文化大革命被殘殺，對人類絕望的菁英科學家葉文潔加入了軍方的通訊單位。就在這裡，她向宇宙深處寄出了改變人類命運的一封信……\n \n　　數十年後，研究尖端奈米材料的汪淼被捲入頂尖科學家接連自殺的謎團之中，他循著線索找到了一個由科學家組成的組織「科學前線」，還有一款名為「三體」的虛擬實境線上遊戲。這個神秘組織究竟藏著什麼祕密，「三體」中出現的三顆太陽又代表著什麼？"
    },
    {
        "title": "曼哈頓中央街一百號",
        "author": "布萊德‧梅爾樂",
        "url": "https://www.taaze.tw/usedList.html?oid=11100076839",
        "img": "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhhyM7BYM5_mBfVpCajZP1YO3Agtm02_ZgWsI3_T7L3wzZItKX5q0WHzfVz5DqsCSu80_dbKqNYgWWobPlTlMONPJPJHLzKql5KlOJ4y0uP4USA5SczAehx4Lp3nAUs2rz6GBgYYx2FtF9hDMdAEKCvkWY1F7-HbXJR_0TB99yGWpQzRG_lq4HSp4Aqsoc/w464-h640-rw/%E5%B0%81%E9%9D%A2.jpg",
        "intro": "紐約時報暢銷小說家布萊德‧梅爾樂在他的第一本暢銷小說《TheTenthjustice》(暫譯：第十正義)中，問了一個問題：你能信任你的朋友多少？而在這本書中，他提高了層次，加大張力，擴增賭注，將場景設在充滿爾虞我詐、計謀重重的法律世界，一對夫妻在法庭上各為其主喉舌力求官司勝訴，情節發展令人驚心動魄。莎拉‧邰德是紐約曼哈頓地檢署新上任的助理檢察官，她找到一個可以打響她第一砲的案子。她聰明、機伶、敏銳，而且強悍，她當然可以將被告繩之以法。可是，她萬萬沒想到對方卻找上她的丈夫擔任辯護律師。她的丈夫賈德任職於一家知名的法律事務所，是個極為出色的辯護律師，而且就快被升為合夥人。莎拉不知道的是，有人威脅她的丈夫，要是他的當事人沒能無罪開釋，就會殺掉他妻子。相對的，莎拉也有一個要人命的秘密。於是這對有苦難言的夫妻在職場上的鬥心機蔓延到家裡，威脅到他們的婚姻、家庭。他們面臨了一個難以想像的困境──這個案子無論誰勝訴，另一方都會死。"
    },
    {
        "title": "世界上最透明的故事",
        "author": "杉井光",
        "url": "https://www.taaze.tw/products/11101047021.html",
        "img": "https://media.taaze.tw/showThumbnail.html?sc=11101047021&height=400&width=310",
        "intro": "享譽文壇的知名推理作家宮內彰吾罹癌過世。宮內在出版界緋聞不斷，明明已有妻小，卻仍然與眾多女性交往，更與其中一位生下了孩子，那就是我。\n\n宮內過世之後，他的長子主動聯絡我。他說宮內死前，好像還持續在撰寫一本名為《世界上最透明的故事》的小說。我那同父異母的哥哥看上高額的版稅，想將之作為遺作出版，無奈一直找不到手稿。\n\n身為書店員工，我知道知名作家過世，正是拓展銷量的機會，生前的作品將炙手可熱。起初我站在如此功利主義的角度思考，但在得知宮內寫作途中曾遭遇難以解釋的瓶頸後，對小說本身產生了好奇。\n\n在欲望與業報盡頭病倒的作家，臨死之際最後的依託──世界上最透明的故事。我和編輯霧子小姐展開調查，尋找未曾謀面的生父的遺作。我們詢問了他的家人、編輯、情婦，然而隨著拼湊出來的父親形象逐漸清晰，我周遭的一切卻開始變得透明……"
    },
    {
        "title": "交互比較視野下的現代性：從台灣出發的反省",
        "author": "湯志傑、吳鴻昌、林峰燦、蔡博方、林文凱、齊偉先、謝斐宇、鄭祖邦",
        "url": "https://www.taaze.tw/usedList.html?oid=11100868348",
        "img": "https://media.taaze.tw/showThumbnail.html?sc=11100868348&height=400&width=310",
        "intro": "近年，在關於現代性的研究中，歐洲經驗已不再是金科玉律，不同區域於何時又是以何種方式進入現代，實有探討的價值與必要。本書站在多元現代性與後殖民理論的反省基礎上，結合實際歷史研究的進展，倡議以交互比較與相互連結的歷史兩種研究取徑，重探現代性的發展，並企圖從台灣出發，追求超越東方╱西方、殖民╱被殖民僵固二分的知識生產模式。\n\n本書透過探討自律市場、文化與文明概念的演變、專業與公民身分的關係、清帝國的早期現代統治理性、台灣民間神明信仰的現代性、中小企業的彈性生產網絡、中國的天朝主義⋯⋯等政治、經濟與文化三大面向，重新定位台灣的現代性經驗，並與西方的發展進行交互比較。\n\n採取交互比較的方法，可避免以本質化的方式把現代性理解為某些特徵；引進相互連結的歷史考察，則可彰顯現代性本身所內含的異質性，皆有助於開展出超越既有多元現代性的另一種研究路數。"
    },
    {
        "title": "異常【龔固爾獎之作、《紐約時報》年度最佳驚悚小說】",
        "author": " Hervé Le Tellier",
        "url": "https://www.books.com.tw/products/0010976596",
        "img": "https://www.books.com.tw/img/001/097/65/0010976596.jpg",
        "intro": "法航006班機，從巴黎飛往紐約，途中遭遇十年難得一見的危急亂流。然而，這架飛機降落後，卻像進入一個迥然不同的時空。\n \n　　機上的人們，早在3個月前就「搭乘同一班飛機落地」。如今在6月下機的他們究竟是什麼？是複製人？抑或某種大型實驗對人類群體開的極惡玩笑？\n \n　　他們被關進隱密的大型建築，在真相查明之前，無法與外界聯繫。美國出動了各界菁英，欲釐清這場已經不單是國安危機的「全人類恐慌事件」。\n \n　　＋＋第二架飛機著陸後＋＋\n　　一個孩子，變成擁有兩個母親。\n　　曾自殺的作家，如今「死而復生」。\n　　孤獨的演藝少年，能與一模一樣的自己組團嗎？\n　　罹患重病的機長，是否可以用另一個垂死的自己當作實驗？\n　\n　　痛苦，如浮沫般撈不完。存在，是為了什麼。\n　　「第二個你」，會是一切的解答嗎？"
    },
    {

        "author": "S. J. 華森 （S.J. Watson）",
        "url": "https://www.taaze.tw/usedList.html?oid=11100836553",
        "img": "https://media.taaze.tw/showThumbnail.html?sc=11100836553&height=400&width=310",
        "intro": "每一天醒來，克莉絲汀都身處一個陌生的房間，身旁躺著一個不認識的男人。\n當她面對鏡子，只看見一張陌生的臉，比她所知的自己老了20歲。接著，男人會耐心說明：我是妳丈夫班恩，妳今年47歲，20年前遭遇嚴重車禍，從此記憶受損。\n\n每一天醒來，克莉絲汀就像懵懂的孩子，關於她世界裡的一切，全仰賴班恩告知。\n不過每一天，她也會接到陌生的奈許醫師來電，要她到衣櫥後方找出日記。\n原來，克莉絲汀在睡前會寫下今天的事作為「備忘錄」，提醒明天失憶的自己。\n就這樣，克莉絲汀藉著日記的累積，一天天重建了自己的歷史，但其中細節漸漸和班恩、奈許醫師的說法產生矛盾。究竟哪一個版本可以信任？"

        "img": "https://www.books.com.tw/img/CN1/140/12/CN11401298.jpg",
        "intro": "每個家庭都有自己的故事，故事裡總有一座橋，這座橋，就是家人。\n　　鄧巴家的男孩沒有母親，也不需要父親。\n\n　　母親的病逝雖在他們心中留下傷痛，父親的離家卻讓兄弟羈絆更加堅強。但在他們以為人生也許就是如此時，父親突然回到家，提出令人不解的要求：他希望五人跟他去蓋一座橋。五兄弟中，只有克雷願意答應。其餘四人不明白這座橋有何意義，也不懂他為什麼背叛兄弟情誼。但從好久以前克雷就知道：他就是那座橋，只有他，能修復這個家庭受的一切創傷。\n\n　　面對傷痛，我們從不陌生，卻不知道怎麼把自己治好。\n　　我們啟程到遠方找希望，奇蹟卻在一開始出發的地方。\n\n　　經歷十三年沉潛淬練，愛與溫暖的傳信人馬格斯‧朱薩克再次帶來撼動人心的美麗作品。這個充滿心碎與感動的家族史詩將揪住你的心臟，直至最後一頁。\n"

    {
        "title": "站在走廊也要聽的爆滿國文課：說故事頓悟國學裡的人生智慧，你情不自禁擁有的文學素養。",

        "intro": "你對「庫存管理」的印象是？\n「我又不管倉庫，跟我無關」，那就誤會大了。\n\n作者芝田稔子，是日本知名物流諮詢公司湯淺的顧問，\n不管你從事批發、零售等流通業或網路商店，\n只要有實體商品，無論業種和規模大小，庫存管理都是必要技術。\n\n管理得當能增加公司利潤，減少多餘報廢，\n管理不當，顧客下單後等很久都拿不到貨，沒人要的商品卻堆滿倉，\n結果就是有訂單沒獲利，現金周轉必出問題。\n\n本書整理了存貨和訂貨的基本思維，\n包括維持適當庫存量所須的基本計算，各商品生命週期的下單技巧，\n並介紹可供使用的資訊系統功能。\n\n◎零庫存，是好還是壞？就像膽固醇，過多過少都不好。\n產品囤太多，現金流變差，囤太少就缺營業額。安全值怎麼抓？\n遇到熱門產品就多進一點避免缺貨，採購成本也低？\n關鍵是你得找到辦法全部賣完，降單位成本才有意義！\n\n過氣的、一直堆在倉庫的賣不動商品是資產還是負債？\n專家的建議是：賣不動就直接報廢銷毀吧，堆在倉庫還得花錢管理。\n\n◎多少庫存算適當，怎麼樣算過量？庫存周轉又是在轉什麼？\n\n．抓庫存不能只看庫存，關鍵是每日平均出貨量\n100元商品目前庫存100個，1,000元商品庫存10個，誰夠誰不夠怎麼判斷？\n100元商品每天出貨50個，庫存只夠撐兩天，\n1,000元商品每天只出貨1個，還可以再撐十天！（這樣計算你一目瞭然！）\n\n．庫存周轉是什麼？想想冰箱的啤酒，消耗越快、買越勤，品質越新鮮。\n假設你一個月要喝40罐，冰箱只放得下4罐，每個月得周轉（清空）10次。\n如果每月只喝４罐，代表月底還在喝月初買的酒（不新鮮）。\n跟新鮮度有關的產品，產品周轉得加快（替換得越勤）。\n\n如果產品品項越來越複雜，怎麼做訂單與庫存管理？\n哪些商品用資訊系統管理、哪些商品得靠人工計算？\n什麼樣的存貨真的不必留？倉儲基本功「整理」和「整頓」有何不同？\n\n獲利的魔鬼就藏在庫存裡：\n從網店經營，到公司採購、業務、財務、主管必學的訂貨與存貨技術。"

    let isLogged = false;
    let displayedCount = 0;
    const PAGE_SIZE = 30;

    // 分頁渲染核心
    function render(append = false) {
        const container = document.getElementById('bookList');
        if (!append) {
            container.innerHTML = '';
            displayedCount = 0;
        }
        const nextBatch = books.slice(displayedCount, displayedCount + PAGE_SIZE);
        nextBatch.forEach((book, i) => {
            const actualIndex = displayedCount + i;
            const item = document.createElement('div');
            item.className = 'book-item';
            item.innerHTML = `
                <img src="${book.img || ''}" onclick="showModal(${actualIndex})" onerror="this.src='https://via.placeholder.com/100x140?text=No+Cover'">
                <div style="font-size:12px; margin-top:8px; height:2.8em; overflow:hidden; line-height:1.4;">${book.title}</div>
                ${isLogged ? `
                    <div style="margin-top:8px; display:flex; gap:4px; justify-content:center;">
                        <button onclick="editBook(${actualIndex})" style="font-size:10px; padding:2px 5px; cursor:pointer;">改</button>
                        <button onclick="delBook(${actualIndex})" style="font-size:10px; padding:2px 5px; color:red; cursor:pointer;">刪</button>
                    </div>
                ` : ''}
            `;
            container.appendChild(item);
        });
        displayedCount += nextBatch.length;
        document.getElementById('loadMoreBtn').style.display = (displayedCount >= books.length) ? 'none' : 'block';
    }

    function loadMore() { render(true); }

        document.getElementById('m_author').innerText = "作者：" + (book.author || "不詳");
        document.getElementById('m_intro').innerText = book.intro || "尚無心得分享。";
        
        const rBtn = document.getElementById('m_read_btn');
        if(book.read) { rBtn.href = book.read; rBtn.style.display = "inline-block"; }
        else { rBtn.style.display = "none"; }
        
        const uBtn = document.getElementById('m_url_btn');
        if(book.url) { uBtn.href = book.url; uBtn.style.display = "inline-block"; }
        else { uBtn.style.display = "none"; }

        document.getElementById('bookModal').style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    function closeModal() {
        document.getElementById('bookModal').style.display = 'none';
        document.body.style.overflow = 'auto';
    }

    // 密碼邏輯
    document.getElementById('authLock').onclick = function() {
        if(!isLogged) {
            const today = new Date();
            const pw = prompt("請輸入密碼：");
            if(pw === today.getFullYear() + String(today.getMonth() + 1).padStart(2, '0') + String(today.getDate()).padStart(2, '0')) {
                isLogged = true;
                this.innerText = "🔓";
                document.getElementById('actionBar').style.display = "flex";
                render();
            } else if (pw !== null) alert("密碼錯誤！");
        } else {
            isLogged = false;
            this.innerText = "🔒";
            document.getElementById('actionBar').style.display = "none";
            document.getElementById('inputForm').style.display = "none";
            render();
        }
    };

    window.addBook = function() {
        const nb = {
            title: document.getElementById('f_title').value,
            author: document.getElementById('f_author').value,
            img: document.getElementById('f_img').value,
            url: document.getElementById('f_url').value,
            read: document.getElementById('f_read').value,
            intro: document.getElementById('f_intro').value
        };
        if(!nb.title) return;
        books.unshift(nb);
        document.getElementById('inputForm').style.display = 'none';
        ['f_title','f_author','f_img','f_url','f_read','f_intro'].forEach(id => document.getElementById(id).value='');
        render();
    };

    window.editBook = function(i) {
        const b = books[i];
        document.getElementById('f_title').value = b.title || '';
        document.getElementById('f_author').value = b.author || '';
        document.getElementById('f_img').value = b.img || '';
        document.getElementById('f_url').value = b.url || '';
        document.getElementById('f_read').value = b.read || '';
        document.getElementById('f_intro').value = b.intro || '';
        document.getElementById('inputForm').style.display = 'block';
        books.splice(i, 1);
        window.scrollTo(0,0);
    };

    window.delBook = function(i) { if(confirm("確定刪除？")) { books.splice(i, 1); render(); } };

    window.exportJSON = function() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(books, null, 4));
        const a = document.createElement('a'); a.href = dataStr; a.download = "library.json"; a.click();
    };

    window.importJSON = function(e) {
        const reader = new FileReader();
        reader.onload = ev => { books = JSON.parse(ev.target.result); render(); };
        reader.readAsText(e.target.files[0]);
    };

    window.saveToHTML = function() {
        isLogged = false; 
        document.getElementById('authLock').innerText = "🔒";
        document.getElementById('actionBar').style.display = "none";
        render();
        setTimeout(() => {
            const html = document.documentElement.outerHTML.replace(/let books = \[[\s\S]*?\];/, `let books = ${JSON.stringify(books, null, 4)};`);
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
            a.download = `mylibrary.html`;
            a.click();
        }, 500);
    };

    render();
    </script>
</div>

</body></html>
