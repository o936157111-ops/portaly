<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>myezlife.com - 私房圖書館隨機推薦區塊</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .modal-scroll::-webkit-scrollbar { width: 6px; }
        .modal-scroll::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .modal-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- ==================== 每日一書推薦區塊 (myezlife.com 主頁專用) ==================== -->
    <section class="max-w-4xl w-full mx-auto my-6 px-4">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6 md:p-8 transition-all duration-300 hover:shadow-md">
            
            <div class="flex items-center justify-between mb-5 pb-3 border-b border-slate-100">
                <div class="text-xs font-semibold tracking-wider text-amber-600 uppercase flex items-center gap-1.5">
                    <span>📚</span> 我的私房圖書館・隨選推薦
                </div>
                <button onclick="loadRandomBookFromLibrary()" class="text-xs text-amber-600 hover:text-amber-700 font-medium underline cursor-pointer bg-transparent border-none p-0">
                    🔄 隨機換一本藏書
                </button>
            </div>

            <!-- 動態載入容器 -->
            <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-center" id="libraryBookContainer">
                <div class="md:col-span-12 text-center py-8 text-slate-400 text-sm animate-pulse">
                    正在從 mylibrary.html 載入私房書庫...
                </div>
            </div>
        </div>
    </section>

    <!-- ==================== 浮動視窗 (Modal) ==================== -->
    <div id="bookModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300">
        <div id="modalContent" class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[85vh] flex flex-col transform scale-95 transition-transform duration-300 overflow-hidden">
            
            <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100 bg-white sticky top-0 z-10">
                <div class="flex items-center space-x-2">
                    <span class="text-amber-600 font-bold">📖</span>
                    <h2 class="font-bold text-slate-800 text-lg" id="modalHeaderTitle">私房藏書深度導讀</h2>
                </div>
                <button onclick="closeBookModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center transition-colors text-lg font-bold">
                    &times;
                </button>
            </div>

            <div id="modalBodyContent" class="modal-scroll p-6 overflow-y-auto text-slate-700 space-y-6 text-left text-sm leading-relaxed" style="max-height: calc(85vh - 130px);">
                <!-- 導讀內容 -->
            </div>

            <div class="flex items-center justify-end px-6 py-3 border-t border-slate-100 bg-slate-50 gap-3">
                <button onclick="closeBookModal()" class="px-4 py-2 bg-white border border-slate-200 hover:bg-slate-100 text-slate-700 font-medium rounded-xl text-sm transition-colors">
                    關閉
                </button>
            </div>
        </div>
    </div>

    <!-- ==================== 讀取私房圖書館與隨機抽書邏輯 ==================== -->
    <script>
        // 模擬您的 mylibrary.html 資料源（未來您可以直接改成 fetch('https://myezlife.com/mylibrary.html') 或讀取您的 Google Sheets CSV）
        // 這裡內建了幾本您的私房收藏範例，您可以隨時擴充
        const myLibraryDatabase = [
            {
                title: "羅蘋計畫",
                author: "橫山秀夫",
                category: "經典警察推理",
                image: "https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&q=80&w=400",
                shortDesc: "十五年前的女教師自殺案原來竟為他殺，距離追訴時效消滅僅剩最後24小時！日本推理大師橫山秀夫融合青春與人性黑暗的夢幻傑作。",
                modalContent: `
                    <h3 class="text-xl font-bold text-slate-900 mb-2">24小時倒數的殘酷真相——橫山秀夫《羅蘋計畫》</h3>
                    <p class="text-slate-600 mb-4">被譽為日本「平成的松本清張」橫山秀夫的夢幻出道大作，將警察體系的緊繃張力與青春期的輕狂罪惡完美交織。</p>
                    <hr class="border-slate-100 my-4">
                    <h4 class="font-bold text-slate-900 text-base mb-2">核心看點與收藏價值</h4>
                    <p class="text-slate-600 leading-relaxed">書中對於警察組織內部壓力、時間流逝的壓迫感，以及三名男學生當年策劃「亞森羅蘋計畫」背後的秘密，展現了極高水準的社會派筆法，是藏書閣中不可多得的推理經典。</p>
                `
            },
            {
                title: "嫌疑犯X的獻身",
                author: "東野圭吾",
                category: "心理懸疑巨作",
                image: "https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&q=80&w=400",
                shortDesc: "「究竟是守護一個人比較難，還是破解這個守護局比較難？」橫跨理性與情感的極致悲壯，東野圭吾巔峰代表作。",
                modalContent: `
                    <h3 class="text-xl font-bold text-slate-900 mb-2">天才的純粹與悲壯——東野圭吾《嫌疑犯X的獻身》</h3>
                    <p class="text-slate-600 mb-4">囊括日本各大推理大獎的大滿貫之作，將「愛情」與「邏輯」推向極致的心理神作。</p>
                    <hr class="border-slate-100 my-4">
                    <h4 class="font-bold text-slate-900 text-base mb-2">核心看點與收藏價值</h4>
                    <p class="text-slate-600 leading-relaxed">石神將全部生命與情感投注於一場完美的犧牲，為心愛的人構築滴水不漏的安全網。每一次重讀都能感受到那種隱忍而深沉的震撼。</p>
                `
            },
            {
                title: "查令十字路84號",
                author: "海蓮·漢芙",
                category: "經典書信散文",
                image: "https://images.unsplash.com/photo-1495640388908-05fa85288e61?auto=format&fit=crop&q=80&w=400",
                shortDesc: "紐約女作家與倫敦舊書店經理長達二十年的書信往來，記錄了對書籍、舊書香與人情溫暖的真摯熱愛。",
                modalContent: `
                    <h3 class="text-xl font-bold text-slate-900 mb-2">跨越大西洋的愛書人情誼——海蓮·漢芙《查令十字路84號》</h3>
                    <p class="text-slate-600 mb-4">所有愛書人奉為圭臬的溫暖經典，記錄了紙本書籍所能串聯起最純粹的人性連結。</p>
                    <hr class="border-slate-100 my-4">
                    <h4 class="font-bold text-slate-900 text-base mb-2">核心看點與收藏價值</h4>
                    <p class="text-slate-600 leading-relaxed">「你們若恰巧經過查令十字路84號，代我向那裡致意。我摯愛它，它也庇護過我。」這本書是每個愛書人書櫃中永遠的溫柔鄉。</p>
                `
            }
        ];

        let selectedBook = null;

        function loadRandomBookFromLibrary() {
            const container = document.getElementById('libraryBookContainer');
            
            // 從私房清單中隨機抽出一本
            const randomIndex = Math.floor(Math.random() * myLibraryDatabase.length);
            selectedBook = myLibraryDatabase[randomIndex];

            // 渲染主頁區塊
            container.innerHTML = `
                <div class="md:col-span-4 flex justify-center">
                    <div onclick="openBookModal()" class="group relative cursor-pointer overflow-hidden rounded-xl shadow-md w-40 h-56 md:w-full md:h-60 bg-slate-100 border border-slate-100">
                        <img src="${selectedBook.image}" alt="${selectedBook.title}書影" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
                        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center text-white font-medium text-xs text-center p-2">
                            點擊展開私房導讀
                        </div>
                    </div>
                </div>
                <div class="md:col-span-8 flex flex-col justify-center space-y-3">
                    <div class="flex items-center gap-2">
                        <span class="bg-amber-50 text-amber-800 text-xs px-2.5 py-1 rounded-md font-medium">${selectedBook.author} 著</span>
                        <span class="text-slate-400 text-xs">• ${selectedBook.category}</span>
                    </div>
                    <h3 class="font-bold text-slate-800 text-xl md:text-2xl tracking-tight">${selectedBook.title}</h3>
                    <p class="text-slate-600 text-sm md:text-base leading-relaxed line-clamp-3">
                        ${selectedBook.shortDesc}
                    </p>
                    <div class="pt-2 flex items-center gap-3">
                        <button onclick="openBookModal()" class="inline-flex items-center justify-center py-2.5 px-5 bg-slate-900 hover:bg-slate-800 text-white font-medium rounded-xl text-sm transition-colors shadow-sm gap-2">
                            <span>📖 閱讀私房導讀</span>
                        </button>
                        <a href="mylibrary.html" class="inline-flex items-center justify-center py-2.5 px-4 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-medium rounded-xl text-sm transition-colors">
                            查看我的藏書櫃
                        </a>
                    </div>
                </div>
            `;

            // 渲染彈出視窗內容
            document.getElementById('modalHeaderTitle').innerText = `${selectedBook.title} - 私房藏書導讀`;
            document.getElementById('modalBodyContent').innerHTML = selectedBook.modalContent;
        }

        // 彈出視窗控制
        const bookModal = document.getElementById('bookModal');
        const modalContent = document.getElementById('modalContent');

        function openBookModal() {
            bookModal.classList.remove('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-95');
            modalContent.classList.add('scale-100');
            document.body.style.overflow = 'hidden';
        }

        function closeBookModal() {
            bookModal.classList.add('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            document.body.style.overflow = 'auto';
        }

        bookModal.addEventListener('click', (e) => {
            if (e.target === bookModal) closeBookModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeBookModal();
        });

        // 頁面載入時自動隨機推薦一本私房藏書
        window.onload = loadRandomBookFromLibrary;
    </script>

</body>
</html>
