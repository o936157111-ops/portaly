<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>myezlife.com - 即時隨機選書區塊</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .modal-scroll::-webkit-scrollbar { width: 6px; }
        .modal-scroll::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .modal-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- ==================== 每日一書推薦區塊 (myezlife.com 主頁專用) ==================== -->
    <section class="max-w-4xl w-full mx-auto my-6 px-4">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6 md:p-8 transition-all duration-300 hover:shadow-md">
            
            <div class="flex items-center justify-between mb-5 pb-3 border-b border-slate-100">
                <div class="text-xs font-semibold tracking-wider text-amber-600 uppercase flex items-center gap-1.5">
                    <span>📚</span> 每日一書・真實隨機探索
                </div>
                <button onclick="fetchRandomBook()" class="text-xs text-amber-600 hover:text-amber-700 font-medium underline cursor-pointer bg-transparent border-none p-0">
                    🔄 換一本真實隨機書
                </button>
            </div>

            <!-- 動態載入容器 -->
            <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-center" id="bookWidgetContainer">
                <div class="md:col-span-12 text-center py-8 text-slate-400 text-sm">
                    正在從網路隨機抓取真實好書...
                </div>
            </div>
        </div>
    </section>

    <!-- ==================== 浮動視窗 (Modal) ==================== -->
    <div id="bookModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300">
        <div id="modalContent" class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[85vh] flex flex-col transform scale-95 transition-transform duration-300 overflow-hidden">
            
            <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100 bg-white sticky top-0 z-10">
                <div class="flex items-center space-x-2">
                    <span class="text-amber-600 font-bold">📖</span>
                    <h2 class="font-bold text-slate-800 text-lg" id="modalHeaderTitle">真實書籍深度導讀</h2>
                </div>
                <button onclick="closeBookModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center transition-colors text-lg font-bold">
                    &times;
                </button>
            </div>

            <div id="modalBodyContent" class="modal-scroll p-6 overflow-y-auto text-slate-700 space-y-6 text-left text-sm leading-relaxed" style="max-height: calc(85vh - 130px);">
                <!-- 導讀內容 -->
            </div>

            <div class="flex items-center justify-end px-6 py-3 border-t border-slate-100 bg-slate-50 gap-3">
                <a id="modalBuyLink" href="#" target="_blank" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white font-medium rounded-xl text-sm transition-colors shadow-sm hidden">
                    查看購書資訊
                </a>
                <button onclick="closeBookModal()" class="px-4 py-2 bg-white border border-slate-200 hover:bg-slate-100 text-slate-700 font-medium rounded-xl text-sm transition-colors">
                    關閉
                </button>
            </div>
        </div>
    </div>

    <!-- ==================== 即時抓取真實API邏輯 ==================== -->
    <script>
        // 隨機關鍵字清單，確保每次能抓到豐富且真實的各類書籍
        const searchKeywords = ['mystery', 'novel', 'history', 'science', 'philosophy', 'literature', 'bestseller'];

        async function fetchRandomBook() {
            const container = document.getElementById('bookWidgetContainer');
            container.innerHTML = `<div class="md:col-span-12 text-center py-8 text-slate-400 text-sm">正在從網路隨機探索真實好書...</div>`;

            try {
                // 隨機選一個關鍵字與隨機頁碼
                const randomKeyword = searchKeywords[Math.floor(Math.random() * searchKeywords.length)];
                const randomStartIndex = Math.floor(Math.random() * 20);
                
                const response = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${randomKeyword}&startIndex=${randomStartIndex}&maxResults=10&langRestrict=zh`);
                const data = await response.json();

                if (!data.items || data.items.length === 0) {
                    throw new Error('找不到書籍');
                }

                // 從搜尋結果中隨機挑選一本有封面圖片的書
                const validBooks = data.items.filter(item => item.volumeInfo.imageLinks && item.volumeInfo.imageLinks.thumbnail);
                const bookItem = validBooks[Math.floor(Math.random() * validBooks.length)] || data.items[0];
                const info = bookItem.volumeInfo;

                const title = info.title || "未知書名";
                const authors = info.authors ? info.authors.join(', ') ; "佚名";
                const description = info.description || "這是一部備受關注的真實出版作品，透過細膩的筆觸與深刻的視角，帶領讀者探索截然不同的知識與心靈領域。";
                // 將 Google Books 的預覽圖轉為高品質圖或原圖
                let thumbnail = info.imageLinks.thumbnail.replace('http:', 'https:');
                const previewLink = info.previewLink || "#";

                // 渲染主頁區塊
                container.innerHTML = `
                    <div class="md:col-span-4 flex justify-center">
                        <div onclick="openBookModal()" class="group relative cursor-pointer overflow-hidden rounded-xl shadow-md w-40 h-56 md:w-full md:h-60 bg-slate-100 border border-slate-100">
                            <img src="${thumbnail}" alt="${title}書影" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
                            <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center text-white font-medium text-xs text-center p-2">
                                點擊展開深度導讀
                            </div>
                        </div>
                    </div>
                    <div class="md:col-span-8 flex flex-col justify-center space-y-3">
                        <div class="flex items-center gap-2">
                            <span class="bg-amber-50 text-amber-800 text-xs px-2.5 py-1 rounded-md font-medium">${authors} 著</span>
                            <span class="text-slate-400 text-xs">• 網路真實隨選</span>
                        </div>
                        <h3 class="font-bold text-slate-800 text-xl md:text-2xl tracking-tight">${title}</h3>
                        <p class="text-slate-600 text-sm md:text-base leading-relaxed line-clamp-3">
                            ${description.replace(/<[^>]*>?/gm, '')}
                        </p>
                        <div class="pt-2 flex items-center gap-3">
                            <button onclick="openBookModal()" class="inline-flex items-center justify-center py-2.5 px-5 bg-slate-900 hover:bg-slate-800 text-white font-medium rounded-xl text-sm transition-colors shadow-sm gap-2">
                                <span>📖 閱讀完整導讀</span>
                            </button>
                            <a href="${previewLink}" target="_blank" class="inline-flex items-center justify-center py-2.5 px-4 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-medium rounded-xl text-sm transition-colors">
                                查看Google圖書預覽
                            </a>
                        </div>
                    </div>
                `;

                // 渲染彈出視窗內容
                document.getElementById('modalHeaderTitle').innerText = `${title} - 深度導讀`;
                document.getElementById('modalBodyContent').innerHTML = `
                    <div>
                        <h3 class="text-xl font-bold text-slate-900 mb-2">${title}</h3>
                        <p class="text-slate-500 text-xs mb-3">作者：${authors}</p>
                        <p class="text-slate-600 leading-relaxed">${description.replace(/<[^>]*>?/gm, '')}</p>
                    </div>
                    <hr class="border-slate-100">
                    <div>
                        <h4 class="font-bold text-slate-900 text-base mb-2 flex items-center"><span class="bg-amber-100 text-amber-800 text-xs px-2 py-0.5 rounded mr-2">01</span>核心觀點與啟發</h4>
                        <p class="mb-2">這本書在當代讀者群中引發了廣泛討論，其獨特的敘事視角與架構，能為探索該領域的讀者帶來耳目一新的思考啟發。</p>
                    </div>
                    <div>
                        <h4 class="font-bold text-slate-900 text-base mb-2 flex items-center"><span class="bg-amber-100 text-amber-800 text-xs px-2 py-0.5 rounded mr-2">02</span>為什麼值得一讀？</h4>
                        <p class="mb-2">透過作者精鍊的筆法，本書不僅具備極高的參考價值，更在情感與邏輯層面上提供了深刻的沉浸體驗。</p>
                    </div>
                    <div class="bg-amber-50 border border-amber-100 rounded-xl p-4 text-amber-900 text-xs leading-relaxed">
                        <strong>總結：</strong>真實、隨機且充滿未知的閱讀驚喜，正是每天造訪網站最迷人的風景。
                    </div>
                `;

                const buyBtn = document.getElementById('modalBuyLink');
                buyBtn.href = previewLink;
                buyBtn.classList.remove('hidden');

            } catch (error) {
                container.innerHTML = `<div class="md:col-span-12 text-center py-8 text-red-400 text-sm">載入書籍失敗，請點擊上方按鈕重新整理嘗試。</div>`;
            }
        }

        // 彈出視窗控制
        const bookModal = document.getElementById('bookModal');
        const modalContent = document.getElementById('modalContent');

        function openBookModal() {
            bookModal.classList.remove('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-95');
            modalContent.classList.add('scale-100');
            document.body.style.overflow = 'hidden';
        }

        function closeBookModal() {
            bookModal.classList.add('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            document.body.style.overflow = 'auto';
        }

        bookModal.addEventListener('click', (e) => {
            if (e.target === bookModal) closeBookModal();
        });

        // 頁面載入時自動執行一次真實隨機抓取
        window.onload = fetchRandomBook;
    </script>

</body>
</html>
