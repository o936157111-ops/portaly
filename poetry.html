<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>詠風雅頌 · 現代橫書詩詞</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: "Noto Serif TC", "Noto Serif CJK TC", serif;
            background-color: #f4f3ee; 
            color: #2c2c2c;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .poem-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 540px; 
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.04);
            padding: 45px 40px;
            display: flex;
            flex-direction: column;
        }

        .poem-header { width: 100%; text-align: right; margin-bottom: 35px; }
        .title { font-size: 1.5rem; font-weight: 700; color: #8c2d19; margin-bottom: 6px; letter-spacing: 2px; }
        .author { font-size: 0.9rem; color: #7a756b; letter-spacing: 2px; }

        /* 詩詞內容排版區 */
        .content-container { width: 100%; margin-bottom: 35px; }
        .content {
            font-size: 1.25rem;
            line-height: 2.2;
            color: #333333;
            letter-spacing: 0.15em;
            text-align: center;
            font-weight: 500;
        }
        /* 強制每一行詩句為一個獨立區塊 */
        .content div {
            display: block;
            margin: 0 auto;
            width: fit-content;
        }

        .btn-container { width: 100%; display: flex; justify-content: center; }
        .refresh-btn {
            background: #ffffff;
            color: #666;
            border: 1px solid #e0dfd5;
            padding: 10px 35px;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.2s ease;
        }
        .refresh-btn:hover { border-color: #8c2d19; color: #8c2d19; }

        @media (max-width: 480px) {
            .poem-card { padding: 35px 20px; }
            .title { font-size: 1.3rem; }
            .content { font-size: 1.05rem; line-height: 2.0; letter-spacing: 0.05em; }
        }
    </style>
</head>
<body>

    <div class="poem-card">
        <div class="poem-header">
            <h1 class="title" id="poemTitle">載入中</h1>
            <div class="author" id="poemAuthor">詩人</div>
        </div>
        
        <div class="content-container" id="poemContent">
            </div>
        
        <div class="btn-container">
            <button class="refresh-btn" onclick="getRandomPoem()">易詞換景</button>
        </div>
    </div>

    <script>
        // 您的詩詞資料庫
       const poemDatabase = [
            // --- 第一、二波 詩詞 ---
            { title: "水調歌頭", author: "宋 · 蘇軾", content: "明月幾時有？把酒問青天。\n不知天上宮閱，今夕是何年。\n我欲乘風歸去，又恐瓊樓玉宇，高處不勝寒。\n起舞弄清影，何似在人間。" },
            { title: "定風波", author: "宋 · 蘇軾", content: "莫聽穿林打葉聲，何妨吟嘯且徐行。\n竹杖芒鞋輕勝馬，誰怕？一蓑煙雨任平生。\n料峭春風吹酒醒，微冷，山頭斜照卻相迎。\n回首向來蕭瑟處，歸去，也無風雨也無晴。" },
            { title: "青玉案 · 元夕", author: "宋 · 辛棄疾", content: "東風夜放花千樹。更吹落、星如雨。\n寶馬雕車香滿路。\n鳳簫聲動，玉壺光轉，一夜魚龍舞。\n蛾兒雪柳黃金縷。笑語盈盈暗香去。\n眾裡尋他千百度。驀然回首，那人卻在，燈火闌珊處。" },
            { title: "雨霖鈴", author: "宋 · 柳永", content: "寒蟬淒切，對長亭晚，驟雨初歇。\n都門帳飲無緒，留戀處，蘭舟催發。\n執手相看淚眼，竟無語凝噎。\n念去去，千里煙波，暮靄沉沉楚天闊。" },
            { title: "錦瑟", author: "唐 · 李商隱", content: "錦瑟無端五十弦，一弦一柱思華年。\n莊生曉夢迷蝴蝶，望帝春心託杜鵑。\n滄海月明珠有淚，藍田日暖玉生煙。\n此情可待成追憶，只是當時已惘然。" },
            { title: "將進酒", author: "唐 · 李白", content: "君不見，黃河之水天上來，奔流到海不復回。\n君不見，高堂明鏡悲白髮，朝如青絲暮成雪。\n人生得意須盡歡，莫使金樽空對月。\n天生我材必有用，千金散盡還復來。\n烹羊宰牛且爲樂，會須一飲三百杯。" },
            { title: "蜀道難", author: "唐 · 李白", content: "噫吁嚱，危乎高哉！蜀道之難，難於上青天！\n蠶叢及魚鳧，開國何茫然！\n爾來四萬八千歲，不與秦塞通人煙。\n西當太白有鳥道，可以橫絕峨眉巔。\n地崩山摧壯士死，然後天梯石棧相鉤連。" },
            { title: "登高", author: "唐 · 杜甫", content: "風急天高猿嘯哀，渚清沙白鳥飛回。\n無邊落木蕭蕭下，不盡長江滾滾來。\n萬里悲秋常作客，百年多病獨登台。\n艱難苦恨繁霜鬢，潦倒新停濁酒杯。" },
            { title: "琵琶行 (節錄)", author: "唐 · 白居易", content: "潯陽江頭夜送客，楓葉荻花秋瑟瑟。\n主人下馬客在船，舉酒欲飲無管弦。\n醉不成歡慘將別，別時茫茫江浸月。\n忽聞水上琵琶聲，主人忘歸客不發。\n尋聲暗問彈者誰，琵琶聲停欲語遲。" },
            { title: "黃鶴樓", author: "唐 · 崔顥", content: "昔人已乘黃鶴去，此地空餘黃鶴樓。\n黃鶴一去不復返，白雲千載空悠悠。\n晴川歷歷漢陽樹，芳草萋萋鸚鵡洲。\n日暮鄉關何處是？煙波江上使人愁。" },
            { title: "山居秋暝", author: "唐 · 王維", content: "空山新雨後，天氣晚來秋。\n明月松間照，清泉石上流。\n竹喧歸浣女，蓮動下漁舟。\n隨意春芳歇，王孫自可留。" },
            { title: "楓橋夜泊", author: "唐 · 張繼", content: "月落烏啼霜滿天，江楓漁火對愁眠。\n姑蘇城外寒山寺，夜半鐘聲到客船。" },
            { title: "登金陵鳳凰台", author: "唐 · 李白", content: "鳳凰台上鳳凰遊，鳳去台空江自流。\n吳宮花草埋幽徑，晉代衣冠成古丘。\n三山半落青天外，二水中分白鷺洲。\n總爲浮雲能蔽日，長安不見使人愁。" },
            { title: "望廬山瀑布", author: "唐 · 李白", content: "日照香爐生紫煙，遙看瀑布掛前川。\n飛流直下三千尺，疑是銀河落九天。" },
            { title: "靜夜思", author: "唐 · 李白", content: "床前明月光，疑是地上霜。\n舉頭望明月，低頭思故鄉。" },
            { title: "春曉", author: "唐 · 孟浩然", content: "春眠不覺曉，處處聞啼鳥。\n夜來風雨聲，花落知多少。" },
            { title: "江雪", author: "唐 · 柳宗元", content: "千山鳥飛絕，萬徑人蹤滅。\n孤舟蓑笠翁，獨釣寒江雪。" },
            { title: "相思", author: "唐 · 王維", content: "紅豆生南國，春來發幾枝。\n願君多采擷，此物最相思。" },
            { title: "送元二使安西", author: "唐 · 王維", content: "渭城朝雨浥輕塵，客舍青青柳色新。\n勸君更盡一杯酒，西出陽關無故人。" },
            { title: "九月九日憶山東兄弟", author: "唐 · 王維", content: "獨在異鄉爲異客，每逢佳節倍思親。\n遙知兄弟登高處，遍插茱萸少一人。" },
            { title: "清明", author: "唐 · 杜牧", content: "清明時節雨紛紛，路上行人欲斷魂。\n借問酒家何處有？牧童遙指杏花村。" },
            { title: "泊船瓜洲", author: "宋 · 王安石", content: "京口瓜洲一水間，鍾山只隔數重山。\n春風又綠江南岸，明月何時照我還。" },
            { title: "遊子吟", author: "唐 · 1孟郊", content: "慈母手中線，遊子身上衣。\n臨行密密縫，意恐遲遲歸。\n誰言寸草心，報得三春暉。" },
            { title: "憫農", author: "唐 · 李紳", content: "鋤禾日當午，汗滴禾下土。\n誰知盤中餐，粒粒皆辛苦。" },
            { title: "烏衣巷", author: "唐 · 劉禹錫", content: "朱雀橋邊野草花，烏衣巷口夕陽斜。\n舊時王謝堂前燕，飛入尋常百姓家。" },
            { title: "念奴嬌 · 赤壁懷古", author: "宋 · 蘇軾", content: "大江東去，浪淘盡，千古風流人物。\n故壘西邊，人道是，三國周郎壁。\n亂石穿空，驚濤拍岸，捲起千堆雪。\n江山如畫，一時多少豪傑。" },
            { title: "江城子 · 乙卯正月二十日夜記夢", author: "宋 · 蘇軾", content: "十年生死兩茫茫，不思量，自難忘。\n千里孤墳，無處話淒涼。\n縱使相逢應不識，塵滿面，鬢如霜。\n夜來幽夢忽還鄉，小軒窗，正梳妝。\n相顧無言，惟有淚千行。\n料得年年腸斷處，明月夜，短松岡。" },
            { title: "蝶戀花 · 春景", author: "宋 · 蘇軾", content: "花褪殘紅青杏小。燕子飛時，綠水人家繞。\n枝上柳綿吹又少。天涯何處無芳草。\n牆裡秋秋牆外道。牆外行人，牆裡佳人笑。\n笑漸不聞聲漸悄。多情卻被無情惱。" },
            { title: "永遇樂 · 京口北固亭懷古", author: "宋 · 辛棄疾", content: "千古江山，英雄無覓，孫仲謀處。\n舞榭歌台，風流總被，雨打風吹去。\n斜陽草樹，尋常巷陌，人道寄奴曾住。\n想當年，金戈鐵馬，氣吞萬里如虎。" },
            { title: "醜奴兒 · 書博山道中壁", author: "宋 · 辛棄疾", content: "少年不識愁滋味，愛上層樓。愛上層樓，爲賦新詞強說愁。\n而今識盡愁滋味，欲說還休。欲說還休，卻道天涼好個秋。" },
            { title: "破陣子 · 爲陳同甫賦壯詞以寄之", author: "宋 · 辛棄疾", content: "醉裏挑燈看劍，夢回吹角連營。\n八百里分麾下炙，五十弦翻塞外聲。沙場秋點兵。\n馬作的盧飛快，弓如霹靂弦驚。\n了卻君王天下事，贏得生前身後名。可憐白髮生！" },
            { title: "聲聲慢 · 尋尋覓覓", author: "宋 · 李清照", content: "尋尋覓覓，冷冷清清，淒淒慘慘戚戚。\n乍暖還寒時候，最難將息。\n三杯兩盞淡酒，怎敵他、晚來風急！\n雁過也，正傷心，卻是舊時相識。" },
            { title: "一剪梅 · 紅藕香殘玉簟秋", author: "宋 · 李清照", content: "紅藕香殘玉簟秋。輕解羅裳，獨上蘭舟。\n雲中誰寄錦書來？雁字回時，月滿西樓。\n花自飄零水自流。一種相思，兩處閒愁。\n此情無計可消除，才下眉頭，卻上心頭。" },
            { title: "醉花陰 · 薄霧濃雲愁永晝", author: "宋 · 李清照", content: "薄霧濃雲愁永晝，瑞腦銷金獸。\n佳節又重陽，玉枕紗廚，半夜涼初透。\n東籬把酒黃昏後，有暗香盈袖。\n莫道不銷魂，簾卷西風，人比黃花瘦。" },
            { title: "武陵春 · 春晚", author: "宋 · 李清照", content: "風住塵香花已盡，日晚倦梳頭。\n物是人非事事休，欲語淚先流。\n聞說雙溪春尚好，也擬泛輕舟。\n只恐雙溪舴艋舟，載不動許多愁。" },
            { title: "鵲橋仙 · 纖雲弄巧", author: "宋 · 秦觀", content: "纖雲弄巧，飛星傳恨，銀漢迢迢暗度。\n金風玉露一相逢，便勝卻人間無數。\n柔情似水，佳期如夢，忍顧鵲橋歸路。\n兩情若是久長時，又豈在朝朝暮暮。" },
            { title: "虞美人 · 春花秋月何時了", author: "五代 · 李煜", content: "春花秋月何時了？往事知多少。\n小樓昨夜又東風，故國不堪回首月明中。\n雕欄玉砌應猶在，只是朱顏改。\n問君能有幾多愁？恰似一江春水向東流。" },
            { title: "浪淘沙令 · 簾外雨潺潺", author: "五代 · 李煜", content: "簾外雨潺潺，春意闌珊。\n羅衾不耐五更寒。\n夢裏不知身是客，一晌貪歡。\n獨自莫憑欄，無限江山。\n別時容易見時難。\n流水落花春去也，天上人間。" },
            { title: "踏莎行 · 候館梅殘", author: "宋 · 歐陽修", content: "候館梅殘，溪橋柳細。草薰風暖搖征轡。\n離愁漸遠漸無窮，迢迢不斷如春水。\n寸寸柔腸，盈盈粉淚。樓高莫近危闌倚。\n平蕪盡處是春山，行人更在春山外。" },
            { title: "蝶戀花 · 佇倚危樓風細細", author: "宋 · 柳永", content: "佇倚危樓風細細。望極春愁，黯黯生天際。\n草色煙光殘照裏。無言誰會憑闌意。\n擬把疏狂圖一醉。對酒當歌，強樂還無味。\n衣帶漸寬終不悔。爲伊消得人憔悴。" },
            { title: "青玉案 · 凌波不過橫塘路", author: "宋 · 賀鑄", content: "凌波不過橫塘路。但目送、芳塵去。錦瑟華年誰與度。\n月橋花院，瑣窗朱戶。只有春知處。\n飛雲冉冉蘅皋暮。彩筆新題斷腸句。若問閒情都幾許。\n一川煙草，滿城風絮。梅子黃時雨。" },
            { title: "臨江仙 · 滾滾長江東逝水", author: "明 · 楊慎", content: "滾滾長江東逝水，浪花淘盡英雄。\n是非成敗轉頭空。\n青山依舊在，幾度夕陽紅。\n白髮漁樵江渚上，慣看秋月春風。\n一壺濁酒喜相逢。\n古今多少事，都付笑談中。" },
            { title: "浣溪沙 · 一曲新詞酒一杯", author: "宋 · 晏殊", content: "一曲新詞酒一杯，去年天氣舊亭台。夕陽西下幾時回？\n無可奈何花落去，似曾相識燕歸來。小園香徑獨徘徊。" },
            { title: "江城子 · 密州出獵", author: "宋 · 蘇軾", content: "老夫聊發少年狂，左牽黃，右擎蒼，錦帽貂裘，千騎卷平岡。\n爲報傾城隨太守，親射虎，看孫郎。\n酒酣胸膽尚開張。鬢微霜，又何妨！持節雲中，何日遣馮唐？\n會挽雕弓如滿月，西北望，射天狼。" },
            { title: "木蘭花 · 擬古決絕詞柬友", author: "清 · 納蘭性德", content: "人生若只如初見，何事秋風悲畫扇。\n等閒變卻故人心，卻道故人心易變。\n驪山語罷清宵半，淚雨零鈴終不怨。\n何如薄倖錦衣郎，比翼連枝當日願。" },

            // --- 第三波 詩詞 ---
            { title: "涼州詞", author: "唐 · 王翰", content: "葡萄美酒夜光杯，欲飲琵琶馬上催。\n醉臥沙場君莫笑，古來征戰幾人回？" },
            { title: "出塞", author: "唐 · 王昌齡", content: "秦時明月漢時關，萬里長征人未還。\n但使龍城飛將在，不教胡馬度陰山。" },
            { title: "芙蓉樓送辛漸", author: "唐 · 王昌齡", content: "寒雨連江夜入吳，平明送客楚山孤。\n洛陽親友如相問，一片冰心在玉壺。" },
            { title: "閨怨", author: "唐 · 王昌齡", content: "閨中少婦不知愁，春日凝妝上翠樓。\n忽見陌頭楊柳色，悔教夫婿覓封侯。" },
            { title: "別董大", author: "唐 · 高適", content: "千里黃雲白日曛，北風吹雁雪紛紛。\n莫愁前路無知己，天下誰人不識君？" },
            { title: "白雪歌送武判官歸京 (節錄)", author: "唐 · 岑參", content: "北風卷地白草折，胡天八月即飛雪。\n忽如一夜春風來，千樹萬樹梨花開。\n散入珠簾濕羅幕，狐裘不暖錦衾薄。\n將軍角弓不得控，都護鐵衣冷難著。" },
            { title: "回鄉偶書", author: "唐 · 賀知章", content: "少小離家老大回，鄉音無改鬢毛衰。\n兒童相見不相識，笑問客從何處來？" },
            { title: "詠柳", author: "唐 · 賀知章", content: "碧玉妝成一樹高，萬條垂下綠絲絛。\n不知細葉誰裁出，二月春風似剪刀。" },
            { title: "桃花溪", author: "唐 · 張旭", content: "隱隱飛橋隔野煙，石磯西畔問漁船。\n桃花盡日隨流水，洞門桃花何處邊？" },
            { title: "夜雨寄北", author: "唐 · 李商隱", content: "君問歸期未有期，巴山夜雨漲秋池。\n何當共剪西窗燭，卻話巴山夜雨時。" },
            { title: "無題 · 相見時難別亦難", author: "唐 · 李商隱", content: "相見時難別亦難，東風無力百花殘。\n春蠶到死絲方盡，蠟炬成灰淚始乾。\n曉鏡但愁雲鬢改，夜吟應覺月光寒。\n蓬山此去無多路，青鳥殷勤爲探看。" },
            { title: "樂遊原", author: "唐 · 李商隱", content: "向晚意不適，驅車登古原。\n夕陽無限好，只是近黃昏。" },
            { title: "賈生", author: "唐 · 李商隱", content: "宣室求賢訪逐臣，賈生才調更無倫。\n可憐夜半虛前席，不問蒼生問鬼神。" },
            { title: "江南春", author: "唐 · 杜牧", content: "千里鶯啼綠映紅，水村山郭酒旗風。\n南朝四百八十寺，多少樓台煙雨中。" },
            { title: "泊秦淮", author: "唐 · 杜牧", content: "煙籠寒水月籠沙，夜泊秦淮近酒家。\n商女不知亡國恨，隔江猶唱後庭花。" },
            { title: "秋夕", author: "唐 · 杜牧", content: "銀燭秋光冷畫屏，輕羅小扇撲流螢。\n天階夜色涼如水，臥看牽牛織女星。" },
            { title: "赤壁", author: "唐 · 杜牧", content: "折戟沉沙鐵未銷，自將磨洗認前朝。\n東風不與周郎便，銅雀春深鎖二喬。" },
            { title: "山行", author: "唐 · 杜牧", content: "遠上寒山石徑斜，白雲生處有人家。\n停車坐愛楓林晚，霜葉紅於二月花。" },
            { title: "贈別 · 其一", author: "唐 · 杜牧", content: "娉娉嫋嫋十三餘，豆蔻梢頭二月初。\n春風十里揚州路，卷上珠簾總不如。" },
            { title: "金谷園", author: "唐 · 杜牧", content: "繁華事散逐香塵，流水無情草自春。\n日暮東風怨啼鳥，落花猶似墜樓人。" },
            { title: "西江月 · 夜行黃沙道中", author: "宋 · 辛棄疾", content: "明月別枝驚鵲，清風半夜鳴蟬。\n稻花香裏說豐年，聽取蛙聲一片。\n七八個星天外，兩三點雨山前。\n舊時茅店社林邊，路轉溪橋忽見。" },
            { title: "南歌子 · 獨夜殘燈暗", author: "宋 · 辛棄疾", content: "獨夜殘燈暗，孤舟底事來。\n幾番秋到幾番回。又被一聲新雁、喚愁來。\n夢裏修書寫，惺惺卻不開。\n不期今夜伴春回。隔帳不知香雪、落梅開。" },
            { title: "江城子 · 湖上與張先同賦", author: "宋 · 蘇軾", content: "鳳凰山下雨初晴，水風清，晚霞明。\n一朵芙蓉，開過尚盈盈。\n何處飛來雙白鷺，如有意，慕娉婷。\n忽聞江上弄哀箏，苦含情，遣誰聽！\n煙斂雲收，依約是湘靈。\n欲待曲終尋問取，人不見，數峰青。" },
            { title: "卜算子 · 黃州定慧院寓居作", author: "宋 · 蘇軾", content: "缺月掛疏桐，漏斷人初靜。\n時見幽人獨往來，縹緲孤鴻影。\n驚起卻回頭，有恨無人省。\n揀盡寒枝不肯棲，寂洲冷。" },
            { title: "浣溪沙 · 簌簌衣巾落棗花", author: "宋 · 蘇軾", content: "簌簌衣巾落棗花，村南村北響繅車。牛衣古柳賣黃瓜。\n酒困路長惟欲睡，日高人渴漫思茶。敲門試問野人家。" },
            { title: "書憤 · 早歲那知世事艱", author: "宋 · 陸游", content: "早歲那知世事艱，中原北望氣如山。\n樓船夜雪瓜洲渡，鐵馬秋風大散關。\n塞上長城空自許，鏡中衰鬢已先斑。\n出師一表真名世，千載誰堪伯仲間！" },
            { title: "臨安春雨初霽", author: "宋 · 陸游", content: "世味年來薄似紗，誰令騎馬客京華。\n小樓一夜聽春雨，深巷明朝賣杏花。\n矮紙斜行閒作草，晴窗細乳戲分茶。\n素衣莫起風塵嘆，猶及清明可到家。" },
            { title: "釵頭鳳 · 紅酥手", author: "宋 · 陸游", content: "紅酥手，黃縢酒，滿城春色宮牆柳。\n東風惡，歡情薄。一懷愁緒，幾年離索。錯、錯、錯。\n春如舊，人空瘦，淚痕紅浥鮫綃透。\n桃花落，閒池閣。山盟雖在，錦書難託。莫、莫、莫！" },
            { title: "釵頭鳳 · 世情薄", author: "宋 · 唐婉", content: "世情薄，人情惡，雨送黃昏花易落。\n曉風乾，淚痕殘。欲訴肺腑，高唐路杳。難、難、難。\n人成各，今非昨，病魂常似秋千索。\n角聲寒，夜闌珊。怕人尋問，咽淚裝歡。瞞、瞞、瞞！" },
            { title: "滿江紅 · 怒髮衝冠", author: "宋 · 岳飛", content: "怒髮衝冠，憑欄處、瀟瀟雨歇。\n抬望眼，仰天長嘯，壯懷激烈。\n三十功名塵與土，八千里路雲和月。\n莫等閒、白了少年頭，空悲切！" },
            { title: "小重山 · 昨夜寒蛩不住鳴", author: "宋 · 岳飛", content: "昨夜寒蛩不住鳴。驚回千里夢，已三更。\n起來獨自繞階行。人悄悄，簾外月朧明。\n白首爲功名。舊山松竹老，阻歸程。\n欲將心事付瑤琴。知音少，弦斷有誰聽？" },
            { title: "漁家傲 · 秋思", author: "宋 · 範仲淹", content: "塞下秋來風景異，衡陽雁去無留意。\n四面邊聲連角起，千嶂裏，長煙落日孤城閉。\n濁酒一杯家萬里，燕然未勒歸無計。\n羌管悠悠霜滿地，人不寐，將軍白髮征夫淚。" },
            { title: "蘇幕遮 · 碧雲天", author: "宋 · 範仲淹", content: "碧雲天，黃葉地。秋色連波，波上寒煙翠。\n山映斜陽天接水。芳草無情，更在斜陽外。\n黯鄉魂，追旅思。夜夜除非，好夢留人睡。\n明月樓高休獨倚。酒入愁腸，化作相思淚。" },
            { title: "江城子 · 秦樓楚館", author: "宋 · 柳永", content: "秦樓楚館，便恁意、縱談高宴。\n向玳瑁筵前，絮絮神仙伴。\n那等溫存，百般嬌懶。\n更待曲終，密期密約、重重與見。" },
            { title: "鶴沖天 · 黃金榜上", author: "宋 · 柳永", content: "黃金榜上，偶失龍頭望。明代暫遺賢，如何向。\n未遂風雲便，爭不恣狂蕩。何須論得喪。\n才子詞人，自是白衣卿相。\n煙花巷陌，依約丹青屏障。幸有意中人，堪尋訪。\n且恁偎紅翠，風流事、平生暢。\n青春都一餉。忍把浮名，換了淺斟低唱！" },
            { title: "踏莎行 · 霧失樓台", author: "宋 · 秦觀", content: "霧失樓台，月迷津渡。桃源望斷無尋處。\n可堪孤館閉春寒，杜鵑聲裏斜陽暮。\n驛寄梅花，魚傳尺素。砌成此恨無重數。\n郴江幸自繞郴山，爲誰流下瀟湘去？" },
            { title: "水龍吟 · 次韻章質夫楊花詞", author: "宋 · 蘇軾", content: "似花還似非花，也無人惜從殘墜。\n拋家傍路，思量卻是，無情有思。\n縈損柔腸，困酣嬌眼，欲開還閉。\n夢隨風萬里，尋郎去處，又還被、鶯呼起。" },
            { title: "點降唇 · 蹴罷秋千", author: "宋 · 李清照", content: "蹴罷秋千，起來慵整纖纖手。\n露濃花瘦，薄汗輕衣透。\n見客入來，襪剗金釵溜。和羞走。\n倚門回首，卻把青梅嗅。" },
            { title: "鷓鴣天 · 暗淡輕黃體性柔", author: "宋 · 李清照", content: "暗淡輕黃體性柔，情疏跡遠只香留。\n何須淺碧深紅色，自是花中第一流。\n梅定妒，菊應羞，畫闌開處冠中秋。\n騷人可煞無情思，何事當年不見收。" },
            { title: "如夢令 · 常記溪亭日暮", author: "宋 · 李清照", content: "常記溪亭日暮，沉醉不知歸路。\n興盡晚回舟，誤入藕花深處。\n爭渡，爭渡，驚起一灘鷗鷺。" }
            // 之後可在此處補入其他資料
        ];

        function getRandomPoem() {
            const randomIndex = Math.floor(Math.random() * poemDatabase.length);
            const poem = poemDatabase[randomIndex];

            document.getElementById('poemTitle').innerText = poem.title;
            document.getElementById('poemAuthor').innerText = poem.author;
            
            // 清空舊內容並重新生成 <div>
            const contentContainer = document.getElementById('poemContent');
            contentContainer.innerHTML = '';
            
            const lines = poem.content.split('\n');
            lines.forEach(line => {
                const div = document.createElement('div');
                div.innerText = line;
                contentContainer.appendChild(div);
            });
        }

        window.onload = getRandomPoem;
    </script>
</body>
</html>
