<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups">
  <title>myezlife Diary - 隨筆心情日記</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- 引入 Google 登入與 API SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* 👓 長輩友善「超大字體」模式 */
    body.large-text-mode {
      font-size: 115%;
    }
    body.large-text-mode .text-base { font-size: 1.25rem !important; }
    body.large-text-mode .text-sm { font-size: 1.1rem !important; }
    body.large-text-mode .text-xs { font-size: 0.95rem !important; }

    .accordion-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s cubic-bezier(0, 1, 0, 1);
    }
    .accordion-content.expanded {
      max-height: 5000px;
      transition: max-height 0.5s ease-in-out;
    }
    .rotate-icon {
      transition: transform 0.3s ease;
    }
    .rotate-icon.active {
      transform: rotate(180deg);
    }

    /* 🌟 側邊滑出選單（Drawer）樣式 */
    .side-drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 10000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .side-drawer-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .side-drawer {
      position: fixed;
      top: 0;
      left: -320px;
      width: 300px;
      height: 100%;
      background: #ffffff;
      z-index: 10001;
      box-shadow: 5px 0 25px rgba(0,0,0,0.15);
      transition: left 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      display: flex;
      flex-direction: column;
      padding: 24px 20px;
      overflow-y: auto;
    }
    .side-drawer.active {
      left: 0;
    }
    .drawer-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #eee;
    }
    .drawer-header img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
    }
    .drawer-title {
      font-size: 18px;
      font-weight: bold;
      color: #111;
    }
    .drawer-btn-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .drawer-btn {
      width: 100%;
      padding: 14px 18px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      color: #1e293b;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      border-radius: 14px;
      text-decoration: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      transition: all 0.2s ease;
    }
    .drawer-btn:hover {
      background: #0f172a;
      color: #fff;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen pb-16 flex flex-col justify-between select-none">

  <!-- 🌟 左側滑出選單結構 (Drawer) -->
  <div class="side-drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>
  <div class="side-drawer" id="sideDrawer">
    <div class="drawer-header">
      <img src="https://myezlife.com/eric-logo.gif" alt="Logo">
      <div class="drawer-title">功能選單</div>
    </div>
    <div class="drawer-btn-container">
      <button onclick="toggleFontSize()" class="drawer-btn bg-amber-50 text-amber-900 border-amber-200 hover:bg-amber-100 flex items-center justify-center gap-2">
        <i class="fa-solid fa-text-height"></i> <span id="fontToggleLabel">切換為超大字模式</span>
      </button>
      <a href="https://myezlife.com/" class="drawer-btn">首頁</a>
      <a href="https://myezlife.com/diary/" class="drawer-btn text-emerald-700 font-bold">🌱 心情隨筆與待辦日記</a>
      <a href="https://myezlife.com/index-1.html" class="drawer-btn">生活‧簡居‧生活</a>
      <a href="https://myezlife.com/FileExplorer.html" class="drawer-btn">檔案總管</a>
      <a href="https://myezlife.com/index_news.html" class="drawer-btn">新聞劃重點</a>
      <a href="https://youtube.com/playlist?list=PLeSu4EJy_yAQ&si=nW1vtYKbmn12uMex" class="drawer-btn">AI好劇一直看</a>
      <a href="https://myezlife.com/goldmelody_csv.html" class="drawer-btn">好歌一直聽</a>
      <a href="https://myezlife.com/ai-greeting-app/" class="drawer-btn text-amber-600 font-bold">🌻 製作問候圖</a>
    </div>
  </div>

  <!-- 頂部導覽列：採用與主首頁一致的白色圓角卡片底色與上下分列設計 -->
  <header class="bg-white text-slate-900 border-b border-slate-200/90 sticky top-0 z-10 shadow-sm">
    <div class="max-w-xl mx-auto px-4 py-3 flex flex-col gap-2.5">
      
      <!-- 上列：LOGO + 標題 + 字體大小切換按鈕 -->
      <div class="flex justify-between items-center">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="toggleDrawer()" title="點擊開啟功能選單">
          <img src="https://myezlife.com/eric-logo.gif" alt="Menu" class="w-10 h-10 rounded-full border-2 border-emerald-500 object-cover shadow-sm hover:scale-105 transition shrink-0">
          <h1 class="text-lg font-bold tracking-wide leading-tight flex flex-col">
            <span>myezlife</span>
            <span class="text-emerald-600 font-semibold text-sm">心情隨筆日記</span>
          </h1>
        </div>

        <!-- 字體大小按鈕 -->
        <button onclick="toggleFontSize()" class="text-xs bg-white border border-slate-300 shadow-sm px-3 py-1.5 rounded-xl font-bold text-slate-700 hover:bg-slate-50 transition flex items-center gap-1.5 cursor-pointer">
          <i class="fa-solid fa-text-height text-emerald-600"></i>
          <span id="fontToggleTopLabel">字體大小</span>
        </button>
      </div>

      <!-- 下列：說明按鈕 + 雲端同步按鈕（並排延展） -->
      <div class="grid grid-cols-2 gap-2">
        <!-- 說明與備份按鈕 -->
        <button onclick="openInfoModal()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-300 py-2 px-3 rounded-xl font-bold transition flex items-center justify-center gap-1.5 cursor-pointer shadow-sm">
          <i class="fa-solid fa-circle-info text-emerald-600"></i> <span>說明與備份</span>
        </button>

        <!-- 雲端同步按鈕 -->
        <button id="sync-btn" onclick="handleAuthClick()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-800 border border-emerald-500/50 py-2 px-3 rounded-xl font-bold transition flex items-center justify-center gap-1.5 cursor-pointer shadow-sm">
          <i class="fa-solid fa-cloud-arrow-up text-emerald-600"></i> <span id="sync-btn-text">雲端同步</span>
        </button>
      </div>

    </div>
  </header>

  <!-- 💻📱 全站主要內容區域：統一採舒適適中的單欄置中佈局 (max-w-xl) -->
  <main class="max-w-xl mx-auto w-full px-4 pt-5 space-y-4">

    <!-- 💡 本機專屬今日提醒摘要卡片 -->
    <section id="home-today-reminder" class="hidden">
      <div class="bg-stone-950 border border-amber-500/40 rounded-2xl p-4 shadow-md flex items-center justify-between gap-3 text-stone-100">
        <div class="flex items-center gap-3 overflow-hidden">
          <span class="text-3xl">💡</span>
          <div class="truncate">
            <h3 class="text-xs font-bold text-amber-400">今日待辦與提醒摘要</h3>
            <p id="home-reminder-text" class="text-sm font-bold text-stone-100 truncate">載入中...</p>
          </div>
        </div>
        <span class="text-xs bg-amber-500 text-stone-950 px-2.5 py-1 rounded-lg font-black shrink-0">本機專屬</span>
      </div>
    </section>

    <!-- 今日心情與待辦卡片 -->
    <section class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200/90 shadow-sm space-y-4">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
        <div class="text-sm font-extrabold text-slate-800 bg-slate-100 px-3.5 py-1.5 rounded-xl border border-slate-200" id="current-date-display">
          📅 載入日期中...
        </div>
        <span id="cloud-status-tip" class="text-xs text-emerald-800 bg-emerald-50 px-2.5 py-1 rounded-lg border border-emerald-200 font-bold">💡 建議先連動雲端，確保日記自動備份</span>
      </div>

      <!-- 心情選擇器 -->
      <div>
        <label class="block text-sm font-extrabold text-slate-800 mb-2.5">今天的心情如何？請點選代表圖示：</label>
        <div class="grid grid-cols-5 gap-1.5 sm:gap-2" id="mood-selector">
          <button type="button" onclick="selectMood('🌻', '晴朗')" class="mood-btn py-2.5 sm:py-3 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 flex flex-col items-center gap-1 transition cursor-pointer" data-mood="🌻">
            <span class="text-2xl sm:text-3xl">🌻</span>
            <span class="text-xs font-bold text-slate-700">晴朗</span>
          </button>
          <button type="button" onclick="selectMood('🌷', '溫馨')" class="mood-btn py-2.5 sm:py-3 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 flex flex-col items-center gap-1 transition cursor-pointer" data-mood="🌷">
            <span class="text-2xl sm:text-3xl">🌷</span>
            <span class="text-xs font-bold text-slate-700">溫馨</span>
          </button>
          <button type="button" onclick="selectMood('🌿', '平靜')" class="mood-btn py-2.5 sm:py-3 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 flex flex-col items-center gap-1 transition cursor-pointer" data-mood="🌿">
            <span class="text-2xl sm:text-3xl">🌿</span>
            <span class="text-xs font-bold text-slate-700">平靜</span>
          </button>
          <button type="button" onclick="selectMood('🌧️', '
