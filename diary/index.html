<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups">
  <title>myezlife Diary - 隨筆花園日記</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- 引入 Google 登入與 API SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>
</head>
<body class="bg-stone-900 text-stone-100 min-h-screen font-sans antialiased text-base md:text-lg">

  <!-- 頂部導覽列 -->
  <header class="bg-stone-950 text-stone-100 border-b border-stone-800 sticky top-0 z-10 shadow-md">
    <div class="max-w-3xl mx-auto px-4 md:px-6 py-3 md:py-4 flex flex-col sm:flex-row justify-between items-center gap-3">
      <div class="flex items-center space-x-3">
        <span class="text-2xl md:text-3xl">🌱</span>
        <h1 class="text-xl md:text-2xl font-bold tracking-wide">myezlife <span class="text-amber-400 text-sm md:text-base font-normal">心情隨筆</span></h1>
      </div>
      <!-- 雲端同步按鈕 -->
      <button id="sync-btn" onclick="handleAuthClick()" class="w-full sm:w-auto text-xs md:text-sm bg-stone-900 hover:bg-stone-800 text-amber-300 border border-amber-400/40 py-2 px-4 rounded-xl font-medium transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-cloud-arrow-up"></i> <span id="sync-btn-text">連動 Google 雲端</span>
      </button>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 md:px-6 py-6 md:py-8 space-y-6 md:space-y-8">

    <!-- 今日心情輸入卡片 -->
    <section class="bg-stone-950 rounded-2xl md:rounded-3xl p-5 md:p-8 shadow-lg border border-stone-800">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-4 md:mb-6">
        <div class="text-sm md:text-base font-bold text-stone-300 bg-stone-900 px-3 md:px-4 py-1.5 md:py-2 rounded-xl border border-stone-800" id="current-date-display">
          📅 載入日期中...
        </div>
        <span class="text-xs md:text-sm text-stone-400">記錄此刻的平靜與心境</span>
      </div>

      <!-- 心情選擇器 -->
      <div class="mb-5 md:mb-6">
        <label class="block text-xs md:text-sm font-bold text-stone-300 mb-2 md:mb-3">今天的心情如何？請點選代表圖示：</label>
        <div class="grid grid-cols-5 gap-2 md:gap-3" id="mood-selector">
          <button type="button" onclick="selectMood('🌻', '晴朗')" class="mood-btn py-2 md:py-3 rounded-xl md:rounded-2xl border-2 border-stone-800 bg-stone-900 hover:bg-stone-800 flex flex-col items-center gap-1 transition" data-mood="🌻">
            <span class="text-2xl md:text-3xl">🌻</span>
            <span class="text-xs md:text-sm font-medium text-stone-300">晴朗</span>
          </button>
          <button type="button" onclick="selectMood('🌷', '溫馨')" class="mood-btn py-2 md:py-3 rounded-xl md:rounded-2xl border-2 border-stone-800 bg-stone-900 hover:bg-stone-800 flex flex-col items-center gap-1 transition" data-mood="🌷">
            <span class="text-2xl md:text-3xl">🌷</span>
            <span class="text-xs md:text-sm font-medium text-stone-300">溫馨</span>
          </button>
          <button type="button" onclick="selectMood('🌿', '平靜')" class="mood-btn py-2 md:py-3 rounded-xl md:rounded-2xl border-2 border-stone-800 bg-stone-900 hover:bg-stone-800 flex flex-col items-center gap-1 transition" data-mood="🌿">
            <span class="text-2xl md:text-3xl">🌿</span>
            <span class="text-xs md:text-sm font-medium text-stone-300">平靜</span>
          </button>
          <button type="button" onclick="selectMood('🌧️', '沉思')" class="mood-btn py-2 md:py-3 rounded-xl md:rounded-2xl border-2 border-stone-800 bg-stone-900 hover:bg-stone-800 flex flex-col items-center gap-1 transition" data-mood="🌧️">
            <span class="text-2xl md:text-3xl">🌧️</span>
            <span class="text-xs md:text-sm font-medium text-stone-300">沉思</span>
          </button>
          <button type="button" onclick="selectMood('🥀', '疲憊')" class="mood-btn py-2 md:py-3 rounded-xl md:rounded-2xl border-2 border-stone-800 bg-stone-900 hover:bg-stone-800 flex flex-col items-center gap-1 transition" data-mood="🥀">
            <span class="text-2xl md:text-3xl">🥀</span>
            <span class="text-xs md:text-sm font-medium text-stone-300">疲憊</span>
          </button>
        </div>
      </div>

      <!-- 文字輸入框 -->
      <div class="mb-5 md:mb-6">
        <textarea id="diary-input" rows="4" placeholder="請在此寫下您今天的心情或想說的話..." class="w-full p-3 md:p-4 border-2 border-stone-800 rounded-2xl focus:outline-none focus:ring-4 focus:ring-amber-500/20 focus:border-amber-500 text-stone-100 text-base md:text-lg leading-relaxed placeholder-stone-600 resize-none bg-stone-900"></textarea>
      </div>

      <!-- 儲存按鈕 -->
      <button onclick="saveDiary()" class="w-full bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold py-3 md:py-4 rounded-2xl transition duration-200 shadow-md text-lg md:text-xl flex items-center justify-center gap-2 md:gap-3">
        <i class="fa-solid fa-pen-nib"></i> 儲存並同步至 Google 雲端
      </button>
    </section>

    <!-- 歷史日記列表 -->
    <section>
      <div class="flex items-center justify-between mb-3 md:mb-4 px-2">
        <h2 class="text-lg md:text-xl font-bold text-stone-200 flex items-center gap-2">
          <span>🌸</span> 歷史隨筆紀錄
        </h2>
        <span id="diary-count" class="text-xs md:text-sm font-medium text-stone-400">共 0 篇</span>
      </div>

      <div id="diary-list" class="space-y-3 md:space-y-4">
        <!-- 內容由 JS 產生 -->
      </div>
    </section>

  </main>

  <script>
    const CLIENT_ID = '733896891104-14rpscprtqc0n1jdsdg5h5pva2k7e9kt.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/drive.file';

    let tokenClient;
    let accessToken = localStorage.getItem('myezlife_access_token') || null;
    let selectedMood = { emoji: '🌿', label: '平靜' };
    const todayStr = new Date().toISOString().split('T')[0];
    let cloudDiaries = {}; 
    const FOLDER_NAME = 'myezlife_diaries';
    let folderId = null;

    window.onload = function() {
      document.getElementById('current-date-display').innerText = `📅 ${todayStr}`;
      selectMood('🌿', '平靜');
      loadDiaries();
      
      // 檢查是否已有暫存 Token，若有直接標記已連動並嘗試抓取雲端資料
      if (accessToken) {
        document.getElementById('sync-btn-text').innerText = '已連動 Google 雲端';
        document.getElementById('sync-btn').classList.add('bg-emerald-950', 'border-emerald-500', 'text-emerald-300');
        initDriveAfterAuth();
      }

      // 初始化 GIS
      gisLoaded();
    }

    function gisLoaded() {
      if (typeof google !== 'undefined' && google.accounts) {
        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: CLIENT_ID,
          scope: SCOPES,
          callback: async (resp) => {
            if (resp.error !== undefined) {
              console.error('Google 授權失敗:', resp.error);
              alert('連動失敗：' + resp.error);
              return;
            }
            accessToken = resp.access_token;
            localStorage.setItem('myezlife_access_token', accessToken); // 記住 Token 避免重複彈窗
            
            document.getElementById('sync-btn-text').innerText = '已連動 Google 雲端';
            document.getElementById('sync-btn').classList.add('bg-emerald-950', 'border-emerald-500', 'text-emerald-300');
            
            await initDriveAfterAuth();
          },
        });
      }
    }

    function handleAuthClick() {
      if (!tokenClient) {
        gisLoaded();
      }
      if (tokenClient) {
        // 強制跳出帳戶選擇對話框，避開部分瀏覽器的快取與 COOP 阻擋
        tokenClient.requestAccessToken({ prompt: 'select_account' });
      } else {
        alert('Google 登入元件載入中，請稍候 2 秒再點一次！');
      }
    }

    async function initDriveAfterAuth() {
      await getOrCreateFolderId();
      await fetchDiariesFromDrive();
    }

    function selectMood(emoji, label) {
      selectedMood = { emoji, label };
      document.querySelectorAll('.mood-btn').forEach(btn => {
        if (btn.getAttribute('data-mood') === emoji) {
          btn.classList.add('border-amber-400', 'bg-stone-800', 'ring-2', 'ring-amber-400/50');
          btn.classList.remove('border-stone-800', 'bg-stone-900');
        } else {
          btn.classList.remove('border-amber-400', 'bg-stone-800', 'ring-2', 'ring-amber-400/50');
          btn.classList.add('border-stone-800', 'bg-stone-900');
        }
      });
    }

    async function getOrCreateFolderId() {
      if (folderId) return folderId;
      try {
        const searchRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=name='${FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`, {
          headers: new Headers({ 'Authorization': 'Bearer ' + accessToken })
        });
        
        if (searchRes.status === 401) {
          // Token 過期或失效
          localStorage.removeItem('myezlife_access_token');
          accessToken = null;
          document.getElementById('sync-btn-text').innerText = '連動 Google 雲端';
          document.getElementById('sync-btn').classList.remove('bg-emerald-950', 'border-emerald-500', 'text-emerald-300');
          alert('Google 授權已過期，請重新點擊「連動 Google 雲端」！');
          return null;
        }

        const searchResult = await searchRes.json();

        if (searchResult.files && searchResult.files.length > 0) {
          folderId = searchResult.files[0].id;
        } else {
          const createRes = await fetch('https://www.googleapis.com/drive/v3/files', {
            method: 'POST',
            headers: new Headers({
              'Authorization': 'Bearer ' + accessToken,
              'Content-Type': 'application/json'
            }),
            body: JSON.stringify({
              name: FOLDER_NAME,
              mimeType: 'application/vnd.google-apps.folder'
            })
          });
          const folderData = await createRes.json();
          folderId = folderData.id;
        }
      } catch (e) {
        console.error('取得或建立資料夾失敗:', e);
      }
      return folderId;
    }

    async function saveDiary() {
      const text = document.getElementById('diary-input').value.trim();
      if (!text) {
        alert('請先輸入一些日記內容喔！');
        return;
      }

      const diaryData = {
        date: todayStr,
        mood: selectedMood.emoji,
        moodLabel: selectedMood.label,
        content: text,
        updatedAt: new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' })
      };

      const diaries = getStoredDiaries();
      diaries[todayStr] = diaryData;
      localStorage.setItem('myezlife_diaries', JSON.stringify(diaries));
      
      document.getElementById('diary-input').value = '';
      loadDiaries();

      if (accessToken) {
        await uploadToGoogleDrive(todayStr, diaryData);
      } else {
        alert('日記已存於本地。請點擊右上角「連動 Google 雲端」進行雲端同步！');
      }
    }

    function getStoredDiaries() {
      const localData = localStorage.getItem('myezlife_diaries');
      const localDiaries = localData ? JSON.parse(localData) : {};
      return { ...localDiaries, ...cloudDiaries };
    }

    async function fetchDiariesFromDrive() {
      try {
        const fId = await getOrCreateFolderId();
        if (!fId) return;

        const response = await fetch(`https://www.googleapis.com/drive/v3/files?q='${fId}' in parents and trashed=false`, {
          method: 'GET',
          headers: new Headers({ 'Authorization': 'Bearer ' + accessToken })
        });
        const result = await response.json();
        
        if (result.files && result.files.length > 0) {
          cloudDiaries = {};
          for (let file of result.files) {
            const fileContentRes = await fetch(`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`, {
              headers: new Headers({ 'Authorization': 'Bearer ' + accessToken })
            });
            const diaryJson = await fileContentRes.json();
            if (diaryJson && diaryJson.date) {
              cloudDiaries[diaryJson.date] = diaryJson;
            }
          }
          loadDiaries();
        }
      } catch (error) {
        console.error('從雲端讀取日記失敗:', error);
      }
    }

    async function uploadToGoogleDrive(date, diaryData) {
      try {
        const fId = await getOrCreateFolderId();
        if (!fId) {
          alert('無法取得雲端資料夾，請重新點擊「連動 Google 雲端」！');
          return;
        }

        const queryRes = await fetch(`https://www.googleapis.com/drive/v3/files?q='${fId}' in parents and name='${date}.json' and trashed=false`, {
          headers: new Headers({ 'Authorization': 'Bearer ' + accessToken })
        });
        const queryResult = await queryRes.json();

        let fileId = null;
        if (queryResult.files && queryResult.files.length > 0) {
          fileId = queryResult.files[0].id;
        }

        const fileContent = JSON.stringify(diaryData, null, 2);

        if (!fileId) {
          const createRes = await fetch('https://www.googleapis.com/drive/v3/files', {
            method: 'POST',
            headers: new Headers({
              'Authorization': 'Bearer ' + accessToken,
              'Content-Type': 'application/json'
            }),
            body: JSON.stringify({
              name: `${date}.json`,
              mimeType: 'application/json',
              parents: [fId]
            })
          });
          const newFile = await createRes.json();
          fileId = newFile.id;
        }

        const uploadRes = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
          method: 'PATCH',
          headers: new Headers({
            'Authorization': 'Bearer ' + accessToken,
            'Content-Type': 'application/json'
          }),
          body: fileContent
        });

        if (uploadRes.ok) {
          // 成功寫入雲端！
        } else {
          const errText = await uploadRes.text();
          console.error('檔案內容寫入失敗:', errText);
        }

      } catch (error) {
        console.error('同步至 Google 雲端發生錯誤:', error);
      }
    }

    function deleteDiary(date) {
      if (confirm(`確定要刪除 ${date} 的日記嗎？`)) {
        const diaries = getStoredDiaries();
        delete diaries[date];
        delete cloudDiaries[date];
        localStorage.setItem('myezlife_diaries', JSON.stringify(diaries));
        loadDiaries();
      }
    }

    function loadDiaries() {
      const diaries = getStoredDiaries();
      const listContainer = document.getElementById('diary-list');
      const dates = Object.keys(diaries).sort().reverse();

      document.getElementById('diary-count').innerText = `共 ${dates.length} 篇`;

      if (dates.length === 0) {
        listContainer.innerHTML = `
          <div class="text-center py-10 md:py-12 bg-stone-950 rounded-2xl md:rounded-3xl border-2 border-dashed border-stone-800">
            <span class="text-3xl md:text-4xl block mb-3">🍃</span>
            <p class="text-sm md:text-base text-stone-400 font-medium">目前還沒有紀錄，寫下第一篇日記吧！</p>
          </div>
        `;
        return;
      }

      listContainer.innerHTML = dates.map(date => {
        const item = diaries[date];
        return `
          <div class="bg-stone-950 p-4 md:p-6 rounded-2xl md:rounded-3xl border border-stone-800 shadow-md">
            <div class="flex justify-between items-start mb-3">
              <div class="flex items-center gap-2 md:gap-3">
                <span class="text-2xl md:text-3xl">${item.mood}</span>
                <div>
                  <span class="font-bold text-stone-100 text-base md:text-lg">${item.date}</span>
                  <span class="text-xs md:text-sm font-semibold text-amber-300 bg-amber-950/60 border border-amber-800/40 px-2 py-0.5 rounded-lg ml-2">${item.moodLabel}</span>
                </div>
              </div>
              <div class="flex items-center gap-2 md:gap-3">
                <span class="text-xs md:text-sm text-stone-500">${item.updatedAt || ''}</span>
                <button onclick="deleteDiary('${item.date}')" class="text-stone-500 hover:text-rose-400 text-sm md:text-base p-2 transition" title="刪除">
                  <i class="fa-regular fa-trash-can"></i>
                </button>
              </div>
            </div>
            <p class="text-stone-300 text-base md:text-lg leading-relaxed whitespace-pre-wrap pl-9 md:pl-12">${escapeHtml(item.content)}</p>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
