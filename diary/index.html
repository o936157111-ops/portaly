<script>
    const CLIENT_ID = '733896891104-14rpscprtqc0n1jdsdg5h5pva2k7e9kt.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/drive.file';

    let tokenClient;
    let accessToken = null;
    let selectedMood = { emoji: '🌿', label: '平靜' };
    const todayStr = new Date().toISOString().split('T')[0];
    let cloudDiaries = {}; 
    const FOLDER_NAME = 'myezlife_diaries';
    let folderId = null;

    window.onload = function() {
      document.getElementById('current-date-display').innerText = `📅 ${todayStr}`;
      selectMood('🌿', '平靜');
      loadDiaries(); // 先讀取本機快取
      
      if (typeof gapi !== 'undefined') {
        gapi.load('client', initializeGapiClient);
      }
    }

    async function initializeGapiClient() {
      await gapi.client.init({
        discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'],
      });
    }

    function gisLoaded() {
      if (typeof google !== 'undefined' && google.accounts) {
        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: CLIENT_ID,
          scope: SCOPES,
          callback: async (resp) => {
            if (resp.error !== undefined) {
              console.error('Google 授權失敗:', resp.error);
              alert('連動失敗：' + resp.error);
              return;
            }
            accessToken = resp.access_token;
            document.getElementById('sync-btn-text').innerText = '已連動 Google 雲端';
            document.getElementById('sync-btn').classList.add('bg-emerald-950', 'border-emerald-500', 'text-emerald-300');
            
            // 授權成功後，取得資料夾並下載雲端日記
            await getOrCreateFolderId();
            await fetchDiariesFromDrive();
          },
        });
      }
    }

    function handleAuthClick() {
      if (!tokenClient) {
        gisLoaded();
      }
      if (tokenClient) {
        tokenClient.requestAccessToken({ prompt: 'consent' });
      } else {
        alert('Google 登入元件尚未載入完成，請稍候再試一次！');
      }
    }

    function selectMood(emoji, label) {
      selectedMood = { emoji, label };
      document.querySelectorAll('.mood-btn').forEach(btn => {
        if (btn.getAttribute('data-mood') === emoji) {
          btn.classList.add('border-amber-400', 'bg-stone-800', 'ring-2', 'ring-amber-400/50');
          btn.classList.remove('border-stone-800', 'bg-stone-900');
        } else {
          btn.classList.remove('border-amber-400', 'bg-stone-800', 'ring-2', 'ring-amber-400/50');
          btn.classList.add('border-stone-800', 'bg-stone-900');
        }
      });
    }

    // 取得或建立雲端專屬資料夾 ID
    async function getOrCreateFolderId() {
      if (folderId) return folderId;
      try {
        const searchRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=name='${FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`, {
          headers: new Headers({ 'Authorization': 'Bearer ' + accessToken })
        });
        const searchResult = await searchRes.json();

        if (searchResult.files && searchResult.files.length > 0) {
          folderId = searchResult.files[0].id;
        } else {
          // 建立 myezlife_diaries 資料夾
          const createRes = await fetch('https://www.googleapis.com/drive/v3/files', {
            method: 'POST',
            headers: new Headers({
              'Authorization': 'Bearer ' + accessToken,
              'Content-Type': 'application/json'
            }),
            body: JSON.stringify({
              name: FOLDER_NAME,
              mimeType: 'application/vnd.google-apps.folder'
            })
          });
          const folderData = await createRes.json();
          folderId = folderData.id;
        }
      } catch (e) {
        console.error('取得或建立資料夾失敗:', e);
      }
      return folderId;
    }

    // 儲存日記
    async function saveDiary() {
      const text = document.getElementById('diary-input').value.trim();
      if (!text) {
        alert('請先輸入一些日記內容喔！');
        return;
      }

      const diaryData = {
        date: todayStr,
        mood: selectedMood.emoji,
        moodLabel: selectedMood.label,
        content: text,
        updatedAt: new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' })
      };

      // 1. 本機快取備份
      const diaries = getStoredDiaries();
      diaries[todayStr] = diaryData;
      localStorage.setItem('myezlife_diaries', JSON.stringify(diaries));
      
      document.getElementById('diary-input').value = '';
      loadDiaries();

      // 2. 上傳至 Google 雲端專屬資料夾
      if (accessToken) {
        await uploadToGoogleDrive(todayStr, diaryData);
      } else {
        alert('日記已存於本地。請點擊右上角「連動 Google 雲端」進行備份！');
      }
    }

    function getStoredDiaries() {
      const localData = localStorage.getItem('myezlife_diaries');
      const localDiaries = localData ? JSON.parse(localData) : {};
      return { ...localDiaries, ...cloudDiaries };
    }

    // 下載專屬資料夾內的所有日記 JSON 檔案
    async function fetchDiariesFromDrive() {
      try {
        const fId = await getOrCreateFolderId();
        if (!fId) return;

        const response = await fetch(`https://www.googleapis.com/drive/v3/files?q='${fId}' in parents and trashed=false`, {
          method: 'GET',
          headers: new Headers({ 'Authorization': 'Bearer ' + accessToken })
        });
        const result = await response.json();
        
        if (result.files && result.files.length > 0) {
          cloudDiaries = {};
          for (let file of result.files) {
            const fileContentRes = await fetch(`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`, {
              headers: new Headers({ 'Authorization': 'Bearer ' + accessToken })
            });
            const diaryJson = await fileContentRes.json();
            if (diaryJson && diaryJson.date) {
              cloudDiaries[diaryJson.date] = diaryJson;
            }
          }
          loadDiaries();
          alert('已成功從雲端專屬資料夾同步歷史日記！');
        }
      } catch (error) {
        console.error('從雲端讀取日記失敗:', error);
      }
    }

    // 精準上傳日記檔案至 myezlife_diaries 資料夾
    async function uploadToGoogleDrive(date, diaryData) {
      try {
        const fId = await getOrCreateFolderId();
        if (!fId) {
          alert('無法取得雲端資料夾 ID，請重新連動！');
          return;
        }

        // 搜尋資料夾內是否已存在今天的檔案
        const queryRes = await fetch(`https://www.googleapis.com/drive/v3/files?q='${fId}' in parents and name='${date}.json' and trashed=false`, {
          headers: new Headers({ 'Authorization': 'Bearer ' + accessToken })
        });
        const queryResult = await queryRes.json();

        let fileId = null;
        if (queryResult.files && queryResult.files.length > 0) {
          fileId = queryResult.files[0].id;
        }

        const fileContent = JSON.stringify(diaryData, null, 2);

        if (!fileId) {
          // 步驟 1: 先在專屬資料夾建立檔案 Metadata
          const createRes = await fetch('https://www.googleapis.com/drive/v3/files', {
            method: 'POST',
            headers: new Headers({
              'Authorization': 'Bearer ' + accessToken,
              'Content-Type': 'application/json'
            }),
            body: JSON.stringify({
              name: `${date}.json`,
              mimeType: 'application/json',
              parents: [fId]
            })
          });
          const newFile = await createRes.json();
          fileId = newFile.id;
        }

        // 步驟 2: 把日記內文寫入這個檔案中
        const uploadRes = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
          method: 'PATCH',
          headers: new Headers({
            'Authorization': 'Bearer ' + accessToken,
            'Content-Type': 'application/json'
          }),
          body: fileContent
        });

        if (uploadRes.ok) {
          alert('日記已成功儲存至 Google 雲端 myezlife_diaries 資料夾！');
        } else {
          const errText = await uploadRes.text();
          console.error('檔案內容寫入失敗:', errText);
          alert('同步失敗，詳情請看 Console');
        }

      } catch (error) {
        console.error('同步至 Google 雲端發生錯誤:', error);
        alert('同步發生錯誤，請看 Console 主控台');
      }
    }

    function deleteDiary(date) {
      if (confirm(`確定要刪除 ${date} 的日記嗎？`)) {
        const diaries = getStoredDiaries();
        delete diaries[date];
        delete cloudDiaries[date];
        localStorage.setItem('myezlife_diaries', JSON.stringify(diaries));
        loadDiaries();
      }
    }

    function loadDiaries() {
      const diaries = getStoredDiaries();
      const listContainer = document.getElementById('diary-list');
      const dates = Object.keys(diaries).sort().reverse();

      document.getElementById('diary-count').innerText = `共 ${dates.length} 篇`;

      if (dates.length === 0) {
        listContainer.innerHTML = `
          <div class="text-center py-10 md:py-12 bg-stone-950 rounded-2xl md:rounded-3xl border-2 border-dashed border-stone-800">
            <span class="text-3xl md:text-4xl block mb-3">🍃</span>
            <p class="text-sm md:text-base text-stone-400 font-medium">目前還沒有紀錄，寫下第一篇日記吧！</p>
          </div>
        `;
        return;
      }

      listContainer.innerHTML = dates.map(date => {
        const item = diaries[date];
        return `
          <div class="bg-stone-950 p-4 md:p-6 rounded-2xl md:rounded-3xl border border-stone-800 shadow-md">
            <div class="flex justify-between items-start mb-3">
              <div class="flex items-center gap-2 md:gap-3">
                <span class="text-2xl md:text-3xl">${item.mood}</span>
                <div>
                  <span class="font-bold text-stone-100 text-base md:text-lg">${item.date}</span>
                  <span class="text-xs md:text-sm font-semibold text-amber-300 bg-amber-950/60 border border-amber-800/40 px-2 py-0.5 rounded-lg ml-2">${item.moodLabel}</span>
                </div>
              </div>
              <div class="flex items-center gap-2 md:gap-3">
                <span class="text-xs md:text-sm text-stone-500">${item.updatedAt || ''}</span>
                <button onclick="deleteDiary('${item.date}')" class="text-stone-500 hover:text-rose-400 text-sm md:text-base p-2 transition" title="刪除">
                  <i class="fa-regular fa-trash-can"></i>
                </button>
              </div>
            </div>
            <p class="text-stone-300 text-base md:text-lg leading-relaxed whitespace-pre-wrap pl-9 md:pl-12">${escapeHtml(item.content)}</p>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
