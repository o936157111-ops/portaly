<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全方位熱門焦點情報站</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-dark: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 16px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* 標題與副標題區塊 */
        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        header p {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        /* 頁籤容器：嚴格控制滾動與對齊，避免隨意漂移 */
        .category-scroll-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 4px 16px 12px 16px;
            margin: 0 -16px 20px -16px;
            scrollbar-width: none; /* Firefox 隱藏捲軸 */
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .category-scroll-container::-webkit-scrollbar {
            display: none; /* Chrome, Safari 隱藏捲軸 */
        }

        .category-btn {
            flex: 0 0 auto;
            padding: 10px 18px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid var(--border-color);
            background: #ffffff;
            color: var(--text-secondary);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .category-btn.active {
            background: var(--primary-color);
            color: #ffffff;
            border-color: var(--primary-color);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        /* 電腦版樣式優化：若螢幕較寬，讓頁籤自動置中並允許換行 */
        @media (min-width: 768px) {
            .category-scroll-container {
                justify-content: center;
                flex-wrap: wrap;
                overflow-x: visible;
                margin: 0 0 20px 0;
                padding: 0;
            }
        }

        /* 卡片主體樣式 */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            padding: 24px;
            margin-bottom: 20px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .media-badge {
            background: #eff6ff;
            color: var(--primary-color);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .exclusive-badge {
            font-size: 0.75rem;
            color: #d97706;
            background: #fef3c7;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
        }

        .headline {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 14px;
            line-height: 1.4;
        }

        .section-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-top: 16px;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .content-box {
            font-size: 0.95rem;
            color: #334155;
            margin-bottom: 12px;
            background: #f8fafc;
            padding: 14px;
            border-radius: 8px;
            border-left: 4px solid var(--primary-color);
        }

        /* 摘要收合按鈕與內容 */
        .summary-container {
            margin-top: 16px;
            border-top: 1px dashed var(--border-color);
            padding-top: 12px;
        }

        .toggle-summary-btn {
            background: none;
            border: none;
            color: var(--primary-color);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 0;
        }

        .summary-content {
            margin-top: 10px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            background: #f8fafc;
            padding: 14px;
            border-radius: 8px;
            display: none;
        }

        .summary-content.show {
            display: block;
        }

        /* Google 相關新聞搜尋按鈕 */
        .external-link-container {
            margin-top: 20px;
            text-align: center;
        }

        .btn-link {
            display: inline-block;
            background: var(--primary-color);
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-link:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .loading, .error-msg {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            font-size: 0.95rem;
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .error-msg {
            color: #ef4444;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🔥 全方位熱門焦點情報站</h1>
        <p id="headerSubtitle">科技新聞與趨勢每日自動彙整</p>
    </header>

    <!-- 焦點新聞頁籤選單 -->
    <div class="category-scroll-container" id="tabContainer">
        <!-- 動態生成頁籤 -->
    </div>

    <!-- 新聞資訊卡片呈現區 -->
    <div id="newsCardContainer">
        <div class="loading">正在讀取最新情報資料...</div>
    </div>
</div>

<script>
    let newsData = {
        date: "",
        category: "",
        total_articles: 0,
        articles: []
    };

    let currentArticleId = 1;

    // 頁面載入時抓取新聞 JSON 並初始化
    window.addEventListener('DOMContentLoaded', async () => {
        try {
            const response = await fetch('news.json');
            if (!response.ok) throw new Error('無法讀取 news.json');
            newsData = await response.json();
            
            initNewsApp();
        } catch (error) {
            document.getElementById('newsCardContainer').innerHTML = `
                <div class="error-msg">
                    ⚠️ 尚無解析資料（news.json）或格式錯誤。<br>
                    請確認您的 news.json 檔案已成功更新且路徑正確！
                </div>
            `;
        }
    });

    // 初始化應用程式與頁籤選項
    function initNewsApp() {
        const tabContainer = document.getElementById('tabContainer');
        tabContainer.innerHTML = '';

        const subtitle = document.getElementById('headerSubtitle');
        if (subtitle) {
            subtitle.textContent = `${newsData.category || '科技新聞'}（更新日期：${newsData.date || '今日'}）`;
        }

        if (newsData.articles && Array.isArray(newsData.articles) && newsData.articles.length > 0) {
            newsData.articles.forEach((article, index) => {
                const btn = document.createElement('button');
                btn.className = `category-btn ${index === 0 ? 'active' : ''}`;
                btn.id = `tab-${article.id}`;
                btn.textContent = `[${article.source}] ${article.category}`;
                btn.onclick = () => switchArticle(article.id);
                tabContainer.appendChild(btn);
            });

            // 預設顯示第一篇
            currentArticleId = newsData.articles[0].id;
            renderSelectedNews(currentArticleId);
        }
    }

    // 切換文章頁籤，精確將被點擊的頁籤置中對齊
    function switchArticle(articleId) {
        currentArticleId = articleId;

        // 更新頁籤按鈕樣式
        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        const activeBtn = document.getElementById(`tab-${articleId}`);
        if (activeBtn) {
            activeBtn.classList.add('active');
            
            // 精確計算並置中滾動位置
            const container = document.getElementById('tabContainer');
            const scrollLeft = activeBtn.offsetLeft - (container.offsetWidth / 2) + (activeBtn.offsetWidth / 2);
            container.scrollTo({
                left: scrollLeft,
                behavior: 'smooth'
            });
        }

        renderSelectedNews(articleId);
    }

    // 渲染指定 ID 的新聞內容（採用 Google 智慧搜尋連結，徹底解決 404）
    function renderSelectedNews(articleId) {
        const container = document.getElementById('newsCardContainer');
        if (!newsData.articles) return;

        const item = newsData.articles.find(art => art.id === articleId);

        if (!item) {
            container.innerHTML = `<div class="error-msg">目前該則新聞尚無詳細資料。</div>`;
            return;
        }

        // 建立 Google 關鍵字搜尋連結
        const googleSearchUrl = `https://www.google.com/search?q=${encodeURIComponent(item.title)}`;

        container.innerHTML = `
            <div class="card">
                <div class="card-header">
                    <span class="media-badge">來源：${item.source || '專業媒體'}</span>
                    <span class="exclusive-badge">視角分類：${item.category || '焦點透鏡'}</span>
                </div>
                
                <h2 class="headline">${item.title || '無標題'}</h2>
                
                <div class="section-title">💡 內容摘要</div>
                <div class="content-box">${item.summary || '暫無摘要'}</div>

                <div class="summary-container">
                    <button class="toggle-summary-btn" onclick="toggleSummary(this)">
                        <span>▶ 展開詳細焦點摘要與引文</span>
                    </button>
                    <div class="summary-content">
                        <strong>【焦點深度解讀】</strong><br>
                        本則報導由 <strong>${item.source}</strong> 提供，針對「${item.title}」進行即時追蹤。助您快速掌握事件核心脈絡與產業趨勢。<br><br>
                        <em>原始摘要內容：</em>${item.summary}
                    </div>
                </div>

                <div class="external-link-container">
                    <a href="${googleSearchUrl}" target="_blank" class="btn-link">🔍 Google 相關新聞搜尋 ↗</a>
                </div>
            </div>
        `;
    }

    // 展開/收合摘要內文功能
    function toggleSummary(btn) {
        const content = btn.nextElementSibling;
        const isShown = content.classList.contains('show');
        
        if (isShown) {
            content.classList.remove('show');
            btn.querySelector('span').textContent = '▶ 展開詳細焦點摘要與引文';
        } else {
            content.classList.add('show');
            btn.querySelector('span').textContent = '▼ 收合詳細焦點摘要與引文';
        }
    }
</script>

</body>
</html>
