<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>焦點議題多元視角觀測站 | 新聞透鏡：多維度事件解析</title>
    <style>
        :root {
            --primary-color: #334155;
            --accent-blue: #2563eb;
            --accent-green: #0d9488;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 16px;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 1.35rem;
            color: var(--primary-color);
            margin-bottom: 6px;
            white-space: nowrap;
        }

        @media (min-width: 480px) {
            header h1 {
                font-size: 1.6rem;
            }
        }

        header p {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        /* 簡潔的焦點頁籤：三顆按鈕平分一列，不滑動 */
        .event-tabs {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
        }

        .event-tab-btn {
            flex: 1;
            max-width: 150px;
            padding: 10px 12px;
            font-size: 0.95rem;
            font-weight: 600;
            border: 1px solid var(--border-color);
            background: #ffffff;
            color: var(--text-secondary);
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .event-tab-btn.active {
            background: var(--accent-blue);
            color: #ffffff;
            border-color: var(--accent-blue);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        /* 主卡片區域 */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            padding: 24px;
            margin-bottom: 20px;
        }

        .event-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .section-box {
            background: #f1f5f9;
            border-left: 4px solid var(--accent-blue);
            padding: 12px 16px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .section-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* 多方視角比較網格 */
        .perspectives-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        @media (min-width: 768px) {
            .perspectives-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .perspective-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .perspective-header {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--accent-blue);
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
        }

        .perspective-content {
            font-size: 0.85rem;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .angle-note {
            font-size: 0.82rem;
            color: #475569;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 6px;
            margin-top: 6px;
            margin-bottom: 12px;
        }

        .perspective-link {
            text-align: center;
            margin-top: auto;
        }

        .btn-mini-link {
            display: inline-block;
            background: #f1f5f9;
            color: var(--accent-blue);
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-mini-link:hover {
            background: var(--accent-blue);
            color: #ffffff;
            border-color: var(--accent-blue);
        }

        .neutral-conclusion {
            background: #f0fdf4;
            border-left: 4px solid var(--accent-green);
            padding: 12px 16px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 16px;
            font-size: 0.95rem;
        }

        .loading, .error-msg {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .error-msg {
            color: #ef4444;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>焦點議題多元視角觀測站</h1>
        <p>新聞透鏡：多維度事件解析</p>
    </header>

    <!-- 簡潔的三個焦點頁籤按鈕 -->
    <div class="event-tabs" id="eventTabsContainer">
        <div class="loading">正在載入頁籤...</div>
    </div>

    <!-- 事件比對卡片呈現區 -->
    <div id="eventCardContainer">
        <div class="loading">正在載入多維度解析資料...</div>
    </div>
</div>

<script>
    let eventsData = [];
    let currentEventIndex = 0;

    window.addEventListener('DOMContentLoaded', async () => {
        try {
            const response = await fetch('news.json');
            if (!response.ok) throw new Error('無法讀取新聞資料');
            const data = await response.json();
            
            if (data.events && Array.isArray(data.events)) {
                eventsData = data.events;
            } else if (Array.isArray(data)) {
                eventsData = data;
            } else {
                throw new Error('資料格式不符');
            }

            if (eventsData.length === 0) throw new Error('事件清單為空');

            renderEventTabs();
            renderEventCard(0);
        } catch (error) {
            console.error(error);
            document.getElementById('eventTabsContainer').innerHTML = '';
            document.getElementById('eventCardContainer').innerHTML = `
                <div class="error-msg">
                    ⚠️ 尚無解析資料（news.json）或格式錯誤。<br>
                    請確認您的 news.json 檔案存在且格式正確！
                </div>
            `;
        }
    });

    function renderEventTabs() {
        const tabsContainer = document.getElementById('eventTabsContainer');
        tabsContainer.innerHTML = '';

        eventsData.forEach((evt, index) => {
            const btn = document.createElement('button');
            btn.className = `event-tab-btn ${index === 0 ? 'active' : ''}`;
            btn.textContent = `焦點 ${index + 1}`;
            btn.onclick = () => switchEvent(index);
            tabsContainer.appendChild(btn);
        });
    }

    function switchEvent(index) {
        currentEventIndex = index;
        
        const buttons = document.querySelectorAll('.event-tabs button');
        buttons.forEach((b, idx) => {
            b.classList.toggle('active', idx === index);
        });

        renderEventCard(index);
    }

    function renderEventCard(index) {
        const evt = eventsData[index];
        const container = document.getElementById('eventCardContainer');

        if (!evt) return;

        let perspectivesHtml = '';
        if (evt.perspectives && Array.isArray(evt.perspectives)) {
            evt.perspectives.forEach(p => {
                const queryText = p.searchQuery || `${evt.eventTitle} ${p.groupName}`;
                const searchUrl = `https://www.google.com/search?q=${encodeURIComponent(queryText)}&hl=zh-TW`;

                perspectivesHtml += `
                    <div class="perspective-card">
                        <div>
                            <div class="perspective-header">${p.groupName || '多元視角'}</div>
                            <div class="perspective-content"><strong>主要聚焦：</strong>${p.focus || ''}</div>
                            <div class="angle-note"><strong>💡 延伸視角：</strong>${p.blindspot || ''}</div>
                        </div>
                        <div class="perspective-link">
                            <a href="${searchUrl}" target="_blank" class="btn-mini-link">Google 即時檢索 ↗</a>
                        </div>
                    </div>
                `;
            });
        }

        container.innerHTML = `
            <div class="card">
                <h2 class="event-title">${evt.eventTitle || '未命名事件'}</h2>
                
                <div class="section-box">
                    <div class="section-title">📌 事件核心與客觀背景</div>
                    <div>${evt.coreFacts || ''}</div>
                </div>

                <div class="section-title" style="margin-bottom: 10px;">🔍 多元視角觀點與切入面比較</div>
                <div class="perspectives-grid">
                    ${perspectivesHtml}
                </div>

                <div class="neutral-conclusion">
                    <div class="section-title" style="color: var(--accent-green);">💡 綜合觀點與事件本質解析</div>
                    <div>${evt.neutralSummary || ''}</div>
                </div>
            </div>
        `;
    }
</script>

</body>
</html>
