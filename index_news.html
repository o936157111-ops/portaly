<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>焦點議題多元視角觀測站 | News Perspectives</title>
    <style>
        :root {
            --primary-color: #334155;
            --accent-blue: #2563eb;
            --accent-green: #0d9488;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 16px;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 1.6rem;
            color: var(--primary-color);
            margin-bottom: 6px;
        }

        header p {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        /* 事件頁籤選單 */
        .event-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }

        .event-tab-btn {
            flex: 0 0 auto;
            padding: 10px 18px;
            font-size: 0.95rem;
            font-weight: 600;
            border: 1px solid var(--border-color);
            background: #ffffff;
            color: var(--text-secondary);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .event-tab-btn.active {
            background: var(--accent-blue);
            color: #ffffff;
            border-color: var(--accent-blue);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        /* 主卡片區域 */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            padding: 24px;
            margin-bottom: 20px;
        }

        .event-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .section-box {
            background: #f1f5f9;
            border-left: 4px solid var(--accent-blue);
            padding: 12px 16px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .section-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* 多方視角比較網格 */
        .perspectives-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        @media (min-width: 768px) {
            .perspectives-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .perspective-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .perspective-header {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--accent-blue);
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
        }

        .perspective-content {
            font-size: 0.85rem;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .angle-note {
            font-size: 0.82rem;
            color: #475569;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 6px;
            margin-top: 6px;
        }

        .neutral-conclusion {
            background: #f0fdf4;
            border-left: 4px solid var(--accent-green);
            padding: 12px 16px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 16px;
            font-size: 0.95rem;
        }

        .external-link-container {
            text-align: center;
            margin-top: 16px;
        }

        .btn-link {
            display: inline-block;
            background: var(--accent-blue);
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-link:hover {
            background: #1d4ed8;
        }

        .loading, .error-msg {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .error-msg {
            color: #ef4444;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>焦點議題多元視角觀測站</h1>
        <p>新聞透鏡：多維度事件解析</p>
    </header>

    <!-- 事件切換頁籤 -->
    <div class="event-tabs" id="eventTabsContainer">
        <!-- 動態產生事件按鈕 -->
    </div>

    <!-- 事件比對卡片呈現區 -->
    <div id="eventCardContainer">
        <div class="loading">正在載入重大事件多維解析資料...</div>
    </div>
</div>

<script>
    let eventsData = [];
    let currentEventIndex = 0;

    window.addEventListener('DOMContentLoaded', async () => {
        try {
            const response = await fetch('news.json');
            if (!response.ok) throw new Error('無法讀取新聞資料');
            const data = await response.json();
            
            eventsData = data.events || [];
            if (eventsData.length === 0) throw new Error('資料格式不符');

            renderEventTabs();
            renderEventCard(0);
        } catch (error) {
            document.getElementById('eventCardContainer').innerHTML = `
                <div class="error-msg">
                    ⚠️ 尚無解析資料（news.json）。<br>
                    請確認後端腳本已更新並完成執行！
                </div>
            `;
        }
    });

    function renderEventTabs() {
        const tabsContainer = document.getElementById('eventTabsContainer');
        tabsContainer.innerHTML = '';

        eventsData.forEach((evt, index) => {
            const btn = document.createElement('button');
            btn.className = `event-tab-btn ${index === 0 ? 'active' : ''}`;
            btn.textContent = `焦點事件 ${index + 1}：${evt.eventTitle.substring(0, 10)}...`;
            btn.onclick = () => switchEvent(index);
            tabsContainer.appendChild(btn);
        });
    }

    function switchEvent(index) {
        currentEventIndex = index;
        document.querySelectorAll('.event-tab-btn').forEach((b, idx) => {
            b.classList.toggle('active', idx === index);
        });
        renderEventCard(index);
    }

    function renderEventCard(index) {
        const evt = eventsData[index];
        const container = document.getElementById('eventCardContainer');

        let perspectivesHtml = '';
        if (evt.perspectives && Array.isArray(evt.perspectives)) {
            evt.perspectives.forEach(p => {
                perspectivesHtml += `
                    <div class="perspective-card">
                        <div>
                            <div class="perspective-header">${p.groupName}</div>
                            <div class="perspective-content"><strong>主要聚焦：</strong>${p.focus}</div>
                        </div>
                        <div class="angle-note"><strong>💡 延伸視角與側重點：</strong>${p.blindspot}</div>
                    </div>
                `;
            });
        }

        container.innerHTML = `
            <div class="card">
                <h2 class="event-title">${evt.eventTitle}</h2>
                
                <div class="section-box">
                    <div class="section-title">📌 事件核心與客觀背景</div>
                    <div>${evt.coreFacts}</div>
                </div>

                <div class="section-title" style="margin-bottom: 10px;">🔍 多元媒體觀點與切入面比較</div>
                <div class="perspectives-grid">
                    ${perspectivesHtml}
                </div>

                <div class="neutral-conclusion">
                    <div class="section-title" style="color: var(--accent-green);">💡 綜合觀點與事件本質解析</div>
                    <div>${evt.neutralSummary}</div>
                </div>

                <div class="external-link-container">
                    <a href="${evt.referenceUrl || '#'}" target="_blank" class="btn-link">前往閱讀代表性新聞 ↗</a>
                </div>
            </div>
        `;
    }
</script>

</body>
</html>
