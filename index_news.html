<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全方位熱門焦點情報站</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-dark: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --accent-gradient: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 16px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        header p {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        /* 五大主題頁籤選單列 */
        .category-scroll-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 16px;
            scrollbar-width: none; /* Firefox */
        }

        .category-scroll-container::-webkit-scrollbar {
            display: none; /* Chrome, Safari */
        }

        .category-btn {
            flex: 0 0 auto;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid var(--border-color);
            background: #ffffff;
            color: var(--text-secondary);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .category-btn.active {
            background: var(--primary-color);
            color: #ffffff;
            border-color: var(--primary-color);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        /* 媒體下拉選單區 */
        .media-select-container {
            margin-bottom: 20px;
        }

        .media-select-container label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        select {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #ffffff;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--primary-color);
        }

        /* 卡片主體樣式 */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            padding: 20px;
            margin-bottom: 20px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .media-badge {
            background: #eff6ff;
            color: var(--primary-color);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .exclusive-badge {
            font-size: 0.75rem;
            color: #d97706;
            background: #fef3c7;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .headline {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .section-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-top: 14px;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .content-box {
            font-size: 0.95rem;
            color: #334155;
            margin-bottom: 10px;
        }

        /* 跨媒體視角表格 */
        .diff-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .diff-table th, .diff-table td {
            border: 1px solid var(--border-color);
            padding: 8px 10px;
            text-align: left;
        }

        .diff-table th {
            background-color: #f8fafc;
            color: var(--text-secondary);
            font-weight: 600;
        }

        /* 摘要收合按鈕與內容 */
        .summary-container {
            margin-top: 14px;
            border-top: 1px dashed var(--border-color);
            padding-top: 10px;
        }

        .toggle-summary-btn {
            background: none;
            border: none;
            color: var(--primary-color);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 0;
        }

        .summary-content {
            margin-top: 8px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            background: #f8fafc;
            padding: 12px;
            border-radius: 6px;
            display: none;
        }

        .summary-content.show {
            display: block;
        }

        /* 前往原網站按鈕 */
        .external-link-container {
            margin-top: 16px;
            text-align: right;
        }

        .btn-link {
            display: inline-block;
            background: var(--primary-color);
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-link:hover {
            background: var(--primary-dark);
        }

        .loading, .error-msg {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .error-msg {
            color: #ef4444;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🔥 全方位熱門焦點情報站</h1>
        <p>AI 科技、年底選舉、健康養生、旅遊攻略、賺錢流量每日自動彙整</p>
    </header>

    <!-- 五大熱門主題頁籤列 -->
    <div class="category-scroll-container">
        <button class="category-btn active" onclick="switchCategory('ai')" id="cat-ai">🤖 AI 科技熱話</button>
        <button class="category-btn" onclick="switchCategory('politics')" id="cat-politics">🗳️ 年底選舉政治</button>
        <button class="category-btn" onclick="switchCategory('health')" id="cat-health">🍎 健康保健養生</button>
        <button class="category-btn" onclick="switchCategory('travel')" id="cat-travel">✈️ 旅遊休閒攻略</button>
        <button class="category-btn" onclick="switchCategory('wealth')" id="cat-wealth">💰 賺錢流量密碼</button>
    </div>

    <!-- 媒體下拉選單 -->
    <div class="media-select-container">
        <label for="mediaSelect" id="selectLabel">選擇細分媒體來源：</label>
        <select id="mediaSelect" onchange="renderSelectedNews()">
            <!-- 動態生成選項 -->
        </select>
    </div>

    <!-- 新聞資訊卡片呈現區 -->
    <div id="newsCardContainer">
        <div class="loading">正在載入最新情報資料...</div>
    </div>
</div>

<script>
    // 定義五大分類與對應的媒體來源設定
    const categories = {
        ai: {
            name: "AI 科技熱話",
            options: [
                { id: "digitimes", label: "數位時代 (AI 創新)" },
                { id: "futureweb", label: "未來商務 (科技應用)" },
                { id: "ettoday", label: "ETtoday (生活科技)" }
            ]
        },
        politics: {
            name: "年底選舉政治",
            options: [
                { id: "united", label: "聯合報 (政經動態)" },
                { id: "china", label: "中國時報 (選情觀察)" },
                { id: "cti", label: "中天新聞網 (政治焦點)" }
            ]
        },
        health: {
            name: "健康保健養生",
            options: [
                { id: "tvbs", label: "TVBS新聞網 (健康醫療)" },
                { id: "cw", label: "天下雜誌 (生活福祉)" }
            ]
        },
        travel: {
            name: "旅遊休閒攻略",
            options: [
                { id: "freedom", label: "自由時報 (旅遊生活)" },
                { id: "bwnet", label: "商業周刊 (休閒品味)" }
            ]
        },
        wealth: {
            name: "賺錢流量密碼",
            options: [
                { id: "economic", label: "經濟日報 (投資理財)" },
                { id: "commercial", label: "工商時報 (致富商機)" },
                { id: "manager", label: "經理人 (職場加薪)" },
                { id: "hbr", label: "哈佛商業評論 (高階策略)" },
                { id: "twreporter", label: "報導者 (深度調查)" }
            ]
        }
    };

    let currentCategory = 'ai';
    let newsData = {};

    // 頁面載入時抓取新聞 JSON 並初始化
    window.addEventListener('DOMContentLoaded', async () => {
        try {
            const response = await fetch('news.json');
            if (!response.ok) throw new Error('無法讀取新聞資料庫檔案');
            newsData = await response.json();
            switchCategory('ai'); // 預設打開第一個分類
        } catch (error) {
            document.getElementById('newsCardContainer').innerHTML = `
                <div class="error-msg">
                    ⚠️ 尚未讀取到即時新聞資料（news.json）。<br>
                    請確認您的後端更新腳本已執行，或已成功將資料推送到 GitHub！
                </div>
            `;
        }
    });

    // 切換分類頁籤
    function switchCategory(categoryKey) {
        currentCategory = categoryKey;

        // 更新按鈕樣式狀態
        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        const activeBtn = document.getElementById(`cat-${categoryKey}`);
        if (activeBtn) activeBtn.classList.add('active');

        // 更新下拉選單選項
        const selectElement = document.getElementById('mediaSelect');
        selectElement.innerHTML = '';

        const catConfig = categories[categoryKey];
        catConfig.options.forEach(opt => {
            const optionEl = document.createElement('option');
            optionEl.value = opt.id;
            optionEl.textContent = opt.label;
            selectElement.appendChild(optionEl);
        });

        // 渲染對應的第一個媒體新聞卡片
        renderSelectedNews();
    }

    // 渲染當前選定媒體的新聞內容
    function renderSelectedNews() {
        const selectElement = document.getElementById('mediaSelect');
        const selectedMediaId = selectElement.value;
        const container = document.getElementById('newsCardContainer');

        if (!newsData[selectedMediaId]) {
            container.innerHTML = `<div class="error-msg">目前該媒體尚無今日的彙整資料。</div>`;
            return;
        }

        const item = newsData[selectedMediaId];

        // 建立跨媒體視角表格列 HTML
        let tableRowsHtml = '';
        if (item.tableData && Array.isArray(item.tableData)) {
            item.tableData.forEach(row => {
                tableRowsHtml += `
                    <tr>
                        <td style="font-weight:600; width: 30%;">${row.type}</td>
                        <td>${row.angle}</td>
                    </tr>
                `;
            });
        }

        // 組裝卡片 HTML
        container.innerHTML = `
            <div class="card">
                <div class="card-header">
                    <span class="media-badge">${item.name || '焦點媒體'}</span>
                    <span class="exclusive-badge">${item.exclusive || '焦點共振'}</span>
                </div>
                
                <h2 class="headline">${item.headline || '無標題'}</h2>
                
                <div class="section-title">💡 深度解析與大眾解讀</div>
                <div class="content-box">${item.analysis || '暫無解析'}</div>

                <div class="section-title">🔍 跨媒體視角與盲點差異</div>
                <div class="content-box">${item.diffSummary || ''}</div>
                ${tableRowsHtml ? `
                    <table class="diff-table">
                        <thead>
                            <tr>
                                <th>媒體類型</th>
                                <th>切入角度與盲點差異</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tableRowsHtml}
                        </tbody>
                    </table>
                ` : ''}

                <div class="summary-container">
                    <button class="toggle-summary-btn" onclick="toggleSummary(this)">
                        <span>▶ 展開詳細焦點摘要與引文</span>
                    </button>
                    <div class="summary-content">
                        ${item.summaryText || '暫無詳細引文內容。'}
                    </div>
                </div>

                <div class="external-link-container">
                    <a href="${item.url || '#'}" target="_blank" class="btn-link">前往原網站閱讀報導 ↗</a>
                </div>
            </div>
        `;
    }

    // 展開/收合摘要內文功能
    function toggleSummary(btn) {
        const content = btn.nextElementSibling;
        const isShown = content.classList.contains('show');
        
        if (isShown) {
            content.classList.remove('show');
            btn.querySelector('span').textContent = '▶ 展開詳細焦點摘要與引文';
        } else {
            content.classList.add('show');
            btn.querySelector('span').textContent = '▼ 收合詳細焦點摘要與引文';
        }
    }
</script>

</body>
</html>
