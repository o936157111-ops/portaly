<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全方位熱門焦點情報站</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-dark: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --accent-gradient: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 16px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        header p {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        /* 媒體下拉選單區 */
        .media-select-container {
            margin-bottom: 20px;
        }

        .media-select-container label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        select {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #ffffff;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--primary-color);
        }

        /* 卡片主體樣式 */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            padding: 20px;
            margin-bottom: 20px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .media-badge {
            background: #eff6ff;
            color: var(--primary-color);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .exclusive-badge {
            font-size: 0.75rem;
            color: #d97706;
            background: #fef3c7;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .headline {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .section-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-top: 14px;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .content-box {
            font-size: 0.95rem;
            color: #334155;
            margin-bottom: 10px;
        }

        /* 前往原網站按鈕 */
        .external-link-container {
            margin-top: 16px;
            text-align: center;
        }

        .btn-link {
            display: inline-block;
            background: var(--primary-color);
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-link:hover {
            background: var(--primary-dark);
        }

        .loading, .error-msg {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .error-msg {
            color: #ef4444;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🔥 全方位熱門焦點情報站</h1>
        <p id="headerSubtitle">科技新聞與趨勢每日自動彙整</p>
    </header>

    <!-- 媒體/文章下拉選單 -->
    <div class="media-select-container">
        <label for="mediaSelect" id="selectLabel">選擇焦點新聞：</label>
        <select id="mediaSelect" onchange="renderSelectedNews()">
            <!-- 動態生成選項 -->
        </select>
    </div>

    <!-- 新聞資訊卡片呈現區 -->
    <div id="newsCardContainer">
        <div class="loading">正在載入最新情報資料...</div>
    </div>
</div>

<script>
    let newsData = {
        date: "",
        category: "",
        total_articles: 0,
        articles: []
    };

    // 頁面載入時抓取新聞 JSON 並初始化
    window.addEventListener('DOMContentLoaded', async () => {
        try {
            const response = await fetch('news.json');
            if (!response.ok) throw new Error('無法讀取新聞資料庫檔案');
            newsData = await response.json();
            
            // 初始化下拉選單與畫面
            initNewsApp();
        } catch (error) {
            document.getElementById('newsCardContainer').innerHTML = `
                <div class="error-msg">
                    ⚠️ 尚無解析資料（news.json）或格式錯誤。<br>
                    請確認您的 news.json 檔案存在且格式正確！
                </div>
            `;
        }
    });

    // 初始化應用程式與選單選項
    function initNewsApp() {
        const selectElement = document.getElementById('mediaSelect');
        selectElement.innerHTML = '';

        // 更新副標題顯示日期與分類
        const subtitle = document.getElementById('headerSubtitle');
        if (subtitle) {
            subtitle.textContent = `${newsData.category || '科技新聞'}（更新日期：${newsData.date || '今日'}）`;
        }

        // 修改下拉選單提示文字
        const selectLabel = document.getElementById('selectLabel');
        if (selectLabel) {
            selectLabel.textContent = `選擇今日焦點新聞（共 ${newsData.total_articles || 0} 篇）：`;
        }

        // 將 articles 逐一填入下拉選單
        if (newsData.articles && Array.isArray(newsData.articles)) {
            newsData.articles.forEach(article => {
                const optionEl = document.createElement('option');
                optionEl.value = article.id;
                optionEl.textContent = `[${article.source}] ${article.title}`;
                selectElement.appendChild(optionEl);
            });
        }

        // 渲染第一篇新聞
        renderSelectedNews();
    }

    // 渲染當前選定文章的新聞內容
    function renderSelectedNews() {
        const selectElement = document.getElementById('mediaSelect');
        const selectedId = Number(selectElement.value);
        const container = document.getElementById('newsCardContainer');

        if (!newsData.articles) return;

        // 尋找對應 ID 的文章
        const item = newsData.articles.find(art => art.id === selectedId);

        if (!item) {
            container.innerHTML = `<div class="error-msg">目前該新聞尚無詳細資料。</div>`;
            return;
        }

        // 組裝新結構的卡片 HTML
        container.innerHTML = `
            <div class="card">
                <div class="card-header">
                    <span class="media-badge">來源：${item.source || '專業媒體'}</span>
                    <span class="exclusive-badge">分類：${item.category || '科技焦點'}</span>
                </div>
                
                <h2 class="headline">${item.title || '無標題'}</h2>
                
                <div class="section-title">💡 內容摘要</div>
                <div class="content-box">${item.summary || '暫無摘要'}</div>

                <div class="external-link-container">
                    <a href="${item.url || '#'}" target="_blank" class="btn-link">前往原網站閱讀報導 ↗</a>
                </div>
            </div>
        `;
    }
</script>

</body>
</html>
