<script>
    let eventsData = [];
    let currentEventIndex = 0;

    window.addEventListener('DOMContentLoaded', async () => {
        try {
            const response = await fetch('news.json');
            if (!response.ok) throw new Error('無法讀取新聞資料');
            const data = await response.json();
            
            // 兼容各種可能的 JSON 結構（有 events 陣列或直接是陣列）
            if (data.events && Array.isArray(data.events)) {
                eventsData = data.events;
            } else if (Array.isArray(data)) {
                eventsData = data;
            } else {
                throw new Error('資料格式不符');
            }

            if (eventsData.length === 0) throw new Error('事件清單為空');

            renderEventTabs();
            renderEventCard(0);
        } catch (error) {
            console.error(error);
            document.getElementById('eventCardContainer').innerHTML = `
                <div class="error-msg">
                    ⚠️ 載入資料發生錯誤或格式不相符。<br>
                    請確認您的 news.json 檔案格式正確！
                </div>
            `;
        }
    });

    function renderEventTabs() {
        const tabsContainer = document.getElementById('eventTabsContainer');
        tabsContainer.innerHTML = '';

        eventsData.forEach((evt, index) => {
            const btn = document.createElement('button');
            btn.className = `event-tab-btn ${index === 0 ? 'active' : ''}`;
            // 顯示簡短標題
            const titleText = evt.eventTitle ? evt.eventTitle.substring(0, 12) + '...' : `焦點事件 ${index + 1}`;
            btn.textContent = `焦點 ${index + 1}：${titleText}`;
            
            // 綁定點擊事件
            btn.onclick = () => switchEvent(index);
            tabsContainer.appendChild(btn);
        });
    }

    function switchEvent(index) {
        currentEventIndex = index;
        
        // 更新按鈕的 active 樣式
        const buttons = document.querySelectorAll('.event-tab-btn');
        buttons.forEach((b, idx) => {
            if (idx === index) {
                b.classList.add('active');
            } else {
                b.classList.remove('active');
            }
        });

        renderEventCard(index);
    }

    function renderEventCard(index) {
        const evt = eventsData[index];
        const container = document.getElementById('eventCardContainer');

        if (!evt) return;

        let perspectivesHtml = '';
        if (evt.perspectives && Array.isArray(evt.perspectives)) {
            evt.perspectives.forEach(p => {
                perspectivesHtml += `
                    <div class="perspective-card">
                        <div>
                            <div class="perspective-header">${p.groupName || '多元視角'}</div>
                            <div class="perspective-content"><strong>主要聚焦：</strong>${p.focus || ''}</div>
                            <div class="angle-note"><strong>💡 延伸視角：</strong>${p.blindspot || ''}</div>
                        </div>
                        <div class="perspective-link">
                            <a href="${p.url || '#'}" target="_blank" class="btn-mini-link">前往閱讀該視角報導 ↗</a>
                        </div>
                    </div>
                `;
            });
        }

        container.innerHTML = `
            <div class="card">
                <h2 class="event-title">${evt.eventTitle || '未命名事件'}</h2>
                
                <div class="section-box">
                    <div class="section-title">📌 事件核心與客觀背景</div>
                    <div>${evt.coreFacts || ''}</div>
                </div>

                <div class="section-title" style="margin-bottom: 10px;">🔍 多元視角觀點與切入面比較</div>
                <div class="perspectives-grid">
                    ${perspectivesHtml}
                </div>

                <div class="neutral-conclusion">
                    <div class="section-title" style="color: var(--accent-green);">💡 綜合觀點與事件本質解析</div>
                    <div>${evt.neutralSummary || ''}</div>
                </div>
            </div>
        `;
    }
</script>
