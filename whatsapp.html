<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>金曲旋律精選｜MyEzLife 簡居生活</title>
  <meta name="description" content="書・咖啡・小日子・零碎日常｜漫無目的，恣意生活。點擊線上聆聽播放清單。" />

  <!-- Open Graph 社群分享標籤 -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://myezlife.com/goldmelody_csv.html" />
  <meta property="og:title" content="金曲旋律精選｜MyEzLife 簡居生活" />
  <meta property="og:description" content="書・咖啡・小日子・零碎日常｜漫無目的，恣意生活。點擊線上聆聽播放清單。" />
  <meta property="og:image" content="https://myezlife.com/images/og-goldmelody.jpg" />

  <style>
    :root {
      --bg: #f7f5f0;
      --card: #ffffff;
      --text: #2c2a29;
      --muted: #6e6a66;
      --border: #e5e0d8;
      --active: #efeae1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .container {
      max-width: 760px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 1.45rem;
    }
    .subtitle {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .player-box {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 比例 */
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .player-box iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .playlist {
      list-style: none;
      padding: 0;
      margin: 0;
      border-top: 1px solid var(--border);
      max-height: 420px;
      overflow-y: auto;
    }
    .playlist li {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .playlist li:hover,
    .playlist li.active {
      background: var(--active);
      font-weight: 600;
    }
    .tag {
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>金曲旋律精選</h1>
    <p class="subtitle">書・咖啡・小日子・零碎日常｜漫無目的，恣意生活。</p>

    <div class="player-box">
      <iframe
        id="ytPlayer"
        src=""
        title="YouTube 影音播放器"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen
      ></iframe>
    </div>

    <ul id="playlist" class="playlist">
      <li>正在載入播放清單...</li>
    </ul>
  </div>

  <script>
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1wHgO9bjq21vu2OFQchkwARwCKU2g-2p7SbxuBQ__mlw/gviz/tq?tqx=out:csv';
    const ytPlayer = document.getElementById('ytPlayer');
    const playlistEl = document.getElementById('playlist');

    // 支援一般 watch、youtu.be、embed、shorts 等 YouTube 網址轉成 embed 網址
    function toYouTubeEmbedUrl(rawUrl, autoplay = false) {
      if (!rawUrl) return '';
      const cleanUrl = rawUrl.trim();
      let videoId = '';

      const patterns = [
        /(?:youtube\.com\/watch\?v=|youtube\.com\/embed\/|youtube\.com\/shorts\/|youtu\.be\/)([A-Za-z0-9_-]{11})/
      ];

      for (const regex of patterns) {
        const match = cleanUrl.match(regex);
        if (match && match[1]) {
          videoId = match[1];
          break;
        }
      }

      if (!videoId) return '';
      const auto = autoplay ? '1' : '0';
      return `https://www.youtube.com/embed/${videoId}?autoplay=${auto}&rel=0`;
    }

    // 處理含引號與逗號的 CSV 行
    function splitCSVLine(line) {
      const result = [];
      let current = '';
      let inQuotes = false;

      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQuotes && line[i + 1] === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === ',' && !inQuotes) {
          result.push(current.trim());
          current = '';
        } else {
          current += ch;
        }
      }
      result.push(current.trim());
      return result;
    }

    function parseCSV(text) {
      const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
      if (lines.length < 2) return [];

      const headers = splitCSVLine(lines[0]);
      return lines.slice(1).map(line => {
        const cols = splitCSVLine(line);
        const row = {};
        headers.forEach((h, idx) => {
          row[h] = cols[idx] || '';
        });
        return row;
      });
    }

    async function initPlaylist() {
      try {
        const res = await fetch(SHEET_CSV_URL);
        if (!res.ok) throw new Error('無法取得試算表 CSV 資料');
        const csvText = await res.text();
        const rows = parseCSV(csvText);

        // 只保留有有效 YouTube 連結的項目
        const tracks = rows
          .map(r => ({
            title: r['歌曲名稱'] || '未命名曲目',
            tag: r['熱門標籤'] || '',
            embedUrl: toYouTubeEmbedUrl(r['YouTube網址'], false),
            autoplayUrl: toYouTubeEmbedUrl(r['YouTube網址'], true)
          }))
          .filter(t => t.embedUrl);

        playlistEl.innerHTML = '';
        if (tracks.length === 0) {
          playlistEl.innerHTML = '<li>找不到可播放的 YouTube 曲目</li>';
          return;
        }

        tracks.forEach((track, index) => {
          const li = document.createElement('li');
          li.innerHTML = `<span>${track.title}</span><span class="tag">${track.tag}</span>`;

          li.addEventListener('click', () => {
            document.querySelectorAll('#playlist li').forEach(el => el.classList.remove('active'));
            li.classList.add('active');
            ytPlayer.src = track.autoplayUrl;
          });

          playlistEl.appendChild(li);

          // 預設載入第一首（不自動吵到訪客）
          if (index === 0) {
            li.classList.add('active');
            ytPlayer.src = track.embedUrl;
          }
        });
      } catch (err) {
        playlistEl.innerHTML = `<li>載入失敗：${err.message}</li>`;
      }
    }

    initPlaylist();
  </script>
</body>
</html>
