<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>金曲旋律精選｜MyEzLife 簡居生活</title>
  <meta name="description" content="書・咖啡・小日子・零碎日常｜漫無目的，恣意生活。點擊線上聆聽播放清單。" />

  <!-- Open Graph 社群分享標籤 -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://myezlife.com/goldmelody_csv.html" />
  <meta property="og:title" content="金曲旋律精選｜MyEzLife 簡居生活" />
  <meta property="og:description" content="書・咖啡・小日子・零碎日常｜漫無目的，恣意生活。點擊線上聆聽播放清單。" />
  <meta property="og:image" content="https://myezlife.com/images/og-goldmelody.jpg" />

  <style>
    :root {
      --bg: #f7f5f0;
      --card: #ffffff;
      --text: #2c2a29;
      --muted: #6e6a66;
      --border: #e5e0d8;
      --active: #efeae1;
      --wa: #25D366;
      --wa-hover: #1ebe5d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .container {
      max-width: 760px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 1.45rem;
    }
    .subtitle {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .player-box {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .player-box iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .now-playing-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: #faf8f4;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .now-playing-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .now-playing-label {
      font-size: 0.78rem;
      color: var(--muted);
    }
    .now-playing-title {
      font-weight: 600;
      font-size: 0.98rem;
      word-break: break-word;
    }
    .wa-share-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--wa);
      color: #ffffff;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 999px;
      white-space: nowrap;
      transition: background 0.2s ease;
    }
    .wa-share-btn:hover {
      background: var(--wa-hover);
    }
    .playlist {
      list-style: none;
      padding: 0;
      margin: 0;
      border-top: 1px solid var(--border);
      max-height: 420px;
      overflow-y: auto;
    }
    .playlist li {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .playlist li:hover,
    .playlist li.active {
      background: var(--active);
      font-weight: 600;
    }
    .tag {
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>金曲旋律精選</h1>
    <p class="subtitle">書・咖啡・小日子・零碎日常｜漫無目的，恣意生活。</p>

    <div class="player-box">
      <iframe
        id="ytPlayer"
        src=""
        title="YouTube 影音播放器"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen
      ></iframe>
    </div>

    <div class="now-playing-bar">
      <div class="now-playing-info">
        <span class="now-playing-label">目前播放</span>
        <span id="nowPlayingTitle" class="now-playing-title">尚未選擇曲目</span>
      </div>
      <a id="waShareBtn" class="wa-share-btn" href="#" target="_blank" rel="noopener noreferrer">
        分享到 WhatsApp
      </a>
    </div>

    <ul id="playlist" class="playlist">
      <li>正在載入播放清單...</li>
    </ul>
  </div>

  <script>
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1wHgO9bjq21vu2OFQchkwARwCKU2g-2p7SbxuBQ__mlw/gviz/tq?tqx=out:csv';
    const ytPlayer = document.getElementById('ytPlayer');
    const playlistEl = document.getElementById('playlist');
    const nowPlayingTitleEl = document.getElementById('nowPlayingTitle');
    const waShareBtn = document.getElementById('waShareBtn');

    function extractYouTubeId(rawUrl) {
      if (!rawUrl) return '';
      const cleanUrl = rawUrl.trim();
      const match = cleanUrl.match(
        /(?:youtube\.com\/watch\?v=|youtube\.com\/embed\/|youtube\.com\/shorts\/|youtu\.be\/)([A-Za-z0-9_-]{11})/
      );
      return match && match[1] ? match[1] : '';
    }

    function toYouTubeEmbedUrl(videoId, autoplay = false) {
      if (!videoId) return '';
      return `https://www.youtube.com/embed/${videoId}?autoplay=${autoplay ? '1' : '0'}&rel=0`;
    }

    function toWatchUrl(videoId, fallbackUrl) {
      if (videoId) return `https://youtu.be/${videoId}`;
      return fallbackUrl || 'https://myezlife.com/goldmelody_csv.html';
    }

    function updateCurrentTrack(track, autoplay = false) {
      nowPlayingTitleEl.textContent = track.tag ? `${track.title}（${track.tag}）` : track.title;
      ytPlayer.src = autoplay ? track.autoplayUrl : track.embedUrl;

      const shareText = [
        `♪ 分享這首好歌：${track.title}`,
        track.tag ? `分類：${track.tag}` : '',
        `影片連結：${track.watchUrl}`,
        `更多精選：https://myezlife.com/goldmelody_csv.html`
      ].filter(Boolean).join('\n');

      waShareBtn.href = `https://api.whatsapp.com/send?text=${encodeURIComponent(shareText)}`;
    }

    function splitCSVLine(line) {
      const result = [];
      let current = '';
      let inQuotes = false;

      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQuotes && line[i + 1] === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === ',' && !inQuotes) {
          result.push(current.trim());
          current = '';
        } else {
          current += ch;
        }
      }
      result.push(current.trim());
      return result;
    }

    function parseCSV(text) {
      const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
      if (lines.length < 2) return [];

      const headers = splitCSVLine(lines[0]);
      return lines.slice(1).map(line => {
        const cols = splitCSVLine(line);
        const row = {};
        headers.forEach((h, idx) => {
          row[h] = cols[idx] || '';
        });
        return row;
      });
    }

    async function initPlaylist() {
      try {
        const res = await fetch(SHEET_CSV_URL);
        if (!res.ok) throw new Error('無法取得試算表 CSV 資料');
        const csvText = await res.text();
        const rows = parseCSV(csvText);

        const tracks = rows
          .map(r => {
            const rawUrl = r['YouTube網址'] || '';
            const videoId = extractYouTubeId(rawUrl);
            return {
              title: r['歌曲名稱'] || '未命名曲目',
              tag: r['熱門標籤'] || '',
              embedUrl: toYouTubeEmbedUrl(videoId, false),
              autoplayUrl: toYouTubeEmbedUrl(videoId, true),
              watchUrl: toWatchUrl(videoId, rawUrl)
            };
          })
          .filter(t => t.embedUrl);

        playlistEl.innerHTML = '';
        if (tracks.length === 0) {
          playlistEl.innerHTML = '<li>找不到可播放的 YouTube 曲目</li>';
          return;
        }

        tracks.forEach((track, index) => {
          const li = document.createElement('li');
          li.innerHTML = `<span>${track.title}</span><span class="tag">${track.tag}</span>`;

          li.addEventListener('click', () => {
            document.querySelectorAll('#playlist li').forEach(el => el.classList.remove('active'));
            li.classList.add('active');
            updateCurrentTrack(track, true);
          });

          playlistEl.appendChild(li);

          if (index === 0) {
            li.classList.add('active');
            updateCurrentTrack(track, false);
          }
        });
      } catch (err) {
        playlistEl.innerHTML = `<li>載入失敗：${err.message}</li>`;
      }
    }

    initPlaylist();
  </script>
</body>
</html>
