<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>金曲旋律精選｜MyEzLife 簡居生活</title>
  <meta name="description" content="書・咖啡・小日子・零碎日常｜漫無目的，恣意生活。點擊線上聆聽播放清單。" />

  <!-- Open Graph 社群分享標籤（WhatsApp / Facebook / LINE 預覽用） -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://myezlife.com/goldmelody_csv.html" />
  <meta property="og:title" content="金曲旋律精選｜MyEzLife 簡居生活" />
  <meta property="og:description" content="書・咖啡・小日子・零碎日常｜漫無目的，恣意生活。點擊線上聆聽播放清單。" />
  <meta property="og:image" content="https://live.staticflickr.com/65535/55655995173_c19ae388f6_c.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <style>
    :root {
      --bg: #f7f5f0;
      --card: #ffffff;
      --text: #2c2a29;
      --muted: #6e6a66;
      --accent: #5c6f5e;
      --border: #e5e0d8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 1.5rem;
    }
    .subtitle {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    audio {
      width: 100%;
      margin-bottom: 16px;
    }
    .playlist {
      list-style: none;
      padding: 0;
      margin: 0;
      border-top: 1px solid var(--border);
    }
    .playlist li {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .playlist li:hover,
    .playlist li.active {
      background: #f0eee9;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>金曲旋律精選</h1>
    <p class="subtitle">書・咖啡・小日子・零碎日常｜漫無目的，恣意生活。</p>

    <audio id="player" controls preload="metadata"></audio>
    <ul id="playlist" class="playlist"></ul>
  </div>

  <script>
   // 替換為你的 Google Sheets 匯出 CSV 網址
const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1wHgO9bjq21vu2OFQchkwARwCKU2g-2p7SbxuBQ__mlw/gviz/tq?tqx=out:csv';

const player = document.getElementById('player');
const playlistEl = document.getElementById('playlist');

// 解析 CSV 文字的簡易函式
function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return [];
  
  // 處理包含引號的 CSV 欄位
  const headers = lines[0].split(',').map(h => h.replace(/^"(.*)"$/, '$1').trim());
  
  return lines.slice(1).map(line => {
    // 簡單區分 CSV 欄位
    const cols = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || [];
    const cleanCols = cols.map(c => c.replace(/^"(.*)"$/, '$1').trim());
    
    const item = {};
    headers.forEach((h, i) => {
      item[h] = cleanCols[i] || '';
    });
    return item;
  });
}

async function loadPlaylistFromGoogleSheet() {
  try {
    const res = await fetch(GOOGLE_SHEET_CSV_URL);
    if (!res.ok) throw new Error('無法讀取 Google Sheets 資料');
    const csvText = await res.text();
    const tracks = parseCSV(csvText);

    playlistEl.innerHTML = '';
    tracks.forEach((track, idx) => {
      const songName = track['歌曲名稱'] || track['title'] || '未命名曲目';
      const videoUrl = track['YouTube網址'] || track['url'] || '';
      const tag = track['熱門標籤'] || '';

      if (!videoUrl) return; // 沒有網址就跳過

      const li = document.createElement('li');
      li.innerHTML = `<span>${songName} <small style="color:#888;">${tag}</small></span>`;
      li.addEventListener('click', () => {
        document.querySelectorAll('#playlist li').forEach(el => el.classList.remove('active'));
        li.classList.add('active');
        player.src = videoUrl;
        player.play().catch(() => {});
      });
      playlistEl.appendChild(li);

      if (idx === 0) {
        li.classList.add('active');
        player.src = videoUrl;
      }
    });
  } catch (err) {
    playlistEl.innerHTML = `<li>載入播放清單失敗：${err.message}</li>`;
  }
}

loadPlaylistFromGoogleSheet();
  </script>
</body>
</html>
