<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- 啟用手機全螢幕與沉浸式模式 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">

    <title>華語金曲隨機短影音牆 - Shorts 風格</title>
    <style>
        /* 基礎重置：確保手機版直接滿版全螢幕 */
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* 電腦版或大螢幕時：置中顯示手機比例框體 */
        @media (min-width: 768px) {
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                background-color: #f0f2f5;
                position: static;
            }
            .app-frame {
                width: 100%;
                max-width: 430px;
                height: 100vh;
                height: 100dvh;
                max-height: 932px;
                border-radius: 24px;
                overflow: hidden;
                box-shadow: 0 10px 30px rgba(0,0,0,0.15);
                position: relative;
                background-color: #ffffff;
            }
        }

        /* 手機版：直接強制 100% 全螢幕覆蓋 */
        @media (max-width: 767px) {
            .app-frame {
                width: 100vw;
                height: 100vh;
                height: 100dvh;
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                border-radius: 0;
                box-shadow: none;
                background-color: #000000;
            }
        }

        .reel-container {
            width: 100%;
            height: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            transform: translateZ(0);
        }

        .reel-container::-webkit-scrollbar {
            display: none;
        }

        .reel-card {
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            overflow: hidden;
        }

        .video-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-wrapper iframe {
            width: 100% !important;
            height: 100% !important;
            border: none;
            object-fit: cover;
        }

        /* 預設自訂封面層樣式 */
        .custom-cover-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1) 100%),
                        url('https://live.staticflickr.com/65535/55549203944_a7a9f89992_z.jpg') center/cover no-repeat;
            z-index: 5;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }

         /* 「我不該動情」專屬封面圖片 */
        .custom-cover-layer.cover-not-falling-you {
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1) 100%),
                        url('https://live.staticflickr.com/65535/55549550848_c03d08fe1a_z.jpg') center/cover no-repeat;
        }
       

        /* 「原來你愛的不是我」專屬封面圖片 */
        .custom-cover-layer.cover-not-you {
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1) 100%),
                        url('https://live.staticflickr.com/65535/55549181083_2c4e3a898f_z.jpg') center/cover no-repeat;
        }


        /* 「換我做你的山」專屬封面圖片 */
        .custom-cover-layer.cover-be-your-mountain {
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1) 100%),
                        url('https://live.staticflickr.com/65535/55549502531_eb0574e77b_z.jpg') center/cover no-repeat;
        }


        /* 「推開世界的門」專屬封面圖片 */
        .custom-cover-layer.cover-open-door {
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1) 100%),
                        url('https://live.staticflickr.com/65535/55549231861_1b96d1fb77_z.jpg') center/cover no-repeat;
        }

        /* 「愛到盡頭」專屬封面圖片 */
        .custom-cover-layer.cover-end-of-love {
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1) 100%),
                        url('https://live.staticflickr.com/65535/55549482870_24b4f389ed_z.jpg') center/cover no-repeat;
        }

        /* 「值得」專屬封面圖片 */
        .custom-cover-layer.cover-worthy {
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1) 100%),
                        url('https://live.staticflickr.com/65535/55549218606_28d06dcf0b_z.jpg') center/cover no-repeat;
        }

        /* 「思念成災」專屬封面圖片 */
        .custom-cover-layer.cover-miss-disaster {
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1) 100%),
                        url('https://images.pexels.com/photos/4581380/pexels-photo-4581380.jpeg') center/cover no-repeat;
        }

        /* 「放過自己」專屬封面圖片 */
        .custom-cover-layer.cover-let-go {
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1) 100%),
                        url('https://live.staticflickr.com/65535/55548228317_3b99571f91_z.jpg') center/cover no-repeat;
        }

        /* 「城北的花」專屬封面圖片 */
        .custom-cover-layer.cover-city-flower {
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1) 100%),
                        url('https://live.staticflickr.com/65535/55549402588_d46db8d284_z.jpg') center/cover no-repeat;
        }

        .custom-cover-layer.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .cover-play-btn {
            width: 52px;
            height: 52px;
            background-color: #ff3b30;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 20px rgba(255, 59, 48, 0.5);
            animation: pulse 2s infinite;
            flex-shrink: 0;
            cursor: pointer;
        }

        .cover-play-btn svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
            transform: translateX(2px);
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.6); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(255, 59, 48, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
        }

        /* 底部資訊與按鈕共用同一列容器，適應安全距離 */
        .overlay-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 40px 16px calc(65px + env(safe-area-inset-bottom)) 16px;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
        }

        .song-text-group {
            pointer-events: auto;
            flex-grow: 1;
            margin-right: 16px;
        }

        .cover-play-btn-wrapper {
            pointer-events: auto;
        }

        .song-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .song-views {
            font-size: 12px;
            color: #fff;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
        }
    </style>
</head>

        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQdcQUHRVGkofvU4A2A7nmXY70YtE0X4fLMLxM-cLJy8_qQ1Kgz4YfZSApj4r6VCXDfHXUWLlouFTJG/pub?gid=0&single=true&output=csv";

        // 支援含逗號、雙引號及換行的 CSV 欄位
        function parseCSV(text) {
            const rows = [];
            let row = [], cell = "", quoted = false;
            for (let i = 0; i < text.length; i++) {
                const ch = text[i];
                if (ch === '"') {
                    if (quoted && text[i + 1] === '"') { cell += '"'; i++; }
                    else quoted = !quoted;
                } else if (ch === ',' && !quoted) {
                    row.push(cell); cell = "";
                } else if ((ch === '\n' || ch === '\r') && !quoted) {
                    if (ch === '\r' && text[i + 1] === '\n') i++;
                    row.push(cell); cell = "";
                    if (row.some(v => v.trim() !== "")) rows.push(row);
                    row = [];
                } else {
                    cell += ch;
                }
            }
            if (cell.length || row.length) {
                row.push(cell);
                if (row.some(v => v.trim() !== "")) rows.push(row);
            }
            return rows;
        }

        function normalizeHeader(value) {
            return String(value || "").trim().toLowerCase().replace(/[\s_\-（）()【】\[\]]/g, "");
        }

        function findColumn(headers, aliases) {
            const normalized = headers.map(normalizeHeader);
            for (const alias of aliases) {
                const index = normalized.indexOf(normalizeHeader(alias));
                if (index >= 0) return index;
            }
            return -1;
        }

        function extractYouTubeId(value) {
            const raw = String(value || "").trim();
            if (!raw) return "";
            if (/^[\w-]{11}$/.test(raw)) return raw;
            try {
                const url = new URL(raw);
                if (url.hostname.includes("youtu.be")) return url.pathname.split("/").filter(Boolean)[0] || "";
                if (url.hostname.includes("youtube.com")) {
                    if (url.pathname === "/watch") return url.searchParams.get("v") || "";
                    const parts = url.pathname.split("/").filter(Boolean);
                    const marker = parts.findIndex(part => ["embed", "shorts", "live"].includes(part));
                    if (marker >= 0) return parts[marker + 1] || "";
                }
            } catch (_) {}
            const match = raw.match(/(?:youtube\.com\/(?:embed\/|shorts\/|live\/|watch\?v=)|youtu\.be\/)([\w-]{11})/);
            return match ? match[1] : "";
        }

        function rowsToSongs(rows) {
            if (!rows.length) return [];
            const headers = rows[0];
            const titleCol = findColumn(headers, ["產品名稱"]);
            const coverCol = findColumn(headers, ["圖片網址"]);
            const videoCol = findColumn(headers, ["分潤連結"]);
            const viewsCol = findColumn(headers, ["熱門標籤"]);
            
            const dataRows = titleCol >= 0 && videoCol >= 0 ? rows.slice(1) : rows;
            const titleIndex = titleCol >= 0 && videoCol >= 0 ? titleCol : 0;
            const videoIndex = titleCol >= 0 && videoCol >= 0 ? videoCol : 3;

            return dataRows.map(row => {
                const title = String(row[titleIndex] || "").trim();
                const videoValue = String(row[videoIndex] || "").trim();
                const videoId = extractYouTubeId(videoValue);
                if (!title || !videoId) return null;

                const coverValue = coverCol >= 0 ? String(row[coverCol] || "").trim() : "";
                
                let coverUrl = "";
                let coverClass = "";
                
                if (coverValue.startsWith("http://") || coverValue.startsWith("https://")) {
                    coverUrl = coverValue;
                } else {
                    coverClass = coverValue;
                }
               

        async function loadProductDatabase() {
    const response = await fetch(CSV_URL, { cache: "no-store" });
    if (!response.ok) throw new Error("CSV 載入失敗（HTTP " + response.status + "）");
    const csvText = await response.text();
    // 這裡把 rowsToSongs 改成你的商品解析函式
    const products = rowsToProducts(parseCSV(csvText.replace(/^\uFEFF/, "")));
    // 錯誤提示也順便改掉，才不會誤導
    if (!products.length) throw new Error("CSV 中找不到有效商品。請確認欄位包含產品名稱與購買連結。");
    return products;
}            

            if (cards.length > 0) {
                const randomOffset = Math.floor(Math.random() * totalOriginal);
                const targetIndex = totalOriginal + randomOffset;
                container.scrollTop = cards[targetIndex].offsetTop;
            }

            let scrollTimeout;
            container.addEventListener('scroll', () => {
                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(() => {
                    const singleBlockHeight = cards[0].offsetHeight * totalOriginal;
                    
                    if (container.scrollTop < singleBlockHeight * 0.4) {
                        container.style.scrollSnapType = 'none';
                        container.scrollTop += singleBlockHeight;
                        setTimeout(() => { container.style.scrollSnapType = 'y mandatory'; }, 50);
                    } 
                    else if (container.scrollTop > singleBlockHeight * 2.3) {
                        container.style.scrollSnapType = 'none';
                        container.scrollTop -= singleBlockHeight;
                        setTimeout(() => { container.style.scrollSnapType = 'y mandatory'; }, 50);
                    }
                }, 100);
            }, { passive: true });         

   

       window.onload = async function () {
    const container = document.getElementById("reelContainer");
    try {
        // 把 loadSongDatabase 改成 loadProductDatabase
        const productDatabase = await loadProductDatabase();
        // 把 songDatabase 改成 productDatabase
        initReels(productDatabase);

        container.innerHTML = `${String(error.message || error)}

};
