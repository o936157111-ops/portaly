<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- 啟用手機全螢幕與沉浸式模式 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">

    <title>熱門產品推薦</title>
    <style>
        /* 基礎重置：確保手機版直接滿版全螢幕 */
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* 電腦版或大螢幕時：置中顯示手機比例框體 */
        @media (min-width: 768px) {
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                background-color: #f0f2f5;
                position: static;
            }
            .app-frame {
                width: 100%;
                max-width: 430px;
                height: 100vh;
                height: 100dvh;
                max-height: 932px;
                border-radius: 24px;
                overflow: hidden;
                box-shadow: 0 10px 30px rgba(0,0,0,0.15);
                position: relative;
                background-color: #ffffff;
            }
        }

        /* 手機版：直接強制 100% 全螢幕覆蓋 */
        @media (max-width: 767px) {
            .app-frame {
                width: 100vw;
                height: 100vh;
                height: 100dvh;
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                border-radius: 0;
                box-shadow: none;
                background-color: #000000;
            }
        }

        .reel-container {
            width: 100%;
            height: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            transform: translateZ(0);
        }

        .reel-container::-webkit-scrollbar {
            display: none;
        }

        .reel-card {
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            overflow: hidden;
        }

        /* 底部資訊與按鈕共用同一列容器，適應安全距離 */
        .overlay-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 30px 20px 50px 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.5) 60%, transparent 100%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
            pointer-events: none; /* 讓背景空白處可以順暢滑動 */
        }

        /* 確保標籤、標題與購買按鈕可以正常點擊 */
        .product-title, .product-tag, .buy-btn {
            pointer-events: auto;
        }

        .product-tag {
            font-size: 12px;
            color: #ffffff;
            background: rgba(255, 59, 48, 0.9);
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: bold;
        }

        .product-title {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            line-height: 1.4;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }

        .buy-btn {
            display: inline-block;
            background-color: #ff3b30;
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            padding: 10px 24px;
            border-radius: 22px;
            box-shadow: 0 4px 15px rgba(255, 59, 48, 0.5);
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="app-frame">
        <div class="reel-container" id="reelContainer"></div>
    </div>

    <script>
        // 產品資料改由 Google 試算表公開 CSV 載入

        // 支援含逗號、雙引號及換行的 CSV 欄位
        function parseCSV(text) {
            const rows = [];
            let row = [], cell = "", quoted = false;
            for (let i = 0; i < text.length; i++) {
                const ch = text[i];
                if (ch === '"') {
                    if (quoted && text[i + 1] === '"') { cell += '"'; i++; }
                    else quoted = !quoted;
                } else if (ch === ',' && !quoted) {
                    row.push(cell); cell = "";
                } else if ((ch === '\n' || ch === '\r') && !quoted) {
                    if (ch === '\r' && text[i + 1] === '\n') i++;
                    row.push(cell); cell = "";
                    if (row.some(v => v.trim() !== "")) rows.push(row);
                    row = [];
                } else {
                    cell += ch;
                }
            }
            if (cell.length || row.length) {
                row.push(cell);
                if (row.some(v => v.trim() !== "")) rows.push(row);
            }
            return rows;
        }
