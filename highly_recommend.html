<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- 啟用手機全螢幕與沉浸式模式 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">

    <title>熱門產品推薦</title>
    <style>
        /* 基礎重置：確保手機版直接滿版全螢幕 */
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* 電腦版或大螢幕時：置中顯示手機比例框體 */
        @media (min-width: 768px) {
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                background-color: #f0f2f5;
                position: static;
            }
            .app-frame {
                width: 100%;
                max-width: 430px;
                height: 100vh;
                height: 100dvh;
                max-height: 932px;
                border-radius: 24px;
                overflow: hidden;
                box-shadow: 0 10px 30px rgba(0,0,0,0.15);
                position: relative;
                background-color: #ffffff;
            }
        }

        /* 手機版：直接強制 100% 全螢幕覆蓋 */
        @media (max-width: 767px) {
            .app-frame {
                width: 100vw;
                height: 100vh;
                height: 100dvh;
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                border-radius: 0;
                box-shadow: none;
                background-color: #000000;
            }
        }

        .reel-container {
            width: 100%;
            height: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            transform: translateZ(0);
        }

        .reel-container::-webkit-scrollbar {
            display: none;
        }

        .reel-card {
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            overflow: hidden;
        }

        /* 底部資訊與按鈕共用同一列容器，適應安全距離 */
        .overlay-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 30px 20px 50px 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.5) 60%, transparent 100%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
            pointer-events: none; /* 讓背景空白處可以順暢滑動 */
        }

        /* 確保標籤、標題與購買按鈕可以正常點擊 */
        .product-title, .product-tag, .buy-btn {
            pointer-events: auto;
        }

        .product-tag {
            font-size: 12px;
            color: #ffffff;
            background: rgba(255, 59, 48, 0.9);
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: bold;
        }

        .product-title {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            line-height: 1.4;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }

        .buy-btn {
            display: inline-block;
            background-color: #ff3b30;
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            padding: 10px 24px;
            border-radius: 22px;
            box-shadow: 0 4px 15px rgba(255, 59, 48, 0.5);
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="app-frame">
        <div class="reel-container" id="reelContainer"></div>
    </div>

    <script>
        // 產品資料改由 Google 試算表公開 CSV 載入
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQdcQUHRVGkofvU4A2A7nmXY70YtE0X4fLMLxM-cLJy8_qQ1Kgz4YfZSApj4r6VCXDfHXUWLlouFTJG/pub?gid=0&single=true&output=csv";

        // 支援含逗號、雙引號及換行的 CSV 欄位
        function parseCSV(text) {
            const rows = [];
            let row = [], cell = "", quoted = false;
            for (let i = 0; i < text.length; i++) {
                const ch = text[i];
                if (ch === '"') {
                    if (quoted && text[i + 1] === '"') { cell += '"'; i++; }
                    else quoted = !quoted;
                } else if (ch === ',' && !quoted) {
                    row.push(cell); cell = "";
                } else if ((ch === '\n' || ch === '\r') && !quoted) {
                    if (ch === '\r' && text[i + 1] === '\n') i++;
                    row.push(cell); cell = "";
                    if (row.some(v => v.trim() !== "")) rows.push(row);
                    row = [];
                } else {
                    cell += ch;
                }
            }
            if (cell.length || row.length) {
                row.push(cell);
                if (row.some(v => v.trim() !== "")) rows.push(row);
            }
            return rows;
        }

        function normalizeHeader(value) {
            return String(value || "").trim().toLowerCase().replace(/[\s_\-（）()【】\[\]]/g, "");
        }

        function findColumn(headers, aliases) {
            const normalized = headers.map(normalizeHeader);
            for (const alias of aliases) {
                const index = normalized.indexOf(normalizeHeader(alias));
                if (index >= 0) return index;
            }
            return -1;
        }

        function rowsToProducts(rows) {
            if (!rows.length) return [];
            const headers = rows[0];
            const titleCol = findColumn(headers, ["產品名稱", "品名", "名稱"]);
            const coverCol = findColumn(headers, ["圖片網址", "圖片", "封面"]);
            const linkCol = findColumn(headers, ["分潤連結", "產品連結", "網址", "連結"]);
            const tagCol = findColumn(headers, ["熱門標籤", "標籤", "分類"]);
            
            const dataRows = titleCol >= 0 && linkCol >= 0 ? rows.slice(1) : rows;
            const titleIndex = titleCol >= 0 ? titleCol : 0;
            const linkIndex = linkCol >= 0 ? linkCol : 2;

            return dataRows.map(row => {
                const title = String(row[titleIndex] || "").trim();
                const productLink = String(row[linkIndex] || "").trim();
                if (!title || !productLink) return null;

                const coverUrl = coverCol >= 0 ? String(row[coverCol] || "").trim() : "";
                const tag = tagCol >= 0 && row[tagCol] ? String(row[tagCol]).trim() : "🔥 熱銷推薦";

                return {
                    title,
                    productLink,
                    coverUrl: coverUrl || "https://live.staticflickr.com/65535/55549203944_a7a9f89992_z.jpg",
                    tag
                };
            }).filter(Boolean);
        }

        function initReels(productDatabase) {
            const container = document.getElementById('reelContainer');
            container.innerHTML = '';
            const totalOriginal = productDatabase.length;

            // 將資料複製 3 次以達成無縫循環滾動
            for (let loop = 0; loop < 3; loop++) {
                for (let i = 0; i < productDatabase.length; i++) {
                    let p = productDatabase[i];

                    let card = document.createElement('div');
                    card.className = 'reel-card';

                    let img = document.createElement('img');
                    img.src = p.coverUrl;
                    img.style.width = '100%';
                    img.style.height = '100%';
                    img.style.objectFit = 'cover'; // 調整為 cover 讓圖片滿版填滿
                    img.style.position = 'absolute';
                    img.style.top = '0';
                    img.style.left = '0';
                    card.appendChild(img);

                    let info = document.createElement('div');
                    info.className = 'overlay-info';

                    // 1. 標籤放最上方
                    let tag = document.createElement('div');
                    tag.className = 'product-tag';
                    tag.textContent = p.tag;
                    info.appendChild(tag);

                    // 2. 名稱放中間
                    let title = document.createElement('div');
                    title.className = 'product-title';
                    title.textContent = p.title;
                    info.appendChild(title);

                    // 3. 購買按鈕放最下方
                    let btn = document.createElement('a');
                    btn.className = 'buy-btn';
                    btn.href = p.productLink;
                    btn.target = '_blank';
                    btn.textContent = '看看內容 🛒';
                    info.appendChild(btn);

                    card.appendChild(info);
                    container.appendChild(card);
                }
            }

            // 隨機定位捲軸（加上安全防護）
            const cards = document.querySelectorAll('.reel-card');
            if (cards.length > 0) {
                const randomOffset = Math.floor(Math.random() * totalOriginal);
                const targetIndex = totalOriginal + randomOffset;
                
                if (cards[targetIndex]) {
                    container.scrollTop = cards[targetIndex].offsetTop;
                } else {
                    container.scrollTop = cards[0].offsetTop;
                }
            }

            // 無限滾動的監聽與位置重置
            let scrollTimeout;
            container.addEventListener('scroll', () => {
                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(() => {
                    const singleBlockHeight = cards[0].offsetHeight * totalOriginal;
                    
                    if (container.scrollTop < singleBlockHeight * 0.4) {
                        container.style.scrollSnapType = 'none';
                        container.scrollTop += singleBlockHeight;
                        setTimeout(() => { container.style.scrollSnapType = 'y mandatory'; }, 50);
                    } 
                    else if (container.scrollTop > singleBlockHeight * 2.3) {
                        container.style.scrollSnapType = 'none';
                        container.scrollTop -= singleBlockHeight;
                        setTimeout(() => { container.style.scrollSnapType = 'y mandatory'; }, 50);
                    }
                }, 100);
            }, { passive: true });
        }

        async function loadProductDatabase() {
            const response = await fetch(CSV_URL, { cache: "no-store" });
            if (!response.ok) throw new Error("CSV 載入失敗（HTTP " + response.status + "）");
            const csvText = await response.text();
            const products = rowsToProducts(parseCSV(csvText.replace(/^\uFEFF/, "")));
            if (!products.length) throw new Error("CSV 中找不到有效商品。請確認欄位包含產品名稱與購買連結。");
            return products;
        }

        window.onload = async function () {
            const container = document.getElementById("reelContainer");
            try {
                const productDatabase = await loadProductDatabase();
                initReels(productDatabase);
            } catch (error) {
                console.error("商品資料載入失敗：", error);
                container.innerHTML = `<div style="padding: 20px; text-align: center; color: #fff;">${String(error.message || error)}</div>`;
            }
        };
    </script>
</body>
</html>
