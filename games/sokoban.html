<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>倉庫番 - 關卡讀取版</title>
    <style>
        body { text-align: center; font-family: 'Segoe UI', sans-serif; background-color: #2c3e50; color: #ecf0f1; padding: 20px; }
        #game-board { display: grid; gap: 4px; background-color: #34495e; width: fit-content; margin: 20px auto; padding: 10px; border-radius: 8px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .cell { width: 40px; height: 40px; background-color: #465a6d; border-radius: 4px; }
        .wall { background-color: #273746; }
        .box { background-color: #e67e22; border-radius: 4px; }
        .box.on-target { background-color: #d35400; outline: 3px solid #2ecc71; }
        .player { background-color: #3498db; border-radius: 50%; }
        .target { background-color: #27ae60; opacity: 0.3; border-radius: 50%; }
    </style>
</head>
<body>

    <h1>倉庫番遊戲</h1>
    <p id="status">正在載入關卡...</p>
    <div id="game-board"></div>

<script>
let levels = [];
let currentLevel = 0;
let map = [];
let targets = [];

// 1. 先從 JSON 讀取資料
async function initGame() {
    try {
        const response = await fetch('levels.json');
        levels = await response.json();
        loadLevel(0);
    } catch (e) {
        document.getElementById('status').innerText = "載入失敗：請確保在伺服器環境下開啟 (Live Server)";
        console.error("錯誤原因：", e);
    }
}

// 2. 載入特定關卡
function loadLevel(index) {
    currentLevel = index;
    map = levels[currentLevel].map.map(row => [...row]);
    targets = levels[currentLevel].targets;
    document.getElementById('status').innerText = `第 ${currentLevel + 1} 關：請將箱子推到目標點！`;
    render();
}

// 3. 繪圖引擎
function render() {
    const board = document.getElementById('game-board');
    board.innerHTML = '';
    board.style.gridTemplateColumns = `repeat(${map[0].length}, 40px)`;
    let boxesOnTarget = 0;

    for (let r = 0; r < map.length; r++) {
        for (let c = 0; c < map[r].length; c++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            if (map[r][c] === 1) cell.classList.add('wall');
            else if (map[r][c] === 4) cell.classList.add('player');
            else if (map[r][c] === 2) {
                cell.classList.add('box');
                if (targets.some(t => t.r === r && t.c === c)) {
                    cell.classList.add('on-target');
                    boxesOnTarget++;
                }
            }
            else if (map[r][c] === 3) cell.classList.add('target');
            board.appendChild(cell);
        }
    }

    if (boxesOnTarget === targets.length) {
        setTimeout(() => {
            if (currentLevel + 1 < levels.length) loadLevel(currentLevel + 1);
            else { alert("恭喜通關所有關卡！"); location.reload(); }
        }, 500);
    }
}

// 4. 移動邏輯
function move(dr, dc) {
    let p = (() => {
        for (let r = 0; r < map.length; r++)
            for (let c = 0; c < map[r].length; c++)
                if (map[r][c] === 4) return { r, c };
    })();
    let nextR = p.r + dr, nextC = p.c + dc;
    if (map[nextR][nextC] === 1) return;
    if (map[nextR][nextC] === 2) {
        let bR = nextR + dr, bC = nextC + dc;
        if (map[bR][bC] === 1 || map[bR][bC] === 2) return;
        map[bR][bC] = 2;
    }
    map[nextR][nextC] = 4;
    map[p.r][p.c] = 0;
    render();
}

window.addEventListener('keydown', (e) => {
    if (e.key.startsWith('Arrow')) move(e.key==='ArrowUp'?-1:e.key==='ArrowDown'?1:0, e.key==='ArrowLeft'?-1:e.key==='ArrowRight'?1:0);
});

initGame(); // 啟動遊戲
</script>
</body>
</html>
