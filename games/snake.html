<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>貪食蛇 - 調整版</title>
    <style>
        body { margin: 0; background: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .phone-container { width: 340px; height: 560px; background: #333; border: 6px solid #444; border-radius: 20px; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        #gameCanvas { width: 300px; height: 300px; background: #8fa382; border: 5px solid #111; display: block; }

        .control-wrapper { margin-top: 40px; display: flex; justify-content: space-between; width: 300px; align-items: center; }
        
        /* 放大開始按鈕 */
        #startBtn { width: 100px; height: 60px; background: #555; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; }
        
        .d-pad { display: grid; grid-template-columns: repeat(3, 50px); gap: 5px; }
        .d-btn { width: 50px; height: 50px; background: #222; color: #fff; border: 2px solid #555; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; }
    </style>
</head>
<body>

<div class="phone-container">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="control-wrapper">
        <button id="startBtn">開始</button>
        <div class="d-pad">
            <div></div><button class="d-btn" onclick="setDir('UP')">▲</button><div></div>
            <button class="d-btn" onclick="setDir('LEFT')">◀</button><button class="d-btn" onclick="setDir('DOWN')">▼</button><button class="d-btn" onclick="setDir('RIGHT')">▶</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let snake = [{x: 10, y: 10}], food = {x: 5, y: 5}, nextDir = {x: 0, y: -1}, isPaused = true;

    function draw() {
        ctx.fillStyle = '#8fa382'; ctx.fillRect(0, 0, 400, 400);
        ctx.fillStyle = '#2b3a22';
        snake.forEach(p => ctx.fillRect(p.x * 20 + 1, p.y * 20 + 1, 18, 18));
        ctx.fillStyle = '#1a2414'; ctx.fillRect(food.x * 20 + 2, food.y * 20 + 2, 16, 16);
    }

    function setDir(dir) {
        if(dir==='UP' && nextDir.y!==1) nextDir = {x: 0, y: -1};
        else if(dir==='DOWN' && nextDir.y!==-1) nextDir = {x: 0, y: 1};
        else if(dir==='LEFT' && nextDir.x!==1) nextDir = {x: -1, y: 0};
        else if(dir==='RIGHT' && nextDir.x!==-1) nextDir = {x: 1, y: 0};
    }

    window.addEventListener('keydown', e => {
        if(e.key==='ArrowUp') setDir('UP');
        else if(e.key==='ArrowDown') setDir('DOWN');
        else if(e.key==='ArrowLeft') setDir('LEFT');
        else if(e.key==='ArrowRight') setDir('RIGHT');
    });

    document.getElementById('startBtn').onclick = () => isPaused = !isPaused;

    draw();

    // 遊戲循環：將間隔從 150ms 增加到 250ms，速度變慢
    setInterval(() => {
        if (isPaused) return;
        let head = {x: snake[0].x + nextDir.x, y: snake[0].y + nextDir.y};

        if (head.x < 0 || head.x > 19 || head.y < 0 || head.y > 19) {
            snake = [{x: 10, y: 10}]; nextDir = {x: 0, y: -1}; isPaused = true;
            alert("遊戲結束！"); draw(); return;
        }

        for(let i=0; i<snake.length; i++) {
            if(head.x === snake[i].x && head.y === snake[i].y) {
                snake = [{x: 10, y: 10}]; nextDir = {x: 0, y: -1}; isPaused = true;
                alert("撞到自己了！"); draw(); return;
            }
        }

        snake.unshift(head);
        if (head.x === food.x && head.y === food.y) {
            food = {x: Math.floor(Math.random()*20), y: Math.floor(Math.random()*20)};
        } else {
            snake.pop();
        }
        draw();
    }, 250); // 這裡調整速度
</script>
</body>
</html>
