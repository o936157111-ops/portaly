<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>myezlife OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            /* 壁紙感背景，帶一點深色漸層，凸顯透明 Widget */
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            background-attachment: fixed;
            color: #ffffff;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* 透明磨砂玻璃效果 (Glassmorphism Widget) */
        .glass-widget {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
        }

        .glass-folder {
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .glass-dock {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .hidden { display: none !important; }

        @keyframes popUp {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: popUp 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 max-w-md mx-auto relative overflow-x-hidden">

    <!-- 頂部時間與手機狀態欄模擬 -->
    <header class="flex justify-between items-center text-xs font-semibold px-2 pt-1 opacity-80">
        <span id="real-time">09:41</span>
        <div class="flex items-center gap-1.5 text-[10px]">
            <i class="fa-solid fa-signal"></i>
            <i class="fa-solid fa-wifi"></i>
            <i class="fa-solid fa-battery-full text-xs"></i>
        </div>
    </header>

    <!-- 桌面主要區域 (Homescreen Desktop) -->
    <main class="flex-1 my-4 space-y-5">

        <!-- 1. 透明大尺寸 Widget (2x2 大小的桌面小工具) -->
        <div class="glass-widget p-4 rounded-3xl relative overflow-hidden">
            <div class="flex justify-between items-start mb-2">
                <div>
                    <div class="text-[10px] uppercase tracking-wider text-slate-300 font-bold">myezlife OS Widget</div>
                    <div class="text-xl font-bold mt-0.5">星期五, 10月24日</div>
                </div>
                <span class="text-2xl">🌤️</span>
            </div>
            
            <div class="grid grid-cols-2 gap-2 mt-3 pt-3 border-t border-white/10 text-xs">
                <div>
                    <span class="text-slate-400 text-[10px] block">台北市氣溫</span>
                    <span class="font-semibold">24°C 多雲</span>
                </div>
                <div>
                    <span class="text-slate-400 text-[10px] block">今日台股</span>
                    <span class="font-semibold text-emerald-400">+125.4 📈</span>
                </div>
            </div>
        </div>

        <!-- 2. 中型核心功能 Widget (擬真小工具) -->
        <div class="glass-widget p-4 rounded-3xl">
            <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-bold text-slate-200 flex items-center gap-1.5">
                    <i class="fa-solid fa-bolt text-yellow-400"></i> 快捷小幫手
                </span>
                <span class="text-[10px] bg-white/20 px-2 py-0.5 rounded-full">即時</span>
            </div>
            
            <!-- 模擬一個可打字的便籤 Widget -->
            <div class="bg-black/20 rounded-2xl p-2.5 text-xs">
                <textarea class="w-full bg-transparent border-none text-white placeholder-slate-400 focus:outline-none resize-none text-xs" rows="2" placeholder="📌 點擊這裡直接寫桌面備忘錄..."></textarea>
            </div>
        </div>

        <!-- 3. App 圖示網格 (4 列 Grid) -->
        <div class="grid grid-cols-4 gap-y-5 gap-x-3 text-center pt-2">
            
            <!-- 普通 App 圖示 1 -->
            <div class="flex flex-col items-center gap-1 cursor-pointer active:scale-90 transition" onclick="openApp('天氣')">
                <div class="w-14 h-14 bg-gradient-to-tr from-blue-400 to-sky-300 rounded-2xl flex items-center justify-center text-2xl shadow-lg">
                    🌤️
                </div>
                <span class="text-[11px] font-medium tracking-tight shadow-sm">天氣</span>
            </div>

            <!-- 普通 App 圖示 2 -->
            <div class="flex flex-col items-center gap-1 cursor-pointer active:scale-90 transition" onclick="openApp('股市')">
                <div class="w-14 h-14 bg-gradient-to-tr from-emerald-500 to-teal-300 rounded-2xl flex items-center justify-center text-2xl shadow-lg">
                    📈
                </div>
                <span class="text-[11px] font-medium tracking-tight">股市大盤</span>
            </div>

            <!-- 普通 App 圖示 3 -->
            <div class="flex flex-col items-center gap-1 cursor-pointer active:scale-90 transition" onclick="openApp('公車')">
                <div class="w-14 h-14 bg-gradient-to-tr from-amber-500 to-orange-300 rounded-2xl flex items-center justify-center text-2xl shadow-lg">
                    🚌
                </div>
                <span class="text-[11px] font-medium tracking-tight">公車動態</span>
            </div>

            <!-- 透明資料夾 (Folder) -->
            <div class="flex flex-col items-center gap-1 cursor-pointer active:scale-90 transition" onclick="openFolder()">
                <div class="w-14 h-14 glass-folder rounded-2xl p-1.5 grid grid-cols-2 gap-1 shadow-lg">
                    <div class="bg-purple-500/80 rounded-lg flex items-center justify-center text-xs">🎵</div>
                    <div class="bg-rose-500/80 rounded-lg flex items-center justify-center text-xs">🎬</div>
                    <div class="bg-indigo-500/80 rounded-lg flex items-center justify-center text-xs">📰</div>
                    <div class="bg-slate-500/80 rounded-lg flex items-center justify-center text-xs">⚙️</div>
                </div>
                <span class="text-[11px] font-medium tracking-tight">娛樂工具</span>
            </div>

        </div>

    </main>

    <!-- 4. 底部 Dock 欄 (固定常駐捷徑) -->
    <footer class="glass-dock rounded-3xl p-3 mb-2">
        <div class="grid grid-cols-4 gap-3 text-center">
            
            <div class="flex justify-center cursor-pointer active:scale-90 transition" onclick="openApp('電話捷徑')">
                <div class="w-12 h-12 bg-emerald-500 rounded-2xl flex items-center justify-center text-xl shadow-md">
                    📞
                </div>
            </div>

            <div class="flex justify-center cursor-pointer active:scale-90 transition" onclick="openApp('訊息靈感')">
                <div class="w-12 h-12 bg-blue-500 rounded-2xl flex items-center justify-center text-xl shadow-md">
                    💬
                </div>
            </div>

            <div class="flex justify-center cursor-pointer active:scale-90 transition" onclick="openApp('瀏覽器')">
                <div class="w-12 h-12 bg-indigo-500 rounded-2xl flex items-center justify-center text-xl shadow-md">
                    🌐
                </div>
            </div>

            <!-- 設定主題的專屬齒輪 -->
            <div class="flex justify-center cursor-pointer active:scale-90 transition" onclick="alert('點擊這裡可以重新回到引導精靈，切換桌面主題與配置！')">
                <div class="w-12 h-12 bg-slate-700/80 border border-white/20 rounded-2xl flex items-center justify-center text-xl shadow-md">
                    ⚙️
                </div>
            </div>

        </div>
    </footer>

    <!-- 模擬點開「資料夾」的彈出面板 (Folder Modal) -->
    <div id="folder-modal" class="fixed inset-0 bg-black/60 backdrop-blur-md flex items-center justify-center p-6 hidden z-50" onclick="closeFolder()">
        <div class="glass-widget w-full p-6 rounded-3xl animate-pop text-center space-y-4" onclick="event.stopPropagation()">
            <h3 class="text-sm font-bold text-slate-200 mb-2">📁 娛樂工具箱</h3>
            <div class="grid grid-cols-3 gap-4">
                <div class="flex flex-col items-center gap-1 cursor-pointer" onclick="openApp('音樂牆')">
                    <div class="w-12 h-12 bg-purple-500 rounded-2xl flex items-center justify-center text-xl">🎵</div>
                    <span class="text-[10px]">好歌牆</span>
                </div>
                <div class="flex flex-col items-center gap-1 cursor-pointer" onclick="openApp('影音短片')">
                    <div class="w-12 h-12 bg-rose-500 rounded-2xl flex items-center justify-center text-xl">🎬</div>
                    <span class="text-[10px]">影音</span>
                </div>
                <div class="flex flex-col items-center gap-1 cursor-pointer" onclick="openApp('新聞')">
                    <div class="w-12 h-12 bg-indigo-500 rounded-2xl flex items-center justify-center text-xl">📰</div>
                    <span class="text-[10px]">重點新聞</span>
                </div>
            </div>
            <p class="text-[10px] text-slate-400 pt-2">點擊外部任意區域即可關閉資料夾</p>
        </div>
    </div>

    <script>
        // 即時時間更新
        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('real-time').innerText = `${hours}:${minutes}`;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // 開啟資料夾
        function openFolder() {
            document.getElementById('folder-modal').classList.remove('hidden');
        }

        // 關閉資料夾
        function closeFolder() {
            document.getElementById('folder-modal').classList.add('hidden');
        }

        // 模擬打開 App
        function openApp(appName) {
            alert(`📱 你點擊了「${appName}」！\n未來這裡可以打開對應的私房功能或跳轉到你指定的真實網站。`);
        }
    </script>
</body>
</html>
