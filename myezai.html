<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyEZ AI - 你的個人數位樞紐</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .green-banner {
            background-color: #00a600;
            color: #ffffff;
        }
        /* 淡入動畫效果 */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-down { animation: fadeInDown 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-fade-up { animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards; opacity: 0; }
    </style>
</head>
<body class="p-4 md:p-6">

    <div class="max-w-xl w-full mx-auto space-y-6">
        
        <!-- 頂部品牌列 -->
        <header class="green-banner p-4 md:p-5 rounded-2xl flex items-center justify-between shadow-lg">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full border-2 border-white/80 overflow-hidden bg-white shadow-sm flex items-center justify-center">
                    <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhpplybxkZauJQWUOn9OWSx4fqUNgwoxpGXCuovmbLZMKRRh6LSY-nxcOHvfbRtCnP43rluEF1DtoO4T_7Xrl7U_tmbyn4mdN0em7q4DMw3euMtaflcW3EeXl-1trm2MFlhaE4o7HgZ5I4TUVaxOR0eHPdmqwV_Nq_tlSMHGhiooq68AHhpA7lz6C58U8O5/s560/logo.gif" alt="Logo" class="w-full h-full object-cover">
                </div>
                <div>
                    <h1 class="font-extrabold text-base tracking-wide">MyEZ AI 數位樞紐</h1>
                    <p class="text-[11px] text-emerald-100">把數位生活的主控權交回自己手上</p>
                </div>
            </div>
            <a href="https://myezlife.com" target="_blank" class="text-xs bg-black/20 hover:bg-black/30 px-3 py-1.5 rounded-xl font-bold transition text-white no-underline">
                返回主站 🏠
            </a>
        </header>

        <!-- 畫面一：極簡開場 (將標語融合成動態影片 overlay) -->
        <div id="intro-screen" class="bg-slate-900/90 border border-slate-800 rounded-3xl p-5 md:p-6 text-center space-y-5 shadow-2xl backdrop-blur-md">
            
            <!-- 動態影片區塊 (結合文字 Overlay) -->
            <div class="relative w-full aspect-video rounded-2xl overflow-hidden border border-slate-700/60 shadow-inner bg-slate-950 group">
                <div id="yt-player-loading" class="absolute inset-0 flex items-center justify-center text-xs text-slate-400">正在從雲端載入隨機影片...</div>
                <iframe id="random-yt-iframe" class="w-full h-full border-0 hidden" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                
                <!-- 疊加在影片上的文字標語 -->
                <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent flex flex-col justify-end p-5 text-left pointer-events-none">
                    <div class="animate-fade-down space-y-1">
                        <span class="text-[11px] font-bold uppercase tracking-widest text-emerald-400 bg-emerald-950/80 px-2.5 py-0.5 rounded-full border border-emerald-800/60 inline-block backdrop-blur-sm">
                            ✨ 迎向全新智慧生活
                        </span>
                        <h2 class="text-lg md:text-2xl font-extrabold text-white drop-shadow-md">
                            遇見你的專屬 AI 助手
                        </h2>
                    </div>
                    <p class="animate-fade-up text-xs text-slate-300 font-medium mt-1 leading-relaxed drop-shadow">
                        零訂閱費、隱私完全自主。專為你量身打造的輕量化數位空間。
                    </p>
                </div>
            </div>

            <!-- 控制按鈕區 -->
            <div class="flex items-center justify-between gap-3">
                <button onclick="loadRandomYouTubeVideo()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold py-3 px-4 rounded-xl transition cursor-pointer border border-slate-700 flex items-center gap-1.5 shrink-0">
                    <i class="fa-solid fa-shuffle text-emerald-400"></i> 換一支影片
                </button>
                <button onclick="startChatExperience()" class="flex-1 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold py-3 px-6 rounded-2xl shadow-lg transition-all flex items-center justify-center gap-2 text-sm md:text-base cursor-pointer">
                    進入 MyEZ AI 對話樞紐 <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </div>
        </div>

        <!-- 畫面二：無邊界對齊版 MyEZ AI 聊天對話介面 -->
        <div id="chat-screen" class="w-full space-y-4 hidden">
            
            <div class="flex items-center justify-between border-b border-slate-800/80 pb-3 px-1">
                <div class="flex items-center gap-2 text-sm font-bold text-emerald-400">
                    <i class="fa-solid fa-robot"></i> MyEZ AI 智慧對話中
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="clearHistory()" class="text-slate-400 hover:text-slate-200 text-xs px-2.5 py-1 rounded-lg bg-slate-800 transition cursor-pointer">
                        清除對話
                    </button>
                    <button onclick="backToIntro()" class="text-slate-400 hover:text-slate-200 text-xs px-2.5 py-1 rounded-lg bg-slate-800 transition cursor-pointer">
                        返回首頁
                    </button>
                </div>
            </div>

            <!-- 對話內容區 (無邊界融合 style) -->
            <div id="chatBox" class="h-80 overflow-y-auto p-4 bg-slate-900/60 rounded-2xl border border-slate-800/80 flex flex-col gap-3">
                <!-- 對話內容由 JS 載入 -->
            </div>

            <!-- 輸入控制區 -->
            <div class="flex gap-2 pt-1">
                <input type="text" id="userInput" placeholder="請輸入訊息或指令..." class="flex-1 bg-slate-900/80 border border-slate-800 text-white p-3 rounded-xl text-sm outline-none focus:border-emerald-500 transition shadow-inner" onkeypress="handleKeyPress(event)">
                <button id="sendBtn" onclick="sendMessage()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-3 rounded-xl text-sm font-bold transition cursor-pointer shadow-md">
                    發送
                </button>
            </div>
        </div>

    </div>

    <script>
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx54C4nncX9H0GWMZGsMR7Mo-vDBPEMkrAB72jLjbCmyMgEVZeDLL2T6Vik8ML9Hwte/exec";
        const STORAGE_KEY = "myez_ai_portal_history";
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1wHgO9bjq21vu2OFQchkwARwCKU2g-2p7SbxuBQ__mlw/export?format=csv";

        let playlistCache = [];

        // 載入 Google 試算表中的 YouTube 清單
        async function fetchYouTubePlaylist() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                const data = await response.text();
                const rows = data.split(/\r?\n/).slice(1);
                
                playlistCache = [];
                rows.forEach(row => {
                    const cols = row.split(",");
                    if (cols.length >= 4) {
                        const url = cols[3]?.replace(/^"|"$/g, '').trim();
                        const videoId = extractYtId(url);
                        if (videoId) playlistCache.push(videoId);
                    }
                });

                if (playlistCache.length > 0) {
                    loadRandomYouTubeVideo();
                } else {
                    useFallbackPlaylist();
                }
            } catch (err) {
                console.error("讀取雲端試算表失敗，改用預設備用清單", err);
                useFallbackPlaylist();
            }
        }

        function useFallbackPlaylist() {
            playlistCache = ["aAh17Sse6LA", "C_SPMqq8uwk", "H7dR6FwvljM", "lzUyTD6IzqU", "1w5r0tbvTCk"];
            loadRandomYouTubeVideo();
        }

        function extractYtId(url) {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function loadRandomYouTubeVideo() {
            if (playlistCache.length === 0) return;
            const randomIndex = Math.floor(Math.random() * playlistCache.length);
            const videoId = playlistCache[randomIndex];

            const iframe = document.getElementById('random-yt-iframe');
            const loadingText = document.getElementById('yt-player-loading');

            if (iframe && loadingText) {
                iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=0&modestbranding=1`;
                iframe.classList.remove('hidden');
                loadingText.classList.add('hidden');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            fetchYouTubePlaylist();
        });

        let chatHistory = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [
            { role: 'ai', text: '你好！我是 MyEZ AI 專屬助手。很高興為你服務，今天想聊些什麼或尋找什麼靈感呢？' }
        ];

        function startChatExperience() {
            document.getElementById('intro-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            renderHistory();
        }

        function backToIntro() {
            document.getElementById('chat-screen').classList.add('hidden');
            document.getElementById('intro-screen').classList.remove('hidden');
        }

        function renderHistory() {
            const chatBox = document.getElementById("chatBox");
            chatBox.innerHTML = "";
            chatHistory.forEach(msg => appendMessageToDOM(msg.text, msg.role));
        }

        async function sendMessage() {
            const inputField = document.getElementById("userInput");
            const sendBtn = document.getElementById("sendBtn");
            const userText = inputField.value.trim();
            if (!userText) return;

            chatHistory.push({ role: 'user', text: userText });
            saveAndRender();
            inputField.value = "";
            inputField.disabled = true;
            sendBtn.disabled = true;

            const aiMessageDiv = appendMessageToDOM("（思考中...）", 'ai');

            try {
                // 滑動視窗限制 (最近 12 則對話)
                const recentHistory = chatHistory.slice(-12);
                const formattedContents = recentHistory
                    .filter(msg => msg.text.trim() !== "" && !msg.text.includes("（思考中...）"))
                    .map(msg => ({
                        role: msg.role === 'ai' ? 'model' : 'user',
                        parts: [{ text: msg.text }]
                    }));

                const response = await fetch(GAS_WEB_APP_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ contents: formattedContents })
                });

                const resData = await response.json();

                if (resData.status === 'success') {
                    await typeWriterEffect(aiMessageDiv, resData.reply);
                    chatHistory.push({ role: 'ai', text: resData.reply });
                } else {
                    throw new Error(resData.message || "轉發回應失敗");
                }
            } catch (error) {
                const errorMsg = "發生錯誤：" + error.message;
                aiMessageDiv.textContent = errorMsg;
                chatHistory.push({ role: 'ai', text: errorMsg });
            } finally {
                saveToStorage();
                inputField.disabled = false;
                sendBtn.disabled = false;
                inputField.focus();
            }
        }

        function typeWriterEffect(element, text, speed = 15) {
            return new Promise((resolve) => {
                element.textContent = "";
                let i = 0;
                function type() {
                    if (i < text.length) {
                        element.textContent += text.charAt(i);
                        i++;
                        const chatBox = document.getElementById("chatBox");
                        chatBox.scrollTop = chatBox.scrollHeight;
                        setTimeout(type, speed);
                    } else {
                        resolve();
                    }
                }
                type();
            });
        }

        function appendMessageToDOM(text, sender) {
            const chatBox = document.getElementById("chatBox");
            const msgDiv = document.createElement("div");
            msgDiv.className = `p-3 rounded-xl text-sm max-w-[85%] leading-relaxed ${sender === 'user' ? 'bg-emerald-600 text-white self-end rounded-br-xs' : 'bg-slate-800 border border-slate-700/85 text-slate-200 self-start rounded-bl-xs shadow-2xs'}`;
            msgDiv.textContent = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgDiv;
        }

        function saveToStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(chatHistory));
        }

        function saveAndRender() {
            saveToStorage();
            renderHistory();
        }

        function clearHistory() {
            if (confirm("確定要重置對話紀錄嗎？")) {
                localStorage.removeItem(STORAGE_KEY);
                chatHistory = [{ role: 'ai', text: '對話記憶已重置！' }];
                renderHistory();
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
