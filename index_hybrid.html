<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5328509571221811" crossorigin="anonymous"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>生活・簡居・生活 | 數位名片型總入口</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        
        /* ========================================== */
        /* 1. 基礎與直式版樣式 (電腦版、手機直式) */
        /* ========================================== */
        html, body {
            background-color: #f9f9f9;
            margin: 0; padding: 0;
            width: 100%; height: 100%;
        }

        body { 
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; 
            padding: 20px; text-align: center; color: #333;
            overscroll-behavior: none;
        }
        .container { max-width: 400px; margin: 0 auto; }
        
        .card-container { 
            background-color: #FCFCFF; 
            border-radius: 24px;       
            border: 1px solid #F0F0F0; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15); 
            overflow: hidden; 
            padding: 40px 25px;
        }
        
        .logo-wrapper { 
            position: relative; 
            min-height: 250px; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            margin-bottom: 20px; 
        }
        .logo-img { width: 95%; height: auto; display: none; border-radius: 12px; cursor: pointer; }
        
        #loader-container { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 80%; }
        .loader-text { color: #999; font-size: 0.9em; }
        progress { width: 100%; height: 8px; border-radius: 4px; border: none; background-color: #eee; }
        progress::-webkit-progress-bar { background-color: #eee; border-radius: 4px; }
        progress::-webkit-progress-value { background-color: #555; border-radius: 4px; transition: width 0.3s; }
        
        .header-tabs { margin: 10px 0; font-size: 1.4em; color: #888; }
        .tab-trigger { cursor: pointer; color: #888; font-weight: normal; transition: all 0.2s; }
        .tab-trigger.active { color: #000; font-weight: 800; }
        
        .slogan { line-height: 1.8; color: #666; font-size: 0.85em; margin-bottom: 25px; }

        .button-group { display: none; flex-direction: column; gap: 12px; }
        .button-group.active { display: flex; }
        
        .btn { 
            display: flex; align-items: center; justify-content: center; height: 50px; 
            background-color: #f4f4f9; color: #333; text-decoration: none; 
            border-radius: 12px; font-weight: 700; border: 2px solid #dcdcdc; 
            transition: all 0.3s ease; 
        }
        .btn:hover { 
            background-color: #000 !important; 
            color: #fff !important; 
            border-color: #000 !important; 
            transform: translateY(-2px) !important;
        }

        /* ========================================== */
        /* 2. 旋轉引導提示遮罩 */
        /* ========================================== */
        #rotate-guide {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.95); z-index: 10000;
            color: white; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer; padding: 20px;
        }
        .guide-text { font-size: 18px; margin-top: 20px; line-height: 1.6; letter-spacing: 1px; }
        
        .phone-icon {
            width: 60px; height: 100px; border: 3px solid #fff; border-radius: 10px;
            position: relative; animation: rotatePhone 2.5s ease-in-out infinite;
        }
        .phone-icon::after {
            content: ''; position: absolute; bottom: 5px; left: 50%;
            transform: translateX(-50%); width: 8px; height: 8px; background: #fff; border-radius: 50%;
        }
        @keyframes rotatePhone {
            0% { transform: rotate(0deg); }
            30% { transform: rotate(-90deg); }
            70% { transform: rotate(-90deg); }
            100% { transform: rotate(0deg); }
        }

        /* ========================================== */
        /* 3. 專屬手機橫式版的佈局 + 右側自動門整合 */
        /* ========================================== */
        #landscape-card-view { display: none; }

        @media (orientation: landscape) and (max-width: 950px) {
            .container, #rotate-guide { display: none !important; }
            
            html, body {
                background-color: #0f172a !important;
                width: 100%; height: 100%; overflow: hidden;
            }

            body { 
                margin: 0; padding: 0;
                display: flex; justify-content: center; align-items: center;
            }
            
            #landscape-card-view {
                display: flex; 
                width: 100%; height: 100%; 
                background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
                overflow: hidden; 
                position: relative;
                
                padding-left: env(safe-area-inset-left, 15px);
                padding-right: env(safe-area-inset-right, 15px);
                padding-top: env(safe-area-inset-top, 10px);
                padding-bottom: env(safe-area-inset-bottom, 10px);
            }
            
            /* 左側：個人頭像與基本資料 */
            .card-left {
                flex: 4; display: flex; flex-direction: column; justify-content: center; 
                align-items: center; border-right: 1px solid rgba(255, 255, 255, 0.08); padding: 10px;
            }
            .card-avatar { width: 85px; height: 85px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.2); margin-bottom: 10px; }
            .card-name { font-size: 20px; font-weight: bold; color: #fff; margin-bottom: 3px; }
            .card-sub { font-size: 12px; color: #94a3b8; letter-spacing: 2px; }

            /* 右側：完美嵌入自動門 */
            .card-right {
                flex: 6; display: flex; justify-content: center; align-items: center;
                position: relative; overflow: hidden;
                background-color: #D6D2C4; /* 繼承自動門的古風背景色 */
            }

            /* ========================================== */
            /* 4. 自動門內部專屬 CSS 樣式組合 */
            /* ========================================== */
            .blogger-door-container {
                width: 100%; height: 100%;
                display: flex !important; justify-content: center !important; align-items: center !important;
                position: relative; overflow: hidden;
            }

            .facade {
                display: flex; width: 95%; height: 95%; position: relative;
                background: #111; border: 6px solid #444; 
                box-shadow: 0 10px 40px rgba(0,0,0,0.5); cursor: pointer;
            }

            /* 門後的六個區塊面板 */
            .inner-grid { 
                position: absolute; inset: 10px; 
                display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; 
                gap: 8px; z-index: 1; 
            }
            
            /* 基礎格子狀態 */
            .panel { 
                display: flex; justify-content: center; align-items: center; 
                text-decoration: none; background: #222; background-size: cover; background-position: center;
                border: 1px solid rgba(255,255,255,0.15); position: relative; overflow: hidden;
                filter: brightness(0.6) grayscale(0.2);
                transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1); z-index: 2;
            }

            .panel h3 { 
                color: #fff; font-size: 1rem; letter-spacing: 3px; 
                text-shadow: 1px 1px 5px #000; margin: 0; transition: all 0.4s ease;
            }

            /* ✨ 滑鼠滑到每格時的效果 (Hover) */
            .panel:hover { 
                filter: brightness(1.1) grayscale(0); 
                border-color: #D4AF37; 
                box-shadow: inset 0 0 15px rgba(212, 175, 55, 0.4), 0 4px 15px rgba(0,0,0,0.4); 
                transform: scale(1.02); z-index: 5; 
            }

            .panel:hover h3 {
                color: #D4AF37; letter-spacing: 6px; transform: scale(1.05); 
            }

            /* 自動門系統 */
            .auto-door-system {
                position: absolute; inset: 0; z-index: 10; display: flex; overflow: hidden;
            }

            .glass-leaf {
                flex: 1; height: 100%; background: rgba(255, 255, 255, 0.4);
                backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
                border: 2px solid #bdc3c7; transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
                position: relative; display: flex; justify-content: center; align-items: center;
            }

            .door-text {
                font-size: 2.2rem; color: rgba(255, 255, 255, 0.6); font-weight: bold; letter-spacing: 12px;
                writing-mode: vertical-rl; text-orientation: upright; user-select: none;
                border: 2px solid rgba(255,255,255,0.2); padding: 15px 5px;
            }

            /* 開門位移 */
            .door-open .left-leaf { transform: translateX(-99%); }
            .door-open .right-leaf { transform: translateX(99%); }

            /* 門開了之後釋放滑鼠控制權 */
            .door-open .auto-door-system { pointer-events: none; }

            /* 自動門感應器 */
            .sensor-box {
                position: absolute; top: 0; left: 50%; transform: translateX(-50%);
                width: 60px; height: 14px; background: #222; border-radius: 0 0 8px 8px;
                z-index: 20; display: flex; justify-content: center; align-items: center;
            }
            .sensor-light {
                width: 5px; height: 5px; background: #ff3333; border-radius: 50%; transition: background 0.3s;
            }
            .door-open .sensor-light {
                background: #33ff33; box-shadow: 0 0 6px #33ff33;
            }

            /* 背景圖設定 */
            .read-nebula-bg { background-image: url('https://live.staticflickr.com/3701/33034841121_6de420e7b6.jpg'); }
            .collect-drawer-bg { background-image: url('https://live.staticflickr.com/5505/10337267526_41e9cf2c27.jpg'); }
            .old-friend-bg { background-image: url('https://live.staticflickr.com/2826/33751154010_38c96ddea2.jpg'); }
            .explore-compass-bg { background-image: url('https://live.staticflickr.com/7361/10370156306_e44386d455.jpg'); }
            .note-quill-bg { background-image: url('https://live.staticflickr.com/3761/10538701665_af40b6e7d5.jpg'); }
            .map-guide-bg { background-image: url('https://live.staticflickr.com/3933/34095470126_4b21bb58f1.jpg'); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card-container">
            <div class="logo-wrapper">
                <div id="loader-container">
                    <div class="loader-text">載入日常片段中...</div>
                    <progress id="progress-bar" value="0" max="100"></progress>
                </div>
                <img id="logo-img" src="" alt="Logo" class="logo-img" onload="finishLoading()" onclick="showRotateGuide()">
            </div>
            
            <div class="content-section">
                <div class="header-tabs">
                    <span class="tab-trigger active" onclick="openTab(event, 'tab-1')">生活</span>・
                    <span class="tab-trigger" onclick="openTab(event, 'tab-2')">簡居</span>・
                    <span class="tab-trigger" onclick="openTab(event, 'tab-3')">生活</span>
                </div>
                
                <div class="slogan">
                    <p>用瞬間記錄永恆，拿片刻鋪滿人生；<br>
                    在角落翻開記憶，把點滴串成一生。<br>
                    漫無目的，恣意生活。</p>
                </div>
            </div>

            <div id="tab-1" class="button-group active">
                <a href="https://portaly.cc/myezlife" class="btn" target="_blank" rel="noopener noreferrer">Portaly</a>
                <a href="https://myeztravellife.blogspot.com" class="btn" target="_blank" rel="noopener noreferrer">Blogger</a>
                <a href="https://www.pinterest.com/myezstore/pins/" class="btn" target="_blank" rel="noopener noreferrer">Pinterest</a>
                <a href="https://www.youtube.com/@myezlife" class="btn" target="_blank" rel="noopener noreferrer">YouTube</a>
                <a href="https://www.instagram.com/?hl=zh-tw" class="btn" target="_blank" rel="noopener noreferrer">Instagram</a>
                <a href="https://myezlife.com/games.html" class="btn" target="_blank" rel="noopener noreferrer">自製簡易復古經典小遊戲</a>
            </div>

            <div id="tab-2" class="button-group">
                <a href="https://play.google.com/books" class="btn" target="_blank" rel="noopener noreferrer">生活書房</a>
                <a href="https://ebook.nlpi.edu.tw" class="btn" target="_blank" rel="noopener noreferrer">電子圖書館</a>
                <a href="https://o936157111-ops.github.io/portaly/mylibrary.html" class="btn" target="_blank" rel="noopener noreferrer">生活小書房</a>
                <a href="https://myezlife.notion.site/ebb39ac941254e4ca49803d16f9df13d" class="btn" target="_blank" rel="noopener noreferrer">挑本書細讀</a>
            </div>

            <div id="tab-3" class="button-group">
                <a href="https://myezdailylife.blogspot.com" class="btn" target="_blank" rel="noopener noreferrer">零碎日常</a>
                <a href="https://youtube.com/playlist?list=PL64GNbse4j6vXlAT3Xw4OYk1uqrsvsOac&si=2J4QFyZ2GwTpG2Ic" class="btn" target="_blank" rel="noopener noreferrer">好歌一直聽</a>
                <a href="https://www.flickr.com/photos/0936157111/" class="btn" target="_blank" rel="noopener noreferrer">生活相簿</a>
                <a href="https://o936157111-ops.github.io/portaly/FileExplorer.html" class="btn" target="_blank" rel="noopener noreferrer">檔案總管</a>
            </div>
        </div>
    </div>

    <div id="rotate-guide" onclick="hideRotateGuide()">
        <div class="phone-icon"></div>
        <div class="guide-text">
            請將手機轉為橫向<br>
            <span style="font-size: 13px; color: #94a3b8;">即可開啟數位個人名片</span>
        </div>
    </div>

    <div id="landscape-card-view">
        <div class="card-left">
            <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhpplybxkZauJQWUOn9OWSx4fqUNgwoxpGXCuovmbLZMKRRh6LSY-nxcOHvfbRtCnP43rluEF1DtoO4T_7Xrl7U_tmbyn4mdN0em7q4DMw3euMtaflcW3EeXl-1trm2MFlhaE4o7HgZ5I4TUVaxOR0eHPdmqwV_Nq_tlSMHGhiooq68AHhpA7lz6C58U8O5/s560/logo.gif" class="card-avatar">
            <div class="card-name">簡居生活</div>
            <div class="card-sub">DIGITAL CARD</div>
        </div>
        
        <div class="card-right">
            <div class="blogger-door-container">
                <div class="facade" onclick="this.classList.toggle('door-open')">
                    
                    <div class="sensor-box">
                        <div class="sensor-light"></div>
                    </div>

                    <div class="inner-grid">
                        <a href="#" class="panel read-nebula-bg"><h3>閱覽</h3></a>
                        <a href="#" class="panel explore-compass-bg"><h3>探索</h3></a>
                        <a href="#" class="panel collect-drawer-bg"><h3>收藏</h3></a>
                        <a href="#" class="panel note-quill-bg"><h3>筆記</h3></a>
                        <a href="#" class="panel old-friend-bg"><h3>舊識</h3></a>
                        <a href="#" class="panel map-guide-bg"><h3>地圖</h3></a>
                    </div>

                    <div class="auto-door-system">
                        <div class="glass-leaf left-leaf">
                            <div class="door-text">生活</div>
                        </div>
                        <div class="glass-leaf right-leaf">
                            <div class="door-text">日常</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function openTab(evt, tabName) {
            const groups = document.getElementsByClassName("button-group");
            for (let i = 0; i < groups.length; i++) groups[i].classList.remove("active");
            const triggers = document.getElementsByClassName("tab-trigger");
            for (let i = 0; i < triggers.length; i++) triggers[i].classList.remove("active");
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
        }

        const logoOptions = [
            "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhpplybxkZauJQWUOn9OWSx4fqUNgwoxpGXCuovmbLZMKRRh6LSY-nxcOHvfbRtCnP43rluEF1DtoO4T_7Xrl7U_tmbyn4mdN0em7q4DMw3euMtaflcW3EeXl-1trm2MFlhaE4o7HgZ5I4TUVaxOR0eHPdmqwV_Nq_tlSMHGhiooq68AHhpA7lz6C58U8O5/s560/logo.gif"
        ];

        const progressBar = document.getElementById('progress-bar');
        let progress = 0;
        const interval = setInterval(() => {
            if (progress < 90) {
                progress += 5;
                progressBar.value = progress;
            }
        }, 100);

        function finishLoading() {
            clearInterval(interval);
            progressBar.value = 100;
            setTimeout(() => {
                document.getElementById('loader-container').style.display = 'none';
                document.getElementById('logo-img').style.display = 'block';
            }, 200);
        }

        function setRandomLogo() {
            const randomIndex = Math.floor(Math.random() * logoOptions.length);
            document.getElementById('logo-img').src = logoOptions[randomIndex];
        }

        function showRotateGuide() {
            if (window.innerHeight > window.innerWidth) {
                document.getElementById('rotate-guide').style.display = 'flex';
            }
        }

        function hideRotateGuide() {
            document.getElementById('rotate-guide').style.display = 'none';
        }

        window.addEventListener("resize", () => {
            if (window.innerHeight > window.innerWidth) {
                hideRotateGuide();
            }
        });

        setRandomLogo();
    </script>
</body>
