<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5328509571221811" crossorigin="anonymous"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>生活・簡居・生活 | 數位名片型總入口</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        
        /* ========================================== */
        /* 1. 基礎與直式版樣式 (電腦版、手機直式) */
        /* ========================================== */
        html, body {
            background-color: #f9f9f9;
            margin: 0; padding: 0;
            width: 100%; height: 100%;
        }

        body { 
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; 
            padding: 20px; text-align: center; color: #333;
            overscroll-behavior: none;
        }
        .container { max-width: 400px; margin: 0 auto; }
        
        .card-container { 
            background-color: #FCFCFF; 
            border-radius: 24px;       
            border: 1px solid #F0F0F0; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15); 
            overflow: hidden; 
            padding: 40px 25px;
        }
        
        .logo-wrapper { 
            position: relative; 
            min-height: 250px; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            margin-bottom: 20px; 
        }
        .logo-img { width: 95%; height: auto; display: none; border-radius: 12px; }
        
        #loader-container { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 80%; }
        .loader-text { color: #999; font-size: 0.9em; }
        progress { width: 100%; height: 8px; border-radius: 4px; border: none; background-color: #eee; }
        progress::-webkit-progress-bar { background-color: #eee; border-radius: 4px; }
        progress::-webkit-progress-value { background-color: #555; border-radius: 4px; transition: width 0.3s; }
        
        .header-tabs { margin: 10px 0; font-size: 1.4em; color: #888; }
        .tab-trigger { cursor: pointer; color: #888; font-weight: normal; transition: all 0.2s; }
        .tab-trigger.active { color: #000; font-weight: 800; }
        
        .slogan { line-height: 1.8; color: #666; font-size: 0.85em; margin-bottom: 25px; }

        .button-group { display: none; flex-direction: column; gap: 12px; }
        .button-group.active { display: flex; }
        
        .btn { 
            display: flex; align-items: center; justify-content: center; height: 50px; 
            background-color: #f4f4f9; color: #333; text-decoration: none; 
            border-radius: 12px; font-weight: 700; border: 2px solid #dcdcdc; 
            transition: all 0.3s ease; 
        }
        .btn:hover { 
            background-color: #000 !important; 
            color: #fff !important; 
            border-color: #000 !important; 
            transform: translateY(-2px) !important;
        }

        /* ========================================== */
        /* 2. 專屬手機橫式版的佈局 (全白背景、高質感極簡) */
        /* ========================================== */
        #landscape-card-view { display: none; }

        @media (orientation: landscape) and (max-width: 950px) {
            .container { display: none !important; }
            
            /* 橫式狀態下，外層與身體全部變成純白色，與瀏覽器白邊完美融合 */
            html, body {
                background-color: #ffffff !important;
                width: 100%; height: 100%; overflow: hidden;
            }

            body { 
                margin: 0; padding: 0;
                display: flex; justify-content: center; align-items: center;
            }
            
            #landscape-card-view {
                display: flex; 
                width: 100%; height: 100%; 
                background: #ffffff; /* 內層也設為純白 */
                overflow: hidden; 
                position: relative;
                
                /* 防止重要元件被瀏海或挖孔切到 */
                padding-left: env(safe-area-inset-left, 20px);
                padding-right: env(safe-area-inset-right, 20px);
                padding-top: env(safe-area-inset-top, 10px);
                padding-bottom: env(safe-area-inset-bottom, 10px);
            }
            
            /* 左側：品牌形象區 (改為白底黑字的高質感色調) */
            .card-left {
                flex: 4; display: flex; flex-direction: column; justify-content: center; 
                align-items: center; border-right: 1px solid #f0f0f0; padding: 10px;
            }
            .card-avatar { width: 85px; height: 85px; border-radius: 50%; border: 1px solid #e2e8f0; margin-bottom: 10px; }
            .card-name { font-size: 20px; font-weight: bold; color: #1a1a1a; margin-bottom: 3px; }
            .card-sub { font-size: 11px; color: #718096; letter-spacing: 2px; }

            /* 右側：按鈕連結區 */
            .card-right {
                flex: 6; display: flex; flex-direction: column; justify-content: center; 
                padding: 20px 30px; gap: 10px; text-align: left; overflow-y: auto;
            }
            .card-btn {
                display: flex; align-items: center; justify-content: center; height: 44px;
                background: #f7fafc; color: #2d3748; text-decoration: none;
                border-radius: 12px; font-size: 14px; font-weight: 600;
                border: 1px solid #e2e8f0; transition: all 0.2s;
            }
            .card-btn:hover { 
                background: #000000; 
                color: #ffffff; 
                border-color: #000000;
            }
            .card-btn:active { transform: scale(0.98); }
        }
    </style>
</head>
<body>

                <a href="https://myezlife.com/games.html" class="btn" target="_blank" rel="noopener noreferrer">自製簡易復古經典小遊戲</a>
            </div>

            <div id="tab-2" class="button-group">
                <a href="https://play.google.com/books" class="btn" target="_blank" rel="noopener noreferrer">生活書房</a>
                <a href="https://ebook.nlpi.edu.tw" class="btn" target="_blank" rel="noopener noreferrer">電子圖書館</a>

    <script>
        function openTab(evt, tabName) {
            const groups = document.getElementsByClassName("button-group");
            for (let i = 0; i < groups.length; i++) groups[i].classList.remove("active");
            const triggers = document.getElementsByClassName("tab-trigger");
            for (let i = 0; i < triggers.length; i++) triggers[i].classList.remove("active");
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
        }

        const logoOptions = [
            "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhpplybxkZauJQWUOn9OWSx4fqUNgwoxpGXCuovmbLZMKRRh6LSY-nxcOHvfbRtCnP43rluEF1DtoO4T_7Xrl7U_tmbyn4mdN0em7q4DMw3euMtaflcW3EeXl-1trm2MFlhaE4o7HgZ5I4TUVaxOR0eHPdmqwV_Nq_tlSMHGhiooq68AHhpA7lz6C58U8O5/s560/logo.gif"
        ];

        const progressBar = document.getElementById('progress-bar');
        let progress = 0;
        const interval = setInterval(() => {
            if (progress < 90) {
                progress += 5;
                progressBar.value = progress;
            }
        }, 100);

        function finishLoading() {
            clearInterval(interval);
            progressBar.value = 100;
            setTimeout(() => {
                document.getElementById('loader-container').style.display = 'none';
                document.getElementById('logo-img').style.display = 'block';
            }, 200);
        }

        function setRandomLogo() {
            const randomIndex = Math.floor(Math.random() * logoOptions.length);
            document.getElementById('logo-img').src = logoOptions[randomIndex];
        }

        setRandomLogo();
    </script>
