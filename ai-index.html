<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的晨間行動入口</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 圖示 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .fade-in {
      animation: fadeIn 0.4s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12 flex flex-col justify-between" id="appBody">

  <div class="max-w-md mx-auto w-full px-4 pt-5 space-y-4 fade-in">

    <!-- 時段感知 Banner -->
    <div id="heroBanner" class="relative overflow-hidden rounded-2xl bg-gradient-to-br from-amber-500 to-rose-500 p-4 text-white shadow-md shadow-amber-500/10">
      <div class="relative z-10 flex items-center justify-between">
        <div>
          <div id="subGreeting" class="text-[11px] font-semibold text-amber-100 flex items-center gap-1">
            <i class="fa-solid fa-sun"></i> 個人化專屬捷徑
          </div>
          <h1 id="greeting" class="text-lg font-extrabold tracking-tight mt-0.5">
            晨光時間 · 自由隨心訂製
          </h1>
        </div>
        <div class="text-right">
          <span id="currentTime" class="text-xl font-black tracking-wider">05:20</span>
        </div>
      </div>
    </div>

    <!-- 🌟 動態捷徑區塊 (支援使用者自行新增/刪除) -->
    <div class="space-y-2.5">
      <div class="flex items-center justify-between px-1">
        <h2 class="text-xs font-bold text-slate-400 tracking-wider uppercase flex items-center gap-1.5">
          <i class="fa-solid fa-star text-amber-500"></i> 我的常用捷徑 (可自訂)
        </h2>
        <button onclick="openAddModal()" class="text-xs bg-amber-500 hover:bg-amber-600 text-white font-bold px-2.5 py-1 rounded-lg transition flex items-center gap-1 shadow-sm">
          <i class="fa-solid fa-plus"></i> 新增捷徑
        </button>
      </div>

      <!-- 捷徑網格清單 (JavaScript 動態渲染) -->
      <div id="shortcutGrid" class="grid grid-cols-3 gap-2.5">
        <!-- 動態帶入 -->
      </div>
    </div>

    <!-- 🌟 站內原創工具快速區 -->
    <div class="space-y-2 pt-2">
      <h2 class="text-xs font-bold text-slate-400 tracking-wider uppercase px-1 flex items-center gap-1.5">
        <i class="fa-solid fa-wand-magic-sparkles text-amber-500"></i> 本站精選工具
      </h2>
      <div class="grid grid-cols-2 gap-2.5">
        <a href="https://myezlife.com/ai-greeting-app/" target="_blank" class="bg-white p-3 rounded-xl border border-slate-200/80 shadow-sm flex items-center gap-3 hover:border-amber-400 transition active:scale-95">
          <div class="w-9 h-9 rounded-lg bg-amber-100 text-amber-600 flex items-center justify-center text-base">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
          </div>
          <div>
            <div class="text-xs font-bold text-slate-800">做早安圖</div>
            <div class="text-[10px] text-slate-400">原創背景直出</div>
          </div>
        </a>

        <a href="https://myezlife.com/index_news.html" target="_blank" class="bg-white p-3 rounded-xl border border-slate-200/80 shadow-sm flex items-center gap-3 hover:border-sky-400 transition active:scale-95">
          <div class="w-9 h-9 rounded-lg bg-sky-100 text-sky-600 flex items-center justify-center text-base">
            <i class="fa-solid fa-newspaper"></i>
          </div>
          <div>
            <div class="text-xs font-bold text-slate-800">新聞劃重點</div>
            <div class="text-[10px] text-slate-400">捷運閱讀時事</div>
          </div>
        </a>
      </div>
    </div>

    <!-- 💡 Google AdSense 廣告區塊 -->
    <div class="bg-white border border-slate-200/80 rounded-2xl p-3 text-center space-y-1.5 shadow-sm mt-3">
      <p class="text-[10px] text-slate-400 font-medium">贊助商廣告</p>
      <div class="min-h-[90px] flex items-center justify-center bg-slate-50 rounded-xl overflow-hidden">
        <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5328509571221811" crossorigin="anonymous"></script>
        <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-5328509571221811" data-ad-format="auto" data-full-width-responsive="true"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
      </div>
    </div>

  </div>

  <!-- 🌟 新增捷徑彈跳視窗 Modal -->
  <div id="addModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-xl">
      <div class="flex items-center justify-between border-b pb-3">
        <h3 class="font-bold text-slate-800 text-sm">新增您的常用捷徑</h3>
        <button onclick="closeAddModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">APP / 網站名稱</label>
          <input type="text" id="shortcutName" placeholder="例如：Instagram" class="w-full text-sm px-3 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 bg-slate-50">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">網址 (URL)</label>
          <input type="text" id="shortcutUrl" placeholder="例如：https://www.instagram.com" class="w-full text-sm px-3 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 bg-slate-50">
        </div>
      </div>
      <div class="flex gap-2 pt-2">
        <button onclick="closeAddModal()" class="flex-1 bg-slate-100 text-slate-600 font-bold py-2.5 rounded-xl text-xs">取消</button>
        <button onclick="saveNewShortcut()" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white font-bold py-2.5 rounded-xl text-xs shadow-sm">確認新增</button>
      </div>
    </div>
  </div>

  <footer class="text-center text-[11px] text-slate-400 pt-6">
    <p>© myezlife.com · 專屬晨間行動入口</p>
  </footer>

  <script>
    // 預設捷徑清單（包含您的 Duolingo, LINE, WhatsApp 等）
    let defaultShortcuts = [
      { name: 'Duolingo', url: 'https://www.duolingo.com/', icon: 'fa-language', bg: 'bg-emerald-500' },
      { name: 'LINE', url: 'https://line.me/tw/', icon: 'fa-line', brand: true, bg: 'bg-[#00B900]' },
      { name: 'WhatsApp', url: 'https://web.whatsapp.com/', icon: 'fa-whatsapp', brand: true, bg: 'bg-[#25D366]' },
      { name: 'YouTube', url: 'https://www.youtube.com/', icon: 'fa-youtube', brand: true, bg: 'bg-rose-600' },
      { name: '台灣等公車', url: 'https://pda.5284.gov.tw/', icon: 'fa-bus-simple', bg: 'bg-sky-500' }
    ];

    let userShortcuts = JSON.parse(localStorage.getItem('my_custom_shortcuts')) || defaultShortcuts;

    function renderShortcuts() {
      const grid = document.getElementById('shortcutGrid');
      grid.innerHTML = '';

      userShortcuts.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'relative group bg-white p-3 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col items-center justify-center gap-1.5 hover:border-amber-400 transition';
        
        div.innerHTML = `
          <!-- 刪除按鈕 (右上角小叉叉) -->
          <button onclick="deleteShortcut(${index})" class="absolute -top-1.5 -right-1.5 w-5 h-5 bg-rose-500 text-white rounded-full text-[10px] flex items-center justify-center opacity-0 group-hover:opacity-100 transition shadow-sm" title="刪除捷徑">
            <i class="fa-solid fa-xmark"></i>
          </button>
          
          <a href="${item.url}" target="_blank" class="flex flex-col items-center justify-center gap-1.5 w-full text-decoration-none text-inherit">
            <div class="w-11 h-11 rounded-2xl ${item.bg || 'bg-amber-500'} text-white flex items-center justify-center text-xl shadow-sm">
              <i class="${item.brand ? 'fa-brands' : 'fa-solid'} ${item.icon || 'fa-link'}"></i>
            </div>
            <span class="text-xs font-bold text-slate-800 truncate max-w-full">${item.name}</span>
          </a>
        `;
        grid.appendChild(div);
      });
    }

    // Modal 控制
    function openAddModal() { document.getElementById('addModal').classList.remove('hidden'); }
    function closeAddModal() { 
      document.getElementById('addModal').classList.add('hidden');
      document.getElementById('shortcutName').value = '';
      document.getElementById('shortcutUrl').value = '';
    }

    // 儲存新捷徑
    function saveNewShortcut() {
      const name = document.getElementById('shortcutName').value.trim();
      let url = document.getElementById('shortcutUrl').value.trim();
      if (!name || !url) { alert('請填寫完整名稱與網址！'); return; }
      if (!url.startsWith('http')) { url = 'https://' + url; }

      userShortcuts.push({ name: name, url: url, icon: 'fa-globe', bg: 'bg-indigo-500' });
      localStorage.setItem('my_custom_shortcuts', JSON.stringify(userShortcuts));
      renderShortcuts();
      closeAddModal();
    }

    // 刪除捷徑
    function deleteShortcut(index) {
      if (confirm('確定要移除這個捷徑嗎？')) {
        userShortcuts.splice(index, 1);
        localStorage.setItem('my_custom_shortcuts', JSON.stringify(userShortcuts));
        renderShortcuts();
      }
    }

    // 時鐘
    function updateClock() {
      const now = new Date();
      document.getElementById('currentTime').innerText = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    renderShortcuts();
  </script>
</body>
</html>
