<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>myezlife 個人行動生活中樞</title>

  <!-- PWA 全螢幕 APP 靈魂設定 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="myezlife">
  <meta name="theme-color" content="#00B900">

  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .fade-in {
      animation: fadeIn 0.4s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-10 flex flex-col justify-between select-none">

  <div class="max-w-md mx-auto w-full px-4 pt-4 space-y-3.5 fade-in">

    <!-- 🌟 極簡綠色 Banner：左天氣 · 中(上日下時) · 右星期 -->
    <div class="relative overflow-hidden rounded-2xl bg-gradient-to-br from-[#00B900] to-[#008800] p-4 text-white shadow-md shadow-emerald-500/15">
      <div class="relative z-10 flex items-center justify-between">
        
        <!-- 左側：天氣圖示與氣溫 -->
        <div class="flex items-center gap-2 bg-black/10 backdrop-blur-sm px-3 py-2 rounded-xl border border-white/10">
          <div id="weatherIcon" class="text-2xl text-amber-300">
            <i class="fa-solid fa-sun animate-pulse"></i>
          </div>
          <div class="leading-none">
            <div id="weatherTemp" class="text-base font-black tracking-tight">--°C</div>
            <div id="weatherDesc" class="text-[10px] text-emerald-100 font-medium">載入中</div>
          </div>
        </div>

        <!-- 中間：上方年月日，下方大字體時間 -->
        <div class="text-center space-y-0.5">
          <div id="currentDate" class="text-[11px] font-medium text-emerald-100 tracking-wide">
            2026年10月21日
          </div>
          <div id="currentTime" class="text-2xl font-black tracking-wider leading-none">
            05:20
          </div>
        </div>

        <!-- 右側：星期 -->
        <div class="text-right">
          <div id="currentDay" class="text-base font-bold text-white tracking-wider bg-black/10 backdrop-blur-sm px-3 py-2 rounded-xl border border-white/10">
            星期三
          </div>
        </div>

      </div>
    </div>

    <!-- 🌟 智慧情境提醒區塊（根據時段自動變換） -->
    <div id="timeContextCard" class="bg-white rounded-2xl p-3.5 border border-slate-200/80 shadow-sm flex items-center gap-3">
      <div id="contextIcon" class="w-10 h-10 rounded-xl bg-amber-100 text-amber-600 flex items-center justify-center text-xl shrink-0">
        <i class="fa-solid fa-mug-hot"></i>
      </div>
      <div>
        <div id="contextTitle" class="text-xs font-bold text-slate-800">早安！開啟美好的一天</div>
        <div id="contextDesc" class="text-[11px] text-slate-500 mt-0.5">即時路況與台股動態已為您備妥，掌握致勝先機。</div>
      </div>
    </div>

    <!-- 🚗 專區一：即時交通與路況中心 -->
    <div id="trafficCard" class="bg-white rounded-2xl p-3.5 border border-slate-200/80 shadow-sm space-y-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></div>
          <span class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
            <i class="fa-solid fa-road text-emerald-600"></i> 即時交通與路況中心
          </span>
        </div>
        <span class="text-[10px] bg-emerald-50 text-emerald-600 px-2 py-0.5 rounded-md font-bold">路況正常</span>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <a href="https://1968.freeway.gov.tw/" target="_blank" class="bg-slate-50 hover:bg-sky-50 hover:text-sky-700 border border-slate-200/80 rounded-xl p-2.5 text-center transition flex items-center justify-center gap-1.5 text-xs font-bold text-slate-700">
          <i class="fa-solid fa-car text-sky-600"></i> 國道即時路況 (1968)
        </a>
        <a href="https://168.thb.gov.tw" target="_blank" class="bg-slate-50 hover:bg-amber-50 hover:text-amber-700 border border-slate-200/80 rounded-xl p-2.5 text-center transition flex items-center justify-center gap-1.5 text-xs font-bold text-slate-700">
          <i class="fa-solid fa-route text-amber-600"></i> 全台省道路況 (168)
        </a>
        <a href="https://youbike.com.tw/" target="_blank" class="bg-slate-50 hover:bg-emerald-50 hover:text-emerald-700 border border-slate-200/80 rounded-xl p-2.5 text-center transition flex items-center justify-center gap-1.5 text-xs font-bold text-slate-700">
          <i class="fa-solid fa-person-biking text-emerald-600"></i> YouBike 站點車位
        </a>
        <a href="https://ebus.gov.taipei/" target="_blank" class="bg-slate-50 hover:bg-indigo-50 hover:text-indigo-700 border border-slate-200/80 rounded-xl p-2.5 text-center transition flex items-center justify-center gap-1.5 text-xs font-bold text-slate-700">
          <i class="fa-solid fa-bus text-indigo-600"></i> 即時公車動態
        </a>
        <a href="https://tip.railway.gov.tw/tra-tip-web/tip" target="_blank" class="bg-slate-50 hover:bg-emerald-50 hover:text-emerald-700 border border-slate-200/80 rounded-xl p-2.5 text-center transition flex items-center justify-center gap-1.5 text-xs font-bold text-slate-700">
          <i class="fa-solid fa-train-subway text-emerald-600"></i> 台鐵時刻查詢
        </a>
        <a href="https://www.thsrc.com.tw/" target="_blank" class="bg-slate-50 hover:bg-orange-50 hover:text-orange-700 border border-slate-200/80 rounded-xl p-2.5 text-center transition flex items-center justify-center gap-1.5 text-xs font-bold text-slate-700">
          <i class="fa-solid fa-gauge-high text-orange-500"></i> 高鐵時刻與營運
        </a>
      </div>
    </div>

    <!-- 📈 專區二：台股大盤與財經快報 (自動判斷開收盤狀態) -->
    <div id="financeCard" class="bg-white rounded-2xl p-3.5 border border-slate-200/80 shadow-sm space-y-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-2.5 h-2.5 rounded-full bg-rose-500 animate-pulse"></div>
          <span class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
            <i class="fa-solid fa-chart-line text-rose-600"></i> 台股行情與財經快報
          </span>
        </div>
        <!-- 💡 自動依開收盤顯示狀態 -->
        <div id="taiexBadge" class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-md font-bold flex items-center gap-1">
          <i class="fa-solid fa-spinner animate-spin"></i> 載入中...
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <a href="https://tw.stock.yahoo.com/" target="_blank" class="bg-slate-50 hover:bg-rose-50 hover:text-rose-700 border border-slate-200/80 rounded-xl p-2.5 text-center transition flex items-center justify-center gap-1.5 text-xs font-bold text-slate-700">
          <i class="fa-solid fa-chart-candlestick text-rose-600"></i> Yahoo 股市行情
        </a>
        <a href="https://www.cnyes.com/" target="_blank" class="bg-slate-50 hover:bg-sky-50 hover:text-sky-700 border border-slate-200/80 rounded-xl p-2.5 text-center transition flex items-center justify-center gap-1.5 text-xs font-bold text-slate-700">
          <i class="fa-solid fa-newspaper text-sky-600"></i> 鉅亨網財經新聞
        </a>
      </div>
    </div>

    <!-- 🌟 動態情境內容區塊（早中晚自動切換） -->
    <div class="space-y-2 pt-0.5">
      <div class="flex items-center justify-between px-1">
        <h2 id="sectionTitle" class="text-xs font-bold text-slate-400 tracking-wider uppercase flex items-center gap-1.5">
          <i class="fa-solid fa-wand-magic-sparkles text-emerald-600"></i> 當前推薦工具
        </h2>
        <span id="timeBadge" class="text-[10px] bg-amber-100 text-amber-700 px-2 py-0.5 rounded-md font-bold">清晨甦醒</span>
      </div>

      <div id="dynamicContentGrid" class="grid grid-cols-2 gap-2.5">
        <!-- JavaScript 將根據早中晚自動渲染不同內容 -->
      </div>
    </div>

    <!-- 💡 Google AdSense 廣告區塊 -->
    <div class="bg-white border border-slate-200/80 rounded-2xl p-3 text-center space-y-1.5 shadow-sm mt-2">
      <p class="text-[10px] text-slate-400 font-medium">贊助商廣告</p>
      <div class="min-h-[90px] flex items-center justify-center bg-slate-50 rounded-xl overflow-hidden">
        <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5328509571221811" crossorigin="anonymous"></script>
        <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-5328509571221811" data-ad-format="auto" data-full-width-responsive="true"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
      </div>
    </div>

  </div>

  <footer class="text-center text-[11px] text-slate-400 pt-6">
    <p>© myezlife.com · 個人行動生活中樞</p>
  </footer>

  <script>
    function applyTimeBasedContext() {
      const hour = new Date().getHours();
      const grid = document.getElementById('dynamicContentGrid');
      const badge = document.getElementById('timeBadge');
      const title = document.getElementById('contextTitle');
      const desc = document.getElementById('contextDesc');
      const icon = document.getElementById('contextIcon');
      const trafficCard = document.getElementById('trafficCard');
      const financeCard = document.getElementById('financeCard');

      if (hour >= 5 && hour < 9) {
        trafficCard.style.display = 'block';
        financeCard.style.display = 'block';
        badge.innerText = '清晨甦醒';
        badge.className = 'text-[10px] bg-amber-100 text-amber-700 px-2 py-0.5 rounded-md font-bold';
        title.innerText = '早安！開啟美好的一天';
        desc.innerText = '出門前掌握路況與台股動態，掌握致勝先機。';
        icon.innerHTML = '<i class="fa-solid fa-mug-hot"></i>';
        icon.className = 'w-10 h-10 rounded-xl bg-amber-100 text-amber-600 flex items-center justify-center text-xl shrink-0';

        grid.innerHTML = `
          <a href="https://myezlife.com/ai-greeting-app/" class="bg-white p-3 rounded-xl border border-slate-200/80 shadow-sm flex items-center gap-3 hover:border-emerald-500 transition active:scale-95">
            <div class="w-9 h-9 rounded-lg bg-emerald-100 text-emerald-600 flex items-center justify-center text-base"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
            <div>
              <div class="text-xs font-bold text-slate-800">做早安圖</div>
              <div class="text-[10px] text-slate-400">一鍵產生問候</div>
            </div>
          </a>
          <a href="https://myezlife.com/index_news.html" class="bg-white p-3 rounded-xl border border-slate-200/80 shadow-sm flex items-center gap-3 hover:border-sky-400 transition active:scale-95">
            <div class="w-9 h-9 rounded-lg bg-sky-100 text-sky-600 flex items-center justify-center text-base"><i class="fa-solid fa-newspaper"></i></div>
            <div>
              <div class="text-xs font-bold text-slate-800">新聞劃重點</div>
              <div class="text-[10px] text-slate-400">捷運閱讀時事</div>
            </div>
          </a>
        `;
      } else if (hour >= 9 && hour < 18) {
        trafficCard.style.display = 'block';
        financeCard.style.display = 'block';
        badge.innerText = '白天高效';
        badge.className = 'text-[10px] bg-sky-100 text-sky-700 px-2 py-0.5 rounded-md font-bold';
        title.innerText = '專注當下，保持步調';
        desc.innerText = '台股盤中與即時路況隨時掌握，預祝投資與工作一切順利。';
        icon.innerHTML = '<i class="fa-solid fa-briefcase"></i>';
        icon.className = 'w-10 h-10 rounded-xl bg-sky-100 text-sky-600 flex items-center justify-center text-xl shrink-0';

        grid.innerHTML = `
          <a href="https://myezlife.com/index_news.html" class="bg-white p-3 rounded-xl border border-slate-200/80 shadow-sm flex items-center gap-3 hover:border-sky-400 transition active:scale-95">
            <div class="w-9 h-9 rounded-lg bg-sky-100 text-sky-600 flex items-center justify-center text-base"><i class="fa-solid fa-newspaper"></i></div>
            <div>
              <div class="text-xs font-bold text-slate-800">新聞劃重點</div>
              <div class="text-[10px] text-slate-400">掌握最新趨勢</div>
            </div>
          </a>
          <a href="https://myezlife.com/ai-greeting-app/" class="bg-white p-3 rounded-xl border border-slate-200/80 shadow-sm flex items-center gap-3 hover:border-emerald-500 transition active:scale-95">
            <div class="w-9 h-9 rounded-lg bg-emerald-100 text-emerald-600 flex items-center justify-center text-base"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
            <div>
              <div class="text-xs font-bold text-slate-800">原創工具箱</div>
              <div class="text-[10px] text-slate-400">生活好用助手</div>
            </div>
          </a>
        `;
      } else {
        trafficCard.style.display = 'none';
        financeCard.style.display = 'none';
        badge.innerText = '晚間放鬆';
        badge.className = 'text-[10px] bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-md font-bold';
        title.innerText = '今天辛苦了，好好休息';
        desc.innerText = '放慢腳步，聽首好歌或看部好劇，享受屬於自己的時間。';
        icon.innerHTML = '<i class="fa-solid fa-moon"></i>';
        icon.className = 'w-10 h-10 rounded-xl bg-indigo-100 text-indigo-600 flex items-center justify-center text-xl shrink-0';

        grid.innerHTML = `
          <a href="https://myezlife.com/goldmelody.html" class="bg-white p-3 rounded-xl border border-slate-200/80 shadow-sm flex items-center gap-3 hover:border-purple-400 transition active:scale-95">
            <div class="w-9 h-9 rounded-lg bg-purple-100 text-purple-600 flex items-center justify-center text-base"><i class="fa-solid fa-music"></i></div>
            <div>
              <div class="text-xs font-bold text-slate-800">好歌一直聽</div>
              <div class="text-[10px] text-slate-400">放鬆心靈旋律</div>
            </div>
          </a>
          <a href="https://myezlife.com/ai-greeting-app/" class="bg-white p-3 rounded-xl border border-slate-200/80 shadow-sm flex items-center gap-3 hover:border-emerald-500 transition active:scale-95">
            <div class="w-9 h-9 rounded-lg bg-emerald-100 text-emerald-600 flex items-center justify-center text-base"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
            <div>
              <div class="text-xs font-bold text-slate-800">做早安圖</div>
              <div class="text-[10px] text-slate-400">預作明日圖卡</div>
            </div>
          </a>
        `;
      }
    }

    function updateDateTime() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('currentTime').innerText = `${hours}:${minutes}`;

      const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      document.getElementById('currentDate').innerText = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;
      document.getElementById('currentDay').innerText = days[now.getDay()];
    }

    async function fetchWeather() {
      try {
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=25.0478&longitude=121.5319&current_weather=true');
        const data = await res.json();
        if (data && data.current_weather) {
          const temp = Math.round(data.current_weather.temperature);
          document.getElementById('weatherTemp').innerText = `${temp}°C`;
          document.getElementById('weatherDesc').innerText = '晴朗';
        }
      } catch (e) {
        document.getElementById('weatherTemp').innerText = '24°C';
        document.getElementById('weatherDesc').innerText = '舒適';
      }
    }

    // 📈 智慧台股狀態判斷 (盤中即時指數 vs 收盤後總結)
    async function fetchStockMarket() {
      const badge = document.getElementById('taiexBadge');
      const now = new Date();
      const hour = now.getHours();
      const minute = now.getMinutes();
      const currentTimeNum = hour * 100 + minute;

      // 判斷是否為台股開盤時間 (約 09:00 至 13:35)
      const isOpenMarket = (currentTimeNum >= 900 && currentTimeNum <= 1335);

      if (!isOpenMarket) {
        // 🌙 收盤後或盤前：顯示收盤總結與盤後分析提示
        badge.className = 'text-[10px] bg-slate-100 text-slate-600 px-2.5 py-1 rounded-lg font-bold flex items-center gap-1';
        badge.innerHTML = `<i class="fa-solid fa-moon text-indigo-500"></i> 今日收盤 · 點擊看盤後`;
        return;
      }

      try {
        // ☀️ 盤中時段：抓取即時指數
        const res = await fetch('https://query1.finance.yahoo.com/v8/finance/chart/%5ETWII?interval=1d');
        const data = await res.json();
        const meta = data.chart.result[0].meta;
        const currentPrice = meta.regularMarketPrice.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        const previousClose = meta.chartPreviousClose || meta.previousClose;
        const change = meta.regularMarketPrice - previousClose;
        const changePercent = (change / previousClose) * 100;
        
        const isUp = change >= 0;
        const colorClass = isUp ? 'bg-rose-50 text-rose-600 border border-rose-200' : 'bg-emerald-50 text-emerald-600 border border-emerald-200';
        const icon = isUp ? '<i class="fa-solid fa-arrow-trend-up"></i>' : '<i class="fa-solid fa-arrow-trend-down"></i>';
        const sign = isUp ? '+' : '';

        badge.className = `text-[10px] px-2.5 py-1 rounded-lg font-bold flex items-center gap-1.5 ${colorClass}`;
        badge.innerHTML = `${icon} 大盤 ${currentPrice} (${sign}${change.toFixed(2)}, ${sign}${changePercent.toFixed(2)}%)`;
      } catch (e) {
        badge.className = 'text-[10px] bg-slate-100 text-slate-600 px-2.5 py-1 rounded-lg font-bold flex items-center gap-1';
        badge.innerHTML = `<i class="fa-solid fa-chart-line text-rose-500"></i> 點擊下方即時看盤`;
      }
    }

    setInterval(updateDateTime, 1000);
    updateDateTime();
    fetchWeather();
    fetchStockMarket();
    applyTimeBasedContext();
  </script>
</body>
</html>
