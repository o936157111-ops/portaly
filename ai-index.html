<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的晨間行動儀表板</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 圖示 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .fade-in {
      animation: fadeIn 0.4s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12 flex flex-col justify-between">

  <div class="max-w-md mx-auto w-full px-4 pt-5 space-y-4 fade-in">

    <!-- 時段感知 Header (LINE 綠色風格) -->
    <div class="relative overflow-hidden rounded-2xl bg-gradient-to-br from-[#00B900] to-[#009900] p-4 text-white shadow-md shadow-emerald-500/10">
      <div class="relative z-10 flex items-center justify-between">
        <div>
          <div class="text-[11px] font-semibold text-emerald-100 flex items-center gap-1">
            <i class="fa-solid fa-sun"></i> 晨間時段 APP 集中導航
          </div>
          <h1 class="text-lg font-extrabold tracking-tight mt-0.5">
            5:20 晨光時間 · 一頁開完常用 APP
          </h1>
        </div>
        <div class="text-right">
          <span id="currentTime" class="text-xl font-black tracking-wider">05:20</span>
        </div>
      </div>
    </div>

    <!-- 🌟 晨間必備APP (點擊直接喚起手機內建實體 APP) -->
    <div class="space-y-2.5">
      <div class="flex items-center justify-between px-1">
        <h2 class="text-xs font-bold text-slate-400 tracking-wider uppercase flex items-center gap-1.5">
          <i class="fa-solid fa-mobile-screen-button text-emerald-600"></i> 我的晨間必用 APP (直達車)
        </h2>
        <button onclick="openAddModal()" class="text-xs bg-[#00B900] hover:bg-[#009900] text-white font-bold px-2.5 py-1 rounded-lg transition flex items-center gap-1 shadow-sm">
          <i class="fa-solid fa-plus"></i> 自訂 APP
        </button>
      </div>

      <!-- 捷徑網格清單 -->
      <div id="shortcutGrid" class="grid grid-cols-3 gap-2.5">
        <!-- JavaScript 動態渲染 -->
      </div>
    </div>

    <!-- 🌟 站內原創線上工具 -->
    <div class="space-y-2 pt-2">
      <h2 class="text-xs font-bold text-slate-400 tracking-wider uppercase px-1 flex items-center gap-1.5">
        <i class="fa-solid fa-wand-magic-sparkles text-emerald-600"></i> 本站線上專屬工具
      </h2>
      <div class="grid grid-cols-2 gap-2.5">
        <a href="https://myezlife.com/ai-greeting-app/" target="_blank" class="bg-white p-3 rounded-xl border border-slate-200/80 shadow-sm flex items-center gap-3 hover:border-emerald-500 transition active:scale-95">
          <div class="w-9 h-9 rounded-lg bg-emerald-100 text-emerald-600 flex items-center justify-center text-base">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
          </div>
          <div>
            <div class="text-xs font-bold text-slate-800">做早安圖</div>
            <div class="text-[10px] text-slate-400">原創背景直出</div>
          </div>
        </a>

        <a href="https://myezlife.com/index_news.html" target="_blank" class="bg-white p-3 rounded-xl border border-slate-200/80 shadow-sm flex items-center gap-3 hover:border-sky-400 transition active:scale-95">
          <div class="w-9 h-9 rounded-lg bg-sky-100 text-sky-600 flex items-center justify-center text-base">
            <i class="fa-solid fa-newspaper"></i>
          </div>
          <div>
            <div class="text-xs font-bold text-slate-800">新聞劃重點</div>
            <div class="text-[10px] text-slate-400">捷運閱讀時事</div>
          </div>
        </a>
      </div>
    </div>

    <!-- 💡 Google AdSense 廣告區塊 -->
    <div class="bg-white border border-slate-200/80 rounded-2xl p-3 text-center space-y-1.5 shadow-sm mt-3">
      <p class="text-[10px] text-slate-400 font-medium">贊助商廣告</p>
      <div class="min-h-[90px] flex items-center justify-center bg-slate-50 rounded-xl overflow-hidden">
        <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5328509571221811" crossorigin="anonymous"></script>
        <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-5328509571221811" data-ad-format="auto" data-full-width-responsive="true"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
      </div>
    </div>

  </div>

  <!-- 新增 APP 彈跳視窗 Modal -->
  <div id="addModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-xl">
      <div class="flex items-center justify-between border-b pb-3">
        <h3 class="font-bold text-slate-800 text-sm">自訂新增 APP 直達車</h3>
        <button onclick="closeAddModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">APP 名稱</label>
          <input type="text" id="shortcutName" placeholder="例如：Instagram" class="w-full text-sm px-3 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-slate-50">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">喚起連結或網址</label>
          <input type="text" id="shortcutUrl" placeholder="例如：instagram:// 或 https://..." class="w-full text-sm px-3 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-slate-50">
        </div>
      </div>
      <div class="flex gap-2 pt-2">
        <button onclick="closeAddModal()" class="flex-1 bg-slate-100 text-slate-600 font-bold py-2.5 rounded-xl text-xs">取消</button>
        <button onclick="saveNewShortcut()" class="flex-1 bg-[#00B900] hover:bg-[#009900] text-white font-bold py-2.5 rounded-xl text-xs shadow-sm">確認新增</button>
      </div>
    </div>
  </div>

  <footer class="text-center text-[11px] text-slate-400 pt-6">
    <p>© myezlife.com · 晨間行動儀表板</p>
  </footer>

  <script>
    // 預設帶有 Deep Link (直達手機 APP) 的清單
    let defaultShortcuts = [
      { name: 'Duolingo', url: 'duolingo://', fallback: 'https://www.duolingo.com/', icon: 'fa-language', bg: 'bg-emerald-500' },
      { name: 'LINE', url: 'line://', fallback: 'https://line.me/tw/', icon: 'fa-line', brand: true, bg: 'bg-[#00B900]' },
      { name: 'WhatsApp', url: 'whatsapp://', fallback: 'https://web.whatsapp.com/', icon: 'fa-whatsapp', brand: true, bg: 'bg-[#25D366]' },
      { name: 'YouTube', url: 'youtube://', fallback: 'https://www.youtube.com/', icon: 'fa-youtube', brand: true, bg: 'bg-rose-600' },
      { name: 'FB', url: 'fb://', fallback: 'https://www.facebook.com/', icon: 'fa-facebook', brand: true, bg: 'bg-blue-600' },
      { name: 'IG', url: 'instagram://', fallback: 'https://www.instagram.com/', icon: 'fa-instagram', brand: true, bg: 'bg-gradient-to-tr from-amber-500 via-rose-500 to-purple-600' }
    ];

    let userShortcuts = JSON.parse(localStorage.getItem('my_morning_apps')) || defaultShortcuts;

    function renderShortcuts() {
      const grid = document.getElementById('shortcutGrid');
      grid.innerHTML = '';

      userShortcuts.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'relative group bg-white p-3 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col items-center justify-center gap-1.5 hover:border-emerald-400 transition';
        
        div.innerHTML = `
          <button onclick="deleteShortcut(${index})" class="absolute -top-1.5 -right-1.5 w-5 h-5 bg-rose-500 text-white rounded-full text-[10px] flex items-center justify-center opacity-0 group-hover:opacity-100 transition shadow-sm" title="刪除">
            <i class="fa-solid fa-xmark"></i>
          </button>
          
          <button onclick="openApp('${item.url}', '${item.fallback || item.url}')" class="flex flex-col items-center justify-center gap-1.5 w-full text-decoration-none text-inherit">
            <div class="w-11 h-11 rounded-2xl ${item.bg || 'bg-emerald-500'} text-white flex items-center justify-center text-xl shadow-sm">
              <i class="${item.brand ? 'fa-brands' : 'fa-solid'} ${item.icon || 'fa-mobile-screen'}"></i>
            </div>
            <span class="text-xs font-bold text-slate-800 truncate max-w-full">${item.name}</span>
          </button>
        `;
        grid.appendChild(div);
      });
    }

    // 智能打開APP (若手機沒裝則跳轉網頁)
    function openApp(appUrl, webUrl) {
      const now = Date.now();
      window.location.href = appUrl;
      setTimeout(() => {
        if (Date.now() - now < 2000) {
          window.location.href = webUrl;
        }
      }, 1000);
    }

    function openAddModal() { document.getElementById('addModal').classList.remove('hidden'); }
    function closeAddModal() { 
      document.getElementById('addModal').classList.add('hidden');
      document.getElementById('shortcutName').value = '';
      document.getElementById('shortcutUrl').value = '';
    }

    function saveNewShortcut() {
      const name = document.getElementById('shortcutName').value.trim();
      let url = document.getElementById('shortcutUrl').value.trim();
      if (!name || !url) { alert('請填寫完整名稱與連結！'); return; }

      userShortcuts.push({ name: name, url: url, icon: 'fa-globe', bg: 'bg-emerald-600' });
      localStorage.setItem('my_morning_apps', JSON.stringify(userShortcuts));
      renderShortcuts();
      closeAddModal();
    }

    function deleteShortcut(index) {
      if (confirm('確定要移除這個 APP 嗎？')) {
        userShortcuts.splice(index, 1);
        localStorage.setItem('my_morning_apps', JSON.stringify(userShortcuts));
        renderShortcuts();
      }
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('currentTime').innerText = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    renderShortcuts();
  </script>
</body>
</html>
