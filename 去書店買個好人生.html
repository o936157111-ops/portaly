<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>去書店買個好人生 - 最終視覺修復版</title>
    <style>
        :root { --bg: #f4f1ea; --paper: #ffffff; --red: #8b0000; }
        body { background-color: var(--bg); font-family: "Microsoft JhengHei", sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        #content-container { background-color: var(--paper); padding: 40px; margin: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 750px; width: 92%; border-radius: 12px; line-height: 1.9; min-height: 500px; word-wrap: break-word; }
        
        .controls { display: flex; gap: 15px; width: 92%; max-width: 750px; margin-bottom: 30px; }
        button { flex: 1; padding: 16px; font-size: 17px; cursor: pointer; border: none; background-color: #e0ddd5; border-radius: 8px; font-weight: bold; }
        button:disabled { opacity: 0.3; }
        .page-info { color: #666; margin-bottom: 40px; font-size: 0.95em; }

        /* 電腦版強制視覺樣式：紅條與灰底 */
        .gold-quote {
            display: block !important;
            background-color: #f9f9f9 !important;
            border-left: 10px solid #8b0000 !important;
            padding: 20px 25px !important;
            margin: 25px 0 !important;
            font-weight: bold !important;
            color: #111 !important;
            font-size: 1.1em !important;
            border-radius: 0 8px 8px 0;
        }
    
        h2 { color: var(--red); border-bottom: 3px solid var(--red); padding-bottom: 12px; margin-top: 0; font-size: 1.6em; font-weight: normal; }
        .gold-quote {
            display: block;
            background-color: #f2f2f2 !important;
            border-left: 10px solid #8b0000 !important;
            padding: 20px 25px !important;
            margin: 30px 0 10px 0 !important;
            font-weight: bold;
            color: #111;
            font-size: 1.1em;
            border-radius: 0 8px 8px 0;
            line-height: 1.7;
        }

    </style>
</head>
<body>
    <div id="content-container"><div id="page-content"></div></div>
    <div class="controls">
        <button id="prevBtn" onclick="changePage(-1)">上一頁</button>
        <button id="nextBtn" onclick="handleNext()">下一頁</button>
    </div>
    <div class="page-info" id="pageNumber"></div>

    <script>
        // --- 核心邏輯 ---
        let currentPage = 0;
        let isUnlocked = false;

        function getDailyPassword() {
            const now = new Date();
            return now.getFullYear() + String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0');
        }

        function handleNext() {
            if (currentPage === 0 && !isUnlocked) {
                const input = prompt(""); // 密碼框完全空白
                if (input === getDailyPassword()) {
                    isUnlocked = true;
                    changePage(1);
                } else if (input !== null) {
                    alert("密碼不正確");
                }
            } else {
                changePage(1);
            }
        }

        function renderPage() {
            const page = pages[currentPage];
            // 自動將內容中的 blockquote 換成帶有強效樣式的 gold-quote div
            let fixedContent = page.content.replace(/<blockquote[^>]*>/g, '<div class="gold-quote">').replace(/<\/blockquote>/g, '</div>');
            
            document.getElementById('page-content').innerHTML = "<h2>" + page.title + "</h2>" + fixedContent;
            document.getElementById('pageNumber').innerText = "第 " + (currentPage + 1) + " 頁 / 共 " + pages.length + " 頁";
            document.getElementById('prevBtn').disabled = (currentPage === 0);
            document.getElementById('nextBtn').disabled = (currentPage === pages.length - 1);
            window.scrollTo(0, 0);
        }

        function changePage(delta) {
            currentPage += delta;
            renderPage();
        }

        // --- 書籍資料區 ---
        const pages = [
        {
                "title": "推薦序 跟千田琢哉學 一千個讀書的好處",
                "content": "<p>《人生路引》作者楊斯棓</p><p>千田琢哉是日本書市的奇蹟，他一生與書締結的緣分是另一個奇蹟，念大學前，除了漫畫，自述「沒讀過任何一本書」。大學四年，他卯起來跟時間賽跑，「千萬日圓買萬本書」，買多少書其實只要有錢，買著擺著，很多人也能做到，但千田琢哉「把這些書全部讀完了」，他不只是只「聲稱讀完多少書」，而是真有巨量產出，出了一百七十本書。</p><p>這本《去書店買個好人生》，乍看有八十九篇文章，其實每篇都觸動我十幾個關於讀書的想法，相乘下來，就是我文章標題說的「一千個讀書的好處」。</p><p>他說：「幫助你面對未來人生當中未知難題的所有提示，全都已經被這個世界上的某個人寫進書裡了。」</p><p>何飛鵬社長也曾分享類似觀點，當他在創業、做所有事情遇到疑惑的時候，「就會透過閱讀去解決問題」。</p><p>我常聽到身邊的人吶喊：時間不夠、錢不夠用、書讀得慢。</p><p>時間不夠</p><p>老是喊著「時間不夠」卻不思改變的人，時間只會越來越不夠用，甚至效率越來越差。若苦於「時間不夠用」，本書就給人不少啟示。</p><p>想辦法增加自己可以掌握的時間，或者提升自己單位時間的讀書或做事效率。</p><p>如何增加自己可以掌握的時間？越來越多人願意「用錢買別人時間」，我覺得甚至應該：「用比合理再幸福一點點的價格去買別人時間」。</p><p>然而，若父親洗腎完畢，我有時得出門先去超商寄東西，再去醫院接他。如果我全程走路，也是要四十分鐘，如果我先搭車到超商，下車寄物，再走路去醫院，也會多耗掉一段時間。</p><p>我曾把超商設定為中途停靠點，讓司機等我（三分鐘內 uber 規定不會多計費），寄物後即刻上車到醫院。</p><p>有的司機曾面露不悅，在我從停靠點上車後，疾駛到目的地，一語不發。我本來覺得停靠三分鐘是其公司明定的政策，其他駕駛也無異議，為什麼獨獨你脾氣這麼大？後來我反過來想，他開車載我，有沒有這個中途停靠點，賺的是一樣或幾乎差不多的錢，他覺得停下來等你這段時間吃了虧，他的心，委屈了。</p><p>於是我改變作法，我上車就跟駕駛說我有設定中途停靠點，勢必耽擱時間，下車後會線上添些小費，萬一我下車遇到排隊隊伍長了點，我小費會再多給一些。自此，無往不利。</p><p>我念小學時，每當月考名次不如預期，家母總會叫我減少打電玩的時間，於情於理，我都難以接受。</p><p>後來我讀了一本書，才發現居然有家長為了幫他們的孩子爭取讀書或休息時間，毅然選擇搬家。</p><p>槓精可能會說：「那是因為他家有錢！」</p><p>不，其實關鍵不是「有錢」，他們是把手上有限的資源集中在一個面向。客觀來論，他們也絕非有錢人。決定搬家的家長，是一對果農夫婦，他們認為「通勤上學」浪費孩子的讀書時間，便舉家搬往都市。</p><p>槓精也許繼續要說：「小時了了，大未必佳！」</p><p>試想，這對父母帶頭認真思考時間配置，認真對待時間，豈有犬子犬女？</p><p>故事中的主角一，日後成了皮膚科專科醫師。</p><p>故事中的主角二，日後是台大醫院的副教授兼主治醫師。</p><p>錢不夠用</p><p>每當汽油、布丁、泡麵漲價，有些主播放送新聞時一定會帶頭喊著「什麼都漲，就是薪水不漲」。這種哀頹話，最容易彼此感染。</p><p>家父曾有一位大學同學開設診所，結果丈母娘要求讓小姨子來診所上班。</p><p>小姨子靠勢有長輩當靠山，上班遲到、下班提早、中間還出去買點心麻荖，一晃眼三十年，家父同學忍她三十年，憂鬱三十年。</p><p>此例就是最不長進的員工樣貌，打混都能領固定薪，那認真何用？</p><p>試想，如果你是一間小公司的老闆，你願意幫哪一種員工加薪？很簡單，無非是幫公司創造更大價值的員工。</p><p>我舉一例，曾有一個沒有顯赫學經歷的青年到一間貿易公司上班。</p><p>過去他那個職位的人，大多機械性地重複前人的「工序」而已。但他不一樣。</p><p>「寄信寄了幾天，他發現，小小一封信超過二十公克，得多付一點錢，信件量一大，就是一大筆錢。他決定想辦法省下超額的郵資。」</p><p>心裡想著「公司又不是我的，誰管要不要幫公司省錢」、「盤算如何幫公司省錢」、「著手行動幫公司省錢」，這三種員工，你會聘哪一種？</p><p>此例主角「先到文具行找紙張，自己動手做信封，把重量控制在二十公克以下。接著他又想，該如何吸引國外客戶在眾多信件中拆開公司的信。捨棄過去省時方便蓋大宗郵件郵戳章的方式，他精心挑選青天白日滿地紅的郵票，一封信需要七元郵資，他還得分五元、二元貼兩次。加工完成，信封煥然一新，又幫公司省下一筆錢。」</p><p>不難發現，他從年輕時就是一位「注意力商人」，擅長用更少的成本同時吸引他人注意力，難怪生意越做越大，他就是圓神出版集團的老闆簡志忠先生。</p><p>而我行文中提及的《注意力商人》其實是一部名著，作者吳修銘的所有作品，我也非常推薦。</p><p>書讀得慢</p><p>近年因為我自費推廣臉友閱讀，常有廣播、電視、自媒體訪問我，主持人常常會帶到一題聽眾經常捎來的問題叫：「我讀得慢，怎麼辦？」</p><p>讀得慢，不要急，不要認為這一定不對，不是所有的書，都需要快快讀，譬如王定國的小說，就要慢慢讀。</p><p>有的書就是需要慢慢讀，跟作者對話，產生獨一無二的體悟，這才叫讀書。</p><p>有些書可以有技巧的讀快些，如何精進技巧，也另有書籍分享，譬如千田琢哉或是樺澤紫苑的作品，</p><p>不擅長獨處、不懂即時感謝、不知不覺堆積了書而不知所措，本書亦都有答案。</p><p>出社會後讀書，我很少去看別人的重點摘要，因為別人跪拜的重點，或許早就是我的已知，讀這些重點，於我無益；而別人沒有列為重點內容，說不定是我的軟肋，若只圖重點摘要，就會漏讀很多重點。</p><div class=\"gold-quote\">讀書是一趟旅程，我們如果只讀別人的重點摘要，很像是去看別人的旅遊臉書文。<br>就像有種樹詩人美譽的李敏勇說的：「踏出腳步，才會當開採」，踏出腳步，自己學著跟作者對話的讀書節奏，往往能獲得最碩大甜美的果實！</div>"
        },
        {
                "title": "前言 我的母校是仙台的丸善與金港堂",
                "content": "<p>我要跟大家坦白一件讓你們吃驚的事情。我在上大學之前，除了漫畫之外，沒有讀過任何一本書。我沒有讀過書，所以要我寫三張稿紙的讀書心得，根本就是酷刑。我抱持著強烈的不安與自卑，覺得自己說不定，不，有相當高的機率，這輩子沒有讀過書就結束了。</p><p>這樣的我，卻在大學這四年，花了一千萬日圓，買了超過一萬本書。</p><p>而且我把這些書全部讀完了。</p><p>我運用了大學生的特權，與祖先給我的強韌肉體，同時兼了好幾份高薪的打工，父母也寄來龐大的生活費。我把這些錢全部拿來買書了。</p><p>我的轉變實在太大了，父母與高中時的朋友都非常地驚訝。</p><p>那些知道我高中時是什麼樣子的人，會懷疑我是不是把錢用在什麼奇怪的地方，也不是毫無道理。</p><p>我之所以會開始讀書，是因為某天偶然走進仙台的丸善書店看漫畫，卻錯拿成中谷彰宏的《與昨天的自己告別》。</p><p>這本書使用強而有力的大字印刷，精煉的文章彷彿刀鋒般銳利，所以即使是以前只看過漫畫的我，也能一頭栽進去把整本書讀完。</p><p>我讀完之後，過了一會兒突然回過神來。</p><p>「哇！這不就是我這輩子讀的第一本書嗎！」</p><p>我就這樣小跳步走向收銀台。</p><p>從這一天起，我就脫胎換骨，變成幾乎脫離常軌的「啃書蟲」。</p><p>不管是下雨天還是下雪天，我都日復一日持續造訪仙台的丸善與金港堂書店，不斷地買下所有摸到的書，無論哪種類別。</p><p>我現在真心認為，丸善與金港堂就是我的母校。</p><p>如果我想看的書沒有在書店擺出來，我就去大學的合作社，一次訂購幾十本。訂到合作社的阿姨都認識我了。</p><p>現在回過頭來看，就連她擔心地問我：「這本要三萬日圓，真的沒問題嗎？」都成了美好的回憶。</p><p>店員一定以為我是不知道哪裡來的敗家子。</p><p>我持續讀著書，就像徹底乾涸的荒漠，飢渴地吸收水分一樣。我絲毫沒有「只要繼續讀下去，就能變得有錢」，或是「將來可以寫書」之類的念頭。畢竟當時的我也不具備擁有這種野心的智慧。</p><p>不過，就結果來看，有些事情我現在就可以斬釘截鐵地告訴你。</p><p>幫助你面對未來人生當中未知難題的所有提示，全都已經被這個世界上的某個人寫進書裡了。</p><div class=\"gold-quote\">希望你也務必單純地理解、由衷去感受這件簡單的事情。<br>雖然這本書大約是在十年前寫成的，但即使再次虛心坦然地回過頭來讀，我的本質也完全沒有任何改變。</div>"
        },
        {
                "title": "Chapter 1",
                "content": "<p>只要讀書，</p><div class=\"gold-quote\">不管時代如何改變，<br>都能靠著智慧活下去</div>"
        },
        {
                "title": "01 因為閱讀，所以能夠騰出寬裕的時間",
                "content": "<p>我看過許多許多公司，在此想要公佈一項驚人的發現。</p><p>那就是大家忙得不可開交，工時盲目增加的公司，其實正朝著倒閉直奔而去。</p><p>這樣的公司在高峰過後，只會從斜坡滾落。所以必須小心忙碌的公司。</p><p>人也是同樣的道理。</p><p>剛起步的時候，誰都會因為對工作不熟悉而顯得忙碌，但這樣的狀態如果持續下去，就會變成沒有任何長進的證據。</p><p>總是處在忙碌狀態的人無法擁有長期的財富。</p><p>就算現在忙於工作，看似賺得很多，總有一天也必定會變得貧窮。因為你有多忙碌，就代表你有多常被他人使喚。</p><p>一個人如果擁有盡情閱讀的充裕時間，就能獲得良好的智慧，財富也會滾滾來。</p><p>而我說的不只是閱讀。</p><p>「我忙到沒時間做〇〇事情」，如果有人將這句話當成口頭禪，請注意不要離他太近。</p><p>時間的貧困，就和金錢的貧困一樣，是一種傳染病。</p><p>如果〇〇是你真正喜歡的事情，應該排除萬難優先進行。</p><p>只要把〇〇視為第一優先，就能創造出無限的時間。</p><p>若是有人說他忙到沒時間閱讀，就代表他對閱讀不是那麼感興趣。</p><div class=\"gold-quote\">與其把財富自由當成目標，更應該把時間自由當成目標。<br>有時間閱讀的人，也更容易變成富有的人。</div>"
        },
        {
                "title": "02 總是嘗試在閱讀的人，就能遇到有趣的書",
                "content": "<p>有些人很常把「最近沒什麼有趣的書」當成口頭禪，不只是書，電影也是。</p><p>仔細觀察這些人，他們全都沒讀過最新出版的書籍，也沒有看最新上映的電影。</p><p>「大量閱讀，或是大量觀影的人，絕對不會說『最近沒什麼有趣的產品』」。</p><p>任何人都有同樣的機會邂逅值得反覆閱讀的書籍，或是能夠反覆欣賞的電影。</p><p>只要在一百本書裡遇到一本，或是在一百部電影裡遇到一部能夠反覆品味的作品，就已經值得慶幸。</p><p>換句話說，必須征服數量如此龐大的作品，才能遇到這 1% 的作品有趣佳作。</p><p>或許你會擔心「這麼一來，剩下的九九％不是在浪費時間嗎？」其實沒有必要。</p><p>當你遇到那一％的瞬間，就會發現其餘的九九％完全不是浪費。</p><p>遇到這「一％」的捷徑，就是把九九％的路徑全部繞過一遍。</p><p>沒有充足的量，只想輕鬆追求品質，就無法充分品味人生。</p><p>因為這就像在推理小說的第一行就公布犯人是誰一樣。</p><p>繞遠路、大量體驗，在人生當中比什麼都更重要。</p><div class=\"gold-quote\">先體驗龐大的量，就能獲得高檔的品質。<br>而得到品質之後，就會想要體驗更多的量。</div>"
        },
        {
                "title": "03 閱讀比加班更能增加薪水",
                "content": "<p>我從來沒有看過貧窮的閱讀者。</p><p>閱讀者總而言之就是經常買書。</p><p>但我的意思並不是指為了購買大量書籍，需要一定程度的財力，所以不會貧窮。</p><p>我的意思是，當我與這些閱讀者熟稔起來，仔細聽他們說話之後，就會發現他們從年輕、不出名而且貧窮的時候，就已經把全身板下的積蓄拿去買書來讀。</p><p>持續閱讀大量的書籍，滿溢而出的知識就會在某個時間點進化成智慧。</p><p>知識只是片段。知識本身不會成為財富，頂多只能讓你在學生時代的考卷上寫下正確答案。</p><p>出社會之後就像開書考試，能夠盡情查詢免費的知識。</p><p>而智慧則是知識×知識。</p><p>多種知識產生化學反應，創造出另一種新的觀點。「這件事情也可以從這個角度看」，這就是智慧。</p><p>擁有智慧的人會帶給周圍快感，所以能夠獲得地位、募集金錢作為回報，這個社會就是如此運作。</p><p>無論古今東西皆然。</p><p>比起關在公司裡無止盡地加班，讀書學習更有機會出人頭地，獲得更多的薪水。</p><div class=\"gold-quote\">我唯一可以確定的是沒有貧窮的閱讀者。<br>貧窮的時候更應該買書投資智慧。</div>"
        },
        {
                "title": "04 閱讀後，實踐的成功機率格外地高",
                "content": "<p>我的意思並不是要大家不能小看紙上談兵。</p><p>只要是認真讀書的人就會發現，現代幾乎沒有只教大家紙上談兵的書籍。</p><p>因為現在書這麼難賣，如果內容不夠實際、不具有實踐性，讀者根本不屑一顧。</p><p>無論是作者還是編輯，都發揮自己全部的人生經驗，在書裡傾注所有的智慧。</p><p>紙上談兵的專家所出版的書籍越來越賣不出去，但實際做出成績的人所寫的書，卻變得更加暢銷。</p><p>而且就算是做出成績的人，只介紹表面技巧的書也越來越不受青睞。</p><p>抽象、酷炫的商品能夠熱賣的時代已經結束，做出實績的人公開所有內幕的書籍變得暢銷。</p><p>所以現在對讀者而言正是最受惠的時代。</p><p>世界正在變好。</p><p>挑戰任何新事物的時候，有沒有事先大量閱讀，得到的結果將會出現天壤之別。</p><p>如果這個時候還有小看閱讀，覺得「反正讀書都是紙上談兵」的對手，反而應該喜出望外。</p><p>因為這樣的人，就等於沒有站上起跑線。</p><div class=\"gold-quote\">沒有閱讀就實踐只是浪費時間。<br>輕視閱讀的人，根本連起跑線都沒站上去。</div>"
        },
        {
                "title": "05 管理人都讀暢銷書",
                "content": "<p>有些人會說，我才不讀暢銷書呢！這些人通常態度傲慢，架子擺得特別高。</p><p>態度倨傲的人雖然一部分是因為警戒，但也是缺乏進取心的證明。</p><p>暢銷書確實不一定有趣，但一本書會暢銷，必定有它的道理。這本書必定擁有與其他許多滯銷的商品截然不同的特質。</p><p>一本暢銷書裡，混和了所有參與者的汗水、淚水、執著，即使不讀，先買起來也不會吃虧。</p><p>當你在工作上必須思考企劃的時候，在身邊擺一本暢銷書翻閱，一定能夠提供你線索。</p><p>暢銷書提供我們智慧的端倪，請你試著仔細觀察所有細節。</p><p>所有大顯身手的管理人，都喜歡閱讀暢銷書。</p><p>反之，遲遲無法出頭天的人，則多半對暢銷書抱持著批判的態度。</p><p>閱讀暢銷書的人將越來越富有，抱怨暢銷書的人則越來越貧窮。</p><div class=\"gold-quote\">管理人都喜歡閱讀流行的暢銷書。<br>裁員候補名單上的人則會聚集在一起批評。</div>"
        },
        {
                "title": "06 出色的小說就是出色的商業書",
                "content": "<p>就如同書籍沒有階級之分，小說與商業書的分界也沒什麼意義。</p><p>這種無意義的分類，就交給書評吧！</p><p>為了自由自在地生活，做自己人生的主人，無論讀小說還是讀商業書，都能得到許多發現。</p><p>出色的小說是出色的商業書，而出色的商業書就是出色的小說。</p><p>莎士比亞的小說也蘊藏著許多商業上的線索，那已經不是小說，而是極致的自我啟發書。</p><p>兒童文學家吉野源三郎在一九三七年出版的《你想活出怎樣的人生？》後來也推出了許多版本，二〇一七年甚至還一併發行了漫畫版。</p><p>這些版本都成為熱門暢銷書，想必也有很多人在讀了漫畫版之後，也想要讀讀看文字版。</p><p>完全不需要在意開始閱讀的契機。</p><p>只需要拿起感興趣的書，從頭到尾貪婪地閱讀，一定能夠遇到你的命定之書。</p><p>就在那些書評家囉哩八唆的時候，你早就已經想讀什麼就讀什麼了，管它是小說還是商業書。</p><p>十年之後，你們的立場就會完全反轉，那些「自詡為書評家」的人消失蹤影，而在媒體上接受訪問的，或許將會是你。</p><div class=\"gold-quote\">出色的小說就是出色的商業書。<br>出色的商業書就是出色的小說。</div>"
        },
        {
                "title": "07 不需要在意閱讀的速度",
                "content": "<p>在意閱讀速度的人，並不是真心喜歡閱讀。</p><p>因為這些人喜歡的不是讀書，而是喜歡藉由快速閱讀，被周圍的人吹捧「好厲害！」 如果想被周圍的人稱讚「好厲害！」就等做出成績再說吧！</p><p>為了面子閱讀的人，永遠比不上因為愛書而閱讀的人。</p><p>只為面子讀書，必定會在中途遇到挫折，最後將因為感到疲倦而再也讀不下去。</p><p>難得有讀書的熱情，只因為感到疲倦就放棄實在太可惜。</p><p>與其落到這番下場，還不如一開始就不要為了面子讀書。</p><p>不要聽信奇怪的技巧論，請等待強烈渴求書本的衝動湧上來。</p><p>讀書的速度不管多慢都無所謂。</p><p>就算被批評「你讀書的速度真的很慢」，也請面帶微笑，抬頭挺胸慢慢讀。</p><p>比起匆匆翻閱，一頁一頁花時間仔細讀的人，看起來更知性、更聰明。</p><p>只要依照自己的步調，盡情閱讀自己喜歡的書就夠了。</p><p>因為沒有會不會速讀的人，只有能不能一輩子持續閱讀的人。</p><div class=\"gold-quote\">沒有讀得快的人與讀得慢的人，<br>只有讀書的人與不讀書的人。</div>"
        },
        {
                "title": "08 漫畫也是一種不折不扣的類別",
                "content": "<p>「漫畫不入流‧‧‧‧‧‧」這種說法對書本太失禮了。</p><p>不是對漫畫失禮，而是對所有的書都失禮。</p><p>日本的漫畫即使在全球也有最高水準的評價。</p><p>日本的漫畫在全世界的評價比在國內更高，真是不可思議。</p><p>不只漫畫，還有許多東西也是，在日本不太受青睞，在海外卻獲得好評，反過來傳回日本才受到重視。</p><p>如果看輕世界級的漫畫，覺得「漫畫不入流」，就代表更看輕漫畫以外的書籍。</p><p>閱讀漫畫時請試著挺直背脊，端正坐姿。 你</p><p>想必會為漫畫的水準之高而感到驚訝。</p><p>越是覺得「漫畫不入流」的人，越是會對漫畫著迷。</p><p>被漫畫打的孩子，將來會進研究所實現夢想。</p><p>話說回來，漫畫改變世界的案例也不在少數。</p><p>如果喜歡漫畫，就徹底地繼續讀下去吧！</p><p>既然要讀，乾脆就從星期五晚上住進網咖，花個幾年的時間把店裡的漫畫全部讀完。</p><p>如果一直讀漫畫讀累了，改讀哲學書或自我啟發書換換口味，也是不折不扣的閱讀。</p><div class=\"gold-quote\">讀漫畫也是不折不扣的閱讀。<br>只要抬頭挺胸持續把所有漫畫讀完即可。</div>"
        },
        {
                "title": "09 如何培養愛書的孩子",
                "content": "<p>「不要光顧著玩，快去讀書！」不斷地對孩子這麼說，會導致他們討厭閱讀。</p><p>「快去做什麼什麼！」就連大人也不喜歡被如此強迫，不能強迫對方做他討厭的事情。</p><p>要求孩子讀書非常簡單，只要給孩子看到你平常愉快閱讀的樣子就可以了。</p><p>可以的話，躲起來偷偷讀，更能激發孩子的好奇心。</p><p>因為孩子會照樣模仿你的行為。</p><p>他們會覺得「爸爸偷偷躲起來讀得那麼開心，一定很有趣。」</p><p>如果你平常都躺在沙發上看電視，孩子也會完全模仿你，關在自己的房間裡，整天躺在床上打電動。</p><p>這就是繭居族。</p><p>孩子會完全反映父母的所作所為。</p><p>「我不記得把你養成這樣！」沒有比這句指責更不負責任的藉口了。</p><p>就是因為大人像這樣找藉口，才會有越來越多的孩子完全模仿大人，只懂得把過錯推到別人身上。</p><p>如果培養出就算不叮嚀也能主動讀書的孩子，就足以從家庭教育畢業。</p><p>嘮嘮叨叨地要求孩子「去學習」「去讀書」，才是最糟糕的教育。</p><div class=\"gold-quote\">孩子們嚮往父母偷偷摸摸從事的活動。<br>只要大人讀得開心，孩子也會喜愛閱讀。</div>"
        },
        {
                "title": "10 推薦的書只有自己能找到",
                "content": "<p>別人擅自推薦書給你，你也只好接受，但是你不能主動要求對方推薦。</p><p>「你推薦哪本書？」這個問題沒有意義。</p><p>即使對方真的推薦了，下次再見到發問的人時，他也不會真的去讀。</p><p>再加上每個人推薦的書都不一樣，推薦的書通常都不是對方想要讀的。</p><p>這不是推薦者的責任，而是發問者的責任。</p><p>找出改變自己命運的那本書，就像在尋寶。</p><p>如果在尋寶的時候，立刻有人搜尋告訴你「挖這裡，汪汪」，沒有什麼比這樣的過程更無趣的了。</p><p>就像一開始就把魔術手法告訴你一樣，人生這場魔術也是，不能突然要求對方揭開祕密。</p><p>只要持續閱讀喜愛的書籍，自然而然就會接近你的命定之書。</p><p>無論繞了多遠的路，邂逅這本書的時間點都會是最佳時機。</p><p>如果沒有準備好接受成長，你就不會遇到這本書。</p><p>自己的命定之書，只有自己走過相同的人生道路才會知道。</p><p>換句話說，除了自己之外，沒有其他人能夠找得到。</p><div class=\"gold-quote\">推薦的書只有自己才能發現。<br>沒有什麼比向他人尋求命定之書更可惜。</div>"
        },
        {
                "title": "11 關鍵時刻，只有語言的力量能夠幫助自己",
                "content": "<p>我至今已經與超過三千名管理者對話，這些管理者的職位都在正規的董事之上。</p><p>挑起組織重擔的他們或她們，人生都經歷過驚滔駭浪，曾想過要自殺的也不只一、兩個。</p><p>如果是經歷過漏夜躲債的，那就更多了。</p><p>為什麼他們在遇到我之前，能夠活下去呢？</p><p>這是因為有一些話拯救了他們。</p><p>這些話並不是所謂的「救命格言」。</p><p>救贖的話因人而異，也會根據場合與時間點而截然不同。</p><p>為了在關鍵時刻遇見幫助自己的話，平常就必須接受名言佳句的洗禮。</p><p>如果平常就能沉浸在名言佳句的環境，腦中就會長出許多「鉤子」。就算自己沒有意識到，這些「鉤子」也能自動在腦中形成。</p><p>所以必須讀書、透過網路學習、與他人對話。</p><p>這麼一來，腦中的「鉤子」就會越來越多，這些「鉤子」能在關鍵時刻拉開智慧的抽屜，也能勾住無意間閃過腦中的話語。</p><p>我在大學的時候就貪心地閱讀小說、哲學、心理學、教育學、科學、商業、自我啟發等各式各樣的書籍。</p><p>當時讀到的話至今依然儲存在我全身的細胞裡，成為我的後盾。</p><div class=\"gold-quote\">在人生的某段時期就把握時間沉浸在書本当中吧！<br>是否擁有這樣的經驗，人生將截然不同。</div>"
        },

                "title": "Chapter 2",

        {
                "title": "12 成功者買的是文庫化*之前的時間",
                "content": "<p>我觀察了許多成功者的書櫃，發現了一項共通點。</p><p>那就是陳列的書絕大多數都是精裝本。</p><p>文庫本確實小巧又方便攜帶，我也有許多文庫本。</p><p>雖然最近越來越多書籍一開始就選擇以文庫的形式出版，但多數的文庫本依然是幾年前就出版的暢銷書。</p><p>如果在偶然間遇到已經文庫化的書，那麼購買文庫本也完全不是問題。</p><p>但如果「其實想讀最新出版的書，但文庫本比較便宜，所以等文庫化再買」，那我就必須說實在太可惜。</p><p>假設新出版的書是一千五百日圓（約新台幣三百元）**，文庫本是五百日圓（約新台幣一百一十元）。</p><p>倘若只要一千日圓（約新台幣二百二十元）就能買到三年的時間，而且要是這本書剛好在自己想讀的時候出版，這樣的價差根本不算什麼。</p><p>人類的好奇心與吸收力，就像海鮮與蔬菜一樣具有時效性。</p><p>當季食材無論從哪方面來看都是最美味的。</p><p>換句話說，成功者無論面對書本還是人生所有的一切，在做判斷的時候都深知「時間」與「時效」的重要性。</p><div class=\"gold-quote\">人類的好奇心與吸收力，就像海鮮與蔬菜一樣具有時效性。<br>成功者買的是文庫化前的時間與即時的機會。</div>"
        },
        {
                "title": "13 買書之後，先在回家前找間咖啡店閱讀",
                "content": "<p>將讀到的內容應用在自己的人生當中只有一個方法。</p><p>那就是去讀有趣到在閱讀過程中讓你坐立難安的書。</p><p>去讀能讓你翻頁的手顫抖，能讓你心跳急速加快的書。</p><p>原則雖然簡單，但真的只有這樣。</p><p>讀書就是去讀讓你覺得有趣的書。</p><p>去讀就算躲起來也想讀的書。</p><p>為了裝模作樣去讀難以下嚥的書，或是被迫閱讀指定的圖書，都是虛假的閱讀。</p><p>讀書完全不需要在意他人的眼光與評價。</p><p>完全不能在意。</p><p>不再為考試讀書之後，就擺脫邊揉著想睡的眼睛，邊忍耐著睡意翻閱的行為吧！</p><p>讀書時湧現睡意，這樣的讀書就是假的。</p><p>即使熬夜到天明，眼睛依然炯炯有神才是正確的閱讀。</p><p>如果在書店翻閱，捧著書的手將因為興奮而微微顫抖。</p><p>明明還沒買下來，淚水就已經滲進書本裡。</p><p>讀完之後回過神來，你已經走向結帳的櫃檯。</p><p>匆忙離開書店也等不及回家，就這樣衝進附近的咖啡店。</p><p>回到家之前就已經熟讀，收進書房的書櫃裡，準備送給重要的人。</p><p>這才是大人的閱讀。</p><div class=\"gold-quote\">讀到一半就想實踐的即是命定之書。<br>站著翻閱就已經心跳加速才擠進合格線。</div>"

        {
                "title": "14 閱讀可以同時鍛鍊左右腦",
                "content": "<p>無論男女，都只有均衡發展的人，才能匯聚人望與資金。</p><p>均衡發展的人有一項共通點，那就是左右腦都很發達。</p><p>很多人以為自己屬於左腦型或右腦型，但實際上只有均衡的人與不均衡的人。</p><p>不管是過於偏向左腦型，還是過於偏向右腦型，人望與資金都無法匯聚。</p><p>我知道在學術上有男女差異或個人差異，但一般而言，左腦掌管理性，右腦掌管感性。 空有理性將使身邊的人感到煩躁並招致厭惡；空有感性則會流於畫大餅。</p><p>當然理性型的人與感性型的人如果運氣好彼此合作，那是再好不過，起碼必須試圖理解對方的態度。</p><p>閱讀就是最好的方法。</p><p>閱讀必須利用左腦理解邏輯，也必須利用右腦浮現想像的畫面，訓練自己的感性。</p><p>於是就能誕生左右腦平衡的點子，傾聽許多人的聲音。</p><p>因為傾聽別人的話，就會有越來越多人為你加油，也能活化對方的個性。</p><div class=\"gold-quote\">透過讀書，愉快地鍛鍊邏輯與感性。<br>當理性與感性被鍛鍊起來，就會想要行動。</div>"
        },
        {
                "title": "15 閱讀的人容易獲得聲援",
                "content": "<p>閱讀能讓人變得謙虛，這是理所當然的。</p><p>思考遠比自己深入、經驗遠比自己豐富的作者多如繁星，每個人都能傳授自己的智慧，所以讀書必然會變得謙虛。</p><p>但謙虛到底是什麼呢？謙虛就是「理解」的能力。</p><p>「我無法理解」，說這句話的人並不謙虛。</p><p>你不能向別人尋求無法理解的原因。</p><p>謙虛就是發現不學習就無法理解。</p><p>謙虛就是發現不實際嘗試就無法理解。</p><p>聽別人說話時，主動採取「想要理解」的態度，別人就會幫助你理解。</p><p>而且周遭的人面對你謙虛的態度也會願意為你聲援。</p><p>誰都不想聲援「不打算理解」的人，卻願意聲援「努力想要理解」的人，這是人之常情。</p><p>讀書就是為了「理解」，為了更容易獲得聲援。</p><p>當你三十多歲，變成幫助他人理解的角色時，說出的話是否具有智慧，會反應出你在二十多歲時，是否謙虛地主動採取「想要理解」的態度。</p><p>為了讓別人理解，自己的理解力必須是別人的一千倍。</p><p>廣度十倍x深度十倍x熱情十倍=一千倍。</p><div class=\"gold-quote\">大人的閱讀就是盡可能減少人生中的「無法理解」。<br>透過閱讀變得謙虛是理解的最佳解方。</div>"
        },
        {
                "title": "16 閱讀能使人變得強韌",
                "content": "<p>身在谷底的時候，能做的事情還是只有閱讀。</p><p>因為這個時候有的是時間讓你翻來覆去地煩惱。</p><p>過於忙碌的人，連煩惱的時間都沒有。</p><p>如果你以為太忙是自己的煩惱，代表你還有空間，因為你還有煩惱的時間。</p><p>倘若無論精神還是肉體都被壓縮到極限，根本連抱怨或煩惱的力氣都沒有。</p><p>因為與朋友吵架而絕交。</p><p>因為與客戶起口角而被列為拒絕往來戶。</p><p>因為與情人爭執而分手。</p><p>這些都是落入谷底的原因吧？</p><p>但是讀書的人即使置身於相同的環境，精神依然強韌。</p><p>因為他們有許多話可以鼓勵自己。</p><p>在三一一大地震中鼓勵人們的就是語言的力量。</p><p>就如同肉體無法缺乏糧食，精神也不可缺少語言。</p><p>為了從谷底往上爬，必須從溝通開始做起。</p><p>透過溝通對話，在對話的過程中，人們就會綻放笑容。</p><p>而笑容能使大腦放鬆，產生智慧。</p><p>當人們藉由智慧從谷底往上爬，就會變得堅強。</p><div class=\"gold-quote\">先接受大量名言佳句的洗禮。<br>人們只能靠著語言變得堅強。</div>"
        },
        {
                "title": "17 把書送人，更容易記住書的內容",
                "content": "<p>人們最深刻的記憶總是道別。</p><p>即使忘記與長年來往的對象一起經歷過的無數事情，道別的記憶卻一輩子也不會忘記。 道別的時候能夠強化人的記憶。</p><p>人在道別的時候最依依不捨，最容易感受到對方之於自己的必要性。</p><p>書本也一樣。</p><p>我在應徵上工作後搬家，這時候花了絕大多數的時間處理我的書。</p><p>我的書塞滿了環繞房間的書架，甚至必須側著身子才能走進來，如果將這些書原封不動搬進公司的單身宿舍，我就會連睡覺的地方都沒有。</p><p>不僅如此，說不定還會被公司懷疑「你根本無心工作」，而被</p><p>取消資格，把我趕出宿舍。</p><p>最後，我放棄了九五%的書。</p><p>把所有的書精簡到只剩一個書架。</p><p>我在處理這些書時，跑了好幾間舊書店，因為我持續搬運數量驚人的書過去，甚至還被老闆說「你是想把我的店搞垮嗎！」</p><p>但是，我透過這些書學到一件重要的事情。</p><p>那就是把心一橫與愛書告別時，才終於發現這本書的好。</p><p>「你帶走那本書，卻要拋棄我？」當這樣的聲音停止，就會有更美好的邂逅，這點不管是人還是書都一樣。</p><div class=\"gold-quote\">不斷地把書送人吧！<br>這個時候，你才能從書裡得到更多。</div>"
        },
        {
                "title": "18 成功者的書架上有許多「初版」",
                "content": "<p>而且這些書的版權頁，通常都印著初版。</p><p>既然是暢銷書，發行之後立刻再版的情況也不在少數，擁有初版就代表必定是在發行不久後購買。</p><p>不，正確來說，說不定早在發行之前就透過網路書店預約了。</p><p>這是驚人的行動力。</p><p>但比行動力更驚人的是非比尋常的好奇心。</p><p>越是不成功的人，越會在腦中批評暢銷書。</p><p>「這麼無聊的作品竟然會暢銷‧‧‧‧‧‧」像這樣批評以互相取暖已經變成他們的生活意義。 成功的人則相反。</p><p>成功的人在發行當天就寄信來問「你讀完《獨學大全》*了嗎？」</p><p>《鬼滅之刃》的初版也陳列在他們的書架上。</p><p>而且他們不會批評這些書。</p><p>他們自始至終都在探索這些書之所以會暢銷的「優點」。</p><p>「找缺點」就連幼兒也很擅長，但「找優點」就必須絞盡腦汁。</p><div class=\"gold-quote\">暢銷書就算不讀也值得買。<br>探索這本書的「優點」可以得到許多發現。</div>"
        },
        {
                "title": "19 側插陳列的不起眼書籍，才是你的命運之書",
                "content": "<p>書店為了營造氛圍，將書籍的陳列區域分成在櫥窗與入口附近、設計感十足的「展示區」，以及將書本平放在最佳位置的「熱銷區」。</p><p>當然這些書也請不斷地買來讀。</p><p>書店為了幫助你遇見出色的好書而持續發揮創意。</p><p>但愛書的人都知道，除了「展示區」和「熱銷區」之外，還有一個最容易邂逅命運之書的區域。</p><p>那就是占據書店大半空間的「側插陳列區」。這裡的書放在書櫃裡，只能看見書背，但數量壓倒性地多。</p><p>這些書乍看之下樸素又不起眼。</p><p>從一個人在「側插陳列區」停留的時間，以及觀察書背的眼神，就可以知道這個人喜不喜歡書。</p><p>讓人懷疑「到底誰會買？」的書，卻能一直插在書櫃裡，就是因為書店判斷「會有人買」。</p><p>我也非常喜歡在側插陳列區裡尋寶。</p><p>如果偶然對上其他愛書人的眼神，就會讓我很快開心地。</p><p>每天造訪常去的書店，很快就會發現側插陳列區的書消失了。</p><p>這就代表有人買下。</p><p>這個人遇見他的命定之書。</p><p>這一瞬間，我會覺得有點忌妒呢。</p><div class=\"gold-quote\">請試著在側插陳列區翻閱被太陽曬得褪色的書吧！<br>因為你將會發現這個世界上無人知曉但專屬自己的命定之書。</div>"
        },
        {
                "title": "20 翻閱過兩次的書，買下來準沒錯",
                "content": "<p>如果你去書店，會發現有些書已經讓你翻閱兩次，代表你已經拿起這本書一次，卻因為感興趣，又再拿起來翻閱一次。</p><p>正確來說可能不只兩次。</p><p>翻閱過兩次的書，絕對會翻閱三次以上，讓你一直猶豫著要不要買。</p><p>你會來來去去，一次又一次地翻閱，甚至被店員認為是「可疑人士」。</p><p>但所有人的共通點，就是最後依然沒有買下來。</p><p>這麼一來，你在明天之後也將繼續重複同樣的人生。</p><p>成功必須從眼前微小的決斷開始改變。</p><p>其實翻閱兩次的書，就是你的命定之書。</p><p>很多人在聯誼的時候，第一眼就知道誰是自己第一志願的命定對象，但如果第二志願或第三志願的對象提出邀約，依然會忍不住答應。</p><p>如果你想讓自己接下來的人生變得更好，就不能下意識地逃離命定對象。</p><p>請隨時保持對第一志願的貪慾。</p><p>兩次翻閱同一本書，就表示你的潛意識想要購買。</p><p>邁向幸福的第一步，就是誠實面對自己。</p><div class=\"gold-quote\">就算對別人說謊也不能對自己說謊。<br>買下翻閱兩次的書就是誠實面對自己。</div>"
        },
        {
                "title": "21 你的書櫃反映了你的將來",
                "content": "<p>請你觀察自己的書櫃。</p><p>書櫃陳列著什麼樣的書，就意味著你會成為什麼樣的人。</p><p>因為陳列在書櫃的書，都是你自己決定買下來的，是你判斷下的結晶。</p><p>愛書的人，多半擁有又大又深的書櫃。</p><p>之所以選擇具有深度的書櫃，是為了將書本陳列成前後兩排。</p><p>前排的書是自己的表象（面具），後排則隱藏了自己的內心（真意）。</p><p>附帶一提，將情色書籍擺在前排的人實在不同凡響。</p><p>如果我是女性，就會想和這樣的豪傑纏綿。</p><p>前排的表象與後排的內心，會刻劃出自己想做的事情與對未來的想像。</p><p>自己的使命是什麼？ 自己想要走向什麼樣的道路？</p><p>自己未來想透過什麼樣的手段幫助別人獲得幸福？</p><p>很多人都在探索自我，但答案就在你的書櫃裡。</p><p>有些人以探索自我為由，真的辭職或休學去旅行。</p><p>但就算不特地出去旅行，自我探索的方式就近在咫尺。</p><div class=\"gold-quote\">分析書櫃就是分析自我。<br>未來就在表象與內心之間。</div>"
        },
        {
                "title": "22 準備不足就行動，將會失去機會",
                "content": "<p>我想對認真的你，說一句非常嚴厲的話。</p><p>你不能仗著自己年輕就貿然行動。</p><p>「年輕的時候不要想太多，總之行動就對了」，這樣的教誨，確實會有一段時間是對的。</p><p>不會囉哩八唆，默默行動的人，能夠受到重視並且出人頭地。</p><p>甚至也有公司教導新進員工要有毅力，要求他們「換到〇張名片之前不准回辦公室！」 但這些在現代全部都會帶來反效果。</p><p>愚昧的年輕人，到處纏著前輩見面是失禮的行為，也會讓自己的路越走越狹窄。</p><p>為什麼呢？</p><p>其實成功者在私底下全部都有共通的默契，「不能與這家公司交易」「不能與這家公司的某某人見面」。</p><p>強行奪走成功者的時間，將會被列入永久流放的黑名單。</p><p>換句話說，他們再也不願意見你。</p><p>我從剛進公司的時候，就奇蹟似地獲得幾乎所有經營者，尤其是創業者的偏心與疼愛，理由只有一個。</p><p>那就是我在讀大學的時候，就把「松下幸之助」「中村天風」「安岡正篤」的書全部讀完。</p><p>不能在沒做功課的情況下與他人見面，這件事我在大學時代早已透過閱讀預習了。</p><div class=\"gold-quote\">勇往直前的蠻幹不是勇氣。<br>揮汗之前必須先動腦。</div>"

        {
                "title": "Chapter 3",
                "content": "<div class=\"gold-quote\">書本教會我們的<br>真正「溝通力」</div>"

        {
                "title": "23 借書來讀的人，自己也一輩子都只能受雇於人",
                "content": "<p>我想耍嚴厲地告誡總是借書來讀的人。</p><p>如果將來想要立於眾人之上，書一定要自己花錢買來讀。</p><p>總是借書來讀的人，這輩子將永遠無法出人頭地。</p><p>不願意付錢的人會漸漸變得小氣、傲慢，無法學習。</p><p>最後損失的是自己。</p><p>所有開過講座的講師都知道。</p><p>被公司被強迫參加的人，多半都在打瞌睡，不然就是開著雙腿，雙手抱在胸前，態度帶著不屑。</p><p>即使點名這些人，他們也完全沒有想法，說話語無倫次。</p><p>反之，自己花錢參加講座的人，就會挺直背脊，積極聽講，拚命地做筆記。</p><p>花錢才會對智慧萌生敬意。</p><p>此外，借來的書通常都會忘記歸還，最終會導致自己失去他人的信賴。</p><p>另外，借來的書通常也不會認真讀，總想著有空再來翻，最後根本忘記收去哪裡。</p><p>借書給別人就像借錢給別人一樣，不管過多久都會記得，每次見到對方都會問他「讀了沒？」</p><p>於是借書的人每次都必須找藉口，導致氣氛變得尷尬。</p><p>請你留意，對方問你「讀了沒？」並不是想要知道感想，而是在催促你「差不多該快點還我了吧？」</p><div class=\"gold-quote\">借書來讀的人，一輩子都只能受雇於人。<br>自己買書來讀的人，才能立於眾人之上。</div>"
        },
        {
                "title": "24 告訴見面的人，自己正在讀的書是什麼內容",
                "content": "<p>拓展人脈的技巧很簡單。</p><p>那就是告訴所有遇到的人，自己即將要讀的書與最近剛讀完的書其內容。</p><p>請談論自己打從心底覺得有趣的書。</p><p>我不是要你努力地強迫自己傳達正確的內容，而是要你用有趣的方式介紹書籍，製造出有趣的氛圍。</p><p>這麼做會產生兩個優點。</p><p>如此不到一年，你的人脈將會完全更新。</p><p>愛書人會積極進取，多數能在社會面與經濟面獲得成功。</p><p>於是讀書的人與他讀書的夥伴將會越來越富有。</p><p>不讀書的人與他不讀書的夥伴，則會互相扯後腿，變得越來越貧窮。</p><p>雖然有些人即使不讀書也能獲得財富。</p><p>但他們的共通點都是成功無法長期持續。</p><div class=\"gold-quote\">把正在讀的書告訴今天遇到的人吧！<br>一年後你的人脈將會完全翻倍。</div>"

        {
                "title": "25 收到書，請在二十四小時內寫信道謝",
                "content": "<p>曾有人送書給我當禮物。</p><p>送我書的人通常都是成功的人。</p><p>我也喜歡仿效成功者，送書給別人。</p><p>二十多歲的時候，曾希望有一天能送自己寫的書給別人。</p><p>藉由送書的機會有些人會變成朋友，有些人則不會。</p><p>但絕大多數的人一輩子都無法變成朋友。</p><p>我如果收到書，就會盡可能想辦法與送書給我的人當朋友。</p><p>所以我習慣在收到書的當天，就寫明信片給對方回禮道謝。</p><p>我通常會在當天就讀完，所以會在明信片中寫「這一節感動了我」。</p><p>我目送對方離開之後，就會立刻開始閱讀這本書。</p><p>這麼一來，就能把送書給我的人與書本的內容一併記住。</p><p>這樣我每次看到這本書，就會想起贈書者的臉。</p><p>不過老實說，還是會有無論如何都無法在當天閱讀的時候。</p><p>這種時候不能寫虛假的感想。</p><p>我會這麼寫——「我正準備開始讀。」</p><p>只要這樣一個小動作，人生就會改變。</p><div class=\"gold-quote\">把書當禮物的人，多半充滿人情味。<br>隔天收到明信片絕對會喜出望外。</div>"

                "content": "<p>有些人會用好壞來形容書籍。</p><p>但一本書的好壞因人而異，沒有絕對的標準。</p><p>對某人來說是好書，對另一個人而言卻可能很難看。</p><p>而且在評論書的好壞之前，不讀書就什麼都無法開始。</p><p>除了閱讀數量極端龐大的書籍之外，沒有其他方法可以找到自己心中的好書。</p><p>只要持續閱讀自己感興趣的書，就能發展出挑選好書的眼光。</p><p>習慣之後只要隨意走進書店，就會在不知不覺間站到自己需要的書面前。</p><p>想要達到這樣的境界，必須在一年當中每天前往書店，每天至少買一本自己感興趣的書回家。</p><p>買到認識所有的店員，也掌握所有書的位置，即使臨時去打工都能成為即時戰力。</p><p>自己需要的書，不一定是平放陳列的知名書籍。</p><p>只有達到對那唯一一本側插在書架上的書，不由自主產生興趣的境界，才終於能夠獨當一面。</p><p>比起水平陳列的暢銷書，</p><div class=\"gold-quote\">更需要在意那唯一一本悄悄側插在書架上的書。<br>因為你的命定之書，絕對就在那裡。</div>"

        {
                "title": "38 喜歡・討厭・未曾接觸過的作者——利用三本書，深入探討主題",
                "content": "<p>工作時必須在規定的期限內，吸收一定程度的知識。</p><p>其中也經常有「超急件」之類的極度難題。</p><p>只要是工作，就必須回應這樣的期待。</p><p>這時候如果要把大量的書全都讀過，不管有多少時間都不夠用。越是認真的人，越會從頭開始仔細閱讀。</p><p>等到仔細閱讀完，期限早已截止。</p><p>步入社會後絕不能遲交工作，請好好記住這點，將它當作是會被列入黑名單的行為。</p><p>想要在有限的時間內吸收高品質的知識有個訣竅。</p><p>那就是只買三本在該領域內自己覺得容易閱讀的書。</p><p>我建議在這三本書當中，必須包含「喜歡的作者」「討厭的作者」與「未曾接觸過的作者」。</p><p>在此先強調，不能買困難、不好讀、生理上排斥的書。</p><p>最推薦盡可能減少厚度與字數的書。</p><p>因為這樣的書較容易掌握重點。</p><p>三本從完全不同角度切入的書，一定能夠讓你發現其他不同的觀點。</p><p>就像尋找三角形的重心一樣。</p><p>如果第一本書就讀「喜歡的作者」，第二本、第三本就能以不到一半的時間深入閱讀。</p><div class=\"gold-quote\">閱讀三本不同作者的書，就能更加深入探討主題。<br>這三本分別包含「喜歡的作者」「討厭的作者」與「未曾接觸過的作者」。</div>"

        {
                "title": "39 吸收的質，必定建立在量上",
                "content": "<p>不怎麼喜歡閱讀的人，有這樣一句口頭禪：「讀書重質不重量。」</p><p>讀書的質固然重要。</p><p>然而閱讀品質高的人，必定也讀了壓倒性的量。</p><p>已故小說家井上廈被譽為知識的巨人，他的藏書超過二十萬冊，而據說已故文化評論家渡邊昇一也有十五萬冊以上的藏書，至於現在的企業家出口治明、外交官佐藤優也是知名的閱讀者，不難想像他們的藏書也是汗牛充棟。</p><p>他們彷彿就像擁有私人圖書館。</p><p>雖然聽到十五萬冊或二十萬冊會覺得超乎想像，但在工作上表現優異的人，共通點就是讀完數量驚人的書籍。</p><p>量與質並非相反的特質，兩者反而互成正比。</p><p>如果不讀完數量驚人的人的書，就不可能有高品質的閱讀。</p><p>「我只反覆閱讀數量有限的優質好書」，說這種話的人其實不怎麼讀書。</p><p>因為閱讀的量不夠龐大，就不會知道書好不好。</p><p>這個世界上有數量龐大的書籍，光是日本一年就持續出版七萬冊以上的新書。</p><p>對你而言的好書，數量也有無限多。</p><p>反覆閱讀好書的人，大家都無一例外地閱讀了數量龐大的書籍。</p><div class=\"gold-quote\">大量閱讀與反覆閱讀並不矛盾。<br>反覆閱讀的人毫無意外地都閱讀大量書籍。</div>"

        {
                "title": "40 無法從書本學習的人，就無法從任何事物學習",
                "content": "<p>「我主張向人學習，而不是從書裡學習」，有些人會這麼說。</p><p>但這麼說的人，其實也不會向人學習。</p><p>這個世界上只有既向人學習也從書裡學習的人，以及既不向人學習也不從書裡學習的人。</p><p>書與人其實是一樣的。</p><p>因為寫書的是人，書就是作者的分身。</p><p>若無其事地宣稱自己無法透過書本學習的人，有必要發現這樣的矛盾。</p><p>假設你想要與某個人見面、對話。</p><p>先把這個人出的書與撰寫的部落格全部讀過再與他見面，學習的質與量至少是什麼都沒有讀就去見他的的一萬倍。</p><p>質一百倍X量一百倍，所以是一萬倍。</p><p>如果遇到某個人的時候沒有讀過他的書，你們的談話內容就只有「你好」「請多指教」之類老套的客套話，在往後的人生，你也只會被對方當作眾多粉絲中的一人。</p><p>這麼說雖然嚴厲，但這就是你全部人生的縮影。</p><p>主張「自己只向人學習」的人，其實不過是在沒有準備的情況下就與人見面，偷走對方龐大的時間。</p><p>你把喜歡的人的書全部讀完，總有一天必定能夠見到對方。</p><p>為了在那個時候把握機會，請準備好超級具體的問題吧！</p><div class=\"gold-quote\">想見的人如果出書就是機會。<br>把所有的書全部讀完，遇到對方時就能提出好問題。</div>"

        {
                "title": "41 就算隨便讀，也能在入睡時整理吸收",
                "content": "<p>「如果隨便讀，不就腦袋亂成一團，最後什麼都沒有留下來嗎？」 有些人會如此懷疑。</p><p>我對這個問題的回答很明確 ——「腦袋絕對會亂成一團」。</p><p>我也因為大量閱讀各種類別的書籍，腦袋隨時都處在亂成一團的狀態。</p><p>但我依然毫不在意地繼續讀下去，結果經歷了奇妙的體驗。</p><p>當腦袋亂到極限後，就會突然開始整理至今讀過的資訊。</p><p>這樣的體驗發生在我與別人溝通的那一瞬間。</p><p>當對方問我問題，尋求立即的答案時，最佳解答就會從過去大量讀到的紛亂資訊中，自然而然冒出的新芽。</p><p>下一個瞬間，對方就啞口無言。</p><p>亂成一團的資訊串連起來了。</p><p>大腦在每天的睡眠當中整理資訊，最後變成智慧。</p><p>雖然我早已忘記這些資訊是哪個人在哪本書裡寫的，但只要持續閱讀數量龐大的書籍，就會發現也有其他人重複提到同一件事情。</p><p>從無數不同的角度觀察同一件事，就能在睡眠中持續刻劃進記憶裡。</p><p>就算讀再多書，腦袋變得再混亂，只要健康地持續熟睡就不會有問題。</p><div class=\"gold-quote\">人腦比你想像的更偉大。<br>無論再怎麼隨便讀，大腦都能在睡眠時整理資訊。</div>"

                "title": "42 從書腰吸收流行精華",
                "content": "<p>當我遇到行銷的瓶頸時，就會去書店。</p><p>這是我在經營顧問公司時經常使用的方法。</p><p>當我想要尋找名言佳句，就會去喜歡的書店，迅速翻閱暢銷書，沉浸在大量的詞彙裡。</p><p>沒有靈感的時候，也會主動走向平常不會逛的區域，譬如女性區、生育區、占卜區、考試區等。</p><p>因為各個區域都會擺出該領域的新書，方便掌握最新流行。</p><p>而最新流行的精華，就濃縮在書腰的文案裡。</p><p>只要將書腰逐一讀過，就能赫然發現原本沒有注意到的一件事情。</p><p>甚至讓我覺得必須付錢給書腰才行。</p><p>稍微動點腦筋，就會發現書腰文案充滿靈感的線索，原本就是生活中理所當然的事情。</p><p>出版社為了多少增加銷量，從這本書當中節錄出過濾再過濾的語言精華。</p><p>或是透過短短幾句話呈現超越內容的內容。</p><p>書腰展現的正是將這本書濃縮成一滴的智慧結晶。</p><div class=\"gold-quote\">書腰是行銷的精華。<br>甚至可以為了買書腰而買書。</div>"

        {
                "title": "43 慢慢讀，才能快速讀完",
                "content": "<p>學會速讀很帥氣，也會覺得自己好像變得很聰明。</p><p>說不定人生真的將因為學會速讀而改變。</p><p>關於速讀術，我有一個結論。</p><p>那就是如果有辦法慢慢讀，將來必定能學會速讀術。</p><p>因為如果有「必須讀快一點」的焦慮感，不僅無法將內容讀進大腦裡，閱讀的速度也會變慢。</p><p>有這種焦慮感的人，不管在咖啡店還是在電車上，讀書時都會害怕被別人覺得「這個人讀得好慢」，因而更加讀不進腦袋裡。</p><p>這麼一來就本末倒置了。</p><p>如果在意旁人的目光，可以選擇在獨處的時候，用自己的步調讀到自己高興為止。</p><p>慢慢讀說不定反而更能吸收內容，也可能因此讀得更快。</p><p>畢竟邊吸收各個領域的知識邊讀更多書，閱讀的速度無論如何都會提升。</p><p>透過閱讀大量的書籍，在工作上表現變好，在社會上也取得成功後，就不會一天到晚在意讀書速度了。</p><p>因為成功之後，就能隨心所欲掌控自己的時間。</p><p>嚮往速讀的人，在意的不是閱讀的速度，而是旁人的目光。</p><div class=\"gold-quote\">你是想要讀得快，<br>還是害怕讀得慢會被旁人認為很笨拙？</div>"

        {
                "title": "44 將想見的作家出版的書全部讀完，見面時就能抓住機會",
                "content": "<p>如果想在見到作家時，能夠好好面對彼此，而不是被當成眾多粉絲之一，該怎麼做才好呢？最近一般人也能透過社群媒體直接聯絡人氣作家，所以最好能夠事先掌握一些訣竅。</p><p>我自己長久以來都會將這名作家出版的書全部讀過。</p><p>只閱讀自己感興趣的類別，就不是真正喜歡這名作家。</p><p>舉例來說，假設有一名作家出版了一百本書。</p><p>而你將來在自己的工作上做出成績，有機會與這名作家見面。</p><p>這個時候，有些人會說「我幾乎把老師的書都讀完了」，也有人會說「老師的書我讀了十本以上」。</p><p>這些人的共通點，就是帶點自大炫耀的意味。</p><p>他們沉默地等待對方回答：「真是太感謝了。」</p><p>這麼一來將會錯過與作者交流的機會。</p><p>如果有真正想見的作家，從今天開始就應該假設終有一天會見到他，毫無例外地把每一本書全部熟讀。</p><p>最後終於見到對方時，開口的第一句話是：</p><p>「我把老師出版的一百本書全部讀完了，我努力到今天就是為了告訴您這句話。」</p><p>這麼一來，對話就會對你另眼相看。</p><p>社群媒體的滲透，讓活用機會的人與錯過機會的人逐漸兩極化。</p><p>想要在這樣的時代創造見面的機會，就是這麼一回事。</p><div class=\"gold-quote\">把喜歡的作家所寫的書全部讀完。<br>賣得不好的書反而更充滿能量。</div>"

        {
                "title": "45 「為什麼會選這本書」就是行銷",
                "content": "<p>雖然大家已經完全熟悉「行銷」這兩個字，但很少有人能夠說明行銷的意義。</p><p>無法說明就代表不了解，而不了解的東西絕對無法應用到工作上。</p><p>所謂的行銷，就是提供一個契機，讓顧客從無數商品中冒出「哇！我想要這個」的想法。</p><p>不是「還算想要」，也不是「相較之下想要」或「相當想要」。</p><p>而是讓顧客產生「哇！我想要」的想法才是行銷。</p><p>你想必也在大量書本中，選擇了「哇！我想要」的那一本。</p><p>否則你不會特地花錢買下需要時間閱讀的書籍。</p><p>換句話說，「購買」這個行為本身，在閱讀內容前的階段就已經回本。</p><p>請你徹底回想自己「哇！我想要」的心情，並且應用到工作上。</p><p>所有人都必須學行銷。</p><p>不只企劃部的人或業務部的人需要學。</p><p>製造部、總務部、人事部、會計部更需要。</p><p>打工或兼職的人也需要。</p><p>讓相關的人都有「哇！」的驚喜，所有的工作都會變得有趣。</p><p>如果這份工作不會讓你有「哇！」的驚喜感，那就辭掉吧！</p><p>從不會讓你有驚喜感的人生畢業吧！</p><div class=\"gold-quote\">請你思考自己為什麼從眾多書籍中挑到這一本。<br>了解自己就是真正行銷的開端。</div>"

        {
                "title": "46 閱讀時，要有明確的當事人意識與問題意識",
                "content": "<p>不只閱讀，在人生早期的階段養成，把日常發生的事情當成自己的事而不是別人的事的習慣，絕對不會吃虧。</p><p>不是覺得「那個人真難堪」，而是思考自己在那個狀況下該怎麼辦。</p><p>不是覺得「那個人真笨」，而是冒著冷汗想自己也可能做出相同的蠢事。</p><p>如果同事被破口大罵，即使身在隔壁部門，也該想像自己被罵的狀況而流下眼淚。</p><p>有前景的上班族看到惹人厭的人，必須沉浸在彷彿自己也招人厭惡的情緒裡。</p><p>這樣的累積到了三十歲之後就會產生天壤之別。</p><p>有人在一本書裡只能得到一個發現，但有人卻能得到一百個。</p><p>只能得到一個發現的人，長久以來都躲在別人背後，過著旁觀者的人生。</p><p>而得到一百個發現的人，則能夠背負著風險，過著當事者的人生。</p><p>只能得到一個發現的人，與能夠得到一百個發現的人，閱讀的價值截然不同。</p><p>覺察的能力與一個人背負的風險成比例。風險就是當事者意識。</p><p>而在公司這樣的組織裡，當事者意識越強，自然能有越高的地位和薪水。</p><div class=\"gold-quote\">站在當事者的角度閱讀最划算。<br>站在旁觀者的角度閱讀划不來。</div>"
        },
        {
                "title": "47 智慧，能將無聊的書變成好書",
                "content": "<p>有些人聽別人說話會說「好無聊」。</p><p>有些人讀書時會說「好無聊」。</p><p>這些人都缺乏智慧。</p><p>有智慧的人，即使一百個人當中有九十九人都因為「無聊」而不屑一顧，也會覺得「有趣」而一頭栽入。</p><p>他們即使面對理所當然又隨處可見的事情，也不會做出理所當然的解釋，這就是有智慧的人的特徵。</p><p>閱讀就是消除世界上的「理所當然」與「無聊」。</p><p>所以讀書的人總是謙虛。</p><p>寫書的作者在面對自己的專業領域時，會特地停下來執拗地思考一般人視而不見的事情。</p><p>「理所當然」與「無聊」是忘記感謝的人的口頭禪。</p><p>因為「感謝」的相反就是「無聊」與「理所當然」。</p><p>從看似無關緊要的小事中察覺「感謝」的那一刻，就能接近宇宙真理。</p><p>地球上想必也有好幾萬人看見蘋果從樹上掉落的瞬間，但是對所有人來說，這一瞬間都是「無聊」與「理所當然」。</p><p>然而卻有一個人大聲驚叫，他既不覺得「無聊」，也沒有「理所當然」的感覺。</p><p>這個人就是英格蘭的哲學家兼神學家艾薩克．牛頓。</p><div class=\"gold-quote\">變聰明就代表人生變有趣。<br>透過閱讀把「無聊」的事變「有趣」吧！</div>"

        {
                "title": "48 擅自錯誤解讀的人，能夠不斷地挑戰並邁向成功",
                "content": "<p>學校的國語考試規定「正確答案絕對只有這個，除此之外的答案都不被承認。」</p><p>模範解答確實是正確的。</p><p>這是任何人都沒有反駁餘地的正確答案。</p><p>但不可思議的是，選擇模範解答，活著就是為了讓老師打勾的人，臉上的表情看起來全都不太幸福。</p><p>反之，自由自在自由解讀的人，看起來都是一臉幸福的模樣。</p><p>大人的國語，就是自由解讀者的勝利。</p><p>「跟我想表達的意思完全不同‧‧‧‧‧‧」，做出幾乎會被作者斥責的解釋，一個人興奮地展開行動，這樣的人就能獲得成功。</p><p>講座也一樣。</p><p>從講師授課的內容聯想到完全無關的事情，心情會越來越激昂，最後忍不住展開行動的人就能成功。</p><p>每次都問作者或講師「根據是什麼」的人，反而會經常錯過機會。</p><p>會問「根據是什麼」的人都態度高傲。</p><p>就算作者與講師花好幾個小時指導，也永遠無法了解根據。</p><p>因為根據什麼的，除非自己行動遭遇挫折，否則根本無法理解。</p><p>與其追究根據，不如任意做出自由解讀，不斷地抓住機會。</p><div class=\"gold-quote\">誤解的人能夠贏得人生。<br>不斷地自由解讀就是這個人的才華。</div>"

        {
                "title": "49 刻意「提出」書上沒寫的內容，能夠培養實力",
                "content": "<p>閱讀能夠偶然遇見絕妙的點子。</p><p>我當然懂那種忍不住想要直接使用這個點子向客戶提案的心情。</p><p>在初期的階段，直接將點子原封不動地提出也無所謂。</p><p>想必也能取得一些不錯的成果。</p><p>但是，終究會在途中的那一刻遭遇瓶頸。</p><p>因為人類是一種喜新厭舊的生物。</p><p>第一次的感動在第二次就只剩下一半，到了第三次更是再打對折變成四分之一。</p><p>重複四、五次之後，再怎麼遲鈍的人，都會強烈感受到對方已經厭倦。</p><p>所以在模仿書上的點子時，請事先想好在下一次提案時能夠成為附加價值的內容。</p><p>如果偷懶省略這個步驟，這輩子將會永遠都在尋找模範解答。</p><p>持續尋找模範解答的人生，不只疲倦，還會逐漸變得空虛。</p><p>積極閱讀固然必要，但同時也必須將讀到的資訊用自己的方式整理，訓練如何發揮智慧。</p><p>經營顧問毫無例外地都是積極學習的瘋狂閱讀者，大家都會為了確認「不能把這個就這樣提給顧客」而閱讀。</p><p>將讀到的資訊加上更多附加價值回饋給社會，到頭來也會變成對作者的回報。</p><div class=\"gold-quote\">如果讀得感動，請忍住想要直接模仿的衝動。<br>忍耐並發揮智慧，將成為一輩子的珍寶。</div>"

        {
                "title": "50 「試著理解」，能讓工作順利運作",

        {
                "title": "51 把書看成一本企劃書",
                "content": "<p>書就是企劃書。</p><p>作者想方設法將訊息傳達給讀者。</p><p>而企劃書終究只是一種傳達訊息的手段。</p><p>所有的上班族都必須思考企劃。</p><p>思考企劃是所有上班族的工作。</p><p>一間公司如果只有隸屬於企劃室或經營戰略室的人在思考企劃，那麼這間公司終將倒閉。</p><p>正在成長的公司，就連總務部、人事部與會計部等所有人，都日復一日在思考企劃。只有老闆、董事或主管在思考企劃的公司終將倒閉。</p><p>正在成長的公司，不只正職員工，就連兼職員工與打工人員也每天都在思考企劃。</p><p>工作就是企劃。</p><p>企劃就是讓所有參與的人，一天比一天更幸福。</p><p>不想獲得幸福的人，就不會面對企劃。</p><p>他們就相當於沒有在工作。 請試著重新把書籍看成是作者的企劃書來閱讀。</p><p>這樣是否就會冒出無限值得學習的內容呢？</p><p>這個世界上沒有任何一份企劃書會讓人變得不幸。</p><p>企劃書的存在，必定會讓世界某個角落的某個人變得幸福。</p><p>請透過書本學習帶來幸福的方法。</p><div class=\"gold-quote\">如果用偷看企劃書的心態買書，就會覺得驚人便宜。<br>用閱讀企劃書的心態讀書，就能不斷吸收書本內容。</div>"

        {
                "title": "52 自己也想書名能夠培養直搗本質的能力",
                "content": "<p>當你把一本書讀完，請你務必思考一件事情。</p><p>那就是如果你要幫這本書取名，你會想出什麼樣的書名呢？</p><p>書名都由出版社構思定案。</p><p>然而書名不一定符合內容，因為對於出版社而言，一本書的問世，需要投入幾乎可以買一輛新車的資金。</p><p>既然是投資，如果無法回本，公司就會立刻倒閉。</p><p>所以我也希望你想像自己是繃緊神經面對挑戰的出版社員工，認真地思考書名。</p><p>如果具備直搗本質的能力，在工作上可說是如虎添翼。</p><p>有些人為了培養直搗本質的能力，會去商學院上課，或是涉獵邏輯思考的書籍。</p><p>你可以把這樣的練習想成是一種自我啟發。</p><p>但如果想要認真磨練直搗本質的能力，就必須養成思考任何事情時都抱持著當事者意識的習慣。</p><p>所以賭上性命的中小企業經營者，比任何優秀的受薪顧問更具備直搗本質的能力。</p><p>兩者的差別就在於有沒有當事者意識。</p><p>你也抱持著當事者意識，像出版社一樣絞盡腦汁思考書名，就是最好的訓練。</p><div class=\"gold-quote\">磨練直搗本質的能力就能提升工作表現。<br>為了直搗本質，必須具備專業的當事者意識。</div>"

        {
                "title": "53 調查書封設計，能夠學習設計的必然",
                "content": "<p>購買暢銷書的時候，一定要調查封面是誰設計的。</p><p>雖然只憑封面的魅力不足以讓書籍暢銷，但也不可能有封面缺乏魅力的暢銷書。</p><p>暢銷書之所以會暢銷，封面也是重要的關鍵。</p><p>正確來說，書名與封面是行銷。</p><p>如果書名與封面缺乏魅力，無論內容多麼優異，讀者都不會拿起來讀。</p><p>當讀者拿起來翻閱，猶豫要不要買的時候，就是探究內容品質的開始。</p><p>若你理解這樣的機制，想必就會更清楚書封設計的重要性。</p><p>而你調查了設計師的名字之後，應該會更加驚訝。</p><p>因為暢銷書的封面設計師，幾乎都是那幾個人。</p><p>換句話說，在設計的領域沒有偶然暢銷這回事。</p><p>暢銷必定有理由。</p><p>行銷調查不是只有定量的左腦分析，透過設計的右腦分析進行調查，就會看見原本沒有注意到的一事情。</p><div class=\"gold-quote\">暢銷的設計不是偶然。<br>請透過右腦理解這點。</div>"

        {
                "title": "54 試著以 SWOT 分析出版社",
                "content": "<p>請你去調查今年出版十大暢銷書的出版社。</p><p>好奇心旺盛的人，也可以把時間拉到最近的三至五年。</p><p>這麼一來你就會發現一件有趣的事情。</p><p>每年出版多本暢銷書的出版社，來來去去都是那幾家。</p><p>這樣的出版社很了不起。</p><p>因為每天出版的新書超過兩百本，每年出版的新書更是超過七萬本。在這樣的環境下，還能每年持續攻上十大暢銷排行榜，靠的不是運氣，而是實力。</p><p>而且你也會發現書的暢銷與否，不一定與出版社規模有關。</p><p>規模很小的出版社，也能出版暢銷書。</p><p>讀者選書時不會看出版社的品牌，而是純粹根據書籍本身來決定。</p><p>市場是公平的。</p><p>了解這個業界，也能知道社會動向，所以請務必試著對自己書櫃裡的每家出版社進行 SWOT 分析*，優勢（Strength）、劣勢（Weakness）、**機會（Opportunity）與威脅（Threat）**這四個面向。</p><p>當你掌握了每一家出版社的特性，選擇書籍時就會更有趣。</p><p>如果你覺得「這家出版社的封面變得更有設計感了」，那麼通常是換了老闆。</p><p>要是你覺得「這幾年都出版無聊、沒品味的書來充數」，那麼他們很有可能採取一人獨大的經營模式，並以業績為導向。</p><div class=\"gold-quote\">從競爭激烈的出版業界可以學到許多事情，<br>可以反過來思考該如何運用在自己的業界與眼前的工作。</div>"

        {
                "title": "55 洞察隱藏的訊息",
                "content": "<p>資深作家都會在作品裡面隱藏訊息，雖然很少人知道。</p><p>隱藏著訊息的作品不是只有愛情小說或推理小說。</p><p>雖然有不少思想書被焚毀，但渡過這些難關，經歷過風霜的書籍都是名著。</p><p>我在大學的時候得知書裡有隱藏的訊息，並且下定決心，如果自己將來成為作家，也要在書裡隱藏訊息。</p><p>我至今出版了超過一百七十本書，所有的書都如同當初的計畫，在書裡隱藏著訊息。</p><p>至今為止沒有任何人指出這點，但我現在公開之後，應該就會有更多人發現吧？</p><p>為什麼要特地用把訊息隱藏起來這種繞遠路的表現方式呢？因為如果不這麼做，就無法出版。賭命寫作的作家，都曾遭受過禁止出版的處分。</p><p>這件事我只告訴你們，曾被禁止出版的作家，才是真正的專業人士。</p><p>我的書也曾被禁止出版。還在上班的時候，也曾被負責人單獨找去說「你寫的文章很可怕」。這種事情理所當然。</p><p>因為我已經下定決心，這輩子都要當一個賭命寫作的作家。</p><p>洞察隱藏的訊息沒有訣竅。</p><p>如果你現在的正賭命競爭，那麼只要虛心坦然閱讀，自然就會發現。</p><div class=\"gold-quote\">讀書的時候突然聯想到其他事情，這件事就是隱藏的訊息。<br>只有認真活在當下一這瞬間的人才能夠發現。</div>"

        {
                "title": "56 將從書本中得到的名言佳句，送給潛在客戶",
                "content": "<p>時間與語言是這個世界上最棒的禮物。</p><p>所有人每天活著都在邁向死亡。</p><p>所有人的死亡率毫無疑問都是百分之百。</p><p>沒有比好好度過限時人生更寶貴的禮物。</p><p>以這個基礎再加上語言的力量最能夠打動人心。</p><p>因為光靠腕力，不足以使人展開行動。</p><p>所有的革命與戰爭，都是因為語言的力量而發生。</p><p>所以，這個世界上沒有什麼禮物比你為了好好度過限時人生而寫下的語言更珍貴。</p><p>請將讀了之後讓你感動的句子，直接抄錄下來送給喜歡的人。</p><p>只要附上一句「今天在書上讀到一句很棒的話，我把這句話送給你」就夠了。</p><p>只懂得不斷地推銷商品不是業務。</p><p>因為不需要的東西，就是不需要。</p><p>重要的是保持良好的狀態，讓任何人在有需要的時候，你都能溫柔接納。</p><p>所以請你記住，人們想找的是無論得失都願意關心自己的人。</p><p>只要持續將你讀到的佳句，送給想要往來、合作的人，一年之後環境就會大幅改變。 只要對方的理由是「我有時候會突然想起你的臉」就夠了。</p><div class=\"gold-quote\">將從書上讀到的佳句送給潛在客戶吧！<br>一年之後就能開始與喜歡的人建立一起工作的環境。</div>"

                "title": "57 從年度暢銷書，記下觸動你心弦的一句話",
                "content": "<p>暢銷書充滿了經濟活動的精華。</p><p>經濟就是人類心理狀態集大成的數值化。</p><p>換句話說，只有能夠充分反映人類心理的書籍，才能成為暢銷書。</p><p>掌握人類的心理，就是致富的第一步。</p><p>如果真心想賺錢，學習經營不如學習心理。</p><p>從暢銷書中記下觸動你心弦的一句話，應該會浮現某種共同的特徵。</p><p>舉例來說，如果共同的特徵是「心」，就會發現最近崇尚讀心術與推理類的風潮有增無減。</p><p>這是一件很棒的事情。</p><p>心理學與教育心理學在日本被歸類為文組，但在歐美卻被歸類為理組。</p><p>心理學與教育心理學的學生，運用高等數學反覆提出假說並進行驗證，每天沒日沒夜地做著實驗。</p><p>諾貝爾經濟學獎，也頒發給以心理學為基礎，從事行動經濟學研究的學者。</p><p>任何人都能透過網路得到事實與真相，資本主義的壓榨伎倆也完全暴露在年輕世代的眼裡，未來年功序列與終身雇用等制度所建立的上班族社會絕對會瓦解。</p><p>這個社會在今後將更加追求人類的心理與根據。</p><p>充分表現出這種人類心理的書籍，必然會成為暢銷書。</p><div class=\"gold-quote\">暢銷書充滿了人類的心理。<br>觸動心弦的關鍵字將豐富你的內涵。</div>"

        {
                "title": "58 花在書本上的錢與年收入成正比",
                "content": "<p>我敢斷言，這個世界上最不會背叛你的投資，就是花在書本上的錢。</p><p>透過有聲書或網路影片學習，當然也是有效的投資。</p><p>但是說到價格便宜，而且隨時隨地都能反覆吸收知識的媒介，書本依然出類拔萃。</p><p>頂多投資個一、兩千日圓（約二一、四百四十元新台幣），就能接觸各領域專家提供的智慧，這樣的媒介除了書本之外不做他想。</p><p>雖然網路新聞與文章也是有效的資訊來源，但是花在產出上的時間，依然遠遠比不上書本。</p><p>資訊 → 知識 → 智慧，確實隨著花費的時間進化。</p><p>資訊是零碎的事實，而資訊＋資訊＝知識。</p><p>新聞頂多只達到知識的程度，而知識本身已經無法轉換成金錢。</p><p>因為現在透過網路，就能快速且免費取得源源不絕的知識。</p><p>但知識必須透過有機的方式結合。如果不經由人類的大腦，不可能獲得知識 × 知識＝智慧。</p><p>智慧能夠變成無限的財富。</p><p>但代價是必須付出時間。</p><p>書本是不花時間就無法誕生的媒體，光是這樣就充滿了致富的線索。</p><div class=\"gold-quote\">花越多的時間撰寫，智慧的價值就越高。<br>資訊與知識可以免費取得，智慧的價值卻會持續增加。</div>"

        {
                "title": "59 沒有人因為買太多書而變窮",
                "content": "<p>不管買多少書都沒什麼大不了。</p><p>不只書本，投資自己的頭腦，在這個世界上絕對是風險最低，報酬最高的投資。</p><p>即使每天買一本書，一個月也頂多花 一千五百日圓 × 三十天 = 四萬五千日圓（約等於三百三十 × 三十天 = 九千九百元新台幣）。</p><p>如果這樣會導致自己破產，那麼每周買一本書，一個月也只需花 一千五百日圓 × 四周 = 六千日圓（約等於三百三十 × 四周 = 一千三百二十元新台幣）。</p><p>無論是電子書、有聲書還是影片，只要適合自己就是最好的學習方式，但假設每天拚命地投資自己的頭腦，只要出人頭地大獲成功，立刻就能回本。</p><p>每周讀一本書，一年就讀完五十二本書，而每天讀一本書，一年就能讀完超過三百本書。這樣的閱讀量與一年讀不完一本書的人相比，將會產生驚人的差距。</p><p>這樣的差距，幾乎連溝通都會有問題。</p><p>讀書的人與不讀書的人，就連建立只在早上打個招呼的關係都已經精疲力盡。</p><p>一旦出現了這樣的差距，鴻溝就很難弭平。</p><p>我建議出社會之後，最好能在人生早期的階段，躋身每年讀完三百本書的群體。</p><p>我至今共事過的商業人士超過一萬人，沒有任何一個人因為買太多書而變窮。</p><p>相較之下，沒讀過書的人很多都是窮人。</p><div class=\"gold-quote\">最好每天讀一本書，如果有困難至少每周讀一本。<br>一年之後就會產生驚人的差距。</div>"

        {
                "title": "60 不是因為有錢才有書房，而是有書房才變有錢",
                "content": "<p>即使多有點勉強，也要擁有自己的書房，這麼一來年收就會增加。</p><p>長大之後擁有自己的書房，也有利於孩子的教育。</p><p>多數的家庭有孩子的房間，卻沒有父母的書房。</p><p>所以父母總是躺在客廳的沙發上看電視。</p><p>這對孩子來說是最壞的榜樣。</p><p>孩子不想變成這樣的人，更不可能尊敬無法崇拜的父母。</p><p>這樣的教育，反而會讓孩子覺得「長大之後會變得很悲慘」。</p><p>反之，如果父母有書房，孩子就會覺得嚮往。</p><p>孩子心裡會想「我長大之後也想要擁有那樣的書房」。</p><p>實際上，能在書房裡確保獨自閱讀時間的人，就能出人頭地獲得財富。</p><p>「就算你這麼說，我家無論如何都騰不出空間」，這樣的人也別擔心。</p><p>如果只是兩坪左右的學生雅房，花點小錢一定就能租到。</p><p>實際上也有越來越多上班族租學生雅房來取代書房。</p><p>這其實就是最棒的投資，將來一定能夠連本帶利賺回來。</p><div class=\"gold-quote\">就算有點勉強，也要擁有一間相當於「智慧倉庫」的書房。<br>因為讓你賺回好幾千萬的機率，絕對遠高於買彩券。</div>"

        {
                "title": "61 認真執行致富書的内容，真的能成為富翁",

        {

                "title": "65 只要持續讀書，就能用一句話讓人感動",

        {
                "title": "66 年收達到最低限度的目標後，學習就優先於工作",
                "content": "<p>認真的你，想必無條件地認為成長是件好事情。</p><p>成長確實是一件很棒的事，如果可以，希望一輩子都能持續成長。</p><p>但很遺憾，就現實來看，持續成長是不可能的。</p><p>世界萬物毫無例外地都有榮枯盛衰，人類的歷史更是直接展現出這點。</p><p>過去不存在永遠持續的文明，有形之物也總有一天會腐朽。</p><p>沒有任何一個人類未曾死去。地球也好，宇宙也好，總有一天都會消亡。</p><p>這麼一想就會知道，持續成長違反大自然的意志。</p><p>因此就經濟力來說，當年收達到最低限度的目標後，比起工作，更應該致力於學習，這麼一來收入也會增加。</p><p>但我不想造成誤會，學習不是為了提升收入，而是為了培育素養，讓人生變得更寬廣。</p><p>我還在上班的時候，當年營收超過六百萬日圓（約一千三百二十萬新台幣）的那一刻，生活一下子就變得輕鬆起來。於是我不再那麼拚命工作，開始致力於閱讀。我甚至可以說是在讀書的空檔工作也不誇張。</p><p>後來我遇到的人從層次的根本上改變了，年收以每年一點五倍的幅度持續增加。創業後的經濟力名符其實變成了不同的數量級，於是我更加平淡地投入學習。</p><p>我想你應該已經發現，想要突破極限，必須透過學習讓人生更加寬廣。你小時候在公園沙坑挖洞時，想必也為了挖更深的洞而把洞挖得更大。</p><div class=\"gold-quote\">學習不是工作的手段。<br>工作才是學習的手段。</div>"

        {
                "title": "67 痛苦的時候，才能遇到命定之書",

        {
                "title": "69 早日實現夢想的讀書法",
                "content": "<p>學術證明固然重要，但如果所有的一切都等待學術上的根據，除非置身於學術界，否則在所有的領域都無法成功。</p><p>因為在你等待的時候，壽命就走到了盡頭。</p><p>而且無論人類再怎麼絞盡腦汁，能夠解釋的也只有全宇宙的一小部分。</p><p>既然如此，閱讀寫著「就經驗來看應該是這樣」、「我用這個方法獲得成功」的商業書或自我啟發書，從中獲得靈感，把所有想試的方法全部試過一遍，成功的機率反而更高。</p><p>不要等待100%的證據，只靠30%的假說就能活下去，更是重要的態度。</p><p>在一百種方法當中，適合自己的說不定只有兩、三種。</p><p>不，說不定在一千種當中，連一種也沒有。</p><p>就算是這樣，依然遠比等待在幾年後，或是幾十年後才能解釋的學術根據，更接近成功。</p><p>在原地等待與在反覆摸索中前進有著天壤之別。</p><p>實現夢想需要的既不是才華，也不是運氣。而是在機會到來的時候，勇敢的迎頭而上。</p><p>機會難得到來，卻有很多人推託或是沒有趕上。</p><p>如果聽到別人說「你先請」，可以不必等對方說完，極力爭取每個機會吧！</p><p>因為為了實現夢想，不能只是一味等待學術上的證據。</p><div class=\"gold-quote\">悠哉等待學術證據，只能學到有限的事情。<br>等待學術證據的人，夢想也會延後實現。</div>"

                "title": "70 如果作者有書本以外的內容，也全部都一網打盡",
                "content": "<p>如果讀到一本讓你感動的書，請務必將這位作者的書全部讀過。</p><p>還好二手書店現在也變得連鎖化，網路販賣也很完善。</p><p>除了極少數的例外，想要的書全部都能買到。</p><p>把某位作者的書全部讀過，就能接觸這位作者的思考 DNA。</p><p>當自己遇到瓶頸的時候，就能思考：「這個時候，如果是某某作者會怎麼想？」</p><p>不是把作者的過去全部背下來，而是創造作者的未來。</p><p>背下過去無法成為財富，但創造未來卻能轉變成不同量級的金錢。</p><p>把作者的書全部讀過之後，就調查看看他有沒有在社群網站上發表文章，或是舉辦線上座談會。</p><p>從各種角度將作者的內容一網打盡，就能掌握更多資訊。</p><p>如果是作者，會如何處理這樣的雜事呢？</p><p>如果是作者，會如何擺脫這樣的困境呢？</p><p>如果是作者，會如何追求這位女性呢？</p><p>三百六十五天、二十四小時都活得像你尊敬的師父。</p><p>這就是成長的捷徑。</p><div class=\"gold-quote\">讀到感動的書，就將作者的所有內容一網打盡。<br>閱讀他的部落格與社群網站，並參加他的講座。</div>"

                "title": "72 化身成為喜歡的作者，自動自發地寫稿子",

        {
                "title": "73 試著每年買一本過去「不可能讀」的書",

                "title": "75 讀書時，想像一年後傳播的內容",
                "content": "<p>想讓職涯更上一層樓、想要快速成長，這種熱情洋溢的人，請以一年後能在眾人面前發表言論為目標。</p><p>就算沒有了什麼了不起的成績，在眾人面前發表言論其實也不是什麼困難的事情。</p><p>訣竅有兩個。</p><p>一是無條件接受這樣的機會。</p><p>二是訴求任何一項特色。</p><p>只要掌握這兩個訣竅，在各個講座團體登記成為講師，必定能在一年內做到在眾人面前發表言論。</p><p>問題在於第二個訣竅。</p><p>就算免費，也不會有人想聽沒有任何特色的人說話。</p><p>在盡量小眾的領域內經營自己感興趣的事情，或是多少做出一點成績的事情，應該更容易展現特色。</p><p>以保險業務員為例，如果沒有相當的實力，就無法獲得公司內綜合業績第一名。但在保險商品中的某個小眾商品奪得第一名的業績，就會簡單很多。</p><p>而且第一名的部分依然沒變，這個部分就能成為特色。</p><p>決定特色之後，就把相關書籍全部讀一遍。</p><p>說不定能從小眾商品的第一名，變成稍微主流一點的領域的第一名。</p><p>把發表言論當成目標，反覆讀書與實踐，也會直接影響工作表現。</p><div class=\"gold-quote\">把發表言論當成目標，就能快速成長。<br>讀書、工作、發表言論會產生良性循環。</div>"

                "content": "<p>書都會附上作者簡介。</p><p>作者簡介除了作者本人之外，還有出版社等作者的智囊團隊協助撰寫，通常都會經過好幾次的增補修正。</p><p>我自己的作者簡介也每次都由工作上的合作對象增補修正，原始的版本已經了無痕跡。</p><p>即使讀了書之後心想「寫得真好」，翻閱簡介也可能讓你覺得：「什麼嘛，寫得好像多了不起一樣，結果也沒什麼大不了的。」</p><p>一般來說，讀者如果判斷這名作者比不上自己，就不會購買他的書。</p><p>簡介就是作者的品牌與信賴感。</p><p>所以沒道理不從這麼重要的作者簡介學習。</p><p>那麼該學什麼呢？</p><p>該學的就是對人的觀察力。</p><p>「什麼樣的人容易被接受？」</p><p>「為什麼這名作者要公開他的出生年月日？」</p><p>「為什麼這名作者要公開他畢業於哪所大學？」</p><p>「這名作者重視的是什麼？」</p><p>就像這樣，不斷地對簡介中每一個字句的「為什麼」「怎麼寫」「寫什麼」自問自答。</p><p>如果持續對閱讀的每一本書的作者簡介進行這樣的問答，對人的觀察力就能磨練到相當的程度。</p><div class=\"gold-quote\">請仔細閱讀作者簡介。<br>而且不要只是讀過去，還要從中學習許多事情。</div>"

        {

                "content": "<p>我坦白告訴大家，紙本書的時代正逐漸迎向終點。</p><p>我不想說「紙本書也有紙本書的優點」這種漂亮話。</p><p>電子書必須盡早成為主流，貪戀既有利益的人必須乾脆地讓出道路，不要再苦苦掙扎。</p><p>當然，紙本書不會完全消失。今後應該也會留下少數的紙本書，而也會持續獲得一定的客群支持。</p><p>就像機械鐘與馬口鐵玩具一樣。馬車至今依然存在也是同樣的道理。</p><p>網路上的社群網站與影片，接下來想必也會逐漸攀向巔峰。</p><p>電視與收音機的內容已經變得空洞，人才爭先恐後地進入網路業界。</p><p>如果你也認真地想在只有一次的人生拚一把，就試著在電子書或網路平台上發表自己的內容吧！</p><p>只要你勇於挑戰，就會創造出新的現實，而人在面對這樣的現實時就能成長。</p><p>身為旁觀者很輕鬆，只要批評就好，但成為挑戰者就會變成遭受批評的人。遭受批評絕對比批評別人瀟灑，人生也活得痛快。</p><p>二十世紀代表性的哲學家馬丁．海德格，稱呼那些一輩子都在私底下說三道四的人為「常人（Das Man）」。</p><p>我們應認知到壽命有限，並以挑戰者的身分活下去，否則將永遠無法擺脫「常人」。</p><div class=\"gold-quote\">在大河中逆流而上的生活方式並不聰明。<br>順應自然潮流，以此為基礎來創造自己的人生吧！</div>"

                "content": "<p>根據我閱讀大量書籍的經驗，以及實際成為作者的經驗，只有一件事情我可以斬釘截鐵地告訴你。</p><p>那就是「前言（序章）」是一本書最有趣的部分。</p><p>很少有前言無聊，但內容有趣的書。</p><p>我在實際動筆寫書之後得到一個發現，那就是前言對作者而言是特別的。</p><p>對出版社而言也是。</p><p>他們很清楚，如果前言無聊，這本書根本就不會賣，所以最有趣的內容都會在前言。</p><p>小說除外，商業書與自我啟發書的高潮都在前言，而後精彩度就會逐漸下滑。</p><p>人類不斷地進化，所以等不及想看到精彩處的人急遽增加。</p><p>「只要默默地往下讀，從第一百頁就會開始變得有趣，在這之前要有耐心。」這種過去的娛樂理論已經不再適用。</p><p>「既然如此，就把第一百頁挪到第一頁啊！」這種情況變成現在的常態。</p><p>「最近的年輕人都不閱讀」不是退化，他們只是不再對無聊的事物一一做出反應，就這層意義來看反而是進化。</p><p>看穿這點的行銷專家，就把過濾到極致的精華挪到前言的部分。</p><div class=\"gold-quote\">「前言」是選書的標準。<br>內容超越「前言」的書幾乎不存在。</div>"

        {
                "title": "82 不受評價左右，遇見那百分之一有趣的書",
                "content": "<p>我在前面提過，有些冒牌的書評或影評，總是把「最近沒什麼有趣的作品」掛在嘴邊。</p><p>這種無聊又千篇一律的評論本身就不有趣。</p><p>你不能隨著這種似是而非的言論起舞。</p><p>這樣是在浪費人生的時間。</p><p>閱讀大量書籍的人，就能遇到許多有趣的作品。</p><p>沒讀幾本書的人，當然不會遇到什麼有趣的書籍。</p><p>請你回想一下無論在哪個領域都有「1%有趣作品」的法則。</p><p>想要遇見那一本有趣的作品，只要品味一百本作品即可。</p><p>想要遇見那十本有趣的作品，只要品味一千本作品即可。</p><p>執行起來非常簡單。 工作也是同樣的道理。</p><p>為了遇見一件有趣的工作，必須完美地完成一百件工作。</p><p>想要遇見十件有趣的工作，那麼完美地完成一千件工作即可。</p><p>常讀書的人總是說「這本書的這個部分很有趣」。</p><p>完全不讀書的人，則把「聽說那本書很無聊」掛在嘴邊。</p><p>話說回來，他們就是因為沒有讀過，所以也只能用「聽說」。</p><div class=\"gold-quote\">隨著言論起舞就是自己沒有在思考的證明。<br>只要讀書，就能自己思考並陳述自己的意見。</div>"
        },
        {
                "title": "83 任何一本書，都有超過書本自身的價值",
                "content": "<p>有人會說「書很貴」。</p><p>覺得「書很貴」的人就不能買書。</p><p>只要那些能夠憑直覺理解「書很便宜」的人買書就夠了。</p><p>需要知性才能有這樣的直覺。</p><p>所謂的知性，就是察覺作者在書裡面，毫無保留地呈現他賭上全部人生培養出來的智慧集大成。</p><p>我甚至覺得，就算所有的書都賣十萬日圓（約新台幣二萬二千元），都便宜到不好意思。</p><p>如果一本書賣十萬日圓（約新台幣二萬二千元），那麼一千日圓（約新台幣二百二十元）與一千五百日圓（約新台幣三百三十元）之間的差別都只不過是誤差。</p><p>三千日圓（約新台幣六百六十元）、五千日圓（約新台幣一千一百元）或一萬日圓（約新台幣二千二百元）都太便宜。</p><p>如果你已經是大人了，只要想像作者花多少時間與金錢才足以發表寫在這本書中的智慧，立刻就能知道我的意思。</p><p>請你想想作者把一部分的人生割下來分給我們。</p><p>我從學生時代，就一直抱持著這樣的想法買書。</p><p>我在前面也提過，出版社阿姨也曾在找訂書的時候跟我確認「這本要三萬日圓（新台幣約六千六百元），真的沒問題嗎？」</p><p>就算是這樣，我也從來不覺得「書很貴」。</p><p>不僅如此，我還想告訴大家，就機率來說，購買高價的書，內容通常都很可以期待。</p><div class=\"gold-quote\">請你想像一本書有十萬日圓的價值。<br>這麼一來，無論是一千、三千還是一萬日圓都在誤差範圍內。</div>"
        },
        {
                "title": "84 買下書的那一瞬間，就達成了一半以上的目的",
                "content": "<p>有些人因為買了很多書都沒讀而煩惱。</p><p>他們每次看到還沒讀的書就嘆氣。</p><p>但讀這些書不是你的義務。</p><p>讀書原本應該是興趣，沒有什麼比把讀書當成義務的人生更無趣了。因為這麼一來就是本末倒置。</p><p>解決方法是徹底改變你對於買書的想法。</p><p>你會買下這本書，代表這是在書店翻閱之後做出的選擇，或者是事先收集資訊，判斷自己需要它。沒有人會毫無理由地買書。</p><p>在決定買書的階段，就已經達成了一半以上的目的。</p><p>不只買書，人在每次做決定的時候都能鍛鍊記憶力。</p><p>不做決定的人，記憶力就會變差。</p><p>決定要不要買這本書的過程，將會成為你閱讀這本書的動力。</p><p>自己掏錢買書的那一瞬間是關鍵，資訊在時候就會迅速地留在記憶裡。所以自掏腰包買書更划算，遠遠能夠學到更多。</p><p>換句話說，就算買來的書一直擺著沒有讀，你也已經從中吸收了許多東西，早就已經回本了。</p><p>總是只站在書店翻一翻的人，其實最吃虧。</p><div class=\"gold-quote\">就算沒有讀，自掏腰包買下來也是有意義的。<br>只要從書店帶回觸動心弦的記憶就已經達成目的的。</div>"
        },
        {
                "title": "85 在三十歲之前，先預習三十歲、四十歲",
                "content": "<p>我從大學的時候就開始閱讀給三十、四十歲的人讀的書。</p><p>我在大學一年級的時候就不只閱讀如何找工作的書，也閱讀如何換工作的書。</p><p>還閱讀給管理者看的書，甚至是給退休人士讀的書。</p><p>當然，關於退休之後即將邁入死後世界的書我也讀。</p><p>我讀這些書既不是因為將來打算換工作，也不是為出人頭地成為管理者做準備。</p><p>我讀這些純粹是因為覺得有趣，這是唯一的原因。</p><p>以人生各階段為主題的書，總是埋入許多讓人萌生危機意識的巧思，讀起來真的很刺激。</p><p>後來我親眼見證了驚人的事實。</p><p>求職、成為社會新鮮人、換工作、擔任經營顧問、創業……這些經歷，我都不覺得是「第一次」遇到。</p><p>我覺得全部都像是在複習我大學時代在書裡讀到的內容。</p><p>所以我對於在這個時間點會出現這樣的人、在下一個時間點自己會置身於這樣的環境全都瞭若指掌。</p><p>我忍不住這麼想。</p><p>人類會走上彷彿自己讀過的書一般的人生。</p><div class=\"gold-quote\">步入社會之後也預習人生吧！就像在學校做過的那樣。<br>彷彿在書上讀過的內容，在現實中也將接二連三地發生。</div>"
        },
        {
                "title": "86 不客氣地「使用」書，更能投入內容",
                "content": "<p>請先打破必須珍惜書本的成見。</p><p>為了方便自己閱讀，書買來之後先拉開折一折。</p><p>讀到感興趣的部分就畫紅線，或是做個折角。</p><p>像這樣把書弄得破破髒髒，變成自己專用的書，讀起來會更投入。</p><p>總是小心翼翼地包著書店給的書套，避免弄出折痕，就足以讓人費神。</p><p>疲倦的讀書是假的，腦袋裡不會留下任何東西。</p><p>書才剛買來，隔天就被說「好像讀了很久」最好。</p><p>有時候甚至可以將打動自己的那一節直接撕下來帶走，剩下的就丟到垃圾桶裡。</p><p>如果把書擬人化，我想他最開心的不是一直被乾乾淨淨漂亮地收著，而是實際對擁有者帶來幫助。</p><p>過度珍惜卻根本沒怎麼讀的人，遠比不上雖然讀得破破爛爛，卻立刻將讀到的發現付諸行動的人。</p><p>成為作者讓我發現一件事情。</p><p>如果遇到在書上貼滿索引，把書讀到破破爛爛的讀者，必須特別珍惜。</p><div class=\"gold-quote\">買下的書有權利自由使用。<br>就算只把需要的頁面撕下來，其他丟到垃圾桶也可以。</div>"
        },
        {
                "title": "87 還沒讀完的書，就放在枕邊",
                "content": "<p>我的枕邊總是堆著讀到一半的書。這些書全部都讀到一半就放棄，這是我近十年來持續不斷的習慣。</p><p>不管我回家時多麼地疲倦，都要翻翻堆在枕邊的書，不至少讀個一秒就渾身不對勁。這已經是一種癮。</p><p>如果因此完全睡不著，我反而感到幸運。</p><p>我很感謝在出現睡意之前的這段時間，覺得是「上天送給我的閱讀時光。」</p><p>有時候鑽進棉被裡讀書，反而越讀越清醒。</p><p>如果越讀越清醒，我會乾脆順其自然地讀下去。</p><p>能夠熬夜做我最喜歡的事情根本求之不得。</p><p>只不過，只要稍微湧上一點睡意，我就會乾脆地闔上書本，在下一秒進入夢鄉。</p><p>因為揉著想睡的眼皮努力讀書是違反生理運行的。</p><p>違反生理運行的閱讀不僅讀不進去，也會讓人討厭讀書。</p><p>另外，堆在枕邊的書最容易留下記憶。</p><p>因為讀了之後直接睡著，記憶就會在睡眠中整理。</p><p>我建議在枕邊擺著想要確實吸收的書。</p><p>這麼一來，待讀清單也能不斷地更新。</p><p>還沒讀完的書全部堆在枕邊。</p><div class=\"gold-quote\">如果能夠減少未讀的量還能自然而然地墜入夢鄉，<br>那就賺到了。</div>"
        },
        {
                "title": "88 買下嚮往的艱澀書籍，不會吃虧",
                "content": "<p>淺顯易懂的書很棒，最重要的是容易付諸實行，因此很有幫助。</p><p>不過，如果要在這裡認真給你建議，我會告訴你，只讀淺顯易懂的書，不會為你的人生層次帶來重大改變。</p><p>因為只讀淺顯易懂的書，不會讓你變聰明。</p><p>就像每天做十次伏地挺身或許能夠維持健康，但無法讓你長出肌肉，變得健美有型。 同理，如果不加重大腦的負荷，頭腦也不會變好。</p><p>只讀淺顯易懂的書就算不聰明也能獲得成功與財富。</p><p>這時聚集在你身邊的夥伴，也都不是聰明的成功者或有錢人。</p><p>一般來說，不會有任何人告訴你這個真相。只能像這樣讀書、提升上網搜尋的能力，靠自己的力量找到真實的資訊。</p><p>為了能夠發掘真相，你必須變得知性。</p><p>那麼該怎麼鍛鍊自己的頭腦，才能變聰明呢？</p><p>那就是憑直覺買下嚮往的艱澀書籍，擺放在明顯的地方。</p><p>就算中途無法相信自己，也不能把這些書丟掉或賣掉。</p><p>因為總有一天，你一定能夠讀懂這些書。</p><p>所謂的直覺，就是潛意識在告訴你拼出幸福拼圖需要的碎片。</p><p>把嚮往的書放在明顯的地方，為了讀懂這些書所需要的書也會自然聚集。</p><div class=\"gold-quote\">鍛鍊大腦和鍛鍊肌肉一樣。<br>如果不意識地加重負荷，就什麼也不會改變。</div>"
        },
        {
                "title": "後記 痛苦的時候不要找人取暖，去讀書吧！",
                "content": "<p>如果你將來想要獲得幸福，痛苦的時候就不能立刻跑去找人取暖。</p><p>因為即使聚在一起互舔傷口，回到房間獨處時依然必須面對自己。</p><p>獨處時的寂寞，與剛才還聚在一起互舔傷口的熱鬧時光，兩者相比的落差，會讓人更加消沉。</p><p>於是隔天為了掩蓋這樣的消沉，又繼續聚在一起互相取暖。</p><p>一旦陷入這樣的循環，就只能一輩子在不斷的抱怨中度過。</p><p>相反地，痛苦的時候自己先接受這樣的事實，很快就會遇到出色的人。</p><p>而為了接受痛苦的事實，必須閱讀大量的書籍。</p><p>讀了許多書之後，就不會再抱怨了。</p><p>因為閱讀時不會有人聽你抱怨，所以只能與正向思考的作者一起想辦法。</p><p>能夠找到自己的正向思考，就算一個人也能發光發熱。</p><p>只有能夠自己發光發熱的人，才會遇到其他同類。</p><p>像綿羊一樣成群結隊終究只會一事無成。但遇到其他的獅子就能改變世界。</p><div class=\"gold-quote\">千田琢哉<br>如果沒有這本書，我早已不在世上。</div>"
