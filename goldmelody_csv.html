<script>
const DEFAULT_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTOX4kSu5tM7H8A3UPVNr1lEF_7dZwkzqXQrSf7oAJuAqkdVYEDhJh_UjJbfQ0UuKtufPydYSeZJO89/pub?gid=0&single=true&output=csv";

let ytPlayers = {}; 

function toggleDrawer() {
  document.getElementById('sideDrawer').classList.toggle('active');
  document.getElementById('drawerOverlay').classList.toggle('active');
}

function getActiveCsvUrl() {
  try {
    return localStorage.getItem('user_custom_csv_url') || DEFAULT_CSV_URL;
  } catch (e) {
    return DEFAULT_CSV_URL;
  }
}

function getPlayerSettings() {
  try {
    return {
      shuffle: localStorage.getItem('player_shuffle') === 'true',
      autoplay: localStorage.getItem('player_autoplay') === 'true'
    };
  } catch (e) {
    return { shuffle: false, autoplay: false };
  }
}

function toggleShuffle() {
  let settings = getPlayerSettings();
  settings.shuffle = !settings.shuffle;
  localStorage.setItem('player_shuffle', settings.shuffle);
  updatePlayerUI();
  location.reload();
}

function toggleAutoplay() {
  let settings = getPlayerSettings();
  settings.autoplay = !settings.autoplay;
  localStorage.setItem('player_autoplay', settings.autoplay);
  updatePlayerUI();
}

function updatePlayerUI() {
  let settings = getPlayerSettings();
  const shuffleBtn = document.getElementById('shuffleBtn');
  const autoplayBtn = document.getElementById('autoplayBtn');
  
  if (settings.shuffle) shuffleBtn.classList.add('active');
  else shuffleBtn.classList.remove('active');

  if (settings.autoplay) autoplayBtn.classList.add('active');
  else autoplayBtn.classList.remove('active');
}

function parseCSV(text) {
const rows = [];
let row = [], cell = "", quoted = false;
for (let i = 0; i < text.length; i++) {
const ch = text[i];
if (ch === '"') {
if (quoted && text[i + 1] === '"') { cell += '"'; i++; }
else quoted = !quoted;
} else if (ch === ',' && !quoted) {
row.push(cell); cell = "";
} else if ((ch === '\n' || ch === '\r') && !quoted) {
if (ch === '\r' && text[i + 1] === '\n') i++;
row.push(cell); cell = "";
if (row.some(v => v.trim() !== "")) rows.push(row);
row = [];
} else {
cell += ch;
}
}
if (cell.length || row.length) {
row.push(cell);
if (row.some(v => v.trim() !== "")) rows.push(row);
}
return rows;
}

function normalizeHeader(value) {
return String(value || "").trim().toLowerCase().replace(/[\s_\-（）()【】\[\]]/g, "");
}

function findColumn(headers, aliases) {
const normalized = headers.map(normalizeHeader);
for (const alias of aliases) {
const index = normalized.indexOf(normalizeHeader(alias));
if (index >= 0) return index;
}
return -1;
}

function extractYouTubeId(value) {
const raw = String(value || "").trim();
if (!raw) return "";
if (/^[\w-]{11}$/.test(raw)) return raw;
try {
const url = new URL(raw);
if (url.hostname.includes("youtu.be")) return url.pathname.split("/").filter(Boolean)[0] || "";
if (url.hostname.includes("youtube.com")) {
if (url.pathname === "/watch") return url.searchParams.get("v") || "";
const parts = url.pathname.split("/").filter(Boolean);
const marker = parts.findIndex(part => ["embed", "shorts", "live"].includes(part));
if (marker >= 0) return parts[marker + 1] || "";
}
} catch (_) {}
const match = raw.match(/(?:youtube\.com\/(?:embed\/|shorts\/|live\/|watch\?v=)|youtu\.be\/)([\w-]{11})/);
return match ? match[1] : "";
}

function rowsToSongs(rows) {
if (!rows.length) return [];
const headers = rows[0];
const titleCol = findColumn(headers, ["歌曲名稱", "歌曲", "歌名", "title", "song", "name"]);
const viewsCol = findColumn(headers, ["熱門標籤", "views", "標籤", "分類", "描述"]);
const coverCol = findColumn(headers, ["封面樣式", "封面圖片網址", "coverclass", "coverurl", "封面"]);
const videoCol = findColumn(headers, ["youtube網址", "youtube連結", "影片網址", "影片連結", "video", "videoid", "youtubeid", "embedcode", "連結", "網址"]);

const dataRows = titleCol >= 0 && videoCol >= 0 ? rows.slice(1) : rows;
const titleIndex = titleCol >= 0 && videoCol >= 0 ? titleCol : 0;
const videoIndex = videoCol >= 0 && videoCol >= 0 ? videoCol : 3;

return dataRows.map(row => {
const title = String(row[titleIndex] || "").trim();
const videoValue = String(row[videoIndex] || "").trim();
const videoId = extractYouTubeId(videoValue);

if (!title || !videoId) return null;

const coverValue = coverCol >= 0 ? String(row[coverCol] || "").trim() : "";
let coverUrl = "";
let coverClass = "";

if (coverValue.startsWith("http://") || coverValue.startsWith("https://")) {
coverUrl = coverValue;
} else {
coverClass = coverValue;
}

return {
title,
videoId: videoId,
views: viewsCol >= 0 && row[viewsCol] ? String(row[viewsCol]).trim() : "🎵 正在播放",
isCustomCover: true,
coverClass: coverClass,
coverUrl: coverUrl
};
}).filter(Boolean);
}

function recordUserClick(songTitle) {
  try {
    let history = JSON.parse(localStorage.getItem('user_watch_history')) || [];
    let existing = history.find(item => item.title === songTitle);
    if (existing) {
      existing.clicks = (existing.clicks || 1) + 1;
      existing.lastWatched = new Date().getTime();
    } else {
      history.push({ title: songTitle, clicks: 3, lastWatched: new Date().getTime() });
    }
    if (history.length > 100) history.shift();
    localStorage.setItem('user_watch_history', JSON.stringify(history));
  } catch (e) {}
}

function getCustomUserSongs() {
  try {
    return JSON.parse(localStorage.getItem('user_added_songs')) || [];
  } catch (e) {
    return [];
  }
}

function openSettingsModal() {
  document.getElementById('customCsvInput').value = localStorage.getItem('user_custom_csv_url') || '';
  document.getElementById('settingsModal').style.display = 'flex';
}

function closeSettingsModal() {
  document.getElementById('settingsModal').style.display = 'none';
}

function loadDefaultCsvUrl() {
  localStorage.removeItem('user_custom_csv_url');
  alert("已還原為站長預設推薦清單！");
  location.reload();
}

function saveCustomCsvUrl() {
  const url = document.getElementById('customCsvInput').value.trim();
  if (url) {
    localStorage.setItem('user_custom_csv_url', url);
    alert("設定成功!已切換為你的專屬試算表網址。");
  } else {
    localStorage.removeItem('user_custom_csv_url');
    alert("已清除自訂設定，將使用預設清單。");
  }
  closeSettingsModal();
  location.reload();
}

function openAddModal() {
  document.getElementById('addSongModal').style.display = 'flex';
}

function closeAddModal() {
  document.getElementById('addSongModal').style.display = 'none';
  document.getElementById('ytUrlInput').value = '';
  document.getElementById('ytTitleInput').value = '';
}

function addNewYouTubeSong() {
  const urlVal = document.getElementById('ytUrlInput').value.trim();
  let titleVal = document.getElementById('ytTitleInput').value.trim();
  const videoId = extractYouTubeId(urlVal);
  if (!videoId) {
    alert("請輸入有效的 YouTube 影片網址！");
    return;
  }
  if (!titleVal) {
    titleVal = "自訂加入的精選好歌 (" + videoId + ")";
  }

  const newSong = {
    title: titleVal,
    videoId: videoId,
    views: "🌟 自訂收藏",
    isCustomCover: true,
    coverClass: "",
    coverUrl: "https://live.staticflickr.com/65535/55549203944_a7a9f89992_z.jpg"
  };

  try {
    let customSongs = getCustomUserSongs();
    customSongs.unshift(newSong);
    localStorage.setItem('user_added_songs', JSON.stringify(customSongs));
    recordUserClick(newSong.title);
  } catch (e) {}

  alert("新增成功！已將此歌曲排入你的專屬播放頂端。");
  closeAddModal();
  location.reload();
}

function applyUserPreferenceSorting(songsArray) {
  try {
    let customSongs = getCustomUserSongs();
    songsArray = [...customSongs, ...songsArray];

    let settings = getPlayerSettings();
    if (settings.shuffle) {
      return songsArray.sort(() => Math.random() - 0.5);
    }

    let history = JSON.parse(localStorage.getItem('user_watch_history')) || [];
    if (history.length === 0) return songsArray;

    let scoreMap = {};
    history.forEach(item => {
      scoreMap[item.title] = item.clicks || 1;
    });

    songsArray.sort((a, b) => {
      let scoreA = scoreMap[a.title] || 0;
      let scoreB = scoreMap[b.title] || 0;
      return scoreB - scoreA;
    });
  } catch (e) {}
  return songsArray;
}

async function loadSongDatabase() {
  const activeUrl = getActiveCsvUrl();
  const response = await fetch(activeUrl, { cache: "no-store" });
  if (!response.ok) throw new Error("CSV 資料載入失敗（HTTP " + response.status + "）");
  const csvText = await response.text();
  let songs = rowsToSongs(parseCSV(csvText.replace(/^\uFEFF/, "")));
  if (!songs.length) throw new Error("CSV 中找不到有效歌曲。請確認連結正確。");
  
  songs = applyUserPreferenceSorting(songs);
  return songs;
}

let globalSongDatabase = [];

function initReels(songDatabase) {
globalSongDatabase = songDatabase;
const container = document.getElementById('reelContainer');
container.innerHTML = '';

const infiniteSongs = [...songDatabase, ...songDatabase];

infiniteSongs.forEach((song, index) => {
const card = document.createElement('div');
card.className = 'reel-card';
card.dataset.index = index;
card.dataset.videoId = song.videoId;

let coverHtml = '';
if (song.isCustomCover) {
const extraClass = song.coverClass ? ` ${song.coverClass}` : '';
coverHtml = `<div class="custom-cover-layer${extraClass}"${song.coverUrl ? ` style="background-image:linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1)),url('${song.coverUrl.replace(/'/g, "%27")}')"` : ""}></div>`;
card.dataset.hasCover = "true";
}

card.innerHTML = `
${coverHtml}
<div class="video-wrapper"><div id="yt-player-${index}" style="width:100%;height:100%;"></div></div>
<div class="overlay-info">
<div class="song-text-group">
<div class="song-title">${song.title}</div>
<div class="song-views">${song.views}</div>
</div>
${song.isCustomCover ? `
<a href="https://myezlife.com/index-1.html" target="_blank" class="cover-play-btn-wrapper" style="text-decoration: none;">
<div class="cover-play-btn" title="回首頁">
<svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
</div>
</a>` : ''}
</div>
`;

card.dataset.title = song.title;
container.appendChild(card);
});

const cards = document.querySelectorAll('.reel-card');
const totalOriginal = songDatabase.length;

if (cards.length > 0) {
container.scrollTop = 0;
}

let scrollTimeout;
container.addEventListener('scroll', () => {
clearTimeout(scrollTimeout);
scrollTimeout = setTimeout(() => {
const singleBlockHeight = cards[0].offsetHeight * totalOriginal;

if (container.scrollTop < singleBlockHeight * 0.2) {
container.style.scrollSnapType = 'none';
container.scrollTop += singleBlockHeight;
setTimeout(() => { container.style.scrollSnapType = 'y mandatory'; }, 50);
}
else if (container.scrollTop > singleBlockHeight * 1.5) {
container.style.scrollSnapType = 'none';
container.scrollTop -= singleBlockHeight;
setTimeout(() => { container.style.scrollSnapType = 'y mandatory'; }, 50);
}
}, 100);
}, { passive: true });

const observer = new IntersectionObserver((entries) => {
entries.forEach(entry => {
const card = entry.target;
const index = parseInt(card.dataset.index);
const videoId = card.dataset.videoId;
const coverLayer = card.querySelector('.custom-cover-layer');

if (entry.isIntersecting) {
if (!ytPlayers[index]) {
ytPlayers[index] = new YT.Player(`yt-player-${index}`, {
videoId: videoId,
playerVars: {
'autoplay': 1,
'playsinline': 1,
'controls': 1,
'rel': 0
},
events: {
'onStateChange': (e) => onPlayerStateChange(e, index)
}
});
} else {
try {
ytPlayers[index].playVideo();
} catch(err) {}
}

if (coverLayer) {
coverLayer.classList.add('fade-out');
}
if (card.dataset.title) {
recordUserClick(card.dataset.title);
}
} else {
if (ytPlayers[index]) {
try {
ytPlayers[index].pauseVideo();
} catch(err) {}
}
if (coverLayer) {
coverLayer.classList.remove('fade-out');
}
}
});
}, { threshold: 0.6 });

cards.forEach(card => {
observer.observe(card);
});
}

// 監聽播放結束事件 (ENDED = 0)
function onPlayerStateChange(event, index) {
  if (event.data === YT.PlayerState.ENDED) {
    let settings = getPlayerSettings();
    if (settings.autoplay) {
      const container = document.getElementById('reelContainer');
      const cards = document.querySelectorAll('.reel-card');
      if (cards.length > 0) {
        const cardHeight = cards[0].offsetHeight;
        
        // 如果有開啟隨機播放，播完後隨機跳到清單中的任一卡片位置
        if (settings.shuffle && globalSongDatabase.length > 0) {
          const randomCardIndex = Math.floor(Math.random() * cards.length);
          const targetScrollTop = randomCardIndex * cardHeight;
          container.scrollTo({ top: targetScrollTop, behavior: 'smooth' });
        } else {
          // 一般循序播放：往下滾動一首
          const nextScrollTop = container.scrollTop + cardHeight;
          container.scrollTo({ top: nextScrollTop, behavior: 'smooth' });
        }
      }
    }
  }
}

window.onload = async function () {
updatePlayerUI();
const container = document.getElementById("reelContainer");
try {
const songDatabase = await loadSongDatabase();
if (window.YT && window.YT.Player) {
initReels(songDatabase);
} else {
window.onYouTubeIframeAPIReady = function() {
initReels(songDatabase);
};
}
} catch (error) {
console.error("歌曲資料載入失敗：", error);
container.innerHTML = `<div style="color:#fff;padding:24px;text-align:center;">歌曲資料載入失敗<br><small>${String(error.message || error)}</small><br><button onclick="localStorage.removeItem('user_custom_csv_url'); location.reload();" style="margin-top:16px;padding:10px 18px;">還原預設並重新載入</button></div>`;
}
};
</script>
