<style>
/* 基礎重置：確保手機版直接滿版全螢幕 */

padding: 0;

justify-content: center;

padding: 24px;
border-radius: 16px;

.modal-card input {

font-size: 14px;

.modal-card input:focus {

}

.modal-btns {
display: flex;
gap: 10px;
}

.modal-btns button {
flex: 1;
padding: 10px;
border-radius: 8px;
border: none;
font-weight: bold;
cursor: pointer;
font-size: 14px;
}

.btn-cancel {

.btn-submit {

}

.reel-container {
width: 100%;
height: 100%;
overflow-y: scroll;
scroll-snap-type: y mandatory;
-webkit-overflow-scrolling: touch;
scrollbar-width: none;
transform: translateZ(0);
}

.reel-container::-webkit-scrollbar {
display: none;
}

.reel-card {
width: 100%;
height: 100%;
scroll-snap-align: start;
scroll-snap-stop: always;
position: relative;
display: flex;
justify-content: center;
align-items: center;
background-color: #000000;
overflow: hidden;
}

.video-wrapper {

top: 0;
left: 0;
width: 100%;
height: 100%;
z-index: 1;
display: flex;
justify-content: center;
align-items: center;
}

.video-wrapper iframe {
width: 100% !important;
height: 100% !important;
border: none;
object-fit: cover;
}

/* 預設自訂封面層樣式 */
.custom-cover-layer {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1) 100%),
url('https://live.staticflickr.com/65535/55549203944_a7a9f89992_z.jpg') center/cover no-repeat;
z-index: 5;
cursor: pointer;

}

/* 各專屬封面圖片對應設定 */
.custom-cover-layer.cover-not-falling-you { background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1) 100%), url('https://live.staticflickr.com/65535/55549550848_c03d08fe1a_z.jpg') center/cover no-repeat; }
.custom-cover-layer.cover-not-you { background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1) 100%), url('https://live.staticflickr.com/65535/55549181083_2c4e3a898f_z.jpg') center/cover no-repeat; }
.custom-cover-layer.cover-be-your-mountain { background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1) 100%), url('https://live.staticflickr.com/65535/55549502531_eb0574e77b_z.jpg') center/cover no-repeat; }
.custom-cover-layer.cover-open-door { background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1) 100%), url('https://live.staticflickr.com/65535/55549231861_1b96d1fb77_z.jpg') center/cover no-repeat; }
.custom-cover-layer.cover-end-of-love { background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1) 100%), url('https://live.staticflickr.com/65535/55549482870_24b4f389ed_z.jpg') center/cover no-repeat; }
.custom-cover-layer.cover-worthy { background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1) 100%), url('https://live.staticflickr.com/65535/55549218606_28d06dcf0b_z.jpg') center/cover no-repeat; }
.custom-cover-layer.cover-miss-disaster { background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1) 100%), url('https://images.pexels.com/photos/4581380/pexels-photo-4581380.jpeg') center/cover no-repeat; }
.custom-cover-layer.cover-let-go { background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1) 100%), url('https://live.staticflickr.com/65535/55548228317_3b99571f91_z.jpg') center/cover no-repeat; }
.custom-cover-layer.cover-city-flower { background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1) 100%), url('https://live.staticflickr.com/65535/55549402588_d46db8d284_z.jpg') center/cover no-repeat; }

.custom-cover-layer.fade-out {
opacity: 0;
pointer-events: none;
}

.cover-play-btn {
width: 52px;
height: 52px;
background-color: #ff3b30;
border-radius: 50%;
display: flex;
justify-content: center;
align-items: center;
box-shadow: 0 4px 20px rgba(255, 59, 48, 0.5);

}

.cover-play-btn svg {

height: 22px;

}

@keyframes pulse {
0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.6); }
70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(255, 59, 48, 0); }
100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
}

.overlay-info {
position: absolute;
bottom: 0;
left: 0;
right: 0;
padding: 40px 16px calc(65px + env(safe-area-inset-bottom)) 16px;

z-index: 10;
display: flex;
justify-content: space-between;
align-items: flex-end;
pointer-events: none;
}

.song-text-group {
pointer-events: auto;
flex-grow: 1;
margin-right: 16px;
}

.cover-play-btn-wrapper {
pointer-events: auto;
}

.song-title {
font-size: 16px;
font-weight: bold;
margin-bottom: 8px;
color: #fff;
text-shadow: 0 1px 3px rgba(0,0,0,0.8);
}

.song-views {
font-size: 12px;
color: #fff;
background: rgba(255, 255, 255, 0.2);
backdrop-filter: blur(4px);

<body>

<div class="app-frame">
<!-- 左上角回首頁 Logo -->
<a href="https://myezlife.com/index-1.html">
<img src="https://myezlife.com/eric-logo.gif" width="44" class="top-left-logo" alt="Logo">
</a>

<!-- 右上角新增 YouTube 影片按鈕 -->
<div class="top-right-add-btn" onclick="openAddModal()" title="貼上 YT 網址新增歌曲">
<svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
</div>

<!-- 彈出式新增視窗 -->
<div id="addSongModal">
<div class="modal-card">
<h3>新增 YouTube 歌曲</h3>
<input type="text" id="ytUrlInput" placeholder="請貼上 YouTube 影片網址...">
<input type="text" id="ytTitleInput" placeholder="輸入歌曲名稱（選填）">
<div class="modal-btns">
<button class="btn-cancel" onclick="closeAddModal()">取消</button>
<button class="btn-submit" onclick="addNewYouTubeSong()">立即加入</button>
</div>
</div>
</div>

<div class="reel-container" id="reelContainer"></div>
</div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTOX4kSu5tM7H8A3UPVNr1lEF_7dZwkzqXQrSf7oAJuAqkdVYEDhJh_UjJbfQ0UuKtufPydYSeZJO89/pub?gid=0&single=true&output=csv";

function parseCSV(text) {
const rows = [];
let row = [], cell = "", quoted = false;
for (let i = 0; i < text.length; i++) {
const ch = text[i];
if (ch === '"') {
if (quoted && text[i + 1] === '"') { cell += '"'; i++; }
else quoted = !quoted;
} else if (ch === ',' && !quoted) {
row.push(cell); cell = "";
} else if ((ch === '\n' || ch === '\r') && !quoted) {
if (ch === '\r' && text[i + 1] === '\n') i++;
row.push(cell); cell = "";
if (row.some(v => v.trim() !== "")) rows.push(row);
row = [];
} else {
cell += ch;
}
}
if (cell.length || row.length) {
row.push(cell);
if (row.some(v => v.trim() !== "")) rows.push(row);
}
return rows;
}

function normalizeHeader(value) {
return String(value || "").trim().toLowerCase().replace(/[\s_\-（）()【】\[\]]/g, "");
}

function findColumn(headers, aliases) {
const normalized = headers.map(normalizeHeader);
for (const alias of aliases) {
const index = normalized.indexOf(normalizeHeader(alias));
if (index >= 0) return index;
}
return -1;
}

function extractYouTubeId(value) {
const raw = String(value || "").trim();
if (!raw) return "";
if (/^[\w-]{11}$/.test(raw)) return raw;
try {
const url = new URL(raw);
if (url.hostname.includes("youtu.be")) return url.pathname.split("/").filter(Boolean)[0] || "";
if (url.hostname.includes("youtube.com")) {
if (url.pathname === "/watch") return url.searchParams.get("v") || "";
const parts = url.pathname.split("/").filter(Boolean);
const marker = parts.findIndex(part => ["embed", "shorts", "live"].includes(part));
if (marker >= 0) return parts[marker + 1] || "";
}
} catch (_) {}
const match = raw.match(/(?:youtube\.com\/(?:embed\/|shorts\/|live\/|watch\?v=)|youtu\.be\/)([\w-]{11})/);
return match ? match[1] : "";
}

function rowsToSongs(rows) {
if (!rows.length) return [];
const headers = rows[0];
const titleCol = findColumn(headers, ["歌曲名稱", "歌曲", "歌名", "title", "song", "name"]);
const viewsCol = findColumn(headers, ["熱門標籤", "views", "標籤", "分類", "描述"]);
const coverCol = findColumn(headers, ["封面樣式", "封面圖片網址", "coverclass", "coverurl", "封面"]);
const videoCol = findColumn(headers, ["youtube網址", "youtube連結", "影片網址", "影片連結", "video", "videoid", "youtubeid", "embedcode", "連結", "網址"]);

const dataRows = titleCol >= 0 && videoCol >= 0 ? rows.slice(1) : rows;
const titleIndex = titleCol >= 0 && videoCol >= 0 ? titleCol : 0;
const videoIndex = videoCol >= 0 && videoCol >= 0 ? videoCol : 3;

return dataRows.map(row => {
const title = String(row[titleIndex] || "").trim();
const videoValue = String(row[videoIndex] || "").trim();
const videoId = extractYouTubeId(videoValue);

if (!title || !videoId) return null;

const coverValue = coverCol >= 0 ? String(row[coverCol] || "").trim() : "";
let coverUrl = "";
let coverClass = "";

if (coverValue.startsWith("http://") || coverValue.startsWith("https://")) {
coverUrl = coverValue;
} else {
coverClass = coverValue;
}

return {
title,
views: viewsCol >= 0 && row[viewsCol] ? String(row[viewsCol]).trim() : "🎵 正在播放",
isCustomCover: true,
coverClass: coverClass,
coverUrl: coverUrl,
embedCode: `<iframe width="560" height="315" src="https://www.youtube.com/embed/${videoId}?autoplay=1&playsinline=1" title="${title.replace(/&/g, "&amp;").replace(/"/g, "&quot;")}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`
};
}).filter(Boolean);
}

// 🌟 記錄使用者的點擊喜好與手動新增清單到 localStorage
function recordUserClick(songTitle) {
  try {
    let history = JSON.parse(localStorage.getItem('user_watch_history')) || [];
    let existing = history.find(item => item.title === songTitle);
    if (existing) {
      existing.clicks = (existing.clicks || 1) + 1;
      existing.lastWatched = new Date().getTime();
    } else {
      history.push({
        title: songTitle,
        clicks: 3, // 手動新增或點擊給予較高權重
        lastWatched: new Date().getTime()
      });
    }
    if (history.length > 100) history.shift();
    localStorage.setItem('user_watch_history', JSON.stringify(history));
  } catch (e) {
    console.error("記錄點擊失敗", e);
  }
}

// 🌟 取得使用者額外自訂新增的歌曲清單
function getCustomUserSongs() {
  try {
    return JSON.parse(localStorage.getItem('user_added_songs')) || [];
  } catch (e) {
    return [];
  }
}

// 🌟 處理介面開啟與關閉
function openAddModal() {
  document.getElementById('addSongModal').style.display = 'flex';
}

function closeAddModal() {
  document.getElementById('addSongModal').style.display = 'none';
  document.getElementById('ytUrlInput').value = '';
  document.getElementById('ytTitleInput').value = '';
}

// 🌟 執行新增 YouTube 網址邏輯
function addNewYouTubeSong() {
  const urlVal = document.getElementById('ytUrlInput').value.trim();
  let titleVal = document.getElementById('ytTitleInput').value.trim();
  
  const videoId = extractYouTubeId(urlVal);
  if (!videoId) {
    alert("請輸入有效的 YouTube 影片網址！");
    return;
  }
  
  if (!titleVal) {
    titleVal = "自訂加入的精選好歌 (" + videoId + ")";
  }

  const newSong = {
    title: titleVal,
    views: "🌟 自訂收藏",
    isCustomCover: true,
    coverClass: "",
    coverUrl: "https://live.staticflickr.com/65535/55549203944_a7a9f89992_z.jpg",
    embedCode: `<iframe width="560" height="315" src="https://www.youtube.com/embed/${videoId}?autoplay=1&playsinline=1" title="${titleVal.replace(/"/g, '&quot;')}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>`
  };

  // 1. 儲存至自訂清單 localStorage
  try {
    let customSongs = getCustomUserSongs();
    customSongs.unshift(newSong); // 放到最前面
    localStorage.setItem('user_added_songs', JSON.stringify(customSongs));
    
    // 同時記錄點擊權重，讓它直接排在最頂端
    recordUserClick(newSong.title);
  } catch (e) {
    console.error("儲存自訂歌曲失敗", e);
  }

  alert("新增成功！已將此歌曲排入您的專屬播放頂端。");
  closeAddModal();
  location.reload(); // 重新整理頁面以載入最新清單
}

// 🌟 依照使用者的歷史點擊紀錄與自訂清單進行智慧排序
function applyUserPreferenceSorting(songsArray) {
  try {
    // 合併使用者自己手動新增的歌曲
    let customSongs = getCustomUserSongs();
    // 濾除重複，將自訂歌曲與試算表歌曲結合
    songsArray = [...customSongs, ...songsArray];

    let history = JSON.parse(localStorage.getItem('user_watch_history')) || [];
    if (history.length === 0) return songsArray;

    let scoreMap = {};
    history.forEach(item => {
      scoreMap[item.title] = item.clicks || 1;
    });

    songsArray.sort((a, b) => {
      let scoreA = scoreMap[a.title] || 0;
      let scoreB = scoreMap[b.title] || 0;
      return scoreB - scoreA;
    });
  } catch (e) {
    console.error("套用個人化排序失敗", e);
  }
  return songsArray;
}

async function loadSongDatabase() {
const response = await fetch(CSV_URL, { cache: "no-store" });
if (!response.ok) throw new Error("CSV 載入失敗（HTTP " + response.status + "）");
const csvText = await response.text();
let songs = rowsToSongs(parseCSV(csvText.replace(/^\uFEFF/, "")));

// 🌟 套用個人化智慧排序（結合手動新增與瀏覽記錄）
songs = applyUserPreferenceSorting(songs);
return songs;
}

function initReels(songDatabase) {
const container = document.getElementById('reelContainer');
container.innerHTML = '';

const infiniteSongs = [...songDatabase, ...songDatabase];

infiniteSongs.forEach((song) => {
const card = document.createElement('div');
card.className = 'reel-card';

let coverHtml = '';
if (song.isCustomCover) {
const extraClass = song.coverClass ? ` ${song.coverClass}` : '';
coverHtml = `<div class="custom-cover-layer${extraClass}"${song.coverUrl ? ` style="background-image:linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1)),url('${song.coverUrl.replace(/'/g, "%27")}')"` : ""}></div>`;
card.dataset.hasCover = "true";
}

card.innerHTML = `
${coverHtml}
<div class="video-wrapper"></div>
<div class="overlay-info">
<div class="song-text-group">
<div class="song-title">${song.title}</div>
<div class="song-views">${song.views}</div>
</div>
${song.isCustomCover ? `
<a href="https://myezlife.com/index-1.html" target="_blank" class="cover-play-btn-wrapper" style="text-decoration: none;">
<div class="cover-play-btn" title="回首頁">
<svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
</div>
</a>` : ''}
</div>
`;

card.dataset.embed = song.embedCode;
card.dataset.title = song.title;
container.appendChild(card);
});

const cards = document.querySelectorAll('.reel-card');
const totalOriginal = songDatabase.length;

if (cards.length > 0) {
container.scrollTop = 0;
}

let scrollTimeout;
container.addEventListener('scroll', () => {
clearTimeout(scrollTimeout);
scrollTimeout = setTimeout(() => {
const singleBlockHeight = cards[0].offsetHeight * totalOriginal;

if (container.scrollTop < singleBlockHeight * 0.2) {
container.style.scrollSnapType = 'none';
container.scrollTop += singleBlockHeight;
setTimeout(() => { container.style.scrollSnapType = 'y mandatory'; }, 50);
}
else if (container.scrollTop > singleBlockHeight * 1.5) {
container.style.scrollSnapType = 'none';
container.scrollTop -= singleBlockHeight;
setTimeout(() => { container.style.scrollSnapType = 'y mandatory'; }, 50);
}
}, 100);
}, { passive: true });

const observer = new IntersectionObserver((entries) => {
entries.forEach(entry => {
const card = entry.target;
const wrapper = card.querySelector('.video-wrapper');
const coverLayer = card.querySelector('.custom-cover-layer');

if (entry.isIntersecting) {
if (!wrapper.hasChildNodes()) {
wrapper.innerHTML = card.dataset.embed;
}
if (coverLayer) {
coverLayer.classList.add('fade-out');
}
  
if (card.dataset.title) {
recordUserClick(card.dataset.title);
}

} else {
wrapper.innerHTML = '';
if (coverLayer) {
coverLayer.classList.remove('fade-out');
}
}
});
}, { threshold: 0.6 });

cards.forEach(card => {
observer.observe(card);
});
}

window.onload = async function () {
const container = document.getElementById("reelContainer");
try {
const songDatabase = await loadSongDatabase();
initReels(songDatabase);
} catch (error) {
console.error("歌曲資料載入失敗：", error);
container.innerHTML = `<div style="color:#fff;padding:24px;text-align:center;">歌曲資料載入失敗<br><small>${String(error.message || error)}</small><br><button onclick="location.reload()" style="margin-top:16px;padding:10px 18px;">重新載入</button></div>`;
}
};
</script>
