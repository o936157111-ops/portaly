<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- 啟用手機全螢幕與沉浸式模式 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">

    <title>華語金曲隨機短影音牆 - Shorts 風格</title>
    <style>
        /* 基礎重置：確保手機版直接滿版全螢幕 */
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* 電腦版或大螢幕時：置中顯示手機比例框體 */
        @media (min-width: 768px) {
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                background-color: #f0f2f5;
                position: static;
            }
            .app-frame {
                width: 100%;
                max-width: 430px;
                height: 100vh;
                height: 100dvh;
                max-height: 932px;
                border-radius: 24px;
                overflow: hidden;
                box-shadow: 0 10px 30px rgba(0,0,0,0.15);
                position: relative;
                background-color: #ffffff;
            }
        }

        /* 手機版：直接強制 100% 全螢幕覆蓋 */
        @media (max-width: 767px) {
            .app-frame {
                width: 100vw;
                height: 100vh;
                height: 100dvh;
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                border-radius: 0;
                box-shadow: none;
                background-color: #000000;
            }
        }

        .reel-container {
            width: 100%;
            height: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            transform: translateZ(0);
        }

        .reel-container::-webkit-scrollbar {
            display: none;
        }

        .reel-card {
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            overflow: hidden;
        }

        .video-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-wrapper iframe {
            width: 100% !important;
            height: 100% !important;
            border: none;
            object-fit: cover;
        }

        /* 預設自訂封面層樣式 */
        .custom-cover-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1) 100%),
                        url('https://live.staticflickr.com/65535/55549203944_a7a9f89992_z.jpg') center/cover no-repeat;
            z-index: 5;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }

         /* 「我不該動情」專屬封面圖片 */
        .custom-cover-layer.cover-not-falling-you {
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1) 100%),
                        url('https://live.staticflickr.com/65535/55549550848_c03d08fe1a_z.jpg') center/cover no-repeat;
        }
       

        /* 「原來你愛的不是我」專屬封面圖片 */
        .custom-cover-layer.cover-not-you {
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1) 100%),
                        url('https://live.staticflickr.com/65535/55549181083_2c4e3a898f_z.jpg') center/cover no-repeat;
        }


        /* 「換我做你的山」專屬封面圖片 */
        .custom-cover-layer.cover-be-your-mountain {
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1) 100%),
                        url('https://live.staticflickr.com/65535/55549502531_eb0574e77b_z.jpg') center/cover no-repeat;
        }


        /* 「推開世界的門」專屬封面圖片 */
        .custom-cover-layer.cover-open-door {
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1) 100%),
                        url('https://live.staticflickr.com/65535/55549231861_1b96d1fb77_z.jpg') center/cover no-repeat;
        }

        /* 「愛到盡頭」專屬封面圖片 */
        .custom-cover-layer.cover-end-of-love {
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1) 100%),
                        url('https://live.staticflickr.com/65535/55549482870_24b4f389ed_z.jpg') center/cover no-repeat;
        }

        /* 「值得」專屬封面圖片 */
        .custom-cover-layer.cover-worthy {
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1) 100%),
                        url('https://live.staticflickr.com/65535/55549218606_28d06dcf0b_z.jpg') center/cover no-repeat;
        }

        /* 「思念成災」專屬封面圖片 */
        .custom-cover-layer.cover-miss-disaster {
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1) 100%),
                        url('https://images.pexels.com/photos/4581380/pexels-photo-4581380.jpeg') center/cover no-repeat;
        }

        /* 「放過自己」專屬封面圖片 */
        .custom-cover-layer.cover-let-go {
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1) 100%),
                        url('https://live.staticflickr.com/65535/55548228317_3b99571f91_z.jpg') center/cover no-repeat;
        }

        /* 「城北的花」專屬封面圖片 */
        .custom-cover-layer.cover-city-flower {
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1) 100%),
                        url('https://live.staticflickr.com/65535/55549402588_d46db8d284_z.jpg') center/cover no-repeat;
        }

        .custom-cover-layer.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .cover-play-btn {
            width: 52px;
            height: 52px;
            background-color: #ff3b30;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 20px rgba(255, 59, 48, 0.5);
            animation: pulse 2s infinite;
            flex-shrink: 0;
            cursor: pointer;
        }

        .cover-play-btn svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
            transform: translateX(2px);
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.6); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(255, 59, 48, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
        }

        /* 底部資訊與按鈕共用同一列容器，適應安全距離 */
        .overlay-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 40px 16px calc(65px + env(safe-area-inset-bottom)) 16px;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
        }

        .song-text-group {
            pointer-events: auto;
            flex-grow: 1;
            margin-right: 16px;
        }

        .cover-play-btn-wrapper {
            pointer-events: auto;
        }

        .song-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .song-views {
            font-size: 12px;
            color: #fff;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <div class="app-frame">
        <div class="reel-container" id="reelContainer"></div>
    </div>

    <script>
        // 歌曲資料改由 Google 試算表公開 CSV 載入
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTOX4kSu5tM7H8A3UPVNr1lEF_7dZwkzqXQrSf7oAJuAqkdVYEDhJh_UjJbfQ0UuKtufPydYSeZJO89/pub?gid=0&single=true&output=csv";

        // 保留原本歌曲的專屬封面設定；新增歌曲若無對應封面，會使用一般播放方式
        const coverSettings = {
            "人潮有多擁擠 就有多想你": { isCustomCover: true, coverClass: "" },
            "城北的花": { isCustomCover: true, coverClass: "cover-city-flower" },
            "推開世界的門": { isCustomCover: true, coverClass: "cover-open-door" },
            "原來你愛的不是我": { isCustomCover: true, coverClass: "cover-not-you" },
            "值得": { isCustomCover: true, coverClass: "cover-worthy" },
            "愛到盡頭": { isCustomCover: true, coverClass: "cover-end-of-love" },
            "換我做你的山": { isCustomCover: true, coverClass: "cover-be-your-mountain" },
            "思念成災": { isCustomCover: true, coverClass: "cover-miss-disaster" },
            "放過自己": { isCustomCover: true, coverClass: "cover-let-go" },
            "我不該動情": { isCustomCover: true, coverClass: "cover-not-falling-you" }
        };

        // 支援含逗號、雙引號及換行的 CSV 欄位
        function parseCSV(text) {
            const rows = [];
            let row = [], cell = "", quoted = false;
            for (let i = 0; i < text.length; i++) {
                const ch = text[i];
                if (ch === '"') {
                    if (quoted && text[i + 1] === '"') { cell += '"'; i++; }
                    else quoted = !quoted;
                } else if (ch === ',' && !quoted) {
                    row.push(cell); cell = "";
                } else if ((ch === '\n' || ch === '\r') && !quoted) {
                    if (ch === '\r' && text[i + 1] === '\n') i++;
                    row.push(cell); cell = "";
                    if (row.some(v => v.trim() !== "")) rows.push(row);
                    row = [];
                } else {
                    cell += ch;
                }
            }
            if (cell.length || row.length) {
                row.push(cell);
                if (row.some(v => v.trim() !== "")) rows.push(row);
            }
            return rows;
        }

        function normalizeHeader(value) {
            return String(value || "").trim().toLowerCase().replace(/[\s_\-（）()【】\[\]]/g, "");
        }

        function findColumn(headers, aliases) {
            const normalized = headers.map(normalizeHeader);
            for (const alias of aliases) {
                const index = normalized.indexOf(normalizeHeader(alias));
                if (index >= 0) return index;
            }
            return -1;
        }

        function extractYouTubeId(value) {
            const raw = String(value || "").trim();
            if (!raw) return "";
            if (/^[\w-]{11}$/.test(raw)) return raw;
            try {
                const url = new URL(raw);
                if (url.hostname.includes("youtu.be")) return url.pathname.split("/").filter(Boolean)[0] || "";
                if (url.hostname.includes("youtube.com")) {
                    if (url.pathname === "/watch") return url.searchParams.get("v") || "";
                    const parts = url.pathname.split("/").filter(Boolean);
                    const marker = parts.findIndex(part => ["embed", "shorts", "live"].includes(part));
                    if (marker >= 0) return parts[marker + 1] || "";
                }
            } catch (_) {}
            const match = raw.match(/(?:youtube\.com\/(?:embed\/|shorts\/|live\/|watch\?v=)|youtu\.be\/)([\w-]{11})/);
            return match ? match[1] : "";
        }

        function rowsToSongs(rows) {
            if (!rows.length) return [];
            const headers = rows[0];
            const titleCol = findColumn(headers, ["歌曲名稱", "歌曲", "歌名", "title", "song", "name"]);
            const viewsCol = findColumn(headers, ["熱門標籤", "views", "標籤", "分類", "描述"]);
            const coverCol = findColumn(headers, ["封面樣式", "封面圖片網址", "coverclass", "coverurl", "封面"]);
            const videoCol = findColumn(headers, ["youtube網址", "youtube連結", "影片網址", "影片連結", "video", "videoid", "youtubeid", "embedcode", "連結", "網址"]);
            
            const dataRows = titleCol >= 0 && videoCol >= 0 ? rows.slice(1) : rows;
            const titleIndex = titleCol >= 0 && videoCol >= 0 ? titleCol : 0;
            const videoIndex = titleCol >= 0 && videoCol >= 0 ? videoCol : 3;

            return dataRows.map(row => {
                const title = String(row[titleIndex] || "").trim();
                const videoValue = String(row[videoIndex] || "").trim();
                const videoId = extractYouTubeId(videoValue);
                if (!title || !videoId) return null;

                const coverValue = coverCol >= 0 ? String(row[coverCol] || "").trim() : "";
                
                let coverUrl = "";
                let coverClass = "";
                
                if (coverValue.startsWith("http://") || coverValue.startsWith("https://")) {
                    coverUrl = coverValue;
                } else {
                    coverClass = coverValue;
                }

                const song = {
                    title,
                    views: viewsCol >= 0 && row[viewsCol] ? String(row[viewsCol]).trim() : "🎵 正在播放",
                    isCustomCover: true,
                    coverClass: coverClass,
                    coverUrl: coverUrl,
                    embedCode: ``
                };
                return song;
            }).filter(Boolean);
        }

        async function loadSongDatabase() {
            const response = await fetch(CSV_URL, { cache: "no-store" });
            if (!response.ok) throw new Error("CSV 載入失敗（HTTP " + response.status + "）");
            const csvText = await response.text();
            const songs = rowsToSongs(parseCSV(csvText.replace(/^\uFEFF/, "")));
            if (!songs.length) throw new Error("CSV 中找不到有效歌曲。請確認欄位至少包含歌曲名稱與 YouTube 影片網址。");
            return songs;
        }

        function initReels(songDatabase) {
            const container = document.getElementById('reelContainer');
            container.innerHTML = '';

            const shuffledSongs = [...songDatabase].sort(() => 0.5 - Math.random());
            const infiniteSongs = [...shuffledSongs, ...shuffledSongs, ...shuffledSongs];

            infiniteSongs.forEach((song) => {
                const card = document.createElement('div');
                card.className = 'reel-card';
                
                let coverHtml = '';
                if (song.isCustomCover) {
                    const extraClass = song.coverClass ? ` ${song.coverClass}` : '';
                    coverHtml = `<div class="custom-cover-layer${extraClass}"${song.coverUrl ? ` style="background-image:linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1)),url('${song.coverUrl.replace(/'/g, "%27")}')"` : ""}></div>`;
                    card.dataset.hasCover = "true";
                }

                card.innerHTML = `
                    ${coverHtml}
                    <div class="video-wrapper"></div>
                    <div class="overlay-info">
                        <div class="song-text-group">
                            <div class="song-title">${song.title}</div>
                            <div class="song-views">${song.views}</div>
                        </div>
                        ${song.isCustomCover ? `
                        <div class="cover-play-btn-wrapper" onclick="playCustomSong(this)">
                            <div class="cover-play-btn">
                                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                            </div>
                        </div>` : ''}
                    </div>
                `;
                
                card.dataset.embed = song.embedCode;
                container.appendChild(card);
            });

            const cards = document.querySelectorAll('.reel-card');
            const totalOriginal = songDatabase.length;

            if (cards.length > 0) {
                const randomOffset = Math.floor(Math.random() * totalOriginal);
                const targetIndex = totalOriginal + randomOffset;
                container.scrollTop = cards[targetIndex].offsetTop;
            }

            let scrollTimeout;
            container.addEventListener('scroll', () => {
                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(() => {
                    const singleBlockHeight = cards[0].offsetHeight * totalOriginal;
                    
                    if (container.scrollTop < singleBlockHeight * 0.4) {
                        container.style.scrollSnapType = 'none';
                        container.scrollTop += singleBlockHeight;
                        setTimeout(() => { container.style.scrollSnapType = 'y mandatory'; }, 50);
                    } 
                    else if (container.scrollTop > singleBlockHeight * 2.3) {
                        container.style.scrollSnapType = 'none';
                        container.scrollTop -= singleBlockHeight;
                        setTimeout(() => { container.style.scrollSnapType = 'y mandatory'; }, 50);
                    }
                }, 100);
            }, { passive: true });

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const card = entry.target;
                    const wrapper = card.querySelector('.video-wrapper');
                    const hasCover = card.dataset.hasCover === "true";

                    if (entry.isIntersecting) {
                        const coverLayer = card.querySelector('.custom-cover-layer');
                        if (hasCover && coverLayer && !coverLayer.classList.contains('fade-out')) {
                            return; 
                        }

                        if (!wrapper.hasChildNodes()) {
                            wrapper.innerHTML = card.dataset.embed;
                        }
                    } else {
                        if (!hasCover || (hasCover && card.querySelector('.custom-cover-layer')?.classList.contains('fade-out'))) {
                            wrapper.innerHTML = '';
                        }
                    }
                });
            }, { threshold: 0.6 });

            cards.forEach(card => {
                observer.observe(card);
            });
        }

        function playCustomSong(btnWrapper) {
            const card = btnWrapper.closest('.reel-card');
            const wrapper = card.querySelector('.video-wrapper');
            const coverLayer = card.querySelector('.custom-cover-layer');
            
            if (!wrapper.hasChildNodes()) {
                wrapper.innerHTML = card.dataset.embed;
            }

            if (coverLayer) {
                coverLayer.classList.add('fade-out');
            }
        }

        window.onload = async function () {
            const container = document.getElementById("reelContainer");
            try {
                const songDatabase = await loadSongDatabase();
                initReels(songDatabase);
            } catch (error) {
                console.error("歌曲資料載入失敗：", error);
                container.innerHTML = `<div style="color:#fff;padding:24px;text-align:center;">歌曲資料載入失敗<br><small>${String(error.message || error)}</small><br><button onclick="location.reload()" style="margin-top:16px;padding:10px 18px;">重新載入</button></div>`;
            }
        };
    </script>
</body>
</html>
