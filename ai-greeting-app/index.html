<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日 AI 視覺問候圖</title>

  <!-- PWA 專屬設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f59e0b">

  <!-- iOS Safari 專屬全螢幕 App 設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="早安問候圖">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/869/869636.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 圖示 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      background-color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .blur-preview {
      filter: blur(12px);
      transition: filter 0.6s ease;
    }
    .photo-card {
      background: #ffffff;
      padding: 8px;
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    }
  </style>
</head>
<body class="min-h-screen pb-12">

  <!-- 頂部導覽列 -->
  <header class="bg-white/90 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-amber-500 to-rose-500 flex items-center justify-center text-white font-bold shadow-sm">
          <i class="fa-solid fa-sun text-sm"></i>
        </div>
        <h1 class="text-lg font-bold text-slate-800">早安問候圖製作</h1>
      </div>
      <span class="text-xs px-2.5 py-1 bg-amber-100 text-amber-800 rounded-full font-medium">
        🌸 LINE 專用大景
      </span>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="max-w-md mx-auto px-4 mt-4 space-y-4">

    <!-- PWA 安裝按鈕區塊 -->
    <div id="pwaInstallCard" class="hidden bg-amber-50 border border-amber-200 rounded-xl p-3 flex items-center justify-between shadow-sm">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-mobile-screen-button text-amber-600 text-xl"></i>
        <div>
          <p class="text-xs font-bold text-amber-900">安裝 App 到手機桌面</p>
          <p class="text-[11px] text-amber-600">每天一鍵打開，快速製作精美問候</p>
        </div>
      </div>
      <button id="installBtn" class="bg-amber-600 text-white text-xs px-3 py-1.5 rounded-lg font-medium shadow-sm hover:bg-amber-700 active:scale-95 transition">
        📲 安裝
      </button>
    </div>

    <!-- 表單輸入區塊 -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 space-y-4">
      <h2 class="text-sm font-bold text-slate-700 border-b border-slate-100 pb-2">
        ✏️ 填寫今日問候內容
      </h2>

      <!-- 第一排：問候前綴與自訂輸入 -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">問候前綴</label>
          <select id="prefixSelect" class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 bg-slate-50">
            <option value="早安">早安</option>
            <option value="午安">午安</option>
            <option value="晚安">晚安</option>
            <option value="日安">日安</option>
            <option value="custom">✏️ 自訂前綴...</option>
          </select>
        </div>
        <div id="customPrefixContainer" class="hidden">
          <label class="block text-xs font-medium text-slate-600 mb-1">自訂前綴字眼</label>
          <input type="text" id="customPrefixInput" placeholder="例如：平安喜樂" 
                 class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 bg-slate-50">
        </div>
        <div id="targetContainer" class="col-span-1">
          <label class="block text-xs font-medium text-slate-600 mb-1">問候對象 / 稱呼</label>
          <input type="text" id="targetInput" placeholder="例如：好友、各位長輩" value="好朋友" 
                 class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 bg-slate-50">
        </div>
      </div>

      <!-- 第二排：祝福內容 -->
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">祝福或提醒內容</label>
        <textarea id="wishInput" rows="2" placeholder="例如：迎著晨光，祝福您今天順心愉快、笑口常開！" 
                  class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 bg-slate-50">迎著晨光，祝福您今天順心愉快，事事如意！</textarea>
      </div>

      <button id="generateBtn" class="w-full bg-gradient-to-r from-amber-500 to-rose-500 text-white font-bold py-3 rounded-xl shadow-md active:scale-95 transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-sun"></i> 一鍵生成精美早安問候圖
      </button>
    </div>

    <!-- 結果與廣告解鎖區塊 -->
    <div id="resultCard" class="hidden space-y-3">
      
      <div class="photo-card">
        <div class="flex items-center justify-between mb-2 px-1">
          <span class="text-xs font-bold text-slate-500 tracking-wider">✨ LINE Blessing Card</span>
          <span id="statusBadge" class="text-xs px-2.5 py-0.5 bg-amber-100 text-amber-800 rounded-full font-medium">鎖定中</span>
        </div>

        <div class="relative rounded-xl overflow-hidden bg-slate-100 min-h-[360px] flex items-center justify-center">
          <canvas id="compositeCanvas" class="hidden"></canvas>
          <img id="previewImage" src="" alt="問候圖預覽" class="w-full h-auto blur-preview">
          
          <!-- 鎖定/廣告遮罩 -->
          <div id="lockOverlay" class="absolute inset-0 bg-slate-900/40 backdrop-blur-xs flex flex-col items-center justify-center p-4 text-center text-white space-y-3">
            <div class="w-12 h-12 rounded-full bg-white/20 flex items-center justify-center backdrop-blur-md">
              <i class="fa-solid fa-lock text-2xl text-amber-300"></i>
            </div>
            <div>
              <p class="font-bold text-base">觀看廣告解鎖 HD 高清美圖</p>
              <p class="text-xs text-slate-200 mt-1">解鎖後可直接儲存並分享至 LINE 群組</p>
            </div>
            <button id="watchAdBtn" class="bg-amber-400 hover:bg-amber-500 text-slate-900 font-bold text-sm px-5 py-2.5 rounded-full shadow-lg active:scale-95 transition flex items-center gap-2">
              <i class="fa-solid fa-play"></i> 觀看短廣告 (15秒) 解鎖
            </button>
          </div>
        </div>
      </div>

      <!-- 解鎖後動作按鈕區 -->
      <div id="unlockedActions" class="hidden grid grid-cols-2 gap-3 pt-1">
        <button id="downloadBtn" class="bg-emerald-600 text-white font-bold py-2.5 rounded-xl shadow-sm hover:bg-emerald-700 active:scale-95 transition flex items-center justify-center gap-2 text-sm">
          <i class="fa-solid fa-download"></i> 下載高清圖
        </button>
        <button id="shareBtn" class="bg-sky-500 text-white font-bold py-2.5 rounded-xl shadow-sm hover:bg-sky-600 active:scale-95 transition flex items-center justify-center gap-2 text-sm">
          <i class="fa-solid fa-share-nodes"></i> 分享至 LINE
        </button>
      </div>
    </div>

  </main>

  <!-- JavaScript 邏輯控制 -->
  <script>
    // --- 0. 自訂前綴切換邏輯 ---
    const prefixSelect = document.getElementById('prefixSelect');
    const customPrefixContainer = document.getElementById('customPrefixContainer');
    const targetContainer = document.getElementById('targetContainer');
    const customPrefixInput = document.getElementById('customPrefixInput');

    prefixSelect.addEventListener('change', (e) => {
      if (e.target.value === 'custom') {
        customPrefixContainer.classList.remove('hidden');
        targetContainer.className = "col-span-2"; // 讓下方排版對齊
      } else {
        customPrefixContainer.classList.add('hidden');
        targetContainer.className = "col-span-1";
      }
    });

    // --- 1. PWA 安裝邏輯 ---
    let deferredPrompt;
    const pwaInstallCard = document.getElementById('pwaInstallCard');
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      pwaInstallCard.classList.remove('hidden');
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          pwaInstallCard.classList.add('hidden');
        }
        deferredPrompt = null;
      }
    });

    // --- 2. 核心邏輯元件 ---
    const generateBtn = document.getElementById('generateBtn');
    const resultCard = document.getElementById('resultCard');
    const previewImage = document.getElementById('previewImage');
    const compositeCanvas = document.getElementById('compositeCanvas');
    const lockOverlay = document.getElementById('lockOverlay');
    const watchAdBtn = document.getElementById('watchAdBtn');
    const statusBadge = document.getElementById('statusBadge');
    const unlockedActions = document.getElementById('unlockedActions');

    let finalDataUrl = "";
    let lastRandomId = 0;

    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        
        const timer = setTimeout(() => {
          img.src = "";
          reject(new Error("Timeout"));
        }, 6000);

        img.onload = () => {
          clearTimeout(timer);
          resolve(img);
        };
        img.onerror = () => {
          clearTimeout(timer);
          reject(new Error("Error"));
        };

        img.src = url;
      });
    }

    generateBtn.addEventListener('click', async () => {
      let prefix = prefixSelect.value;
      if (prefix === 'custom') {
        prefix = customPrefixInput.value.trim() || '平安喜樂';
      }
      const target = document.getElementById('targetInput').value.trim() || '好朋友';
      const wish = document.getElementById('wishInput').value.trim() || '祝您今天順心愉快！';

      generateBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 正在挑選日出大景與花草美景...';
      generateBtn.disabled = true;

      // 🌸 專門精選的 LINE 質感大景與花草晨曦圖片 ID 庫 (100% 亮麗、充滿正能量)
      const lineMorningImageIds = [10, 54, 119, 145, 152, 249, 292, 319, 360, 429, 517, 621, 659, 729, 824, 915, 1025, 1043, 1047, 1059];
      
      let randomId;
      do {
        randomId = lineMorningImageIds[Math.floor(Math.random() * lineMorningImageIds.length)];
      } while (randomId === lastRandomId && lineMorningImageIds.length > 1);
      lastRandomId = randomId;

      const timestamp = Date.now();
      const bgUrl = `https://picsum.photos/id/${randomId}/768/1024?t=${timestamp}`;

      let bgImg = null;
      try {
        bgImg = await loadImage(bgUrl);
      } catch (err) {
        bgImg = await loadImage(`https://picsum.photos/768/1024?random=${timestamp}`);
      }

      // 開始 Canvas 繪製 (直式畫布)
      const canvas = compositeCanvas;
      const ctx = canvas.getContext('2d');
      const cw = 768;
      const ch = 1024;
      canvas.width = cw;
      canvas.height = ch;

      ctx.filter = 'none';

      // A. 智慧縮放與置中繪製背景 (完美填滿直式畫面)
      if (bgImg) {
        const iw = bgImg.width;
        const ih = bgImg.height;
        const ratio_w = cw / iw;
        const ratio_h = ch / ih;
        const renderRatio = Math.max(ratio_w, ratio_h);
        const renderW = iw * renderRatio;
        const renderH = ih * renderRatio;
        const offsetX = (cw - renderW) / 2;
        const offsetY = (ch - renderH) / 2;

        // 拉高亮度與飽和度，展現熱鬧、朝氣的早安圖風格
        ctx.filter = 'brightness(1.12) contrast(1.08) saturate(1.35)';
        ctx.drawImage(bgImg, offsetX, offsetY, renderW, renderH);
        ctx.filter = 'none';
      } else {
        const bgGrad = ctx.createLinearGradient(0, 0, cw, ch);
        bgGrad.addColorStop(0, '#f59e0b');
        bgGrad.addColorStop(1, '#ec4899');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, cw, ch);
      }

      // B. 質感上下漸層光暈遮罩 (讓文字更清晰易讀，同時保有早安圖的高級感)
      const gradient = ctx.createLinearGradient(0, 0, 0, ch);
      gradient.addColorStop(0, 'rgba(0, 0, 0, 0.55)');
      gradient.addColorStop(0.25, 'rgba(0, 0, 0, 0.1)');
      gradient.addColorStop(0.68, 'rgba(0, 0, 0, 0.1)');
      gradient.addColorStop(1, 'rgba(0, 0, 0, 0.7)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, cw, ch);

      // C. 繪製頂部問候語 (精緻發光字體)
      ctx.fillStyle = "#ffffff";
      ctx.textAlign = "center";
      ctx.font = "bold 40px sans-serif";
      ctx.shadowColor = "rgba(0, 0, 0, 0.95)";
      ctx.shadowBlur = 16;
      ctx.fillText(`🌻 ${prefix} · ${target}`, cw / 2, 105);

      // D. 繪製祝福內文 (自動換行)
      ctx.font = "normal 42px serif";
      const maxLineWidth = cw - 120;
      const words = wish.split('');
      let line = '';
      let y = ch - 240;
      const lineHeight = 58;

      for (let n = 0; n < words.length; n++) {
        let testLine = line + words[n];
        let metrics = ctx.measureText(testLine);
        if (metrics.width > maxLineWidth && n > 0) {
          ctx.fillText(line, cw / 2, y);
          line = words[n];
          y += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, cw / 2, y);

      // 產出圖片 Data URL
      try {
        finalDataUrl = canvas.toDataURL('image/jpeg', 0.95);
        previewImage.src = finalDataUrl;
      } catch (e) {
        console.error("Canvas 導出錯誤:", e);
      }

      // 顯示預覽
      resultCard.classList.remove('hidden');
      previewImage.classList.add('blur-preview');
      lockOverlay.classList.remove('hidden');
      unlockedActions.classList.add('hidden');
      
      statusBadge.innerText = '鎖定中 (觀看廣告解鎖)';
      statusBadge.className = 'text-xs px-2.5 py-0.5 bg-amber-100 text-amber-800 rounded-full font-medium';

      generateBtn.innerHTML = '<i class="fa-solid fa-sun"></i> 重新生成另一張早安問候圖';
      generateBtn.disabled = false;

      resultCard.scrollIntoView({ behavior: 'smooth' });
    });

    // 廣告解鎖
    watchAdBtn.addEventListener('click', () => {
      watchAdBtn.innerText = '⏳ 廣告播放中 (請稍候 3 秒)...';
      watchAdBtn.disabled = true;

      setTimeout(() => {
        alert('🎉 感謝觀看贊助商廣告！已解鎖含完整文字的高清問候圖！');
        
        previewImage.classList.remove('blur-preview');
        lockOverlay.classList.add('hidden');
        unlockedActions.classList.remove('hidden');
        
        statusBadge.innerText = '已解鎖 HD';
        statusBadge.className = 'text-xs px-2.5 py-0.5 bg-emerald-100 text-emerald-800 rounded-full font-medium';

        watchAdBtn.innerText = '觀看短廣告 (15秒) 解鎖';
        watchAdBtn.disabled = false;
      }, 3000);
    });

    // 下載
    document.getElementById('downloadBtn').addEventListener('click', () => {
      if (!finalDataUrl) return;
      const a = document.createElement('a');
      a.href = finalDataUrl;
      a.download = `LINE早安圖_${Date.now()}.jpg`;
      document.body.appendChild(a);
      a.click();
      a.remove();
    });

    // 分享
    document.getElementById('shareBtn').addEventListener('click', async () => {
      if (!finalDataUrl) return;
      try {
        const res = await fetch(finalDataUrl);
        const blob = await res.blob();
        const file = new File([blob], 'Morning_Greeting.jpg', { type: 'image/jpeg' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            files: [file],
            title: '每日早安問候圖',
            text: '這是我為您製作的專屬問候祝福！',
          });
        } else {
          alert('您的瀏覽器不支援直接分享圖片，系統已自動為您開啟圖片，請長按圖片儲存並分享！');
          window.open(finalDataUrl, '_blank');
        }
      } catch (err) {
        alert('請長按圖片選擇「儲存圖片」，即可直接發送至 LINE 群組！');
      }
    });
  </script>
</body>
</html>
