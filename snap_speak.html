<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snap & Speak 隨手拍·生活實物外語學習館</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
        }
        .tab-active {
            border-bottom: 3px solid #3b82f6;
            color: #1d4ed8;
            font-weight: 700;
        }
        .record-pulse {
            animation: pulse-red 1.5s infinite;
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

    <!-- 導覽列 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 text-white p-2 rounded-xl">
                    <i data-lucide="camera" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight text-slate-900">Snap & Speak</h1>
                    <p class="text-xs text-slate-500">隨手拍 · 生活實物外語學習館</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-4">
                <!-- 語言切換 -->
                <div class="flex items-center bg-slate-100 rounded-lg p-1 border border-slate-200">
                    <i data-lucide="languages" class="w-4 h-4 ml-2 text-slate-500"></i>
                    <select id="targetLanguage" onchange="changeLanguage()" class="bg-transparent text-sm font-medium px-2 py-1 outline-none cursor-pointer">
                        <option value="en">英語 (English)</option>
                        <option value="ja" selected>日本語 (Japanese)</option>
                        <option value="fr">法語 (Français)</option>
                        <option value="es">西班牙語 (Español)</option>
                        <option value="de">德語 (Deutsch)</option>
                    </select>
                </div>

                <!-- 語音設定按鈕 -->
                <button onclick="toggleVoiceSettingsModal()" class="p-2 text-slate-600 hover:text-blue-600 hover:bg-slate-100 rounded-lg border border-slate-200 transition" title="調音與語音設定">
                    <i data-lucide="sliders" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- 主內容區 -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- 左側：影像辨識與 Hotspots 拍照區 (5 cols) -->
        <section class="lg:col-span-5 flex flex-col space-y-4">
            <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="font-bold text-slate-800 flex items-center gap-2">
                        <i data-lucide="image" class="w-5 h-5 text-blue-600"></i> 1. 拍照/選擇實物
                    </h2>
                    <span class="text-xs bg-blue-50 text-blue-600 px-2.5 py-1 rounded-full font-medium">點擊熱點學習細節</span>
                </div>

                <!-- 影像觀測台 -->
                <div class="relative w-full aspect-square bg-slate-900 rounded-xl overflow-hidden group shadow-inner flex items-center justify-center">
                    <img id="objectImage" src="https://images.unsplash.com/photo-1583485088034-697b5bc54ccd?auto=format&fit=crop&w=800&q=80" alt="實物照片" class="w-full h-full object-cover">
                    
                    <!-- 點擊標記熱點 (Hotspots) -->
                    <div id="hotspotContainer" class="absolute inset-0"></div>

                    <!-- 載入中遮罩 -->
                    <div id="loadingOverlay" class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm flex flex-col items-center justify-center text-white hidden">
                        <i data-lucide="loader-2" class="w-8 h-8 animate-spin mb-2"></i>
                        <span class="text-sm font-medium">AI 正在辨識實物與特徵標籤...</span>
                    </div>
                </div>

                <!-- 拍照與預設操作控制卡 -->
                <div class="mt-4 grid grid-cols-2 gap-2">
                    <button onclick="triggerCamera()" class="flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white py-2.5 px-4 rounded-xl text-sm font-medium transition shadow-sm">
                        <i data-lucide="camera" class="w-4 h-4"></i> 開啟相機/上傳
                    </button>
                    <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                    
                    <select id="presetSelector" onchange="loadPreset(this.value)" class="bg-slate-50 border border-slate-200 text-slate-700 py-2.5 px-3 rounded-xl text-sm font-medium outline-none cursor-pointer">
                        <option value="fountainPen">預設範例：鋼筆 (Fountain Pen)</option>
                        <option value="coffeeMug">預設範例：馬克杯 (Coffee Mug)</option>
                        <option value="watch">預設範例：復古手錶 (Watch)</option>
                    </select>
                </div>
            </div>

            <!-- 實物細節單字快捷清單 -->
            <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm flex-1">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">辨識出的元件與部位單字</h3>
                <div id="hotspotList" class="flex flex-wrap gap-2"></div>
            </div>
        </section>

        <!-- 右側：三階段口說練習與語音區 (7 cols) -->
        <section class="lg:col-span-7 flex flex-col space-y-4">
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex-1 flex flex-col">
                
                <!-- 階段頁籤 Header -->
                <div class="border-b border-slate-200 bg-slate-50/50 px-4 pt-3 flex space-x-6 overflow-x-auto">
                    <button onclick="switchStage(1)" id="tabStage1" class="pb-3 text-sm font-medium transition flex items-center gap-2 tab-active whitespace-nowrap">
                        <span class="w-5 h-5 rounded-full bg-blue-100 text-blue-600 text-xs flex items-center justify-center font-bold">1</span>
                        階段 1：外觀描述
                    </button>
                    <button onclick="switchStage(2)" id="tabStage2" class="pb-3 text-sm font-medium text-slate-500 hover:text-slate-800 transition flex items-center gap-2 whitespace-nowrap">
                        <span class="w-5 h-5 rounded-full bg-slate-200 text-slate-600 text-xs flex items-center justify-center font-bold">2</span>
                        階段 2：功能與動作
                    </button>
                    <button onclick="switchStage(3)" id="tabStage3" class="pb-3 text-sm font-medium text-slate-500 hover:text-slate-800 transition flex items-center gap-2 whitespace-nowrap">
                        <span class="w-5 h-5 rounded-full bg-slate-200 text-slate-600 text-xs flex items-center justify-center font-bold">3</span>
                        階段 3：故事與感受
                    </button>
                </div>

                <!-- 階段卡片內容區 -->
                <div class="p-6 flex-1 overflow-y-auto">
                    <div id="stageContent"></div>
                </div>

                <!-- 底部口說錄音與發音練習列 -->
                <div class="border-t border-slate-200 bg-slate-50 p-4 flex items-center justify-between gap-4">
                    <div class="flex items-center gap-3">
                        <button id="recordBtn" onclick="toggleRecording()" class="w-12 h-12 rounded-full bg-red-500 hover:bg-red-600 text-white flex items-center justify-center transition shadow-md">
                            <i data-lucide="mic" class="w-6 h-6"></i>
                        </button>
                        <div>
                            <div class="text-xs font-semibold text-slate-500 uppercase">3 分鐘口說挑戰錄音</div>
                            <div id="recordTimer" class="text-sm font-mono font-bold text-slate-800">00:00 / 03:00</div>
                        </div>
                    </div>

                    <div class="flex items-center gap-2">
                        <button id="playAudioBtn" onclick="playUserAudio()" disabled class="p-2.5 rounded-xl border border-slate-300 text-slate-400 bg-white cursor-not-allowed transition flex items-center gap-1.5 text-xs font-medium">
                            <i data-lucide="play" class="w-4 h-4"></i> 回放自己的錄音
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 語音設定 Modal -->
    <div id="voiceModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-200">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-slate-900 text-lg flex items-center gap-2">
                    <i data-lucide="sliders" class="w-5 h-5 text-blue-600"></i> 語音清晰度與聲音設定
                </h3>
                <button onclick="toggleVoiceSettingsModal()" class="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <p class="text-xs text-slate-500 mb-4 leading-relaxed">
                若覺得預設語音偏渾厚，可將音高調高以獲得乾淨清亮的聲音；系統已啟動雙語獨立朗讀機制，確保日文與中文不會混在一起。
            </p>

            <div class="space-y-4">
                <!-- 音高 -->
                <div>
                    <div class="flex justify-between text-xs font-medium text-slate-700 mb-1">
                        <span>音高 (Pitch / 尖銳度): <strong id="pitchValue" class="text-blue-600">1.25</strong></span>
                        <span class="text-slate-400">清亮 1.25 ~ 1.4</span>
                    </div>
                    <input type="range" id="pitchInput" min="0.8" max="1.8" step="0.05" value="1.25" oninput="updateVoiceSettingsParams()" class="w-full accent-blue-600">
                </div>

                <!-- 語速 -->
                <div>
                    <div class="flex justify-between text-xs font-medium text-slate-700 mb-1">
                        <span>語速 (Speed): <strong id="rateValue" class="text-blue-600">0.95</strong>x</span>
                    </div>
                    <input type="range" id="rateInput" min="0.6" max="1.4" step="0.05" value="0.95" oninput="updateVoiceSettingsParams()" class="w-full accent-blue-600">
                </div>

                <!-- 外語發音人選擇器 -->
                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">外語發音人選單 (系統支援)</label>
                    <select id="targetVoiceSelect" class="w-full bg-slate-50 border border-slate-200 text-xs py-2 px-3 rounded-lg outline-none cursor-pointer"></select>
                </div>

                <!-- 中文翻譯發音人選擇器 -->
                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">中文翻譯發音人選單</label>
                    <select id="zhVoiceSelect" class="w-full bg-slate-50 border border-slate-200 text-xs py-2 px-3 rounded-lg outline-none cursor-pointer"></select>
                </div>
            </div>

            <div class="mt-6 flex justify-between gap-3">
                <button onclick="testCurrentVoice()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2 rounded-xl text-xs font-semibold flex items-center justify-center gap-1">
                    <i data-lucide="volume-2" class="w-4 h-4"></i> 測試當前語音
                </button>
                <button onclick="toggleVoiceSettingsModal()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-xl text-xs font-semibold">
                    儲存並關閉
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript 邏輯庫 -->
    <script>
        // Data Store
        const presets = {
            fountainPen: {
                title: "鋼筆 / Fountain Pen",
                image: "https://images.unsplash.com/photo-1583485088034-697b5bc54ccd?auto=format&fit=crop&w=800&q=80",
                hotspots: [
                    { x: 45, y: 35, label: { en: "Nib", ja: "ペン先 (ペンさき)", fr: "Plume", es: "Plumín", de: "Feder" } },
                    { x: 55, y: 60, label: { en: "Pen Body", ja: "軸 / 軸身 (じく)", fr: "Corps", es: "Cuerpo", de: "Schaft" } },
                    { x: 50, y: 15, label: { en: "Cap", ja: "キャップ", fr: "Capuchon", es: "Capuchón", de: "Kappe" } }
                ],
                stages: {
                    1: {
                        title: "階段 1：外觀與材質描述 (First Minute)",
                        vocab: [
                            { word: "Metallic", ja: "金属製の (きんぞくせい)", zh: "金屬質感的" },
                            { word: "Polished", ja: "研磨された (けんまされた)", zh: "拋光磨平的" },
                            { word: "Solid", ja: "重厚感のある (じゅうこうかん)", zh: "紮實沉穩的" }
                        ],
                        sentence: {
                            en: "This is a classical fountain pen with a polished black body.",
                            ja: "これは洗練された黒い軸身を持つクラシックな万年筆です。(這是一支具有光滑黑色筆身的經典鋼筆。)",
                            fr: "C'est un stylo-plume classique avec un corps noir poli.",
                            es: "Es una pluma estilográfica clásica con un cuerpo negro pulido.",
                            de: "Dies ist ein klassischer Füllhalter mit einem polierten schwarzen Schaft."
                        }
                    },
                    2: {
                        title: "階段 2：功能用途與動作短語 (Second Minute)",
                        vocab: [
                            { word: "Glide across", ja: "すらすら滑る (すべる)", zh: "在紙上滑順書寫" },
                            { word: "Refill ink", ja: "インクを補充する (ほじゅう)", zh: "補充/墨水注入" },
                            { word: "Sign documents", ja: "書類に署名する (しょめい)", zh: "簽署重要文件" }
                        ],
                        sentence: {
                            en: "It glides smoothly across paper without requiring heavy pressure.",
                            ja: "紙の上をすらすらと滑り、力を入れずに書くことができます。(它能在紙上順暢滑動，完全不需施加重力。)",
                            fr: "Il glisse doucement sur le papier sans avoir à appuyer fort.",
                            es: "Se desliza suavemente sobre el papel sin necesidad de presionar mucho.",
                            de: "Er gleitet sanft über das Papier, ohne dass man stark aufdrücken muss."
                        }
                    },
                    3: {
                        title: "階段 3：故事體驗與個人連結 (Third Minute)",
                        sentence: {
                            en: "Using this pen forces me to slow down and enjoy the rhythm of handwriting.",
                            ja: "この万年筆を使うと、心が落ち着き手書きの文字の感覚を楽しめます。(使用這支鋼筆讓我能慢下腳步，享受手寫文字的節奏。)",
                            fr: "Utiliser ce stylo me force à ralentir et à apprécier le rythme de l'écriture.",
                            es: "Usar esta pluma me obliga a frenar y disfrutar el ritmo de escribir a mano.",
                            de: "Die Benutzung dieses Füllers zwingt mich, innezuhalten und das Schreiben zu genießen."
                        }
                    }
                }
            },
            coffeeMug: {
                title: "馬克杯 / Coffee Mug",
                image: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=800&q=80",
                hotspots: [
                    { x: 70, y: 50, label: { en: "Handle", ja: "取っ手 (とって)", fr: "Anse", es: "Asa", de: "Henkel" } },
                    { x: 45, y: 25, label: { en: "Rim", ja: "飲み口 (のみくち)", fr: "Rebord", es: "Borde", de: "Rand" } }
                ],
                stages: {
                    1: {
                        title: "階段 1：外觀與材質描述 (First Minute)",
                        vocab: [
                            { word: "Ceramic", ja: "陶器の (とうき)", zh: "陶瓷的" },
                            { word: "Cozy", ja: "心地よい (ここちよい)", zh: "溫暖舒適的" }
                        ],
                        sentence: {
                            en: "This is a heavy ceramic mug that keeps my tea warm.",
                            ja: "これはお茶を温かく保ってくれる、厚手のセラミックマグカップです。(這是一個能幫我的茶保持溫熱的厚實陶瓷馬克杯。)",
                            fr: "C'est une tasse en céramique lourde qui garde mon thé au chaud.",
                            es: "Es una taza de cerámica pesada que mantiene mi té caliente.",
                            de: "Dies ist ein schwerer Keramikbecher, der meinen Tee warm hält."
                        }
                    },
                    2: {
                        title: "階段 2：功能用途與動作短語 (Second Minute)",
                        vocab: [
                            { word: "Sip slowly", ja: "ゆっくり味わう", zh: "細細啜飲" },
                            { word: "Hold with both hands", ja: "両手で包み込む (りょうて)", zh: "用雙手捧著" }
                        ],
                        sentence: {
                            en: "I like to hold it with both hands on cold winter mornings.",
                            ja: "寒い冬の朝、これを両手で包み込むように持つのが好きです。(在寒冷的冬天早晨，我喜歡用雙手捧著它。)",
                            fr: "J'aime la tenir à deux mains les matins d'hiver froids.",
                            es: "Me gusta sostenerla con ambas manos en las mañanas frías de invierno.",
                            de: "Ich halte ihn an kalten Wintermorgen gerne mit beiden Händen."
                        }
                    },
                    3: {
                        title: "階段 3：故事體驗與個人連結 (Third Minute)",
                        sentence: {
                            en: "It marks the start of my quiet morning routine before work.",
                            ja: "これは仕事前の、穏やかな朝の習慣の始まりを意味しています。(它代表著我在工作前那段寧靜早晨時光的開始。)",
                            fr: "Elle marque le début de ma routine matinale avant le travail.",
                            es: "Marca el comienzo de mi tranquila rutina matutina antes de trabajar.",
                            de: "Er markiert den Beginn meiner ruhigen Morgenroutine vor der Arbeit."
                        }
                    }
                }
            }
        };

        let currentLang = 'ja';
        let currentPreset = 'fountainPen';
        let currentStage = 1;
        let pitch = 1.25;
        let rate = 0.95;
        let availableVoices = [];

        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            initSpeechSynthesis();
            renderApp();
        });

        function initSpeechSynthesis() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.onvoiceschanged = () => {
                    availableVoices = window.speechSynthesis.getVoices();
                    populateVoiceDropdowns();
                };
                availableVoices = window.speechSynthesis.getVoices();
                populateVoiceDropdowns();
            }
        }

        function populateVoiceDropdowns() {
            const targetSelect = document.getElementById('targetVoiceSelect');
            const zhSelect = document.getElementById('zhVoiceSelect');
            if (!targetSelect || !zhSelect) return;

            targetSelect.innerHTML = '';
            zhSelect.innerHTML = '';

            const langPrefixMap = { en: 'en', ja: 'ja', fr: 'fr', es: 'es', de: 'de' };
            const prefix = langPrefixMap[currentLang] || 'en';

            availableVoices.forEach((v, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                opt.textContent = `${v.name} (${v.lang})`;

                if (v.lang.toLowerCase().startsWith(prefix)) {
                    targetSelect.appendChild(opt);
                }
                if (v.lang.toLowerCase().startsWith('zh')) {
                    const zhOpt = document.createElement('option');
                    zhOpt.value = index;
                    zhOpt.textContent = `${v.name} (${v.lang})`;
                    zhSelect.appendChild(zhOpt);
                }
            });

            // 優先設定發音清晰、高品質語音 (Google/Microsoft/Apple)
            selectBestVoice(targetSelect, prefix);
            selectBestVoice(zhSelect, 'zh');
        }

        function selectBestVoice(selectElement, langPrefix) {
            const options = Array.from(selectElement.options);
            const preferredKeywords = ['Google', 'Natural', 'Online', 'Premium', 'Enhanced', 'Kyoko', 'Otoya', 'Luciana'];
            
            for (let kw of preferredKeywords) {
                const match = options.find(o => o.textContent.includes(kw));
                if (match) {
                    selectElement.value = match.value;
                    return;
                }
            }
        }

        function renderApp() {
            const data = presets[currentPreset];
            document.getElementById('objectImage').src = data.image;

            // Render Hotspots
            const container = document.getElementById('hotspotContainer');
            const list = document.getElementById('hotspotList');
            container.innerHTML = '';
            list.innerHTML = '';

            data.hotspots.forEach(hp => {
                const dot = document.createElement('button');
                dot.className = "absolute w-7 h-7 bg-blue-600/90 border-2 border-white rounded-full text-white text-xs font-bold flex items-center justify-center transform -translate-x-1/2 -translate-y-1/2 hover:scale-125 transition shadow-lg cursor-pointer";
                dot.style.left = `${hp.x}%`;
                dot.style.top = `${hp.y}%`;
                dot.innerHTML = `<i data-lucide="sparkles" class="w-3.5 h-3.5"></i>`;
                dot.onclick = () => speakText(hp.label[currentLang] || hp.label.en);
                container.appendChild(dot);

                const tag = document.createElement('span');
                tag.className = "bg-slate-100 hover:bg-blue-50 border border-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 cursor-pointer transition";
                tag.innerHTML = `<i data-lucide="volume-2" class="w-3.5 h-3.5 text-blue-600"></i> ${hp.label[currentLang] || hp.label.en}`;
                tag.onclick = () => speakText(hp.label[currentLang] || hp.label.en);
                list.appendChild(tag);
            });

            renderStageContent();
            lucide.createIcons();
        }

        function renderStageContent() {
            const stageData = presets[currentPreset].stages[currentStage];
            const container = document.getElementById('stageContent');
            
            let html = `<h3 class="font-bold text-slate-900 text-base mb-4 flex items-center justify-between">
                <span>${stageData.title}</span>
            </h3>`;

            if (stageData.vocab) {
                html += `<div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-6">`;
                stageData.vocab.forEach(v => {
                    const textToRead = currentLang === 'ja' ? `${v.word} ${v.ja}` : `${v.word} (${v.zh})`;
                    html += `
                    <div onclick="speakText('${textToRead.replace(/'/g, "\\'")}')" class="bg-slate-50 hover:bg-blue-50 border border-slate-200 p-3 rounded-xl cursor-pointer transition group">
                        <div class="flex justify-between items-start">
                            <span class="font-bold text-blue-600 text-sm">${v.word}</span>
                            <i data-lucide="volume-2" class="w-4 h-4 text-slate-400 group-hover:text-blue-600"></i>
                        </div>
                        <div class="text-xs text-slate-600 mt-1">${v.ja || v.zh}</div>
                    </div>`;
                });
                html += `</div>`;
            }

            const rawSentence = stageData.sentence[currentLang] || stageData.sentence.en;
            html += `
            <div class="bg-blue-50/60 border border-blue-200 rounded-2xl p-5 relative">
                <div class="flex justify-between items-start mb-2">
                    <span class="text-xs font-bold text-blue-600 uppercase tracking-wider">學習例句與練習聽力</span>
                    <button onclick="speakText('${rawSentence.replace(/'/g, "\\'")}')" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 transition shadow-sm">
                        <i data-lucide="volume-2" class="w-4 h-4"></i> 清晰朗讀
                    </button>
                </div>
                <p class="text-slate-800 text-base font-medium leading-relaxed">${rawSentence}</p>
            </div>`;

            container.innerHTML = html;
            lucide.createIcons();
        }

        // 雙語獨立朗讀邏輯，防止語言混雜
        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();

            // 解析文字中的括號 (區分外語與中文翻譯)
            const match = text.match(/^(.*?)\((.*?)\)$/);

            if (match) {
                const targetPart = match[1].trim();
                const zhPart = match[2].trim();

                // 1. 朗讀外語
                const targetUtterance = new SpeechSynthesisUtterance(targetPart);
                configureUtterance(targetUtterance, 'target');

                // 2. 朗讀中文
                const zhUtterance = new SpeechSynthesisUtterance(zhPart);
                configureUtterance(zhUtterance, 'zh');

                window.speechSynthesis.speak(targetUtterance);
                window.speechSynthesis.speak(zhUtterance);
            } else {
                const utterance = new SpeechSynthesisUtterance(text);
                configureUtterance(utterance, 'target');
                window.speechSynthesis.speak(utterance);
            }
        }

        function configureUtterance(utterance, type) {
            utterance.pitch = parseFloat(document.getElementById('pitchInput').value);
            utterance.rate = parseFloat(document.getElementById('rateInput').value);

            if (type === 'target') {
                const select = document.getElementById('targetVoiceSelect');
                if (select && select.value !== '') {
                    utterance.voice = availableVoices[parseInt(select.value)];
                }
            } else {
                const zhSelect = document.getElementById('zhVoiceSelect');
                if (zhSelect && zhSelect.value !== '') {
                    utterance.voice = availableVoices[parseInt(zhSelect.value)];
                }
            }
        }

        function updateVoiceSettingsParams() {
            document.getElementById('pitchValue').textContent = document.getElementById('pitchInput').value;
            document.getElementById('rateValue').textContent = document.getElementById('rateInput').value;
        }

        function testCurrentVoice() {
            const sampleText = currentLang === 'ja' 
                ? "これは万年筆です。(這是一支鋼筆。)" 
                : "This is a fountain pen. (這是一支鋼筆。)";
            speakText(sampleText);
        }

        function switchStage(stageNum) {
            currentStage = stageNum;
            for (let i = 1; i <= 3; i++) {
                const btn = document.getElementById(`tabStage${i}`);
                if (i === stageNum) {
                    btn.className = "pb-3 text-sm font-medium transition flex items-center gap-2 tab-active whitespace-nowrap";
                } else {
                    btn.className = "pb-3 text-sm font-medium text-slate-500 hover:text-slate-800 transition flex items-center gap-2 whitespace-nowrap";
                }
            }
            renderStageContent();
        }

        function changeLanguage() {
            currentLang = document.getElementById('targetLanguage').value;
            populateVoiceDropdowns();
            renderApp();
        }

        function loadPreset(key) {
            currentPreset = key;
            renderApp();
        }

        function toggleVoiceSettingsModal() {
            document.getElementById('voiceModal').classList.toggle('hidden');
        }

        // 拍照/模擬上傳
        function triggerCamera() {
            document.getElementById('fileInput').click();
        }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            document.getElementById('loadingOverlay').classList.remove('hidden');
            const reader = new FileReader();
            reader.onload = (evt) => {
                setTimeout(() => {
                    document.getElementById('objectImage').src = evt.target.result;
                    document.getElementById('loadingOverlay').classList.add('hidden');
                }, 1200);
            };
            reader.readAsDataURL(file);
        }

        // 錄音功能實作
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let timerInterval;
        let secondsElapsed = 0;
        let audioUrl = null;

        async function toggleRecording() {
            const btn = document.getElementById('recordBtn');
            const timer = document.getElementById('recordTimer');

            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                        audioUrl = URL.createObjectURL(audioBlob);
                        const playBtn = document.getElementById('playAudioBtn');
                        playBtn.disabled = false;
                        playBtn.classList.remove('text-slate-400', 'bg-white', 'cursor-not-allowed');
                        playBtn.classList.add('text-blue-600', 'bg-blue-50', 'border-blue-200');
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    btn.classList.add('record-pulse');
                    secondsElapsed = 0;

                    timerInterval = setInterval(() => {
                        secondsElapsed++;
                        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                        const secs = String(secondsElapsed % 60).padStart(2, '0');
                        timer.textContent = `${mins}:${secs} / 03:00`;

                        if (secondsElapsed >= 180) toggleRecording();
                    }, 1000);
                } catch (err) {
                    alert('無法讀取麥克風設備，請確認權限設定。');
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.classList.remove('record-pulse');
                clearInterval(timerInterval);
            }
        }

        function playUserAudio() {
            if (audioUrl) {
                const audio = new Audio(audioUrl);
                audio.play();
            }
        }
    </script>
</body>
</html>
