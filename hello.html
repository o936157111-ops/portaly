<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日常問候圖庫</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700&family=Noto+Serif+TC:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f7f5f0;
            --card-bg: #ffffff;
            --text-main: #4a4541;
            --text-sub: #b5afa4;
            --border-color: #d6cfc2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.4;
            padding: 15px 12px;
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Pinterest 風格瀑布流排版 */
        .masonry-grid {
            column-count: 2;
            column-gap: 10px;
            width: 100%;
            margin-bottom: 20px;
        }

        @media (min-width: 500px) {
            .masonry-grid {
                column-count: 3;
            }
        }

        .masonry-item {
            break-inside: avoid;
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--border-color);
            position: relative;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .masonry-item:hover {
            transform: translateY(-2px);
        }

        .masonry-item img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* Lightbox 預覽視窗 */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .lightbox-content {
            position: relative;
            max-width: 100%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* 問候語選擇選單樣式 */
        .lightbox-text-selector {
            width: 100%;
            max-width: 450px;
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #d6cfc2;
            background-color: #fff;
            color: #4a4541;
            font-size: 0.85rem;
            font-family: 'Noto Sans TC', sans-serif;
            outline: none;
        }

        .lightbox-content img {
            max-width: 100%;
            max-height: 65vh;
            object-fit: contain;
            border-radius: 8px;
        }

        .lightbox-close {
            position: absolute;
            top: -40px;
            right: 0;
            background: none;
            border: none;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 5px 10px;
        }

        .lightbox-btns {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            width: 100%;
            max-width: 450px;
        }

        .lightbox-btns button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            color: #fff;
        }

        footer {
            margin-top: auto;
            padding: 10px 0;
        }

        /* 極度淡化的後台按鈕 */
        .admin-trigger {
            text-align: center;
            padding: 6px;
            font-size: 0.70rem;
            color: var(--text-sub);
            cursor: pointer;
            opacity: 0.4;
            transition: opacity 0.2s;
            user-select: none;
        }

        .admin-trigger:hover {
            opacity: 1;
        }

        .admin-panel {
            display: none;
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            position: relative;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .admin-form-group {
            margin-bottom: 8px;
        }

        .admin-form-group label {
            display: block;
            font-size: 0.75rem;
            color: #8c857b;
            margin-bottom: 2px;
        }

        .admin-form-group input {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .admin-btn {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            background-color: #2b6cb0;
            color: #fff;
            cursor: pointer;
        }

        .manage-list {
            margin-top: 10px;
            max-height: 120px;
            overflow-y: auto;
            border-top: 1px solid var(--border-color);
            padding-top: 6px;
        }
        .manage-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            padding: 3px 0;
            border-bottom: 1px dashed var(--border-color);
            color: #4a4541;
        }
        .manage-item button {
            background: #c53030;
            color: #fff;
            border: none;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div id="gridContainer" class="masonry-grid"></div>
    </div>

    <!-- 放大與互動預覽 Lightbox -->
    <div class="lightbox" id="lightbox">
        <div class="lightbox-content" id="lightboxContentBox">
            <button class="lightbox-close" id="closeLightboxBtn">✕ 關閉</button>
            <select id="lightboxTextSelector" class="lightbox-text-selector"></select>
            <img id="lightboxImg" src="" alt="預覽圖">
            <div class="lightbox-btns">
                <button style="background-color: #06C755;" id="lightboxShareBtn">📤 分享圖片</button>
                <button style="background-color: #4a4541;" id="lightboxDownloadBtn">📥 儲存圖片</button>
            </div>
        </div>
    </div>

    <footer>
        <div class="admin-trigger" id="adminTriggerBtn">⚙️ 後台圖庫管理</div>

        <div class="admin-panel" id="adminPanel">
            <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                <strong>新增圖片與問候語</strong>
                <button id="closeAdminBtn" style="border:none; background:none; cursor:pointer;">✕</button>
            </div>
            <div class="admin-form-group">
                <label>問候語 (選填，不填則隨機)</label>
                <input type="text" id="newText" placeholder="例如：早安！美好的一天開始囉。">
            </div>
            <div class="admin-form-group">
                <label>圖片網址 (必填)</label>
                <input type="text" id="newImgUrl" placeholder="https://live.staticflickr.com/...">
            </div>
            <button class="admin-btn" id="addCardBtn">確認新增並下載更新檔案</button>
            <div class="manage-list" id="manageList"><strong>自訂項目管理：</strong></div>
        </div>
    </footer>

    <script>
        const randomTexts = [
            "早安。把步調放慢一些，今天也要溫柔而堅定地過。",
            "早安。晨光正好，願你的每一個早晨，都有清風與好心情相伴。",
            "午安。忙碌之中，別忘了留一杯茶的時間給自己。",
            "午安。午後的陽光溫暖而慵懶，稍作休息再出發。",
            "晚安。把今天所有的紛擾都留在身後，做個好夢。",
            "晚安。星光點點，願疲憊的你有個溫馨的夢鄉。",
            "週末愉快。放慢腳步，去感受生活裡微小而確切的幸福。"
        ];

        let userCards = [
            { text: "早安。把步調放慢一些，今天也要溫柔而堅定地過。", imgUrl: "https://live.staticflickr.com/65535/55541265833_1a649c8ab4_z.jpg" },
            { text: "午安。忙碌之中，別忘了留一杯茶的時間給自己。", imgUrl: "https://live.staticflickr.com/65535/55541312744_615164f2fc_z.jpg" },
            { text: "晚安。把今天所有的紛擾都留在身後，做個好夢。", imgUrl: "https://live.staticflickr.com/65535/55541265828_1b03519f64_z.jpg" },
            { text: "晨光正好，願你的每一個早晨充滿喜樂。", imgUrl: "https://live.staticflickr.com/65535/55540085677_dd4f7c6eac_z.jpg" },
            { text: "週末愉快。放慢腳步，去感受生活裡微小而確切的幸福。", imgUrl: "https://live.staticflickr.com/65535/55499113703_906bdf089a_z.jpg" },
            { text: "願你今天有美好的一天。", imgUrl: "https://live.staticflickr.com/65535/55541312774_de1e601307_z.jpg" },
            { text: "平安喜樂，順心如意。", imgUrl: "https://live.staticflickr.com/65535/55541111196_fc2672f254_z.jpg" },
            { text: "溫馨問候，天天好心情。", imgUrl: "https://live.staticflickr.com/65535/55541268294_082453369a_z.jpg" }
        ];

        try {
            const saved = localStorage.getItem('myCustomCards');
            if (saved) {
                userCards = JSON.parse(saved);
            }
        } catch (e) {
            console.log(e);
        }

        function renderGrid() {
            const container = document.getElementById('gridContainer');
            if (!container) return;
            container.innerHTML = '';

            if (userCards.length === 0) {
                container.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:40px; color:#888; font-size:0.9rem;">目前尚無圖片<br>請點擊下方管理按鈕新增！</div>`;
                updateManageList();
                return;
            }

            let displayCards = [...userCards];
            displayCards.sort(() => Math.random() - 0.5);

            displayCards.forEach((item) => {
                const div = document.createElement('div');
                div.className = 'masonry-item';
                
                const img = document.createElement('img');
                img.src = item.imgUrl;
                img.alt = "問候圖";
                img.loading = "lazy";
                
                img.addEventListener('click', () => {
                    const randomDefault = item.text || randomTexts[Math.floor(Math.random() * randomTexts.length)];
                    openLightbox(item.imgUrl, randomDefault);
                });
                
                div.appendChild(img);
                container.appendChild(div);
            });

            updateManageList();
        }

        function openLightbox(imgUrl, defaultText) {
            const lightbox = document.getElementById('lightbox');
            const selector = document.getElementById('lightboxTextSelector');
            
            const allPossibleTexts = Array.from(new Set([...randomTexts, ...userCards.map(c => c.text)]));
            
            selector.innerHTML = '';
            allPossibleTexts.forEach(t => {
                const option = document.createElement('option');
                option.value = t;
                option.textContent = t;
                if (t === defaultText) {
                    option.selected = true;
                }
                selector.appendChild(option);
            });

            updatePreviewImage(imgUrl, selector.value);

            selector.onchange = function() {
                updatePreviewImage(imgUrl, selector.value);
            };
            
            lightbox.style.display = 'flex';
        }

        function updatePreviewImage(imgUrl, text) {
            const previewImg = document.getElementById('lightboxImg');
            previewImg.src = imgUrl;

            generateTextOnImage(imgUrl, text, function(blob) {
                if (blob) {
                    const objectUrl = URL.createObjectURL(blob);
                    previewImg.src = objectUrl;
                }
            });
            
            document.getElementById('lightboxShareBtn').onclick = () => shareCardDirect(imgUrl, document.getElementById('lightboxTextSelector').value, 'greeting.jpg');
            document.getElementById('lightboxDownloadBtn').onclick = () => downloadCardDirect(imgUrl, document.getElementById('lightboxTextSelector').value, 'greeting.jpg');
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }

        // 高解析度 Retina 畫布文字合成核心
        function generateTextOnImage(imgUrl, textContent, callback) {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            
            img.onload = function() {
                try {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    const originWidth = img.naturalWidth || 1000;
                    const originHeight = img.naturalHeight || 1000;

                    // 使用 2 倍高畫質倍率（Retina 渲染），大幅提升手機上的文字清晰度
                    const scaleFactor = 2;
                    canvas.width = originWidth * scaleFactor;
                    canvas.height = originHeight * scaleFactor;

                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                    gradient.addColorStop(0, 'rgba(0, 0, 0, 0.05)');
                    gradient.addColorStop(1, 'rgba(0, 0, 0, 0.5)');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    let baseFontSize = 42;
                    if (originWidth > originHeight) {
                        baseFontSize = 30;
                    }

                    // 結合高畫質倍率計算最終字體大小
                    const scale = originWidth / 800;
                    const fontSize = Math.round(baseFontSize * scale * scaleFactor);
                    ctx.font = `500 ${fontSize}px "Noto Serif TC", serif`;
                    ctx.fillStyle = '#ffffff';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    const maxLineWidth = canvas.width * 0.82;
                    let lines = [];
                    let currentLine = "";

                    for (let i = 0; i < textContent.length; i++) {
                        let char = textContent[i];
                        let testLine = currentLine + char;
                        if (ctx.measureText(testLine).width > maxLineWidth && currentLine !== "") {
                            lines.push(currentLine);
                            currentLine = char;
                        } else {
                            currentLine = testLine;
                        }
                    }
                    if (currentLine) lines.push(currentLine);

                    const lineHeight = fontSize * 1.5;
                    let startY = (canvas.height - (lines.length * lineHeight)) / 2 + (lineHeight / 2);

                    lines.forEach(line => {
                        ctx.shadowColor = 'rgba(0, 0, 0, 0.7)';
                        ctx.shadowBlur = 12 * scaleFactor;
                        ctx.fillText(line, canvas.width / 2, startY);
                        startY += lineHeight;
                    });

                    canvas.toBlob(blob => callback(blob), 'image/jpeg', 0.95);
                } catch (e) {
                    console.log("CORS 限制無法直接修改畫布", e);
                    callback(null);
                }
            };

            img.onerror = function() {
                callback(null);
            };

            img.src = imgUrl;
        }

        async function shareCardDirect(imgUrl, text, filename) {
            generateTextOnImage(imgUrl, text, async function(blob) {
                if (!blob) {
                    alert('此圖片網址受到伺服器跨域安全保護，無法直接透過程式合成文字與分享。');
                    return;
                }
                const file = new File([blob], filename, { type: 'image/jpeg' });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({ files: [file], title: '日常問候圖', text: text });
                    } catch (e) { console.log('分享取消'); }
                } else {
                    alert('您的瀏覽器不支援直接分享圖片檔案，請使用「儲存圖片」按鈕。');
                }
            });
        }

        function downloadCardDirect(imgUrl, text, filename) {
            generateTextOnImage(imgUrl, text, function(blob) {
                if (!blob) {
                    alert('此圖片網址受到伺服器跨域安全保護，無法直接合成文字下載。');
                    return;
                }
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                URL.revokeObjectURL(url);
            });
        }

        function toggleAdmin() {
            const panel = document.getElementById('adminPanel');
            if (!panel) return;
            if (panel.style.display === 'block') {
                panel.style.display = 'none';
            } else {
                const today = new Date();
                const pwd = prompt("請輸入後台管理密碼：");
                const dynamicPwd = `${today.getFullYear()}${String(today.getMonth() + 1).padStart(2, '0')}${String(today.getDate()).padStart(2, '0')}`;
                
                if (pwd === dynamicPwd) {
                    panel.style.display = 'block';
                } else if (pwd !== null) {
                    alert("密碼錯誤！");
                }
            }
        }

        function addCard() {
            const textInput = document.getElementById('newText');
            const imgUrlInput = document.getElementById('newImgUrl');
            
            if (!textInput || !imgUrlInput) return;

            let text = textInput.value.trim();
            const imgUrl = imgUrlInput.value.trim();

            if (!imgUrl) {
                alert('請填寫圖片網址！');
                return;
            }

            if (!text) {
                text = randomTexts[Math.floor(Math.random() * randomTexts.length)];
            }

            userCards.push({ text: text, imgUrl: imgUrl });
            localStorage.setItem('myCustomCards', JSON.stringify(userCards));

            textInput.value = '';
            imgUrlInput.value = '';
            document.getElementById('adminPanel').style.display = 'none';

            renderGrid();
            exportUpdatedHTML();
        }

        function deleteCard(index) {
            userCards.splice(index, 1);
            localStorage.setItem('myCustomCards', JSON.stringify(userCards));
            renderGrid();
            exportUpdatedHTML();
        }

        function updateManageList() {
            const listEl = document.getElementById('manageList');
            if (!listEl) return;
            listEl.innerHTML = '<strong>自訂項目管理：</strong>';
            if (userCards.length === 0) {
                listEl.innerHTML += '<span style="font-size:0.75rem; color:#888;"> 目前無圖片</span>';
                return;
            }
            userCards.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'manage-item';
                div.innerHTML = `<span>${item.text.substring(0, 10)}...</span><button type="button" onclick="deleteCard(${index})">刪除</button>`;
                listEl.appendChild(div);
            });
        }

        function exportUpdatedHTML() {
            const cardsJSON = JSON.stringify(userCards, null, 4);
            let htmlContent = document.documentElement.outerHTML;
            
            const targetRegex = /let userCards = \[\s*([\s\S]*?)\s*\];/;
            const newCardsString = `let userCards = ${cardsJSON};`;
            
            if (targetRegex.test(htmlContent)) {
                htmlContent = htmlContent.replace(targetRegex, newCardsString);
            }

            htmlContent = htmlContent.replace(/id="adminPanel"[^>]*style="display:\s*block;"/, 'id="adminPanel" style="display: none;"');

            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'index.html';
            a.click();
            URL.revokeObjectURL(url);
        }

        window.onload = function() {
            renderGrid();

            document.getElementById('adminTriggerBtn').addEventListener('click', toggleAdmin);
            document.getElementById('closeAdminBtn').addEventListener('click', toggleAdmin);
            document.getElementById('addCardBtn').addEventListener('click', addCard);

            const lightbox = document.getElementById('lightbox');
            lightbox.addEventListener('click', closeLightbox);
            document.getElementById('lightboxContentBox').addEventListener('click', function(e) {
                e.stopPropagation();
            });
            document.getElementById('closeLightboxBtn').addEventListener('click', closeLightbox);
        };
    </script>
</body>
</html>
