<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日常問候圖庫</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700&family=Noto+Serif+TC:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f7f5f0;
            --card-bg: #ffffff;
            --text-main: #4a4541;
            --text-sub: #8c857b;
            --border-color: #d6cfc2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.4;
            padding: 10px 12px;
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            padding: 10px 0;
        }

        h1 {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.3rem;
            font-weight: 500;
            letter-spacing: 2px;
            color: var(--text-main);
        }

        p.subtitle {
            font-size: 0.75rem;
            color: var(--text-sub);
            letter-spacing: 1px;
            margin-top: 2px;
        }

        /* Excel Sheet 風格頁籤 */
        .categories-container {
            margin: 10px 0 15px 0;
            width: 100%;
        }

        .categories {
            display: flex;
            width: 100%;
            background-color: #e2ded4;
            padding: 2px 2px 0 2px;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            border: 1px solid var(--border-color);
            border-bottom: none;
        }

        .category-btn {
            flex: 1;
            background-color: #ece8df;
            border: 1px solid transparent;
            border-bottom: 1px solid var(--border-color);
            padding: 7px 0;
            font-size: 0.75rem;
            color: var(--text-sub);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border-top-left-radius: 4px;
            border-top-right-radius: 4px;
            margin-right: 2px;
        }

        .category-btn:last-child {
            margin-right: 0;
        }

        .category-btn.active {
            background-color: var(--card-bg);
            color: var(--text-main);
            font-weight: 700;
            border-color: var(--border-color);
            border-bottom: 1px solid var(--card-bg);
            position: relative;
            z-index: 2;
        }

        /* Pinterest 風格瀑布流排版 */
        .masonry-grid {
            column-count: 2;
            column-gap: 10px;
            width: 100%;
            margin-bottom: 20px;
        }

        @media (min-width: 500px) {
            .masonry-grid {
                column-count: 3;
            }
        }

        .masonry-item {
            break-inside: avoid;
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--border-color);
            position: relative;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .masonry-item:hover {
            transform: translateY(-2px);
        }

        .masonry-item img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* Lightbox 預覽視窗 */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .lightbox-content {
            position: relative;
            max-width: 100%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .lightbox-content img {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
            border-radius: 8px;
        }

        .lightbox-close {
            position: absolute;
            top: -40px;
            right: 0;
            background: none;
            border: none;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 5px 10px;
        }

        .lightbox-btns {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            width: 100%;
        }

        .lightbox-btns button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            color: #fff;
        }

        footer {
            margin-top: auto;
            padding: 10px 0;
        }

        .admin-trigger {
            text-align: center;
            padding: 6px;
            font-size: 0.80rem;
            color: var(--text-sub);
            cursor: pointer;
        }

        .admin-panel {
            display: none;
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            position: relative;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .admin-form-group {
            margin-bottom: 8px;
        }

        .admin-form-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-bottom: 2px;
        }

        .admin-form-group input, .admin-form-group select {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .admin-btn {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            background-color: #2b6cb0;
            color: #fff;
            cursor: pointer;
        }

        .manage-list {
            margin-top: 10px;
            max-height: 100px;
            overflow-y: auto;
            border-top: 1px solid var(--border-color);
            padding-top: 6px;
        }
        .manage-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            padding: 3px 0;
            border-bottom: 1px dashed var(--border-color);
        }
        .manage-item button {
            background: #c53030;
            color: #fff;
            border: none;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>日常問候圖庫</h1>
        <p class="subtitle">願你今日所求皆如願，所行皆坦途</p>
    </header>

    <div class="categories-container">
        <div class="categories">
            <button class="category-btn active" onclick="filterCategory('all', event)">全部</button>
            <button class="category-btn" onclick="filterCategory('morning', event)">早安</button>
            <button class="category-btn" onclick="filterCategory('afternoon', event)">午安</button>
            <button class="category-btn" onclick="filterCategory('night', event)">晚安</button>
            <button class="category-btn" onclick="filterCategory('holiday', event)">節慶假日</button>
        </div>
    </div>

    <div class="main-container">
        <div id="gridContainer" class="masonry-grid"></div>
    </div>

    <!-- 放大與互動預覽 Lightbox -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <div class="lightbox-content" onclick="event.stopPropagation()">
            <button class="lightbox-close" onclick="closeLightbox()">✕ 關閉</button>
            <img id="lightboxImg" src="" alt="預覽圖">
            <div class="lightbox-btns">
                <button style="background-color: #06C755;" id="lightboxShareBtn">📤 分享圖片</button>
                <button style="background-color: #4a4541;" id="lightboxDownloadBtn">📥 儲存圖片</button>
            </div>
        </div>
    </div>

    <footer>
        <div class="admin-trigger" onclick="toggleAdmin()">⚙️ 後台圖庫管理</div>

        <div class="admin-panel" id="adminPanel">
            <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                <strong>新增圖片至分類</strong>
                <button onclick="toggleAdmin()" style="border:none; background:none; cursor:pointer;">✕</button>
            </div>
            <div class="admin-form-group">
                <label>選擇分類</label>
                <select id="newCategory">
                    <option value="morning">早安</option>
                    <option value="afternoon">午安</option>
                    <option value="night">晚安</option>
                    <option value="holiday">節慶假日</option>
                </select>
            </div>
            <div class="admin-form-group">
                <label>自訂問候語 (選填，不填則隨機)</label>
                <input type="text" id="newText" placeholder="例如：早安！美好的一天開始囉。">
            </div>
            <div class="admin-form-group">
                <label>圖片網址 (必填)</label>
                <input type="text" id="newImgUrl" placeholder="https://images.unsplash.com/...">
            </div>
            <button class="admin-btn" onclick="addCard()">確認新增並儲存</button>
            <div class="manage-list" id="manageList"><strong>自訂項目管理：</strong></div>
        </div>
    </footer>

    <script>
        const imagePool = {
            morning: [
                "photo-1507525428034-b723cf961d3e", "photo-1470240731273-7821a6eeb6bd", "photo-1506744038136-46273834b3fb",
                "photo-1472214103451-9374bd1c798e", "photo-1501785888041-af3ef285b470", "photo-1464822759023-fed622ff2c3b"
            ],
            afternoon: [
                "photo-1501339847302-ac426a4a7cbb", "photo-1509316975850-ff9c5deb0cd9", "photo-1433086966358-54859d0ed716",
                "photo-1470071459604-3b5ec3a7fe05", "photo-1546069901-ba9599a7e63c", "photo-1526772662000-3f88f10405ff"
            ],
            night: [
                "photo-1509198397868-475647b2a1e5", "photo-1519681393784-d120267933ba", "photo-1511447333015-45b65e60f6d5",
                "photo-1518709268805-4e9042af9f23", "photo-1505506874110-6a7a69069a08", "photo-1517411032315-54ef2cb783bb"
            ],
            holiday: [
                "photo-1513151233558-d860c5398176", "photo-1492684223066-81342ee5ff30", "photo-1533174072545-7a4b6ad7a6c3",
                "photo-1506157786151-b8491531f063", "photo-1511578314322-379afb476865", "photo-1514525253161-7a46d19cd819"
            ]
        };

        const defaultTexts = {
            morning: [
                "早安。把步調放慢一些，今天也要溫柔而堅定地過。",
                "早安。晨光正好，願你的每一個早晨，都有清風與好心情相伴。",
                "早安。迎著微風，開啟充滿希望的一天。"
            ],
            afternoon: [
                "午安。忙碌之中，別忘了留一杯茶的時間給自己。",
                "午安。午後的陽光溫暖而慵懶，稍作休息再出發。",
                "午安。喝杯咖啡，讓心靈沉澱片刻。"
            ],
            night: [
                "晚安。把今天所有的紛擾都留在身後，做個好夢。",
                "晚安。星光點點，願疲憊的你有個溫馨的夢鄉。",
                "晚安。卸下一天的疲憊，好好愛自己。"
            ],
            holiday: [
                "週末愉快。放慢腳步，去感受生活裡微小而確切的幸福。",
                "假期愉快。拋開工作，享受屬於自己的悠閒時光。"
            ]
        };

        // 從瀏覽器 localStorage 載入自訂項目（若沒有則為空陣列）
        let userCards = JSON.parse(localStorage.getItem('myGreetingCards') || '[]');

        let currentFilter = 'all';

        function getCategoryPool(cat) {
            let list = [];
            let pool = imagePool[cat] || [];
            let texts = defaultTexts[cat] || ["願你今天一切安好"];
            for (let i = 0; i < pool.length; i++) {
                list.push({
                    category: cat,
                    text: texts[i % texts.length],
                    imgUrl: `https://images.unsplash.com/${pool[i]}?auto=format&fit=crop&w=600&q=80`
                });
            }
            return list;
        }

        function renderGrid() {
            const container = document.getElementById('gridContainer');
            container.innerHTML = '';

            let allItems = [];
            const cats = ['morning', 'afternoon', 'night', 'holiday'];
            
            cats.forEach(cat => {
                if (currentFilter === 'all' || currentFilter === cat) {
                    allItems = allItems.concat(getCategoryPool(cat));
                }
            });

            userCards.forEach(item => {
                if (currentFilter === 'all' || currentFilter === item.category) {
                    allItems.push(item);
                }
            });

            if (allItems.length === 0) {
                container.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:30px; color:#888;">此分類目前尚無圖片，請至下方後台新增！</div>`;
                return;
            }

            allItems.sort(() => Math.random() - 0.5);

            allItems.forEach((item) => {
                const div = document.createElement('div');
                div.className = 'masonry-item';
                
                const img = document.createElement('img');
                img.src = item.imgUrl;
                img.alt = "問候圖";
                img.loading = "lazy";
                
                img.addEventListener('click', () => {
                    openLightbox(item.imgUrl, item.text, item.category);
                });
                
                div.appendChild(img);
                container.appendChild(div);
            });

            updateManageList();
        }

        function filterCategory(cat, event) {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            currentFilter = cat;
            renderGrid();
        }

        function openLightbox(imgUrl, text, category) {
            const lightbox = document.getElementById('lightbox');
            const previewImg = document.getElementById('lightboxImg');
            
            previewImg.src = imgUrl;

            generateTextOnImage(imgUrl, text, function(blob) {
                if (blob) {
                    const objectUrl = URL.createObjectURL(blob);
                    previewImg.src = objectUrl;
                }
            });
            
            document.getElementById('lightboxShareBtn').onclick = () => shareCardDirect(imgUrl, text, `${category}.jpg`);
            document.getElementById('lightboxDownloadBtn').onclick = () => downloadCardDirect(imgUrl, text, `${category}.jpg`);
            
            lightbox.style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }

        function generateTextOnImage(imgUrl, textContent, callback) {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            
            img.onload = function() {
                try {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = img.naturalWidth || 1000;
                    canvas.height = img.naturalHeight || 1000;

                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                    gradient.addColorStop(0, 'rgba(0, 0, 0, 0.15)');
                    gradient.addColorStop(1, 'rgba(0, 0, 0, 0.5)');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    const scale = canvas.width / 800;
                    const fontSize = Math.round(46 * scale);
                    ctx.font = `500 ${fontSize}px "Noto Serif TC", serif`;
                    ctx.fillStyle = '#ffffff';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    const maxLineWidth = canvas.width * 0.85;
                    let lines = [];
                    let currentLine = "";

                    for (let i = 0; i < textContent.length; i++) {
                        let char = textContent[i];
                        let testLine = currentLine + char;
                        if (ctx.measureText(testLine).width > maxLineWidth && currentLine !== "") {
                            lines.push(currentLine);
                            currentLine = char;
                        } else {
                            currentLine = testLine;
                        }
                    }
                    if (currentLine) lines.push(currentLine);

                    const lineHeight = fontSize * 1.6;
                    let startY = (canvas.height - (lines.length * lineHeight)) / 2 + (lineHeight / 2);

                    lines.forEach(line => {
                        ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
                        ctx.shadowBlur = 10;
                        ctx.fillText(line, canvas.width / 2, startY);
                        startY += lineHeight;
                    });

                    canvas.toBlob(blob => callback(blob), 'image/jpeg', 0.95);
                } catch (e) {
                    console.log("CORS 限制無法直接修改畫布", e);
                    callback(null);
                }
            };

            img.onerror = function() {
                callback(null);
            };

            img.src = imgUrl;
        }

        async function shareCardDirect(imgUrl, text, filename) {
            generateTextOnImage(imgUrl, text, async function(blob) {
                if (!blob) {
                    alert('此圖片網址受到伺服器跨域安全保護，無法直接透過程式合成文字與分享，請改用支援跨域的圖片網址。');
                    return;
                }
                const file = new File([blob], filename, { type: 'image/jpeg' });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({ files: [file], title: '日常問候圖', text: text });
                    } catch (e) { console.log('分享取消'); }
                } else {
                    alert('您的瀏覽器不支援直接分享圖片檔案，請使用「儲存圖片」按鈕。');
                }
            });
        }

        function downloadCardDirect(imgUrl, text, filename) {
            generateTextOnImage(imgUrl, text, function(blob) {
                if (!blob) {
                    alert('此圖片網址受到伺服器跨域安全保護，無法直接合成文字下載。');
                    return;
                }
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                URL.revokeObjectURL(url);
            });
        }

        function toggleAdmin() {
            const panel = document.getElementById('adminPanel');
            if (panel.style.display === 'block') {
                panel.style.display = 'none';
            } else {
                const today = new Date();
                const pwd = prompt("");
                const dynamicPwd = `${today.getFullYear()}${String(today.getMonth() + 1).padStart(2, '0')}${String(today.getDate()).padStart(2, '0')}`;
                
                if (pwd === dynamicPwd) {
                    panel.style.display = 'block';
                } else if (pwd !== null) {
                    alert("密碼錯誤！");
                }
            }
        }

        function addCard() {
            const cat = document.getElementById('newCategory').value;
            let text = document.getElementById('newText').value.trim();
            const imgUrl = document.getElementById('newImgUrl').value.trim();

            if (!imgUrl) {
                alert('請填寫圖片網址！');
                return;
            }

            if (text === "") {
                const texts = defaultTexts[cat] || ["願你今天平安喜樂"];
                text = texts[Math.floor(Math.random() * texts.length)];
            }

            userCards.push({ category: cat, text: text, imgUrl: imgUrl });
            localStorage.setItem('myGreetingCards', JSON.stringify(userCards));

            document.getElementById('newText').value = '';
            document.getElementById('newImgUrl').value = '';
            document.getElementById('adminPanel').style.display = 'none';

            renderGrid();
        }

        function deleteCard(index) {
            userCards.splice(index, 1);
            localStorage.setItem('myGreetingCards', JSON.stringify(userCards));
            renderGrid();
        }

        function updateManageList() {
            const listEl = document.getElementById('manageList');
            listEl.innerHTML = '<strong>自訂項目管理：</strong>';
            if (userCards.length === 0) {
                listEl.innerHTML += '<span style="font-size:0.75rem; color:#888;"> 目前無自訂圖片</span>';
                return;
            }
            userCards.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'manage-item';
                div.innerHTML = `<span>[${item.category}] ${item.text.substring(0, 8)}...</span><button onclick="deleteCard(${index})">刪除</button>`;
                listEl.appendChild(div);
            });
        }

        window.onload = renderGrid;
    </script>
</body>
</html>
