<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>華語金曲隨機短影音牆</title>
    <style>
        /* 基礎重置與手機外觀模擬（若用電腦開會置中並加上手機框） */
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* 電腦版時的外觀防護：限制最大寬度並置中，營造手機App質感 */
        @media (min-width: 768px) {
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                background-color: #121212;
            }
            .app-frame {
                width: 100%;
                max-width: 430px; /* 模擬主流手機寬度 */
                height: 100vh;
                max-height: 932px; /* 模擬主流手機高度 */
                border-radius: 24px;
                overflow: hidden;
                box-shadow: 0 10px 30px rgba(0,0,0,0.8);
                position: relative;
            }
        }

        @media (max-width: 767px) {
            .app-frame {
                width: 100%;
                height: 100vh;
                position: relative;
            }
        }

        /* 滿版上下滑動容器 (Shorts / 抖音風格) */
        .reel-container {
            width: 100%;
            height: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
        }

        /* 每一頁的單一影片卡片 (剛好佔滿一頁) */
        .reel-card {
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #111;
        }

        /* YouTube 嵌入 iframe 滿版適配 */
        .video-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .video-wrapper iframe {
            width: 100% !important;
            height: 100% !important;
            border: none;
        }

        /* 覆蓋在影片下方的資訊列（往上移避免與 YouTube 底部控制列重疊） */
        .overlay-info {
            position: absolute;
            bottom: 70px;
            left: 16px;
            right: 16px;
            z-index: 10;
            pointer-events: none; /* 讓點擊能穿透到 YouTube 控制列 */
        }

        .song-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 6px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .song-views {
            font-size: 13px;
            color: #1db954;
            background: rgba(0,0,0,0.6);
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="app-frame">
        <!-- 手機上下滑動滿版容器 -->
        <div class="reel-container" id="reelContainer">
            <!-- 影片卡片會由 JavaScript 動態填入 -->
        </div>
    </div>

    <script>
        /* ==========================================================
           【如何自行加入新歌曲？】
           格式如下：
           { 
               title: "你的歌名", 
               views: "你的觀看次數標籤", 
               embedCode: '把整個 <iframe ...> 貼在這裡，用單引號包起來' 
           },
           ========================================================== */
        const songDatabase = [
            { 
                title: "人潮有多擁擠 就有多想你 1", 
                views: "🔥 好聽熱門", 
                embedCode: '<iframe width="560" height="315" src="https://www.youtube.com/embed/1w5r0tbvTCk?si=Vidg56-9ILIU8FWF" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>' 
            },
            { 
                title: "人潮有多擁擠 就有多想你 2", 
                views: "🔥 好聽熱門", 
                embedCode: '<iframe width="560" height="315" src="https://www.youtube.com/embed/VdDSpgwfZrA?si=X-96_OB_Xk51xHT_" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>' 
            }
            
        ];

        function initReels() {
            const container = document.getElementById('reelContainer');
            container.innerHTML = '';

            // 每次重新整理網頁時隨機洗牌順序
            const shuffledSongs = [...songDatabase].sort(() => 0.5 - Math.random());

            shuffledSongs.forEach((song) => {
                const card = document.createElement('div');
                card.className = 'reel-card';
                card.innerHTML = `
                    <div class="video-wrapper">
                        ${song.embedCode}
                    </div>
                    <div class="overlay-info">
                        <div class="song-title">${song.title}</div>
                        <div class="song-views">${song.views}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 頁面初次載入時執行
        window.onload = initReels;
    </script>
</body>
</html>
