<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>華語金曲隨機短影音牆 - Shorts 風格</title>
    <style>
        /* 基礎重置與手機外觀模擬 */
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            color: #111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* 電腦版時的外觀防護：限制最大寬度並置中，營造手機App質感 */
        @media (min-width: 768px) {
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                background-color: #f0f2f5;
            }
            .app-frame {
                width: 100%;
                max-width: 430px;
                height: 100vh;
                max-height: 932px;
                border-radius: 24px;
                overflow: hidden;
                box-shadow: 0 10px 30px rgba(0,0,0,0.15);
                position: relative;
                background-color: #ffffff;
            }
        }

        @media (max-width: 767px) {
            .app-frame {
                width: 100%;
                height: 100vh;
                position: relative;
            }
        }

        /* 滿版上下滑動容器 */
        .reel-container {
            width: 100%;
            height: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            transform: translateZ(0);
        }

        .reel-container::-webkit-scrollbar {
            display: none;
        }

        /* 每一頁的單一影片卡片：佔滿全螢幕、黑底沉浸式播放 */
        .reel-card {
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            overflow: hidden;
        }

        /* 滿版直式容器：確保影片完整撐滿背景 */
        .video-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-wrapper iframe {
            width: 100% !important;
            height: 100% !important;
            border: none;
            object-fit: cover;
        }

        /* 仿 YouTube Shorts 的底部資訊漸層遮罩 */
        .overlay-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 40px 16px calc(30px + env(safe-area-inset-bottom)) 16px;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
            z-index: 10;
            pointer-events: none;
        }

        .song-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .song-views {
            font-size: 12px;
            color: #fff;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
        }
    </style>
</head>
<body>

            }
        ];

        function initReels() {
            const container = document.getElementById('reelContainer');
            container.innerHTML = '';

            const shuffledSongs = [...songDatabase].sort(() => 0.5 - Math.random());
            const infiniteSongs = [...shuffledSongs, ...shuffledSongs, ...shuffledSongs];

            infiniteSongs.forEach((song) => {
                const card = document.createElement('div');
                card.className = 'reel-card';
                card.dataset.embed = song.embedCode;
                card.innerHTML = `
                    <div class="video-wrapper"></div>
                    <div class="overlay-info">
                        <div class="song-title">${song.title}</div>
                        <div class="song-views">${song.views}</div>
                    </div>
                `;
                container.appendChild(card);
            });

            const cards = document.querySelectorAll('.reel-card');
            const totalOriginal = songDatabase.length;

            if (cards.length > 0) {
                const randomOffset = Math.floor(Math.random() * totalOriginal);
                const targetIndex = totalOriginal + randomOffset;
                container.scrollTop = cards[targetIndex].offsetTop;
            }

            let scrollTimeout;
            container.addEventListener('scroll', () => {
                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(() => {
                    const singleBlockHeight = cards[0].offsetHeight * totalOriginal;
                    
                    if (container.scrollTop < singleBlockHeight * 0.4) {
                        container.style.scrollSnapType = 'none';
                        container.scrollTop += singleBlockHeight;
                        setTimeout(() => { container.style.scrollSnapType = 'y mandatory'; }, 50);
                    } 
                    else if (container.scrollTop > singleBlockHeight * 2.3) {
                        container.style.scrollSnapType = 'none';
                        container.scrollTop -= singleBlockHeight;
                        setTimeout(() => { container.style.scrollSnapType = 'y mandatory'; }, 50);
                    }
                }, 100);
            }, { passive: true });

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const wrapper = entry.target.querySelector('.video-wrapper');
                    if (entry.isIntersecting) {
                        if (!wrapper.hasChildNodes()) {
                            wrapper.innerHTML = entry.target.dataset.embed;
                        }
                    } else {
                        wrapper.innerHTML = '';
                    }
                });
            }, { threshold: 0.6 });

            cards.forEach(card => {
                observer.observe(card);
            });
        }

        window.onload = initReels;
    </script>

</html>
