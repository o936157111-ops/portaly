<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>華語金曲隨機短影音牆 - Shorts 風格</title>
    <style>
        /* 基礎重置與手機外觀模擬 */
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            color: #111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* 電腦版時的外觀防護：限制最大寬度並置中，營造手機App質感 */
        @media (min-width: 768px) {
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                background-color: #f0f2f5;
            }
            .app-frame {
                width: 100%;
                max-width: 430px;
                height: 100vh;
                max-height: 932px;
                border-radius: 24px;
                overflow: hidden;
                box-shadow: 0 10px 30px rgba(0,0,0,0.15);
                position: relative;
                background-color: #ffffff;
            }
        }

        @media (max-width: 767px) {
            .app-frame {
                width: 100%;
                height: 100vh;
                position: relative;
            }
        }

        /* 滿版上下滑動容器 */
        .reel-container {
            width: 100%;
            height: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            transform: translateZ(0);
        }

        .reel-container::-webkit-scrollbar {
            display: none;
        }

        /* 每一頁的單一影片卡片：佔滿全螢幕、黑底沉浸式播放 */
        .reel-card {
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            overflow: hidden;
        }

        /* 滿版直式容器：確保影片完整撐滿背景 */
        .video-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-wrapper iframe {
            width: 100% !important;
            height: 100% !important;
            border: none;
            object-fit: cover;
        }

        /* 自訂封面層樣式 */
        .custom-cover-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1) 100%),
                        url('https://live.staticflickr.com/65535/55549203944_a7a9f89992_z.jpg') center/cover no-repeat;
            z-index: 5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }

        .custom-cover-layer.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .cover-play-btn {
            width: 64px;
            height: 64px;
            background-color: #ff3b30;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 20px rgba(255, 59, 48, 0.5);
            animation: pulse 2s infinite;
        }

        .cover-play-btn svg {
            width: 28px;
            height: 28px;
            fill: #ffffff;
            transform: translateX(2px);
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.6); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(255, 59, 48, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
        }

        /* 仿 YouTube Shorts 的底部資訊漸層遮罩 */
        .overlay-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 40px 16px calc(30px + env(safe-area-inset-bottom)) 16px;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
            z-index: 10;
            pointer-events: none;
        }

        .song-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .song-views {
            font-size: 12px;
            color: #fff;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
        }
    </style>
</head>
<body>

            },
            {

                views: "🔥 好聽熱門", 
                embedCode: '<iframe width="560" height="315" src="https://www.youtube.com/embed/HfJEquKgjRw?si=UBbMucW63OV3RSfh" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>' 
            },
            { 
                title: "愛到盡頭",

                embedCode: '<iframe width="560" height="315" src="https://www.youtube.com/embed/jrWD_p_VoE8?si=iNAzgL5QA4ZCmdml" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>'

            },
            { 
                title: "我不該動情",

                embedCode: '<iframe width="560" height="315" src="https://www.youtube.com/embed/rMuqgAHnXUo?si=PJVJc-68n0nBj4kM" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>' 
            },
            { 
                title: "到最后受伤的是我", 
                views: "🔥 好聽熱門", 
                embedCode: '<iframe width="560" height="315" src="https://www.youtube.com/embed/pW1thfYePWY?si=lvjb1GfRIZ05BTLX" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>' 
            },
            { 
                title: "人潮有多擁擠 就有多想你", 
                views: "🔥 專屬封面熱門", 
                isCustomCover: true,
                embedCode: '<iframe width="560" height="315" src="https://www.youtube.com/embed/VdDSpgwfZrA?autoplay=1&si=X-96_OB_Xk51xHT_" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>' 
            }
        ];

        function initReels() {
            const container = document.getElementById('reelContainer');
            container.innerHTML = '';

            const shuffledSongs = [...songDatabase].sort(() => 0.5 - Math.random());
            const infiniteSongs = [...shuffledSongs, ...shuffledSongs, ...shuffledSongs];

            infiniteSongs.forEach((song) => {
                const card = document.createElement('div');
                card.className = 'reel-card';
                
                // 組合卡片內部 HTML
                let coverHtml = '';
                if (song.isCustomCover) {
                    coverHtml = `
                        <div class="custom-cover-layer" onclick="playCustomSong(this)">
                            <div class="cover-play-btn">
                                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                            </div>
                        </div>
                    `;
                    card.dataset.hasCover = "true";
                }

                card.innerHTML = `
                    ${coverHtml}
                    <div class="video-wrapper"></div>
                    <div class="overlay-info">
                        <div class="song-title">${song.title}</div>
                        <div class="song-views">${song.views}</div>
                    </div>
                `;
                
                // 把 embedCode 存放在 dataset 中供觀測器或點擊使用
                card.dataset.embed = song.embedCode;
                container.appendChild(card);
            });

            const cards = document.querySelectorAll('.reel-card');
            const totalOriginal = songDatabase.length;

            if (cards.length > 0) {
                const randomOffset = Math.floor(Math.random() * totalOriginal);
                const targetIndex = totalOriginal + randomOffset;
                container.scrollTop = cards[targetIndex].offsetTop;
            }

            let scrollTimeout;
            container.addEventListener('scroll', () => {
                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(() => {
                    const singleBlockHeight = cards[0].offsetHeight * totalOriginal;
                    
                    if (container.scrollTop < singleBlockHeight * 0.4) {
                        container.style.scrollSnapType = 'none';
                        container.scrollTop += singleBlockHeight;
                        setTimeout(() => { container.style.scrollSnapType = 'y mandatory'; }, 50);
                    } 
                    else if (container.scrollTop > singleBlockHeight * 2.3) {
                        container.style.scrollSnapType = 'none';
                        container.scrollTop -= singleBlockHeight;
                        setTimeout(() => { container.style.scrollSnapType = 'y mandatory'; }, 50);
                    }
                }, 100);
            }, { passive: true });

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const card = entry.target;
                    const wrapper = card.querySelector('.video-wrapper');
                    const hasCover = card.dataset.hasCover === "true";

                    if (entry.isIntersecting) {
                        // 如果是有自訂封面的卡片，且封面還沒被點開，先不載入 iframe（保持封面靜止）
                        const coverLayer = card.querySelector('.custom-cover-layer');
                        if (hasCover && coverLayer && !coverLayer.classList.contains('fade-out')) {
                            return; 
                        }

                        if (!wrapper.hasChildNodes()) {
                            wrapper.innerHTML = card.dataset.embed;
                        }
                    } else {
                        // 離開畫面時清空一般影片，但如果自訂封面還沒被點擊過，保留封面
                        if (!hasCover || (hasCover && card.querySelector('.custom-cover-layer')?.classList.contains('fade-out'))) {
                            wrapper.innerHTML = '';
                        }
                    }
                });
            }, { threshold: 0.6 });

            cards.forEach(card => {
                observer.observe(card);
            });
        }

        // 點擊自訂封面後的播放行為
        function playCustomSong(coverElement) {
            const card = coverElement.closest('.reel-card');
            const wrapper = card.querySelector('.video-wrapper');
            
            // 載入影片並自動播放
            if (!wrapper.hasChildNodes()) {
                wrapper.innerHTML = card.dataset.embed;
            }

            // 淡出封面
            coverElement.classList.add('fade-out');
        }

        window.onload = initReels;
    </script>
</body>
</html>
