<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>華語百萬金曲沉浸滑動牆</title>
    <style>
        /* 確保全螢幕滿版，支援手機流暢上下滑動 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* 滿版滑動容器 (類似 Shorts 滾動效果) */
        .reel-container {
            width: 100%;
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
        }

        /* 每一頁的單一影片卡片 */
        .reel-card {
            width: 100%;
            height: 100vh;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #111;
        }

        /* YouTube 影片滿版適配 */
        .video-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: auto;
        }

        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 覆蓋在影片下方的資訊列與按鈕 */
        .overlay-info {
            position: absolute;
            bottom: 40px;
            left: 16px;
            right: 80px;
            z-index: 10;
            pointer-events: none;
        }

        .song-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 6px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .song-views {
            font-size: 14px;
            color: #1db954;
            background: rgba(0,0,0,0.6);
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
        }

        /* 右側互動按鈕列 */
        .side-actions {
            position: absolute;
            right: 16px;
            bottom: 60px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
            align-items: center;
        }

        .action-btn {
            background: rgba(0, 0, 0, 0.5);
            border: none;
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        /* 頂部重新隨機洗牌按鈕 */
        .top-bar {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 100;
        }

        .shuffle-btn {
            background-color: #1db954;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- 頂部隨機換歌按鈕 -->
    <div class="top-bar">
        <button class="shuffle-btn" onclick="initReels()">🔄 隨機換一批歌</button>
    </div>

    <!-- 手機上下滑動滿版容器 -->
    <div class="reel-container" id="reelContainer">
        <!-- 影片卡片會由 JavaScript 動態填入 -->
    </div>

    <script>
        // 經過驗證、允許網頁外部嵌入的華語金曲清單
        const songDatabase = [
            { title: "韋禮安 WeiBird - 如果可以 (破億神曲)", views: "🔥 破億熱門金曲", embedCode: '<iframe src="https://www.youtube.com/embed/WkI-cbsGf_4" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>' },
            { title: "周興哲 Eric Chou - 怎麼了", views: "🔥 突破 1.7 億觀看", embedCode: '<iframe src="https://www.youtube.com/embed/gyIPibWoWtg" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>' },
            { title: "茄子蛋 EggPlantEgg - 浪子回頭", views: "🔥 突破 1.6 億觀看", embedCode: '<iframe src="https://www.youtube.com/embed/rhTlqIb87vU" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>' },
            { title: "八三夭 831 - 想見你想見你想見你", views: "🔥 破億熱門金曲", embedCode: '<iframe src="https://www.youtube.com/embed/ZX8x1gN9vG0" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>' },
            { title: "精選華語熱門金曲", views: "🔥 突破百萬點擊", embedCode: '<iframe src="https://www.youtube.com/embed/1w5r0tbvTCk" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>' }
        ];

        function initReels() {
            const container = document.getElementById('reelContainer');
            container.innerHTML = '';

            // 隨機打亂順序
            const shuffledSongs = [...songDatabase].sort(() => 0.5 - Math.random());

            shuffledSongs.forEach((song) => {
                const card = document.createElement('div');
                card.className = 'reel-card';
                card.innerHTML = `
                    <div class="video-wrapper">
                        ${song.embedCode}
                    </div>
                    <div class="overlay-info">
                        <div class="song-title">${song.title}</div>
                        <div class="song-views">${song.views}</div>
                    </div>
                    <div class="side-actions">
                        <button class="action-btn" onclick="alert('已加入最愛！')">❤️</button>
                        <button class="action-btn" onclick="alert('分享連結已複製！')">🔗</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 頁面初次載入時執行
        window.onload = initReels;
    </script>
</body>
</html>
