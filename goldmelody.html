<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>華語金曲隨機短影音牆</title>
    <style>
        /* 基礎重置與手機外觀模擬（若用電腦開會置中並加上手機框） */
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            /* 白色底色，完美融入手機介面 */
            background-color: #ffffff;
            color: #111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* 電腦版時的外觀防護：限制最大寬度並置中，營造手機App質感 */
        @media (min-width: 768px) {
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                background-color: #f0f2f5;
            }
            .app-frame {
                width: 100%;
                max-width: 430px; /* 模擬主流手機寬度 */
                height: 100vh;
                max-height: 932px; /* 模擬主流手機高度 */
                border-radius: 24px;
                overflow: hidden;
                box-shadow: 0 10px 30px rgba(0,0,0,0.15);
                position: relative;
                background-color: #ffffff;
            }
        }

        @media (max-width: 767px) {
            .app-frame {
                width: 100%;
                height: 100vh;
                position: relative;
            }
        }

        /* 滿版上下滑動容器 (Shorts / 抖音風格)，並隱藏右側捲軸 */
        .reel-container {
            width: 100%;
            height: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .reel-container::-webkit-scrollbar {
            display: none;
        }

        /* 每一頁的單一影片卡片：加入安全區域，並在白色背景下完美置中 */
        .reel-card {
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            /* 自動避開頂部相機與底部手勢條空間 */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* 採用 16:9 黃金比例容器，確保橫式影片在安全空間內完整置中不變形 */
        .video-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            position: relative;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            border: none;
        }

        /* 覆蓋在影片下方的資訊列（避開底部安全距離） */
        .overlay-info {
            position: absolute;
            bottom: calc(50px + env(safe-area-inset-bottom));
            left: 16px;
            right: 16px;
            z-index: 10;
            pointer-events: none; /* 讓點擊能穿透到 YouTube 控制列 */
        }

        .song-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 6px;
            color: #111;
            text-shadow: 0 1px 2px rgba(255,255,255,0.8);
        }

        .song-views {
            font-size: 13px;
            color: #fff;
            background: rgba(0, 0, 0, 0.75);
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="app-frame">
        <!-- 手機上下滑動滿版容器 -->
        <div class="reel-container" id="reelContainer">
            <!-- 影片卡片會由 JavaScript 動態填入 -->
        </div>
    </div>

            {

                views: "🔥 好聽熱門", 
                embedCode: '<iframe width="560" height="315" src="https://www.youtube.com/embed/pW1thfYePWY?si=lvjb1GfRIZ05BTLX" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>'

            { 
                title: "人潮有多擁擠 就有多想你", 
                views: "🔥 好聽熱門", 
                embedCode: '<iframe width="560" height="315" src="https://www.youtube.com/embed/VdDSpgwfZrA?si=X-96_OB_Xk51xHT_" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>' 
            }
        ];

        function initReels() {
            const container = document.getElementById('reelContainer');
            container.innerHTML = '';

            // 每次重新整理網頁時隨機洗牌順序
            const shuffledSongs = [...songDatabase].sort(() => 0.5 - Math.random());

            shuffledSongs.forEach((song) => {
                const card = document.createElement('div');
                card.className = 'reel-card';
                card.dataset.embed = song.embedCode;
                card.innerHTML = `
                    <div class="video-wrapper"></div>
                    <div class="overlay-info">
                        <div class="song-title">${song.title}</div>
                        <div class="song-views">${song.views}</div>
                    </div>
                `;
                container.appendChild(card);
            });

            // 建立交叉觀察器：畫面滑到哪一首，就載入哪一首；滑開就清空 iframe 停止聲音
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const wrapper = entry.target.querySelector('.video-wrapper');
                    if (entry.isIntersecting) {
                        if (!wrapper.hasChildNodes()) {
                            wrapper.innerHTML = entry.target.dataset.embed;
                        }
                    } else {
                        wrapper.innerHTML = '';
                    }
                });
            }, { threshold: 0.6 });

            const cards = document.querySelectorAll('.reel-card');
            cards.forEach(card => {
                observer.observe(card);
            });

            // 網頁開啟時隨機挑選其中一首播放
            if (cards.length > 0) {
                const randomIndex = Math.floor(Math.random() * cards.length);
                container.scrollTop = cards[randomIndex].offsetTop;
            }
        }

        // 頁面初次載入時執行
        window.onload = initReels;
    </script>

</html>
